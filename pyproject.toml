# Tooling config for the lint/format/type gate (introduced in phases —
# see /home/dynasty/.claude/plans/write-me-a-plan-temporal-harp.md).
#
# This PR (A1) only activates `ruff format` (a mechanical, AST-preserving
# sweep + a hard-blocking format check in CI). The lint rules and mypy
# blocks below are defined now but NOT yet gated in CI — the lint gate
# lands report-only then changed-files-only in a later PR (A2/A3), and
# mypy is ratcheted per-module later (A4). Defining them here keeps the
# eventual config in one place without enabling enforcement early.

[tool.ruff]
line-length = 100  # matches the observed ~89% ≤100 baseline
target-version = "py312"
# docs/research/bdvm-v1/reference is a byte-frozen acceptance fixture
# (SHA-256-pinned in its README; tests/bdvm/test_reference_parity.py
# re-executes it and token-compares the output) — it must never be
# reformatted.
extend-exclude = [
    "data",
    "exports",
    ".next",
    "node_modules",
    "frontend",
    "docs/research/bdvm-v1/reference",
]
# Honour the excludes even when a path is passed explicitly (the A3
# changed-files gate calls `ruff check <file>...`); without this a
# changed .py under an excluded dir would still get linted.
force-exclude = true

[tool.ruff.lint]
# Pyflakes (F) + pycodestyle (E/W). Lint runs report-only in CI as of
# phase A2, enforced changed-files-only in A3.
select = ["E", "F", "W"]
# E501 (line-too-long) is intentionally NOT enforced: `ruff format`
# already owns line length, and it deliberately leaves long strings/
# URLs/comments it can't safely split. Enforcing E501 on top of the
# formatter is the well-known double-ownership anti-pattern (it nags
# about exactly the lines the formatter chose to keep) — 169 such
# pre-existing lines, none of them defects.
ignore = ["E501"]

[tool.ruff.format]
# Black-compatible defaults (double quotes, magic trailing comma).
# No overrides — deterministic output is what makes the CI check safe
# to hard-block once the sweep has landed.

[tool.mypy]
# Scaffold only — no CI step runs mypy until phase A4, which ratchets
# strictness in per-module via [[tool.mypy.overrides]].
python_version = "3.12"
ignore_missing_imports = true
