upstream dynasty_backend  { server 127.0.0.1:8000; }
upstream dynasty_frontend { server 127.0.0.1:3000; }

server {
    server_name 203.0.113.10 chaseupside.com www.chaseupside.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://dynasty_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/ {
        proxy_pass http://dynasty_frontend;
        proxy_set_header Host $host;
    }

    location = /favicon.ico { proxy_pass http://dynasty_frontend; }

    location / {
        proxy_pass http://dynasty_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [2001:db8::10]:443 ssl; # managed by Certbot
    listen 203.0.113.10:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chaseupside.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chaseupside.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.chaseupside.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = chaseupside.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 203.0.113.10 chaseupside.com www.chaseupside.com;
    return 404; # managed by Certbot


}
