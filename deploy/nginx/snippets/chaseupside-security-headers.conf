# Chase Upside response hardening — included INSIDE the live chaseupside
# server blocks by deploy/nginx_live_harden.sh.  It is a server-context
# snippet: it adds headers and hides version banners, and it changes no
# listener, certificate, upstream or location.
#
# The header values are the ones declared in deploy/nginx/chaseupside.com.conf
# (docs/PROD-HARDENING.md §1).  nginx drops server-level add_header
# directives in any location that declares its own add_header; the
# installer refuses a live config with location-level add_header for that
# reason.
server_tokens off;
proxy_hide_header X-Powered-By;

# HSTS: 1 year, no includeSubDomains / no preload (see the template's note).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
