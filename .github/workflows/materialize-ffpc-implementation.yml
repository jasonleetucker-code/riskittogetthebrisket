name: Materialize FFPC implementation

on:
  push:
    branches:
      - feature/unified-ffpc-sharp
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'feature/unified-ffpc-sharp' || github.ref_name == 'feature/unified-ffpc-sharp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feature/unified-ffpc-sharp
          fetch-depth: 0

      - name: Verify and unpack implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "672125b8ba27b4e61c48e93a1c6ab25823155619029ca5452e3a634906653442  .ffpc_payload.part-00" | sha256sum --check -
          echo "26b417f835dee9048ce9428b982e2123161cd3e37cb1905ab889fbd6a15b8b6a  .ffpc_payload.part-01" | sha256sum --check -
          echo "d55d95cc04abf5803745c64e846ba011a3321a36a80aa9a823f828449b95466e  .ffpc_payload.part-02" | sha256sum --check -
          echo "a12a8715ec4b0be272fc8e27b560c854fdeb6d1f75aa2452a13c1ddbcfece550  .ffpc_payload.part-03" | sha256sum --check -
          echo "05c9e8ed00cd7c7fc9fb97d6cc480b3f0fa7e6535f803158cc990172868b9757  .ffpc_payload.part-04" | sha256sum --check -
          echo "aa19c2eb8e4b245416e88531aa03f145d2f6e48b03dd45a5d5612134df312b7f  .ffpc_payload.part-05" | sha256sum --check -
          echo "8432c4148528a09ac87a0705293cd1b719a2e19a8ee52654353c17b75d55b59b  .ffpc_payload.part-06" | sha256sum --check -
          echo "13430bea05ee17fb7c727d88bdc40435523876b416515dec5cc106fee0acbe8d  .ffpc_payload.part-07" | sha256sum --check -
          cat .ffpc_payload.part-* > /tmp/ffpc_payload.b64
          base64 --decode /tmp/ffpc_payload.b64 > /tmp/ffpc_payload.tar.gz
          echo "cdae82abdc93657cf41b04cdc500c5b29f850b509070210226b1298723202d4e  /tmp/ffpc_payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/ffpc_payload.tar.gz -C .
          rm -f .ffpc_payload.b64 .ffpc_payload.part-* .github/workflows/materialize-ffpc-implementation.yml

      - name: Commit implementation files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement unified Sleeper and FFPC Sharp Tracker"
          git push origin HEAD:feature/unified-ffpc-sharp
