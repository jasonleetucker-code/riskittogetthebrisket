name: Forward Scoreboard On-Box (read-only)

# DYN10 V1b.  Runs the forward validation scoreboard (#2301) on the production
# box against the box's temporal ledger (the only place the served
# canonical_board lane exists) and prints AGGREGATE statistics only, into the
# job log and step summary.  The repository is PUBLIC, so both are public: the
# box-side summarizer (scripts/forward_scoreboard_summary.py) emits a fixed
# whitelist -- no player names, asset keys, ids or file paths.  Read-only: the
# tool copies the ledger with SQLite's backup API from a read-only connection
# and measures the copy in a temp dir that is deleted afterwards.
#
# Live-writer note: SQLite's backup API holds ONE read transaction on the live
# ledger for the duration of the copy, so WAL checkpointing is delayed until it
# ends.  Dispatch away from the even-hour :27 / :32 refresh windows.  The disk
# check counts the main file PLUS the -wal file, times 3.
#
# Production safety: the remote `timeout` (1500 s + 10 s kill grace, plus 120 s
# for the summarizer) is the real bound and sits below timeout-minutes (30);
# GitHub's timeout only kills the local ssh client.  The remote job also runs
# under nice / ionice and a systemd scope (MemoryMax 2G, CPUQuota 50%) or an
# address-space rlimit, and a hang-up or cancel kills the measurement.
#
# Dispatch only, deliberately: no schedule.  Own concurrency group, NOT
# production-deploy: a queued run in that group can cancel a pending deploy.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forward-scoreboard-onbox
  cancel-in-progress: false

jobs:
  scoreboard:
    name: Forward scoreboard on production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Measure forward scoreboard on production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Non-zero = a real answer (ledger missing, no headroom, nothing
          # measurable, summary failed), surfaced as a failure so silence is
          # never read as ok.
          set +e
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") bash -s" > summary.md <<'REMOTE'
          # All remote stderr is dropped: the job log is public and any error
          # (cd, stat, bash, python) can name box paths.  Known failure branches
          # print one terse stdout line instead.
          exec 2>/dev/null
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1   # no __pycache__ in the app checkout
          export GIT_OPTIONAL_LOCKS=0        # the tool's `git status` must not refresh .git/index
          cd "$APP_DIR" || { echo "app dir not found"; exit 2; }
          PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          [ -x "$PY" ] || PY=python3
          LEDGER="data/temporal_ledger.sqlite"
          if [ ! -f "$LEDGER" ]; then
            echo "no temporal ledger on this host"
            exit 2
          fi
          WORK="$(mktemp -d "${TMPDIR:-/tmp}/forward-scoreboard-XXXXXX")" || {
            echo "could not create a temp dir"
            exit 4
          }
          CHILD=""
          # Cleanup also runs on SSH hang-up / cancel (HUP/TERM): kill the
          # background measurement so a cancelled run cannot be orphaned.
          trap 'if [ -n "$CHILD" ]; then kill "$CHILD" 2>/dev/null || true; fi; rm -rf "$WORK"' EXIT HUP INT TERM
          # The tool copies the ledger (backup API) into this temp dir: refuse
          # unless free space is at least 3x (main file + -wal) size.
          SIZE="$(stat -c %s "$LEDGER" 2>/dev/null || echo 0)"
          WAL="$(stat -c %s "$LEDGER-wal" 2>/dev/null || echo 0)"
          SIZE=$((SIZE + WAL))
          FREE="$(df -PB1 "$WORK" | awk 'NR==2 {print $4}')"
          if [ -z "$FREE" ] || [ "$FREE" -lt $((SIZE * 3)) ]; then
            echo "insufficient disk: temp dir free ${FREE:-unknown} bytes is under 3x ledger+wal ($SIZE bytes)"
            exit 4
          fi
          export TMPDIR="$WORK"
          # Resource bounds, each guarded and degrading gracefully.  The remote
          # `timeout` (1500 s + 10 s kill grace) is the REAL bound and sits below
          # the job's timeout-minutes (30): the GitHub-side timeout only kills the
          # local ssh client.  Prefer a systemd scope (MemoryMax / CPUQuota) when
          # it works for this user, else an address-space rlimit.
          LOW=()
          if command -v nice >/dev/null; then LOW+=(nice -n 19); fi
          if command -v ionice >/dev/null; then LOW+=(ionice -c3); fi
          MEM=()
          if command -v systemd-run >/dev/null \
             && systemd-run --scope --quiet -p MemoryMax=2G -p CPUQuota=50% true >/dev/null 2>&1; then
            MEM=(systemd-run --scope --quiet -p MemoryMax=2G -p CPUQuota=50%)
          elif command -v prlimit >/dev/null; then
            MEM=(prlimit --as=$((2<<30)))
          fi
          LIMIT=()
          if command -v timeout >/dev/null; then LIMIT=(timeout -k 10 1500); fi
          ${LIMIT[@]+"${LIMIT[@]}"} ${LOW[@]+"${LOW[@]}"} ${MEM[@]+"${MEM[@]}"} "$PY" scripts/forward_validation_scoreboard.py \
            --ledger "$LEDGER" --out "$WORK/scoreboard.json" --summary "$WORK/scoreboard.md" \
            >/dev/null 2>&1 &
          CHILD=$!
          rc=0
          wait "$CHILD" || rc=$?
          CHILD=""
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "scoreboard timed out on the box (exit $rc)"
            exit 5
          fi
          # rc 1 = "nothing measurable" but the JSON is still written: summarize it.
          if [ ! -s "$WORK/scoreboard.json" ]; then
            echo "scoreboard produced no output (exit $rc)"
            exit 3
          fi
          SLIMIT=()
          if command -v timeout >/dev/null; then SLIMIT=(timeout -k 5 120); fi
          ${SLIMIT[@]+"${SLIMIT[@]}"} ${LOW[@]+"${LOW[@]}"} "$PY" scripts/forward_scoreboard_summary.py \
            "$WORK/scoreboard.json" --markdown 2>/dev/null
          if [ "$rc" -eq 1 ]; then
            echo "NOTHING MEASURABLE"
            exit 1
          fi
          exit "$rc"
          REMOTE
          rc=$?
          set -e
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The job log masks every repository-secret value, and DEPLOY_PORT is
      # "22": every "22" in the printed summary (inside a number or a date)
      # shows as ***.  The artifact is not masked, so it carries the exact
      # aggregate figures.  Same aggregate-only content as the log.
      - name: Upload the aggregate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forward-scoreboard-summary
          path: summary.md
          if-no-files-found: ignore
          retention-days: 30
