name: W1 Auth Login Diagnostics

# Temporary Week-1 diagnostic instrument for the W1-30 authenticated
# production-verification blocker. This workflow does not promote any
# contract row. It creates a short-lived real guest pass on the production
# box, exercises the real auth endpoint over loopback and the public origin,
# records only non-secret timing/status evidence, and revokes the pass in the
# same remote process. No synthetic evidence and no auth bypasses.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose production auth login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Diagnose real guest login path
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          PUBLIC_ORIGIN: ${{ vars.PROD_PUBLIC_URL }}
          EXPECTED_MAIN_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${PUBLIC_ORIGIN:-}" ]; then
            echo "::error::vars.PROD_PUBLIC_URL is unset"
            exit 1
          fi
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") PUBLIC_ORIGIN=$(printf %q "${PUBLIC_ORIGIN%/}") EXPECTED_MAIN_SHA=$(printf %q "$EXPECTED_MAIN_SHA") RUN_ID=$(printf %q "$RUN_ID") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          DEPLOYED_SHA=$(git rev-parse HEAD)
          echo "deployed_sha=$DEPLOYED_SHA"
          echo "workflow_sha=$EXPECTED_MAIN_SHA"
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          [ -x "$PY" ] || PY=python3

          set +e
          "$PY" - <<'PYEOF'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          sys.path.insert(0, os.environ["APP_DIR"])
          from src.api import guest_passes

          def probe(label: str, origin: str, token: str) -> dict:
              started = time.monotonic()
              req = urllib.request.Request(
                  origin.rstrip("/") + "/api/auth/login",
                  method="POST",
                  headers={"Content-Type": "application/json"},
                  data=json.dumps({"username": "guest", "password": token}).encode(),
              )
              result = {
                  "label": label,
                  "origin": origin,
                  "status": None,
                  "elapsedSeconds": None,
                  "ok": None,
                  "guest": None,
                  "cookiePresent": False,
                  "errorType": None,
                  "error": None,
              }
              try:
                  with urllib.request.urlopen(req, timeout=12) as resp:
                      result["status"] = resp.status
                      result["cookiePresent"] = any(
                          key.lower() == "set-cookie" and value.startswith("jason_session=")
                          for key, value in resp.headers.items()
                      )
                      try:
                          body = json.load(resp)
                      except Exception:
                          body = {}
                      result["ok"] = body.get("ok")
                      result["guest"] = body.get("guest")
              except urllib.error.HTTPError as exc:
                  result["status"] = exc.code
                  result["errorType"] = type(exc).__name__
                  try:
                      body = exc.read(512).decode("utf-8", "replace").strip()
                  except Exception:
                      body = ""
                  result["error"] = body[:240] or str(exc)
              except Exception as exc:
                  result["errorType"] = type(exc).__name__
                  result["error"] = str(exc)[:240]
              result["elapsedSeconds"] = round(time.monotonic() - started, 3)
              return result

          gp = None
          token = None
          results = []
          try:
              gp, token = guest_passes.create(
                  duration_hours=0.25,
                  note=f"w1-auth-diagnostic run {os.environ.get('RUN_ID', '?')}",
                  created_by="github-actions-w1-auth-diagnostic",
              )
              print(json.dumps({"guestPassId": gp.id, "expiresAtEpoch": gp.expires_at_epoch}))
              results.append(probe("backend-loopback", "http://127.0.0.1:8000", token))
              time.sleep(1)
              results.append(probe("public-origin", os.environ["PUBLIC_ORIGIN"], token))
              for result in results:
                  print(json.dumps(result, sort_keys=True))
          finally:
              if gp is not None:
                  revoked = guest_passes.revoke(gp.id)
                  print(json.dumps({"guestPassId": gp.id, "revoked": revoked}))

          good = all(
              r.get("status") == 200
              and r.get("ok") is True
              and r.get("guest") is True
              and r.get("cookiePresent") is True
              for r in results
          )
          raise SystemExit(0 if good else 2)
          PYEOF
          probe_rc=$?
          set -e

          echo "probe_exit=$probe_rc"
          echo "recent_backend_auth_logs_begin"
          sudo -n journalctl -u dynasty --since '-3 minutes' --no-pager -n 250 2>/dev/null \
            | grep -Ei 'auth|guest|session_store|error|warning|exception|traceback|timeout' \
            | tail -n 120 || true
          echo "recent_backend_auth_logs_end"

          exit "$probe_rc"
          REMOTE
