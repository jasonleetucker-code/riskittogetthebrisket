name: Temporary Sharp read-path performance patch

on:
  push:
    branches:
      - chatgpt/sharp-readpath-speed-v1
    paths:
      - .github/workflows/_tmp_sharp_readpath_speed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded performance patch
        shell: bash
        run: |
          cat .github/_tmp_sharp_patch_part1.pyfrag \
              .github/_tmp_sharp_patch_part2.pyfrag \
              .github/_tmp_sharp_patch_part3.pyfrag \
              .github/_tmp_sharp_patch_part4.pyfrag > /tmp/sharp-perf-patch.py
          python -m py_compile /tmp/sharp-perf-patch.py
          python /tmp/sharp-perf-patch.py
          python -m py_compile src/sharp/market.py src/sharp/roster_percentage.py tests/sharp/test_unified_market.py tests/sharp/test_roster_percentage.py
          git diff --check
      - name: Commit patch and remove temporary staging files
        shell: bash
        run: |
          git config user.name "chatgpt-integration"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp_sharp_readpath_speed.yml \
                 .github/_tmp_sharp_patch_part1.pyfrag \
                 .github/_tmp_sharp_patch_part2.pyfrag \
                 .github/_tmp_sharp_patch_part3.pyfrag \
                 .github/_tmp_sharp_patch_part4.pyfrag
          git add src/sharp/market.py src/sharp/roster_percentage.py \
                  tests/sharp/test_unified_market.py tests/sharp/test_roster_percentage.py
          git commit -m "perf(sharp): collapse redundant read-path database work"
          git push origin HEAD:chatgpt/sharp-readpath-speed-v1
