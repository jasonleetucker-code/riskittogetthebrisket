name: Temporary Sharp read-path performance patch

on:
  push:
    branches:
      - chatgpt/sharp-readpath-speed-v1
    paths:
      - .github/workflows/_tmp_sharp_readpath_speed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and apply bounded performance patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/_tmp_sharp_readpath_speed.yml > /tmp/old-sharp-workflow.yml
          sed -n "/python - <<'PY'/,/^          PY$/p" /tmp/old-sharp-workflow.yml | sed '1d;$d;s/^          //' > /tmp/sharp-perf-patch.py
          python /tmp/sharp-perf-patch.py
          python -m py_compile src/sharp/market.py src/sharp/roster_percentage.py tests/sharp/test_unified_market.py tests/sharp/test_roster_percentage.py
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "chatgpt-integration"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_tmp_sharp_readpath_speed.yml
          git add src/sharp/market.py src/sharp/roster_percentage.py tests/sharp/test_unified_market.py tests/sharp/test_roster_percentage.py
          git commit -m "perf(sharp): collapse redundant read-path database work"
          git push origin HEAD:chatgpt/sharp-readpath-speed-v1
