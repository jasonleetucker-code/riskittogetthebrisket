name: Scheduled Data Refresh

# Runs the scraper + canonical rebuild every 2 hours.
# This keeps the site data fresh without manual intervention.
# The scraper itself is idempotent and overwrites CSVs/site_raw/.
#
# Cadence bumped 3h → 2h on 2026-04-26 to keep Sleeper rosters
# tighter; the scrape fetches fresh rosters as part of every run,
# so a tighter cron means rosters never go more than ~2h stale.

on:
  schedule:
    # Every 2 hours at minute 42 (UTC) to avoid thundering herd.
    - cron: "42 */2 * * *"
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Skip scraper, only rebuild canonical (for debugging)"
        required: false
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

# ``contents: write`` for the data-refresh commit + push.
# ``actions: write`` for the explicit deploy dispatch — deploy.yml
# uses ``paths-ignore: [data/**, exports/**]`` so a data-only push
# wouldn't trigger it automatically; we dispatch via ``gh workflow
# run`` instead.  Without ``actions: write`` the dispatch returns
# 401 and the data refresh stops short of shipping to production.
# ``issues: write`` for the failure-handler step at the end of the
# job — opens / updates a tracking issue when the run fails so a
# silent fetcher outage can't sit unnoticed for hours.
permissions:
  contents: write
  actions: write
  issues: write

jobs:
  refresh:
    name: Scrape + Rebuild + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          python scripts/check_env.py --runtime
          # Playwright package itself is declared in requirements.txt;
          # this step only installs the Chromium *browser binary* that
          # the scraper drives.  The `2>/dev/null || true` is
          # deliberate — a transient Chromium download failure should
          # not block the scheduled refresh when a browser is already
          # cached on the runner.
          python -m playwright install chromium 2>/dev/null || true

      - name: Sync Draft Data from Google Sheet
        shell: bash
        run: |
          set -Eeuo pipefail
          # ── Google Sheet → repo sync ──────────────────────────────────
          # The Draft Data workbook lives in Google Sheets and is shared
          # via link ("anyone with the link can view").  We download it
          # every refresh cycle so the app always has current values.
          #
          # Sheet ID extracted from the sharing URL.  If the sheet is
          # ever made private, replace this with a service-account flow
          # and store credentials in GitHub Secrets.
          SHEET_ID="17wa6qdZ1Y8ckb4TIVZ4_C71g0skvtk9UZy43zSFzRlA"

          echo "Downloading Draft Data workbook..."
          HTTP_CODE=$(curl -sL -w "%{http_code}" \
            "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx" \
            -o "CSVs/Draft Data.xlsx.tmp")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::warning title=Sheet sync failed::Google Sheets returned HTTP ${HTTP_CODE} — keeping existing workbook"
            rm -f "CSVs/Draft Data.xlsx.tmp"
          else
            SIZE=$(stat -c%s "CSVs/Draft Data.xlsx.tmp" 2>/dev/null || echo 0)
            if (( SIZE < 1000 )); then
              echo "::warning title=Sheet sync suspicious::Downloaded file only ${SIZE} bytes — keeping existing workbook"
              rm -f "CSVs/Draft Data.xlsx.tmp"
            else
              mv "CSVs/Draft Data.xlsx.tmp" "CSVs/Draft Data.xlsx"
              echo "Workbook updated (${SIZE} bytes)"

              # Also export the Draft Data tab as CSV for fallback consumers
              python -c "
          import openpyxl, csv
          wb = openpyxl.load_workbook('CSVs/Draft Data.xlsx', data_only=True)
          ws = wb['Draft Data']
          with open('CSVs/draft_data.csv', 'w', newline='') as f:
              writer = csv.writer(f)
              for row in ws.iter_rows(values_only=True):
                  writer.writerow(['' if v is None else v for v in row])
          wb.close()
          print(f'CSV exported: {ws.max_row} rows')
          "
            fi
          fi

      - name: Run scraper
        if: ${{ inputs.skip_scrape != true }}
        shell: bash
        timeout-minutes: 15
        env:
          # Feed credentials to the FG + DS scrapers, which read them
          # via os.environ.  If a secret is missing the scraper logs
          # a warning and fails the fetch — handled as non-fatal by
          # the `|| echo` fallback below.
          DRAFTSHARKS_EMAIL: ${{ secrets.DRAFTSHARKS_EMAIL }}
          DRAFTSHARKS_PASSWORD: ${{ secrets.DRAFTSHARKS_PASSWORD }}
          DLF_USERNAME: ${{ secrets.DLF_USERNAME }}
          DLF_PASSWORD: ${{ secrets.DLF_PASSWORD }}
          # Contents of ``idpshow_session.json`` — the browser-minted
          # Substack cookie jar. Optional: absent means CI skips
          # idpShow and the prod systemd timer remains its only
          # producer, which is the behaviour before this secret existed.
          IDPSHOW_SESSION_JSON: ${{ secrets.IDPSHOW_SESSION_JSON }}
        run: |
          set -Eeuo pipefail

          # Stamp helper.  Each fetcher invocation runs through this so
          # ``data/scrape_state/{key}_last_success`` records the unix
          # epoch of every successful run, regardless of whether the
          # CSV content changed.  This is the load-bearing freshness
          # signal for the alert engine — see _per_source_freshness in
          # server.py for the read side.  Without it, monthly-cadence
          # vendors (Fitzmaurice, Yahoo Boone) trip false-positive
          # stale alerts because git checkout --force on prod skips
          # rewriting unchanged files, freezing the CSV mtime on the
          # last *content* change rather than the last *fetcher
          # success*.
          #
          # ``stamp_keys`` is a colon-separated list so a single
          # fetcher that produces multiple registry-keyed CSVs (e.g.
          # ``fetch_draftsharks.py`` writes both ``draftSharks``
          # and ``draftSharksIdp``) stamps every registry key its
          # output feeds.  ``_per_source_freshness`` in server.py
          # looks up stamps by *registry key*, not vendor name, so a
          # single ``footballGuys`` stamp left ``footballGuysSf`` /
          # ``footballGuysIdp`` falling back to CSV mtime — which
          # freezes whenever Vendor PDFs / rookie consensus stay
          # byte-identical for >24h.  Legacy vendor stamps stay in
          # the list for backward compatibility (e.g. the
          # ``Assert DLF freshness`` step still reads ``dlf_last_success``).
          mkdir -p data/scrape_state
          run_fetcher() {
            local stamp_keys="$1"; shift
            local label="$1"; shift
            if "$@" 2>&1; then
              local now_epoch
              now_epoch="$(date -u +%s)"
              local IFS=':'
              for key in $stamp_keys; do
                [[ -z "$key" ]] && continue
                printf '%s\n' "$now_epoch" > "data/scrape_state/${key}_last_success"
              done
            else
              echo "::warning title=${label} fetch failed::Non-fatal — continuing with stale CSV"
            fi
          }

          # Marker for stamp_if_present below: a stamp may only be
          # written for a CSV the scraper ACTUALLY REWROTE during this
          # run.  Files that merely exist from checkout must not mint
          # fresh stamps — with _build_source_timestamps preferring
          # stamps over mtime, presence-only stamping would report a
          # dead scraper's sources as freshly fetched forever (Codex
          # review on PR #532 round 7).
          SCRAPE_START_MARKER="$RUNNER_TEMP/scrape_start.marker"
          touch "$SCRAPE_START_MARKER"

          echo "::group::Scraper output"
          python "Dynasty Scraper.py" 2>&1 || {
            echo "::warning title=Scraper partial failure::Scraper exited non-zero but may have partial data"
          }
          echo "::endgroup::"

          # Mirror scraper site_raw output to the tracked CSVs/ directory.
          # ``-p`` preserves the export's mtime: a plain ``cp`` would
          # give the destination a post-marker mtime even for stale
          # checkout-resident exports the failed scraper never touched,
          # letting old boards mint fresh success stamps below (Codex
          # review on PR #532 round 8).  With the source mtime
          # preserved, only exports the scraper actually rewrote this
          # run pass the ``-nt $SCRAPE_START_MARKER`` gate.
          if [[ -d "exports/latest/site_raw" ]]; then
            mkdir -p CSVs/site_raw
            cp -vp exports/latest/site_raw/*.csv CSVs/site_raw/ 2>/dev/null || true
          fi

          # Stamp the sources produced by the main scraper.  These
          # don't go through ``run_fetcher`` so they previously had no
          # explicit freshness stamp — ``_per_source_freshness`` fell
          # back to CSV mtime, which is reset by ``actions/checkout``
          # on every CI run and frozen on prod for byte-identical
          # files after ``git pull``.  Writing the stamp here makes
          # ktcSfTep / idpTradeCalc / dynastyNerds / fantasyPros
          # boards visible to the staleness watchdog regardless of
          # mtime behaviour.  Two conditions guard the stamp: the CSV
          # must have been REWRITTEN during this run (newer than the
          # pre-scraper marker — mere presence from checkout does not
          # prove a fetch happened; the scraper's non-zero exit is
          # swallowed above, and per-source granularity means partial
          # successes still stamp only what was actually written), and
          # it must have reasonable content (>= min lines) so a
          # corrupted scrape doesn't fake freshness.
          # AUDIT Z-2 — the mtime gate above is necessary and NOT
          # sufficient, and this is the gap that made the whole
          # freshness class unobservable.
          #
          # When a source fetch fails or lands under its row floor, the
          # scraper skips the write and a later pass RESTORES the prior
          # good copy with ``open(dest, "wb")`` — a fresh write, so the
          # file gets a CURRENT mtime and sails past ``-nt marker``.
          # The row count passes too, because the restored board is the
          # full last-good one. So a dead vendor minted a fresh
          # ``*_last_success`` on every run and the staleness watchdog
          # printed "ok: 22 sources" forever. IDPTradeCalc is the IDP
          # backbone, the sole cross-market IDP anchor and ~90% of every
          # IDP value under alpha-shrinkage — it going quiet is exactly
          # what this stamp exists to reveal.
          #
          # The scraper already knows the answer and writes it down:
          # ``exports/latest/manifest.json`` carries ``siteRawFresh``
          # and ``siteRawPreserved``. Nothing consulted it. Preferring
          # the manifest makes the stamp mean "the vendor answered this
          # run" instead of "a file exists", with the mtime gate kept as
          # the fallback for when no manifest was produced.
          # Kept to a SINGLE line on purpose. Every line of this step is
          # inside a YAML block scalar, so any line at column 0 — a
          # heredoc terminator, or the body of a multi-line `python3 -c`
          # — is less-indented than the block and silently ends it,
          # breaking the whole workflow file. Both forms were tried.
          #
          # Exit 0 == "this CSV was restored, not fetched". Any error
          # (missing/corrupt manifest, absent key) exits non-zero, which
          # falls back to the mtime gate below — the pre-existing
          # behaviour, so a manifest problem cannot suppress stamping
          # for every source at once.
          MANIFEST="exports/latest/manifest.json"
          was_preserved() {
            [[ -f "$MANIFEST" ]] || return 1
            python3 -c "import json,sys;sys.exit(0 if sys.argv[2] in (json.load(open(sys.argv[1],encoding='utf-8')).get('siteRawPreserved') or []) else 1)" "$MANIFEST" "$1" 2>/dev/null
          }

          stamp_if_present() {
            local key="$1"
            local csv="$2"
            local min_lines="${3:-10}"
            if was_preserved "$(basename "$csv")"; then
              echo "::warning title=${key} not refreshed::Restored last-good board; NOT stamping ${key}_last_success (the vendor did not answer this run)"
              return
            fi
            if [[ -f "$csv" && "$csv" -nt "$SCRAPE_START_MARKER" ]]; then
              local lines
              lines=$(wc -l < "$csv" 2>/dev/null || echo 0)
              if (( lines >= min_lines )); then
                printf '%s\n' "$(date -u +%s)" > "data/scrape_state/${key}_last_success"
              fi
            fi
          }
          stamp_if_present ktc                CSVs/site_raw/ktc.csv               100
          stamp_if_present ktcSfTep           CSVs/site_raw/ktcSfTep.csv          100
          stamp_if_present idpTradeCalc       CSVs/site_raw/idpTradeCalc.csv       50
          # NOTE: dynastyNerdsSfTep / fantasyProsSf / fantasyProsIdp used
          # to be stamped here too.  They are now fetched below instead —
          # see "Three sources were frozen" further down.  Leaving the
          # stamps here would be actively harmful: ``stamp_if_present``
          # only fires for a CSV the scraper rewrote this run, and the
          # scraper no longer produces these at all, so the stamps could
          # never fire and their presence implied a producer that does
          # not exist.

          # Fetch Dynasty Daddy SF rankings
          run_fetcher dynastyDaddy:dynastyDaddySf "Dynasty Daddy" python scripts/fetch_dynasty_daddy.py --mirror-data-dir

          # Fetch FantasyCalc dynasty SF + TEP rankings (public JSON API)
          run_fetcher fantasyCalc "FantasyCalc" python scripts/fetch_fantasycalc.py --mirror-data-dir

          # Fetch OTC Fantasy Football Superflex trade-derived values
          # (public JSON API at otcffb.com/api/trade-values?format=sf).
          # No auth, no Playwright — see fetch_otcffb.py for details.
          run_fetcher otcffbSf "OTCFFB SF" python scripts/fetch_otcffb.py --mirror-data-dir

          # Fetch Fantasy Navigator superflex dynasty board (public
          # JSON API on Render; no auth, no Playwright).  Values are
          # KTC-derived — see the registry entry in data_contract.py.
          run_fetcher fantasyNavigatorSf "Fantasy Navigator" python scripts/fetch_fantasynavigator.py --mirror-data-dir

          # Fetch Play for Keeps Dynasty master board (public Supabase
          # PostgREST read with PFK's publishable anon key — the same
          # anonymous access their site gives any visitor).
          run_fetcher pfkDynasty "PFK Dynasty" python scripts/fetch_pfk.py --mirror-data-dir

          # Fetch Flock Fantasy SF rankings
          run_fetcher flockFantasy:flockFantasySf "Flock Fantasy" python scripts/fetch_flock_fantasy.py --mirror-data-dir

          # Fetch Flock Fantasy SF ROOKIE rankings (PROSPECTS_SF endpoint)
          run_fetcher flockFantasyRookies:flockFantasySfRookies "Flock Fantasy rookies" python scripts/fetch_flock_fantasy_rookies.py --mirror-data-dir

          # Fetch FootballGuys league-synced rankings (offense + IDP)
          # The scraper auto-logs-in via Playwright on session refresh
          # when cached cookies are rejected; non-fatal if the site is
          # unreachable so the rest of the pipeline keeps running.

          # Fetch DraftSharks league-synced rankings (offense + IDP).
          # DS requires Playwright because league scoring is applied
          # client-side by a WebAssembly worker; auto-login is wired
          # into the scraper itself.
          run_fetcher draftSharks:draftSharksIdp "DraftSharks" python scripts/fetch_draftsharks.py

          # Fetch DraftSharks rest-of-season rankings (real ROS pages,
          # not the dynasty board).  Reuses the session cookies the
          # dynasty fetch above already minted.  Writes to
          # ``CSVs/site_raw/draftSharksRos{Sf,Idp}.csv`` — the ROS
          # adapter prefers these over the dynasty proxies when present.
          # Non-fatal: the ROS adapter falls back to the dynasty
          # proxies if these CSVs are missing or stale.
          run_fetcher draftSharksRos "DraftSharks ROS" python scripts/fetch_draftsharks_ros.py

          # DLF rankings (dlfSf, dlfIdp, dlfRookieSf, dlfRookieIdp) are
          # NOT fetched here.  Cloudflare 403s every GET to wp-login.php
          # from the GitHub Actions IP range before our credentials are
          # even sent — curl_cffi's chrome131 TLS-fingerprint impersonation
          # passes CF's JS challenge but cannot beat the IP-reputation
          # gate.  The same ``scripts/fetch_dlf.py`` succeeds from the
          # production VPS, so we run it there on a systemd timer
          # (``deploy/systemd/dynasty-dlf-fetch.timer``) every 2h, push
          # the four CSVs + the freshness stamp back to main, and let
          # CI's normal data-refresh cycle pick them up on the next run.
          # Same pattern that ``fetch_idpshow.py`` already uses (see
          # the IDP Show comment block below).
          #
          # The ``Assert DLF freshness`` step at the end of this
          # workflow still reads ``data/scrape_state/dlf_last_success``
          # (now written by the prod timer instead of this step) and
          # red-Xes the run when the stamp is more than 24h old.
          # Fetch FantasyPros / Pat Fitzmaurice Dynasty Trade Value
          # Chart.  Monthly article with date-rotating URL; the
          # fetcher auto-resolves the current month (falls back up
          # to 3 months).  Vendor publishes monthly so the CSV content
          # stays byte-identical between drops — the stamp is what
          # tracks that the fetcher itself succeeded each cycle.
          run_fetcher fantasyProsFitzmaurice "FP Fitzmaurice" python scripts/fetch_fantasypros_fitzmaurice.py

          # ── Three sources were frozen. This unfreezes them. ─────────
          #
          # ``dynastyNerdsSfTep``, ``fantasyProsSf`` and ``fantasyProsIdp``
          # had NO producer at all:
          #
          #   * ``Dynasty Scraper.py`` sets DynastyNerds / FantasyPros /
          #     FantasyPros_IDP to ``False`` in its ``SITES`` dict
          #     ("disabled in scope reduction") — only KTC and
          #     IDPTradeCalc remain ``True``.
          #   * Replacement fetchers were WRITTEN but never wired:
          #     ``fetch_dynasty_nerds.py``, ``fetch_fantasypros_offense.py``
          #     and ``fetch_fantasypros_idp.py`` had zero references in
          #     .github/workflows/ before this change.
          #
          # So the only thing touching them was ``stamp_if_present``,
          # which correctly declined to stamp a CSV nothing rewrote.
          # Their last real fetch was 2026-07-25; the checked-in
          # ``dynastyNerdsSfTep.csv`` dates from 2026-07-20. Measured
          # 2026-07-27 against a live fetch: 131 of 269 shared players
          # had moved >=10 ranks, 25 players were missing entirely, and
          # the #2 overall asset was wrong (frozen said Drake Maye, live
          # says Bijan Robinson). All three kept voting in every
          # player's blend the whole time — 420 + 169 + 293 served rows
          # of week-old data.
          #
          # All three fetchers were validated live before wiring:
          # FantasyPros offense 540 players (QB 72 / RB 137 / TE 99 /
          # WR 232), FantasyPros IDP 183, Dynasty Nerds 294 rows. Each
          # is a plain ``requests.get`` against a public page — no auth,
          # no paywall bypass — exactly like the fetchers above.
          run_fetcher dynastyNerdsSfTep "Dynasty Nerds SF-TEP" python scripts/fetch_dynasty_nerds.py --mirror-data-dir
          run_fetcher fantasyProsSf "FantasyPros Dynasty SF" python scripts/fetch_fantasypros_offense.py --mirror-data-dir
          run_fetcher fantasyProsIdp "FantasyPros Dynasty IDP" python scripts/fetch_fantasypros_idp.py --mirror-data-dir

          # Fetch Justin Boone's Yahoo Sports dynasty trade value charts
          # (QB / RB / WR / TE).  Public web pages, no auth, so the
          # GitHub Actions runner IPs work fine.  Vendor publishes
          # monthly via redirect chain — see the script's docstring.
          # The stamp captures fetcher success on every cycle even when
          # the resolved article URL hasn't changed.
          run_fetcher yahooBoone "Yahoo Boone" python scripts/fetch_yahoo_boone.py

          # IDP Show — only when the session secret is configured.
          #
          # The rankings sit behind a Substack paywall whose login is
          # captcha-gated, so there is no credential pair to hand the
          # fetcher; it needs a browser-minted cookie jar. Until this
          # secret existed, the ONLY producer was the prod systemd
          # timer (deploy/idpshow_fetch_and_push.sh) — which is why
          # idpShow is soft-flagged in config/source_staleness.json.
          #
          # Written to a file and deleted in the same block rather than
          # left on disk: the repo is committed from this working tree
          # later in the job, and idpshow_session.json is gitignored,
          # but relying on a gitignore entry to keep a live session
          # cookie out of a public-ish commit is one edit away from
          # leaking it. The trap fires on any exit path.
          if [[ -n "${IDPSHOW_SESSION_JSON:-}" ]]; then
            trap 'rm -f idpshow_session.json' EXIT
            printf '%s' "$IDPSHOW_SESSION_JSON" > idpshow_session.json
            # Validate before spending a request: a truncated or
            # mis-pasted secret should say so plainly rather than
            # surface as an indistinguishable "paywall" failure.
            if python -c "import json,sys; d=json.load(open('idpshow_session.json')); sys.exit(0 if d.get('cookies') else 1)" 2>/dev/null; then
              run_fetcher idpShow "IDP Show" python scripts/fetch_idpshow.py
            else
              echo "::warning title=IDP Show secret malformed::IDPSHOW_SESSION_JSON is set but is not JSON with a non-empty 'cookies' array. Skipping; the prod timer still covers idpShow."
            fi
            rm -f idpshow_session.json
            trap - EXIT
          else
            echo "IDPSHOW_SESSION_JSON not configured; skipping idpShow (prod timer remains its producer)"
          fi

          # IDP Show (Adamidp) is a Substack paywalled source with
          # captcha-protected login, so the scraper reads cached
          # cookies from idpshow_session.json (gitignored).  CI has no
          # session file, and Substack's CAPTCHA flow can't be solved
          # headlessly, so we run fetch_idpshow.py on the production
          # VPS via systemd timer (``deploy/systemd/dynasty-idpshow-fetch.timer``)
          # every 2h and push the CSV + stamp back to main — same
          # pattern as fetch_dlf.py.  Nothing to do here; CI just
          # consumes whatever the prod timer most recently committed.

          # Verify at least KTC data was produced (primary source)
          if [[ -f "CSVs/site_raw/ktc.csv" ]]; then
            KTC_LINES=$(wc -l < "CSVs/site_raw/ktc.csv")
            echo "KTC CSV: ${KTC_LINES} lines"
            if (( KTC_LINES < 100 )); then
              echo "::error title=KTC data too small::Only ${KTC_LINES} lines in KTC export"
              exit 1
            fi
          else
            echo "::error title=KTC data missing::CSVs/site_raw/ktc.csv not found"
            exit 1
          fi

          # Refresh ROS engine data (separate short-term contender layer;
          # never touches dynasty values).  Runs after the dynasty
          # scrapers complete so the DraftSharks-CSV proxy adapter sees
          # today's CSVs.  Non-fatal — orchestrator preserves last-good
          # CSV per source on adapter failure, so a bad scrape just
          # marks the source stale.
          python -m src.ros.scrape 2>&1 || echo "::warning title=ROS scrape failed::Non-fatal — orchestrator keeps yesterday's CSV per source"


      - name: Persist freshness stamps
        # Runs even when ``Run scraper`` exited non-zero so the
        # per-fetcher ``data/scrape_state/{key}_last_success`` stamps
        # written by ``run_fetcher`` survive partial failures.
        # Without this, a downstream guard (e.g. the KTC line-count
        # check) failing the scrape step throws away every other
        # fetcher's stamps when the container is torn down, freezing
        # ``lastFetched`` on the prior good commit and silently
        # stretching the 44h-stale-everywhere outage the operator
        # flagged.  Only stages ``data/scrape_state/`` — bad CSVs
        # cannot get committed via this step.  ``always() &&
        # !cancelled()`` is explicit about the intent: ignore the
        # implicit success() gate (we WANT to run on failure) but
        # still skip if the operator cancelled the run.
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/scrape_state/
          if git diff --cached --quiet; then
            echo "No stamps changed"
          else
            git commit -m "chore: freshness stamps $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # ``--autostash`` is load-bearing here: on the failure
            # path that this step is meant to recover from, the
            # workspace still has unstaged tracked CSV/export
            # changes from the partially-completed scrape.  A plain
            # ``git pull --rebase`` refuses to start with unstaged
            # tracked changes ("cannot pull with rebase: You have
            # unstaged changes") and the stamp commit would never
            # get pushed, defeating the whole stamps-survive-failure
            # contract.  Autostash stashes the working tree before
            # the rebase and pops it after, leaving the CSV churn
            # in place for the next step (Commit updated data) to
            # find.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Validate scrape sanity (pre-commit gate)
        # Roadmap 1.4: block a corrupted scrape (row count collapsed
        # > 50% vs the prior commit, no numeric signal in any column,
        # or below the source's registered min line count) from being
        # committed/deployed.  Plain step → default ``if: success()``,
        # so a non-zero exit fails the job and the success()-gated
        # "Commit updated data" below is SKIPPED; the existing "Alert
        # on workflow failure" step then opens a tracking issue.  A
        # 30-50% drop is a non-fatal ::warning (exits 0, still ships).
        # HEAD here is prior main (Persist freshness stamps already
        # pulled), so ``git show HEAD:`` is the previous scrape.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/validate_scrape_sanity.py

      - name: Prune regenerable archives (retention)
        # ``server.py`` runs this same policy best-effort at scrape-end
        # on the prod box, but this workflow scrapes and ``git add -f``s
        # the raw trees WITHOUT booting the server — so without an
        # explicit prune here the tracked raw_sources/raw snapshots grow
        # unbounded (they had reached ~640MB).  Running it before the
        # ``git add`` below means the working-tree deletions are staged
        # and committed alongside the fresh snapshot.  Best-effort: a
        # prune hiccup must never block shipping a good scrape, so this
        # is non-strict and ``|| true``-guarded.
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m src.maintenance.retention || true

      - name: Commit updated data
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Guard each path: ``git add`` hard-fails (exit 128) on a
          # pathspec that matches nothing, and these directories can
          # legitimately vanish — retention (src/maintenance/retention)
          # pruned the last data/canonical/ snapshots on 2026-07-25 and
          # every subsequent refresh run died right here while the
          # scrape itself had succeeded.  A path that is absent from
          # the worktree but still TRACKED must stage its deletions
          # (``git add -A`` — verified to exit 0 with only a warning),
          # otherwise the prune never lands in a commit and the next
          # checkout resurrects the files forever (Codex review on
          # PR #532).
          # data/player_map/ persists team_map_last_good.json — the
          # scraper's Sleeper-outage fallback for NFL-team tags.  Fresh
          # runners start from the repo, so an unstaged map would never
          # survive to the run that needs it (Codex round 7 on PR #535).
          for p in CSVs/ exports/ data/canonical/ data/raw/ data/raw_sources/ data/identity/ data/player_map/ data/ros/ data/scrape_state/ data/sleeper_last_good.json; do
            if [ -e "$p" ]; then
              git add -f -- "$p"
            elif [ -n "$(git ls-files -- "$p")" ]; then
              git add -A -- "$p"
            fi
          done
          # B8 — `git add -f` OVERRIDES .gitignore, which is how
          # data/ros/team_strength/*.json came to be tracked in a public
          # repo every two hours despite .gitignore saying generated
          # team-strength output stays ignored.  Those files are 78 KB
          # per league of per-manager weakness intelligence (ownerId,
          # benchDepthScore, positionalCoverageScore, full lineups), and
          # the rosTeamStrength route now requires a session for exactly
          # that payload — leaving the git copy would make the gate
          # decorative.
          #
          # Unstaged rather than removed: the files must keep existing on
          # the runner and on production, where the ROS pipeline reads
          # them from disk.  This only stops them entering a commit.
          git reset -q -- 'data/ros/team_strength/*.json' || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: automated data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # ``--autostash`` mirrors the Persist freshness stamps
            # step above so this pull also tolerates any working-tree
            # leftovers (e.g. uncommitted ROS scrape outputs that
            # didn't match the staged paths).
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Trigger deploy
        # ``!cancelled()`` rather than ``success()``: the Persist
        # freshness stamps step runs and pushes a stamp commit even
        # when Run scraper failed partway (the exact partial-failure
        # mode this hardening targets).  Gating deploy on success()
        # would leave production's source_health frozen on the prior
        # deploy's timestamps while main keeps receiving stamp commits
        # — defeating the freshness-visibility goal.  Safe because the
        # grep guard below only dispatches when the latest pushed
        # commit is an actual data-refresh or stamp commit, and a
        # failed scrape never commits CSV content (Commit updated data
        # is success()-gated), so a failure-path deploy ships fresh
        # stamps over unchanged last-good data — never bad data.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          # deploy.yml uses paths-ignore for data/** and exports/**, so
          # data-only pushes will NOT auto-trigger a deploy. Dispatch manually.
          # ``freshness stamps`` matches the stamp-only commit the
          # Persist freshness stamps step creates when a partial scrape
          # failure or a slow-vendor cycle produces no CSV content
          # change but still bumps ``data/scrape_state``.  Without this
          # alternative, prod's source_health would freeze on the
          # previous deploy's stamps even though the cron has been
          # running and stamps have been pushed every cycle.
          if git log -1 --pretty=%B | grep -qE "automated data refresh|freshness stamps"; then
            echo "Data updated, dispatching deploy workflow explicitly"
            gh workflow run deploy.yml --ref main
          else
            echo "No data changes, skipping deploy trigger"
          fi

      - name: Assert DLF freshness
        # Runs after Commit + Deploy so other sources still ship even
        # when DLF is broken.  Fails the workflow when the most recent
        # successful ``scripts/fetch_dlf.py`` invocation was more than
        # 24h ago — same threshold the email alert engine uses
        # (config/source_staleness.json), but surfaced as an immediate
        # red X on the workflow run.
        #
        # ``data/scrape_state/dlf_last_success`` holds a unix epoch
        # written by the ``Run scraper`` step on full success and
        # committed in the previous step.  We read its *content*, not
        # its mtime — ``actions/checkout`` resets every tracked file's
        # mtime to the checkout instant, so an mtime-based check can
        # never observe a cross-run outage and would silently pass
        # while DLF rots.  File contents do survive checkout, so the
        # epoch stored inside the stamp is the load-bearing signal.
        #
        # ``if: always()`` so the assertion runs even when an earlier
        # step crashed.
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          THRESHOLD_HOURS=24
          STAMP="data/scrape_state/dlf_last_success"
          if [[ ! -f "$STAMP" ]]; then
            echo "::error title=DLF freshness::${STAMP} missing — DLF has never produced a successful run since this guard was added.  Check the [DLF] log lines in 'Run scraper' above and verify DLF_USERNAME/DLF_PASSWORD repo secrets."
            exit 1
          fi
          LAST_SUCCESS="$(tr -dc '0-9' < "$STAMP")"
          if [[ -z "$LAST_SUCCESS" ]]; then
            echo "::error title=DLF freshness::${STAMP} contains no parseable epoch — file is corrupt."
            exit 1
          fi
          NOW=$(date +%s)
          AGE_HOURS=$(( (NOW - LAST_SUCCESS) / 3600 ))
          if (( AGE_HOURS > THRESHOLD_HOURS )); then
            echo "::error title=DLF freshness::Last successful fetch_dlf.py run was ${AGE_HOURS}h ago (threshold ${THRESHOLD_HOURS}h).  Check the [DLF] log lines in 'Run scraper' above and verify DLF_USERNAME/DLF_PASSWORD repo secrets."
            exit 1
          fi
          echo "ok: last successful DLF fetch was ${AGE_HOURS}h ago"

      - name: Report freshness
        if: always()
        shell: bash
        run: |
          echo "## Data Refresh Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Lines | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for csv in CSVs/site_raw/*.csv; do
            name=$(basename "$csv" .csv)
            lines=$(wc -l < "$csv" 2>/dev/null || echo "0")
            status="OK"
            if (( lines < 10 )); then status="⚠️ LOW"; fi
            echo "| ${name} | ${lines} | ${status} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Staleness watchdog
        # Fails the workflow when any registered ranking source is
        # older than its threshold in ``config/source_staleness.json``.
        # Uses the same freshness signal the live alert engine reads
        # (``data/scrape_state/{key}_last_success`` stamps, falling
        # back to CSV mtime), so a green watchdog run guarantees the
        # site's stale-source banner is empty.  Runs ``if: always()``
        # so it executes even when an earlier step partially failed —
        # we want the red X regardless.
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          # Tee to a file so the failure handler can name the stale
          # sources in its tracking issue.  pipefail preserves the
          # watchdog's exit code so the step still goes red.
          python scripts/watchdog_freshness.py 2>&1 | tee "$RUNNER_TEMP/staleness.log"

      - name: Contract coverage watchdog
        # Sibling to the freshness watchdog.  Freshness asks "did the
        # fetcher run?"; this asks "did the fetched data actually land
        # in the board the server will serve?".  Builds the contract
        # exactly as ``server._prime_latest_payload`` does and fails
        # the run if a *fresh* registered source covers ~0 players —
        # the silent registry / enrich / prime-timing regression that
        # let ``otcffbSf`` be fetched + committed yet absent from the
        # live board with no error anywhere.  ``if: always()`` so a
        # partial earlier failure still gets the red X plus the
        # failure-handler issue.
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/watchdog_contract_coverage.py

      - name: Alert on workflow failure
        # When the run fails (scrape crash, DLF guard tripped,
        # staleness watchdog red, etc.) open or update a tracking
        # issue so the outage surfaces immediately instead of sitting
        # quietly until someone notices the on-site banner.  Idempotent:
        # if an open ``stale-sources`` issue already exists, post a
        # comment with the new run details rather than spamming new
        # issues each cycle.
        #
        # Mainline only — see the long note on the same guard in e2e.yml
        # (#716); workflow_dispatch is this workflow's only non-main path.
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Pull the watchdog's stale-source summary (if it ran) so the
          # issue names what's actually stale instead of a generic blurb.
          STALE_SUMMARY="(see the Run scraper / watchdog steps)"
          if [[ -f "${RUNNER_TEMP}/staleness.log" ]]; then
            LINE=$(grep -E '^(fail|ok):' "${RUNNER_TEMP}/staleness.log" | tail -n1 || true)
            [[ -n "$LINE" ]] && STALE_SUMMARY="$LINE"
          fi
          BODY=$(cat <<EOF
          Scheduled data refresh failed.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Triggered: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - Freshness watchdog: ${STALE_SUMMARY}

          Likely causes:
          1. A fetcher crashed (check the **Run scraper** step).
          2. KTC produced too few rows (primary-source guard tripped).
          3. The DLF freshness guard tripped (>24h since last DLF stamp).
          4. The staleness watchdog flagged one or more sources past
             threshold (see the run summary table).

          The cron will retry automatically on the next 2h cycle.  If
          the same failure recurs, fix the root cause and trigger a
          manual run via ``workflow_dispatch``.
          EOF
          )
          # Ensure the dedup label exists.  Previously it never did, so
          # the labelled create below failed and fell back to an
          # UNLABELLED issue every cycle — which the search could never
          # match, spamming a fresh issue on each run.  Creating it
          # idempotently makes the rolling-issue dedup actually work.
          gh label create stale-sources \
            --color B60205 \
            --description "Auto-opened when the scheduled data refresh fails" \
            2>/dev/null || true
          # Idempotent: comment on the existing open tracking issue if
          # one exists, else open a single labelled one and reuse it.
          EXISTING=$(gh issue list --state open --label stale-sources \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Scheduled data refresh failing" \
              --body "$BODY" \
              --label stale-sources
          fi

      - name: Close the tracking issue on a green run
        # The counterpart the alert step never had.  Failures opened or
        # commented on a rolling ``stale-sources`` issue, but nothing
        # ever closed it — so once the underlying problem was fixed the
        # issue stayed open forever, collecting comments from unrelated
        # future outages.  An alert that cannot clear is indistinguishable
        # from an alert nobody acted on, and after a few days it stops
        # being read at all.
        #
        # ``success()`` is the whole condition deliberately: every gate
        # in this workflow (scrape sanity, DLF freshness, the staleness
        # watchdog, contract coverage) has already run by here, so a
        # green run IS the all-clear.  Re-deriving "is it really fixed?"
        # from individual step outcomes would duplicate that logic and
        # let the two drift.
        #
        # The one thing ``success()`` alone cannot establish is WHOSE run
        # was green.  Mainline only, for the reason in e2e.yml (#716): a
        # green dispatch from a branch would close a real open mainline
        # issue with an all-clear it never measured.
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Close every open one, not just the first.  The pre-#584 alert
          # step could fall back to creating UNLABELLED duplicates, and a
          # label was added to the query later, so more than one may be
          # open; ``--json number --jq '.[0]'`` (the read the alert step
          # uses) would leave the rest orphaned.
          OPEN=$(gh issue list --state open --label stale-sources \
                   --json number --jq '.[].number' 2>/dev/null || echo "")
          if [[ -z "$OPEN" ]]; then
            echo "no open stale-sources issue; nothing to close"
            exit 0
          fi
          for N in $OPEN; do
            echo "closing #${N}"
            gh issue close "$N" --reason completed --comment \
              "Scheduled data refresh is green again — all gates passed (scrape sanity, DLF freshness, staleness watchdog, contract coverage).

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Closed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Reopened automatically by the alert step if the refresh fails again." || true
          done
