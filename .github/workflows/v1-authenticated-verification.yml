name: V1 Authenticated Production Verification (ephemeral guest session)

# Commit-to-verification attribution: a run that is named only "V1 ..." cannot
# be tied to the deploy it verifies without opening its log (the head_sha GitHub
# shows for a workflow_run is main's tip at trigger time, NOT the deploy's).
# Informational only; no gate reads the run name.
run-name: >-
  V1 verify ${{ github.event_name == 'workflow_run'
  && format('deploy run {0} @ {1}', github.event.workflow_run.id, github.event.workflow_run.head_sha)
  || format('manual dispatch @ {0}', github.sha) }}

# The one generic primitive the §9a packet-A tranche was blocked on: an
# authenticated production session, produced by EXISTING authorized
# infrastructure instead of an owner grant.
#
# HOW, and why it preserves auth
# ------------------------------
# 1. An on-box SSH step (the same DEPLOY_* mechanism the other dispatch
#    workflows use) mints a guest pass through the canonical
#    src/api/guest_passes.py::create() at a NON-DEFAULT duration.  That is
#    a normal admin mutation — and it is itself the mechanism V1-102
#    exists to test (configurable expiry; hash-only persistence).
# 2. The runner logs in through the real /api/auth/login guest-pass
#    fall-through.  No bypass, no E2E_TEST_MODE, no allowlist change: the
#    resulting session is a genuine time-bounded GUEST session, which the
#    admin gates reject by construction (username stays "guest").
# 3. The verification suite runs with that session:
#      - scripts/verify_v1_authenticated.py  (API halves: V1-11/27/45/56/
#        61/102-partial/131)
#      - scripts/verify_lane4_production.py --mode remote (+ C8/C9 with a
#        REAL free agent the API suite picked off the deployed board)
#      - the prod-auth Playwright specs, when present (browser halves)
# 4. The pass is revoked (always()), and the audit trail — pass id,
#    timestamps, deployed SHA — goes into the artifact.  The token and the
#    session id are masked, kept in 600-mode RUNNER_TEMP files, and never
#    written to any artifact.
#
# What this deliberately CANNOT do: anything admin.  The /admin-surface
# halves of V1-101/V1-102 stay blocked on an admin credential that does
# not exist here and is not being created.

on:
  # TEMP Week-1 proof bridge: run the existing verification instrument
  # after a successful main deployment. Remove this workflow_run trigger
  # once W1-30 evidence is recorded; workflow_dispatch remains canonical.
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  workflow_dispatch:
    inputs:
      league:
        description: League key to verify against (registry key)
        required: false
        default: "dynasty_main"
        type: string
      suite:
        description: Which halves to run
        required: false
        default: "all"
        type: choice
        options: [api, browser, all, baseline]
      baseline_diagnostics:
        description: Opt-in bounded browser attribution for manual baseline only
        type: boolean
        required: false
        default: false
      baseline_context_cooldown_ms:
        description: Pause before each baseline context, outside navigation timing (60000 requires pass_hours >= 3 for core)
        type: choice
        required: false
        default: "0"
        options: ["0", "60000"]
      baseline_route_set:
        description: Reviewed routes for manual baseline (league is sessionless; Game Day uses the guest profile)
        type: choice
        required: false
        default: core
        options: [core, league-game-day]
      pass_hours:
        description: Guest-pass duration in hours, at least 1 (non-default on purpose — 12 is the UI default)
        required: false
        default: "2"
        type: string

permissions:
  contents: read

# No WORKFLOW-level concurrency, deliberately (2026-09-24).  This workflow
# fires on EVERY Deploy Production completion, cancelled ones included, and
# the job's ``if`` skips all but a successful main deploy.  A workflow-level
# group is entered before that ``if`` is evaluated, so a run whose job was
# about to be skipped still sat PENDING in ``production-deploy`` — and GitHub
# keeps one pending run per group, so it cancelled whatever deploy was
# queued (Deploy Production 36072042988 / 36072618473, both cancelled with no
# job started, displaced by run 36072626319).  Each cancelled deploy then
# spawned another such run.  Job-level concurrency is acquired only when the
# job actually runs, so a real verification still serialises with deploys
# and a skipped one never enters the group.

jobs:
  v1-authenticated:
    name: V1 authenticated verification
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # 45 + the bounded warm wait (5 min) added 2026-10-19.
    timeout-minutes: 50
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A workflow_run starts from the default branch, so an implicit
          # checkout can race ahead of the Deploy Production run that
          # triggered this verifier. Pin to the triggering deploy SHA; a
          # manual dispatch still verifies the SHA it was dispatched from.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve production origin
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          PROD_PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
          BASELINE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'baseline' }}
          DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          DEPLOY_COMPLETED_AT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.updated_at || '' }}
        run: |
          set -Eeuo pipefail
          if [ -z "${EXPECTED_SOURCE_SHA:-}" ]; then
            echo "::error::verification source SHA is empty"
            exit 1
          fi
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Expected verification source: $EXPECTED_SOURCE_SHA"
          echo "Checked-out verification source: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SOURCE_SHA"
          if [ -z "${PROD_PUBLIC_URL:-}" ]; then
            echo "::error::vars.PROD_PUBLIC_URL is unset — refusing to guess the origin"
            exit 1
          fi
          if [ "$BASELINE_REQUESTED" = "true" ] && [ "$PROD_PUBLIC_URL" != "https://chaseupside.com" ]; then
            echo "::error::baseline production origin is not approved"
            exit 1
          fi
          echo "ORIGIN=${PROD_PUBLIC_URL%/}" >> "$GITHUB_ENV"
          # Inputs to the report-only failure classifier (scripts/v1_failure_classifier.py):
          # which revision this run MEANT to verify, which deploy produced it,
          # and how long it queued behind other production work.  Public values.
          echo "V1_EXPECTED_SHA=$EXPECTED_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "V1_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "V1_DEPLOY_RUN_ID=${DEPLOY_RUN_ID}" >> "$GITHUB_ENV"
          echo "V1_DEPLOY_COMPLETED_AT=${DEPLOY_COMPLETED_AT}" >> "$GITHUB_ENV"

      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Mint an ephemeral verification guest pass (on-box, canonical implementation)
        id: mint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          PASS_HOURS: ${{ inputs.pass_hours || '2' }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The pass must outlive the run: one that expires mid-run would
          # kill the session before the revoke, and the security probes
          # could no longer attribute a rejection to the revoke.  Refused
          # before anything is minted.
          if ! python3 -c 'import math, sys; v = float(sys.argv[1]); sys.exit(0 if math.isfinite(v) and v >= 1 else 1)' "$PASS_HOURS" 2>/dev/null; then
            echo "::error::pass_hours must be a number >= 1 (got '${PASS_HOURS}')"
            exit 1
          fi
          # Captured by command substitution ONLY — the raw output is never
          # echoed or teed, so the token cannot reach the log before the
          # mask below.
          MINT_JSON=$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") PASS_HOURS=$(printf %q "$PASS_HOURS") RUN_ID=$(printf %q "$RUN_ID") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          [ -x "$PY" ] || PY=python3
          "$PY" - <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, os.environ["APP_DIR"])
          from src.api import guest_passes

          gp, token = guest_passes.create(
              duration_hours=float(os.environ.get("PASS_HOURS", "2")),
              note=f"v1-authenticated-verification run {os.environ.get('RUN_ID', '?')}",
              created_by="github-actions-v1-verify",
          )
          print(json.dumps({"id": gp.id, "expires": gp.expires_at_epoch, "token": token}))
          PYEOF
          REMOTE
          )
          TOKEN=$(printf '%s' "$MINT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          PASS_ID=$(printf '%s' "$MINT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          EXPIRES=$(printf '%s' "$MINT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["expires"])')
          install -m 600 /dev/null "$RUNNER_TEMP/guest_pass_token"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/guest_pass_token"
          echo "PASS_ID=$PASS_ID" >> "$GITHUB_ENV"
          echo "pass_id=$PASS_ID" >> "$GITHUB_OUTPUT"
          echo "expires=$EXPIRES" >> "$GITHUB_OUTPUT"
          echo "Minted guest pass id=$PASS_ID (expiry epoch $EXPIRES); token masked."

      - name: Log in through the real auth path
        id: login
        shell: bash
        env:
          BASELINE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'baseline' }}
          PASS_HOURS: ${{ inputs.pass_hours || '2' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        run: |
          set -Eeuo pipefail
          set +e
          BODY=$(python3 - "$ORIGIN" "$RUNNER_TEMP/guest_pass_token" <<'PYEOF'
          import json
          import os
          import sys
          import urllib.request

          class NoBaselineRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def login_opener(origin, baseline):
              if not baseline:
                  return urllib.request.urlopen
              if origin != "https://chaseupside.com":
                  raise ValueError("baseline_origin_refused")
              return urllib.request.build_opener(NoBaselineRedirect()).open

          origin, token_file = sys.argv[1], sys.argv[2]
          open_login = login_opener(origin, os.environ.get("BASELINE_REQUESTED") == "true")
          token = open(token_file, encoding="utf-8").read().strip()
          req = urllib.request.Request(
              origin + "/api/auth/login",
              method="POST",
              headers={"Content-Type": "application/json"},
              data=json.dumps({"username": "guest", "password": token}).encode(),
          )
          with open_login(req, timeout=30) as resp:
              cookie = ""
              for header, value in resp.headers.items():
                  if header.lower() == "set-cookie" and value.startswith("jason_session="):
                      cookie = value.split(";", 1)[0].split("=", 1)[1]
              body = json.load(resp)
          print(json.dumps({"ok": body.get("ok"), "guest": body.get("guest"),
                            "expiresAtEpoch": body.get("expiresAtEpoch"), "cookie": cookie}))
          PYEOF
          )
          LOGIN_RC=$?
          set -e

          if [ "$LOGIN_RC" -ne 0 ]; then
            echo "::error title=Production auth path failed::real /api/auth/login failed with exit ${LOGIN_RC}; collecting bounded non-secret diagnostics before preserving the failure"
            echo "Public-path diagnostics (status + latency only):"
            for endpoint in /api/health /api/status /api/public/league; do
              rc=0
              result=$(curl --silent --show-error --output /dev/null --max-time 10 \
                --write-out "HTTP=%{http_code} total=%{time_total}s" \
                "${ORIGIN}${endpoint}") || rc=$?
              echo "runner ${endpoint}: ${result:-HTTP=000} curl_rc=${rc}"
            done

            echo "On-box backend diagnostics (no request bodies, tokens, or journal payloads):"
            ssh -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "SERVICE_NAME=$(printf %q "$SERVICE_NAME") bash -s" <<'REMOTE' || true
            set +e
            date -u '+[on-box] utc=%Y-%m-%dT%H:%M:%SZ'
            for endpoint in /api/health /api/status /api/public/league; do
              result=$(curl --silent --show-error --output /dev/null --max-time 10 \
                --write-out 'HTTP=%{http_code} total=%{time_total}s' \
                "http://127.0.0.1:8000${endpoint}")
              rc=$?
              echo "[on-box] ${endpoint}: ${result:-HTTP=000} curl_rc=${rc}"
            done
            echo "[on-box] systemd state:"
            sudo -n systemctl is-active "$SERVICE_NAME" || true
            sudo -n systemctl show "$SERVICE_NAME" --no-pager \
              -p ActiveState -p SubState -p MainPID -p NRestarts \
              -p ExecMainStatus -p MemoryCurrent -p TasksCurrent || true
          REMOTE
            exit "$LOGIN_RC"
          fi

          COOKIE=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["cookie"])')
          if [ -z "$COOKIE" ]; then
            echo "::error::login returned no jason_session cookie"
            exit 1
          fi
          echo "::add-mask::$COOKIE"
          install -m 600 /dev/null "$RUNNER_TEMP/session_cookie"
          printf '%s' "$COOKIE" > "$RUNNER_TEMP/session_cookie"
          GUEST=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["guest"])')
          EXPIRES=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["expiresAtEpoch"])')
          echo "guest=$GUEST expiresAtEpoch=$EXPIRES (requested ${PASS_HOURS}h — non-default)"
          echo "expires_epoch=$EXPIRES" >> "$GITHUB_OUTPUT"
          if [ "$GUEST" != "True" ] && [ "$GUEST" != "true" ]; then
            echo "::error::login did not report a guest session"
            exit 1
          fi

      # Security incident 2026-10-08 acceptance, on EVERY run: the control
      # half.  The same session is probed again after the revoke; a
      # rejection then is only evidence if it was accepted now.  Status
      # codes and booleans only (scripts/verify_v1_authenticated.py
      # security-probe); the cookie stays in its 600-mode file.
      - name: Security probe after login (control)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_v1_authenticated.py security-probe \
            --origin "$ORIGIN" --cookie-file "$RUNNER_TEMP/session_cookie" \
            --out "$RUNNER_TEMP/security_probe_login.json"

      # Bounded wait for a WARM backend before any suite runs.  This job is
      # dispatched the moment Deploy Production finishes, i.e. seconds after a
      # restart: the backend's startup scrape then runs for ~4 minutes and
      # keeps the event loop busy (a cold /api/status measured 28-35 s), so
      # the first specs were timing the scrape, not the product.  Public
      # endpoints only — status code, latency and a boolean are printed,
      # nothing else.  Never fails the job: a backend that does not warm
      # inside the budget is reported (::warning::) and the suites run
      # anyway, so their verdict still stands on production as it is.  Also
      # records the backend's public ``build.process_started_at`` so the
      # restart check below can tell whether the process restarted mid-run.
      - name: Wait for a warm backend (bounded, public endpoints)
        id: warm
        if: ${{ inputs.suite != 'baseline' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$ORIGIN" <<'PYEOF'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          origin = sys.argv[1]
          BUDGET_SECONDS = 300
          FAST_SECONDS = 10.0
          deadline = time.monotonic() + BUDGET_SECONDS


          def get(path, timeout):
              t0 = time.monotonic()
              try:
                  with urllib.request.urlopen(origin + path, timeout=timeout) as resp:
                      code, raw = resp.status, resp.read()
              except urllib.error.HTTPError as exc:  # /api/health answers 503 while degraded
                  code, raw = exc.code, exc.read()
              except Exception:  # noqa: BLE001 -- unreachable/timeout: not warm
                  return None, None, time.monotonic() - t0
              try:
                  body = json.loads(raw)
              except ValueError:
                  body = None
              return code, (body if isinstance(body, dict) else None), time.monotonic() - t0


          warm = False
          while True:
              code, body, took = get("/api/health", 20)
              scraping = body.get("scrape_running") if body else None
              print(f"health HTTP={code or '000'} {took:.1f}s scrape_running={scraping}")
              if code is not None and took < FAST_SECONDS and scraping is False:
                  warm = True
                  break
              if time.monotonic() >= deadline:
                  break
              time.sleep(15)

          _code, status, _took = get("/api/status", 60)
          started = ((status or {}).get("build") or {}).get("process_started_at")
          started = started if isinstance(started, str) else ""
          # Which commit production is RUNNING (public /api/status build.commit,
          # read once at process start).  The same request as above -- no extra
          # load.  Only a full 40-hex SHA is kept; anything else is unknown.
          commit = ((status or {}).get("build") or {}).get("commit")
          commit = commit if isinstance(commit, str) and re.fullmatch(r"[0-9a-f]{40}", commit) else ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"backend_warm={'true' if warm else 'false'}\n")
              out.write(f"backend_started_at={started}\n")
              out.write(f"backend_commit={commit}\n")
          print(f"backend warm={warm} process_started_at={started or 'unknown'} commit={commit or 'unknown'}")
          expected = os.environ.get("V1_EXPECTED_SHA", "")
          # Report-only.  The specs of THIS checkout are being run against
          # whatever production serves; when that is a different revision the
          # run cannot verify the deploy that triggered it (a V1 run queued
          # 66-86 min behind a newer deploy ran against that deploy's process).
          if commit and expected and commit != expected:
              print(
                  "::warning title=Production revision differs from the verified revision::"
                  f"specs are from {expected[:12]} but production runs {commit[:12]}; "
                  "this run's verdict is not a verdict on the triggering deploy"
              )
          if not warm:
              print(
                  "::warning title=Backend not warm::production did not answer /api/health "
                  f"quickly with no scrape running within {BUDGET_SECONDS}s; the suites run "
                  "anyway — read slow or timed-out specs with that in mind"
              )
          PYEOF

      - name: API verification suite
        # The temporary post-deploy Week 1 bridge needs the prod-auth browser
        # artifact for W1-30; API/Lane-4 rows are already independently
        # VERIFIED. Manual dispatch semantics stay unchanged.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'browser' && inputs.suite != 'baseline' }}
        id: api
        shell: bash
        env:
          LEAGUE: ${{ inputs.league || 'dynasty_main' }}
          PASS_HOURS: ${{ inputs.pass_hours || '2' }}
          EXPIRES_EPOCH: ${{ steps.login.outputs.expires_epoch }}
        run: |
          set -Eeuo pipefail
          rc=0
          # PUBLIC log + artifact: the script prints and writes ONLY its
          # allowlisted summary (scripts/public_verification_report.py) --
          # ids, statuses, counts, booleans; never detail text or bodies.
          python3 scripts/verify_v1_authenticated.py \
            --origin "$ORIGIN" --league "$LEAGUE" \
            --cookie-file "$RUNNER_TEMP/session_cookie" \
            --report v1-auth-report.json \
            --expected-duration-seconds "$(python3 -c "print(float('$PASS_HOURS')*3600)")" \
            --observed-expires-epoch "$EXPIRES_EPOCH" \
            --free-agent-out "$RUNNER_TEMP/free_agent.txt" || rc=$?
          echo "api_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "API suite exit: $rc (0 pass · 2 fail · 3 proved nothing)"

      - name: Lane 4 remote verification (C1-C3 + C8/C9)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'browser' && inputs.suite != 'baseline' }}
        id: lane4
        shell: bash
        env:
          LEAGUE: ${{ inputs.league || 'dynasty_main' }}
        run: |
          set -Eeuo pipefail
          export RISKIT_SESSION_COOKIE="jason_session=$(cat "$RUNNER_TEMP/session_cookie")"
          ADD_PLAYER_ARGS=()
          if [ -s "$RUNNER_TEMP/free_agent.txt" ]; then
            ADD_PLAYER_ARGS=(--add-player "$(cat "$RUNNER_TEMP/free_agent.txt")")
            echo "C8/C9 free agent picked from the deployed board (name not logged)"
          else
            echo "No free agent picked — C8/C9 will record BLOCKED (never invented)"
          fi
          rc=0
          # PUBLIC log + artifact: --public-report makes stdout and the file
          # the allowlisted summary only.  No tee of the full report, and no
          # --out here (the full report is for a private host).
          python3 scripts/verify_lane4_production.py \
            --mode remote --origin "$ORIGIN" --league "$LEAGUE" \
            --public-report lane4-remote.json \
            "${ADD_PLAYER_ARGS[@]}" || rc=$?
          echo "lane4_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "Lane 4 remote exit: $rc"

      - name: Browser verification suite (prod-auth Playwright specs)
        if: ${{ (github.event_name == 'workflow_run' || (inputs.suite != 'api' && inputs.suite != 'baseline')) && hashFiles('tests/e2e/prod-auth.config.js') != '' }}
        id: browser
        shell: bash
        env:
          PROD_ORIGIN: ${{ env.ORIGIN }}
          PROD_SESSION_COOKIE_FILE: ${{ runner.temp }}/session_cookie
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install chromium --with-deps
          rc=0
          npx playwright test --config tests/e2e/prod-auth.config.js 2>&1 | tee prod-auth-browser.txt || rc=$?
          echo "browser_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "Browser suite exit: $rc"

      - name: Set up Node 20 for production baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'baseline' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Collect authenticated route baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'baseline' }}
        id: baseline
        shell: bash
        env:
          PROD_ORIGIN: ${{ env.ORIGIN }}
          PROD_SESSION_COOKIE_FILE: ${{ runner.temp }}/session_cookie
          PROD_SESSION_EXPIRES_EPOCH: ${{ steps.login.outputs.expires_epoch }}
          BASELINE_DIAGNOSTICS: ${{ inputs.baseline_diagnostics && 'true' || 'false' }}
          BASELINE_ROUTE_SET: ${{ inputs.baseline_route_set || 'core' }}
          BASELINE_CONTEXT_COOLDOWN_MS: ${{ inputs.baseline_context_cooldown_ms || '0' }}
        run: |
          set -Eeuo pipefail
          npm ci
          npx playwright install chromium --with-deps
          case "$BASELINE_ROUTE_SET" in
            core) routes=/rankings,/trade ;;
            league-game-day) routes=/league,/game-day ;;
            *) echo 'Unreviewed baseline route set' >&2; exit 2 ;;
          esac
          rc=0
          node frontend/scripts/measure-route-baselines.mjs \
            --auth production-cookie --runs 5 --viewport both --diagnostics "$BASELINE_DIAGNOSTICS" \
            --routes "$routes" --timeout 45000 \
            --context-cooldown-ms "$BASELINE_CONTEXT_COOLDOWN_MS" \
            --json production-route-baselines.json || rc=$?
          echo "baseline_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "Baseline collection exit: $rc (bounded observations, not campaign acceptance)"

      # Did the backend restart while the suites ran?  A restart is not a
      # verification failure by itself, but every spec in flight across it
      # fails (502s, a wedged process before it), and before the 2026-10-19
      # session_store fix it also deleted this run's guest session on
      # rehydrate — run 39221318435 lost its session, half its browser specs
      # and its revoke proof to a restart at 08:42:49 that nothing in the log
      # named.  Public /api/status only; never fails the job.
      - name: Detect a backend restart during the run (public /api/status)
        id: restart
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          STARTED_BEFORE: ${{ steps.warm.outputs.backend_started_at }}
        run: |
          set -Eeuo pipefail
          python3 - "$ORIGIN" <<'PYEOF'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          origin = sys.argv[1]
          before = os.environ.get("STARTED_BEFORE") or ""
          after = ""
          commit_after = ""
          status_http = ""
          t0 = time.monotonic()
          try:
              with urllib.request.urlopen(origin + "/api/status", timeout=60) as resp:
                  status_http = str(resp.status)
                  body = json.loads(resp.read())
              build = (body or {}).get("build") or {}
              value = build.get("process_started_at")
              after = value if isinstance(value, str) else ""
              commit = build.get("commit")
              commit_after = commit if isinstance(commit, str) and re.fullmatch(r"[0-9a-f]{40}", commit) else ""
          except urllib.error.HTTPError as exc:  # answered, with an error status
              status_http = str(exc.code)
              after = ""
          except Exception:  # noqa: BLE001 -- unknown, never "no restart"
              after = ""
          status_seconds = f"{time.monotonic() - t0:.2f}" if status_http else ""
          # Report-only inputs to scripts/v1_failure_classifier.py.  The restart
          # INSTANT is what lets a restart be attributed to the one test it
          # overlapped, rather than to every failure in the run; the HTTP code and
          # latency of this same request (no extra load) say whether the backend
          # was answering promptly after the suites.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"backend_started_after={after}\n")
              out.write(f"backend_commit_after={commit_after}\n")
              out.write(f"status_after_http={status_http}\n")
              out.write(f"status_after_seconds={status_seconds}\n")
          if not before or not after:
              print(f"backend restart during run: unknown (before={before or 'unknown'}, now={after or 'unknown'})")
          elif before != after:
              print(
                  "::warning title=Backend restarted mid-run::process_started_at moved from "
                  f"{before} to {after}; specs in flight across the restart are not product verdicts"
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"\n**Backend restarted during the run:** `{before}` → `{after}`\n")
          else:
              print(f"backend restart during run: none (process_started_at {after})")
          PYEOF

      # The control the security verdict depends on: the SAME session,
      # probed in the step directly before the revoke.  The post-login probe
      # above ran before every suite; if the session died in between (a
      # short pass, an eviction, a restart) a post-revoke rejection would be
      # misattributed to the revoke.  Not accepted here => the verdict is
      # ``inconclusive``, which fails the run.
      - name: Security probe immediately before revocation (control)
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/verify_v1_authenticated.py security-probe \
            --origin "$ORIGIN" --cookie-file "$RUNNER_TEMP/session_cookie" \
            --out "$RUNNER_TEMP/security_probe_pre_revoke.json"

      - name: Revoke the pass (always)
        id: revoke
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # The session cookie outlives this step on purpose: the
          # post-revocation probe below needs the SAME session, and that
          # step deletes the cookie file on its own exit.
          trap 'rm -f -- "$RUNNER_TEMP/guest_pass_token"' EXIT
          rc=0
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") PASS_ID=$(printf %q "$PASS_ID") bash -s" <<'REMOTE' || rc=$?
          set -Eeuo pipefail
          cd "$APP_DIR"
          PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          [ -x "$PY" ] || PY=python3
          "$PY" - <<'PYEOF'
          import os
          import sys

          sys.path.insert(0, os.environ["APP_DIR"])
          from src.api import guest_passes

          pass_id = int(os.environ["PASS_ID"])
          revoked = guest_passes.revoke(pass_id)
          still_authoritative = guest_passes.session_authority(pass_id)
          print(f"revoked pass id={pass_id}: {revoked}; still authoritative: {still_authoritative}")
          # A freshly minted pass must be newly marked AND stop being an
          # authority; anything else is a failed revoke.
          sys.exit(0 if revoked and not still_authoritative else 3)
          PYEOF
          REMOTE
          if [ "$rc" -ne 0 ]; then
            echo "revoke_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Revoke failed::revoking pass ${PASS_ID} failed (exit ${rc})"
            exit 1
          fi
          echo "revoke_ok=true" >> "$GITHUB_OUTPUT"
          echo "Audit: pass ${PASS_ID} minted and revoked within this run."

      - name: Security probe after revocation (same session)
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f -- "$RUNNER_TEMP/guest_pass_token" "$RUNNER_TEMP/session_cookie"' EXIT
          python3 scripts/verify_v1_authenticated.py security-probe \
            --origin "$ORIGIN" --cookie-file "$RUNNER_TEMP/session_cookie" \
            --out "$RUNNER_TEMP/security_probe_post.json"

      - name: On-box guest-session census (count-only, content read-only)
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # src/api/session_store.py::guest_session_census reads both stores
          # content read-only (sqlite mode=ro; may create -wal/-shm) and
          # returns counts/booleans only — no session id,
          # username, cookie or pass id.  A failure leaves no census file,
          # which the summary records as unknown (never as 0).
          rc=0
          CENSUS_JSON=$(ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          [ -x "$PY" ] || PY=python3
          "$PY" - <<'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, os.environ["APP_DIR"])
          from src.api import session_store

          print(json.dumps(session_store.guest_session_census()))
          PYEOF
          REMOTE
          ) || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::on-box census failed (exit ${rc}); recorded as unknown"
            exit 0
          fi
          printf '%s' "$CENSUS_JSON" > "$RUNNER_TEMP/session_census.json"

      - name: Security acceptance summary (incident 2026-10-08)
        id: security
        if: ${{ always() && steps.mint.outputs.pass_id != '' }}
        shell: bash
        env:
          REVOKE_OK: ${{ steps.revoke.outputs.revoke_ok }}
        run: |
          set -Eeuo pipefail
          rc=0
          python3 scripts/verify_v1_authenticated.py security-summary \
            --login-control "$RUNNER_TEMP/security_probe_login.json" \
            --pre-revoke-control "$RUNNER_TEMP/security_probe_pre_revoke.json" \
            --post "$RUNNER_TEMP/security_probe_post.json" \
            --census "$RUNNER_TEMP/session_census.json" \
            --revoke-ok "$REVOKE_OK" \
            --out security-acceptance.json \
            --step-summary "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "security_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "Security acceptance exit: $rc (0 pass · 2 fail or inconclusive)"

      # REPORT-ONLY failure classification (scripts/v1_failure_classifier.py;
      # taxonomy in docs/ops/V1_VERIFICATION_TAXONOMY.md).  It reads only the
      # sanitized prod-auth report, the two security-probe JSONs (status codes
      # and booleans) and public values from earlier steps, and writes
      # v1-failure-classification.json + a step summary.  It is NOT a gate:
      # continue-on-error, nothing below reads its output, and the verdict is
      # still decided by the next step and by the security acceptance step.
      # No secret is passed to it.
      - name: Classify failures (report-only, never a gate)
        id: classify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          V1_JOB_STATUS: ${{ job.status }}
          V1_BACKEND_WARM: ${{ steps.warm.outputs.backend_warm }}
          V1_COMMIT_BEFORE: ${{ steps.warm.outputs.backend_commit }}
          V1_STARTED_BEFORE: ${{ steps.warm.outputs.backend_started_at }}
          V1_COMMIT_AFTER: ${{ steps.restart.outputs.backend_commit_after }}
          V1_STARTED_AFTER: ${{ steps.restart.outputs.backend_started_after }}
          V1_LOGIN_OUTCOME: ${{ steps.login.outcome }}
          V1_BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          V1_STATUS_AFTER_HTTP: ${{ steps.restart.outputs.status_after_http }}
          V1_STATUS_AFTER_SECONDS: ${{ steps.restart.outputs.status_after_seconds }}
          # The exit codes the verdict step below decides on.  job.status still
          # reads "success" here for a run that step is about to fail, so the
          # classifier mirrors the verdict step's rule from these same values.
          V1_API_EXIT: ${{ steps.api.outputs.api_exit }}
          V1_LANE4_EXIT: ${{ steps.lane4.outputs.lane4_exit }}
          V1_BROWSER_EXIT: ${{ steps.browser.outputs.browser_exit }}
          V1_SECURITY_EXIT: ${{ steps.security.outputs.security_exit }}
        run: |
          set -Eeuo pipefail
          python3 scripts/v1_failure_classifier.py classify \
            --safe-report tests/e2e/prod-auth-results.json \
            --probe-login "$RUNNER_TEMP/security_probe_login.json" \
            --probe-pre-revoke "$RUNNER_TEMP/security_probe_pre_revoke.json" \
            --out v1-failure-classification.json \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Fail the job on API/lane4/browser verdicts
        shell: bash
        env:
          API_EXIT: ${{ steps.api.outputs.api_exit }}
          LANE4_EXIT: ${{ steps.lane4.outputs.lane4_exit }}
          BROWSER_EXIT: ${{ steps.browser.outputs.browser_exit }}
          BASELINE_EXIT: ${{ steps.baseline.outputs.baseline_exit }}
          SECURITY_EXIT: ${{ steps.security.outputs.security_exit }}
          BASELINE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'baseline' }}
        run: |
          set -Eeuo pipefail
          echo "api=$API_EXIT lane4=$LANE4_EXIT browser=$BROWSER_EXIT security=$SECURITY_EXIT (0 pass · 2 fail · 3 proved nothing)"
          # Security incident 2026-10-08 acceptance is binding on every run
          # that minted a pass: anything but an observed pass fails the job.
          if [ -n "$SECURITY_EXIT" ] && [ "$SECURITY_EXIT" != "0" ]; then
            echo "::error title=Security acceptance::post-revocation probe or session census failed (exit $SECURITY_EXIT)"
            exit 1
          fi
          # Exit 3 is recorded but does not fail the job: an evidence-free
          # check must be visible, and a red job hides which one happened.
          #
          # The browser code is consumed HERE rather than by a second step,
          # so there is one verdict owner. It used to be captured into
          # `browser_exit` and read by nothing, while this step carried
          # `if: inputs.suite != 'browser'` — so on a browser run the job's
          # conclusion was structurally independent of whether the Playwright
          # specs passed, and a failing browser suite reported success. That
          # is the same class as a gate that cannot find its input and
          # therefore reads exactly like a gate that passed.
          #
          # A skipped suite leaves its output empty, which the case below
          # ignores: absent is not a verdict, and must not read as either a
          # pass or a failure.
          if [ "$BASELINE_REQUESTED" = "true" ] && [ "$BASELINE_EXIT" != "0" ]; then
            echo "::error::requested baseline failed or produced no verdict"
            exit 1
          fi
          for code in "$API_EXIT" "$LANE4_EXIT" "$BROWSER_EXIT"; do
            case "$code" in
              1|2) echo "::error title=V1 authenticated::a suite reported exit $code"; exit "$code" ;;
            esac
          done

      # PUBLIC repo => public artifacts (security S3).  v1-auth-report.json
      # and lane4-remote.json are allowlisted summaries
      # (scripts/public_verification_report.py); production-route-baselines.json
      # is fixed-enum timings.  The browser suite contributes ONLY its sanitized
      # report (tests/e2e/prod-auth.config.js
      # runs prod-auth-safe-reporter.js; trace/screenshot/video are off).
      # NEVER add tests/e2e/test-results-prod-auth/, a Playwright html
      # report, a trace, a video or a screenshot here: a failed run's
      # trace.zip carried the session cookie 154x plus private response
      # bodies.  Pinned by tests/e2e/test_prod_auth_artifact_safety.py.
      - name: Upload the reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: v1-authenticated-report
          path: |
            production-route-baselines.json
            v1-auth-report.json
            security-acceptance.json
            v1-failure-classification.json
            lane4-remote.json
            tests/e2e/prod-auth-results.json
          if-no-files-found: warn
          retention-days: 30
