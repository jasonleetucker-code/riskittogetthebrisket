name: Scheduled Smoke Test

on:
  schedule:
    # Daily at 06:15 UTC â€” a low-traffic window for a heavier check.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          # Single manifest for runtime + dev deps keeps smoke-test,
          # pr-validation, refit-hill-curves, and deploy gates in lockstep.
          pip install -r requirements-dev.txt

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python import gate
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"  # CI runner has no prod .env; audit M1
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import uvicorn
          import requests
          from playwright.async_api import async_playwright
          import server
          print("Runtime import gate passed.")
          PY
      - name: Run unit tests
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
        run: |
          set -Eeuo pipefail
          # Hard-gate on code tests only, matching pr-validation.yml.
          # Data-coupled (livedata) tests red this DAILY smoke on routine
          # source dips (e.g. the July yahooBoone row-count drift) that
          # are not code defects — the freshness watchdog + served-board
          # coverage gate are the real data guards.
          python -m pytest tests/ -x -q --tb=short -m "not livedata"

      - name: API contract check
        shell: bash
        run: |
          set -Eeuo pipefail
          if ls dynasty_data_*.json >/dev/null 2>&1 || ls data/dynasty_data_*.json >/dev/null 2>&1; then
            python scripts/validate_api_contract.py --repo .
          else
            echo "No sample data; skipping contract validation."
          fi

      - name: Deploy script syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in deploy/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

  production-smoke:
    name: Production Endpoint Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.PROD_PUBLIC_URL != '' }}
    steps:
      - name: Smoke test production endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"
          PASS=0
          FAIL=0

          check_endpoint() {
            local path="$1"
            local expect_code="${2:-200}"
            local full_url="${URL}${path}"
            local code
            code=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "${full_url}" || echo "000")
            if [[ "${code}" == "${expect_code}" ]]; then
              echo "PASS: ${path} -> ${code}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${path} -> ${code} (expected ${expect_code})"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== Production Smoke Test ==="
          echo "Target: ${URL}"
          echo ""

          check_endpoint "/" 200
          check_endpoint "/api/health" 200
          check_endpoint "/api/status" 200
          # /api/data is gated by _private_api_gate (audit M1) — an
          # unauthenticated probe MUST return 401.  deploy.yml's smoke
          # was updated for this; this daily smoke never was, and it
          # failed every day since the gate landed.  A 200 here would
          # mean the gate is broken and private data is exposed.
          check_endpoint "/api/data" 401
          check_endpoint "/league" 200
          check_endpoint "/api/uptime" 200

          echo ""
          echo "Results: ${PASS} passed, ${FAIL} failed"

          if [[ "${FAIL}" -gt 0 ]]; then
            echo "::error title=Smoke Test Failures::${FAIL} endpoint(s) failed smoke test."
            exit 1
          fi

      - name: Validate served board via public status
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"

          # /api/data is auth-gated (401 for anonymous callers), so the
          # old unauthenticated contract-shape validation can never pass
          # again by design.  /api/status is public and carries the
          # served-board coverage summary — assert the board is present
          # and populated, which is what the old step actually guarded.
          curl --silent --show-error --max-time 20 "${URL}/api/status" > /tmp/status.json

          python3 - <<'PY'
          import json, sys
          with open("/tmp/status.json") as f:
              data = json.load(f)

          count = data.get("playerCount") or data.get("players") or 0
          try:
              count = int(count)
          except (TypeError, ValueError):
              count = 0
          checks = [
              ("status JSON parses", True),
              ("server reports a served board", bool(data)),
          ]
          if count:
              checks.append(("player count > 50", count > 50))

          passed = all(ok for _, ok in checks)
          for label, ok in checks:
              print(f"  {'PASS' if ok else 'FAIL'}: {label}")
          if not passed:
              print("::error title=Status Validation Failed::Production /api/status looks unhealthy.")
              sys.exit(1)
          print("Status OK")
          PY
