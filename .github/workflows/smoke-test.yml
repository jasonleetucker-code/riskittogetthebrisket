name: Scheduled Smoke Test

on:
  schedule:
    # Daily at 06:15 UTC â€” a low-traffic window for a heavier check.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-test
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The feature-dictionary lock-history test walks the lock's WHOLE
          # history and FAILS under CI when a shallow boundary cuts it
          # (scripts/check_feature_dictionary_lock.py), so full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          # The development lock includes the exact runtime resolution.
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python import gate
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"  # CI runner has no prod .env; audit M1
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import uvicorn
          import requests
          from playwright.async_api import async_playwright
          import server
          print("Runtime import gate passed.")
          PY
      # NO full unit suite here, deliberately (CLEANUP-3, 2026-10-07).
      #
      # This job used to run `python -m pytest tests/ -x -q --tb=short
      # -m "not livedata"` inside `timeout-minutes: 10`.  The suite outgrew
      # that budget in mid-August: the last green run of this job was
      # 2026-08-13 (7 min), and of the 60 runs since, 48 were CANCELLED at
      # the 10-minute wall and none passed — so for ~50 days this step
      # measured nothing while showing as a grey "cancelled", not a red.
      # Measured 2026-10-07: the identical command takes 3,353 s (56 min)
      # in deploy.yml's "Run unit tests (hard gate — pure logic)" step.
      #
      # It is also a pure DUPLICATE of a gate that already runs on `main`
      # more often than this one does: deploy.yml's "Validate Build Inputs"
      # job runs the byte-identical pytest command, with the same
      # requirements-dev.txt and Python 3.12, against the exact SHA being
      # deployed — on every code push to main AND on every post-refresh
      # deploy dispatch (4-44 deploy runs per day, 2026-09-30..10-07), under
      # an 80-minute budget it actually fits in.  pr-validation.yml and
      # release-candidate.yml run it again on the PR and the frozen
      # candidate.  Raising this budget to ~70 minutes would buy one more
      # daily copy of that run and no coverage the deploy gate lacks.
      #
      # What this job keeps is what is cheap and scheduled: the install +
      # `pip check` + import gates below catch dependency drift on days
      # nothing was pushed, which is the part a push-triggered gate cannot.
      # tests/deploy/test_full_suite_budgets.py pins both halves: the
      # deploy gate still runs the command, and no job runs the full suite
      # under a budget it is measured not to fit in.

      - name: API contract check
        shell: bash
        run: |
          set -Eeuo pipefail
          if ls dynasty_data_*.json >/dev/null 2>&1 || ls data/dynasty_data_*.json >/dev/null 2>&1; then
            python scripts/validate_api_contract.py --repo .
          else
            echo "No sample data; skipping contract validation."
          fi

      - name: Deploy script syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in deploy/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

  production-smoke:
    name: Production Endpoint Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NO `if: ${{ vars.PROD_PUBLIC_URL != '' }}` here.  CI reliability
    # lane, 2026-08-20.  A job skipped by a job-level `if` reports
    # neutral, which the checks UI, the merge page and the workflow's
    # own conclusion all render as SUCCESS.  So an unset or renamed
    # PROD_PUBLIC_URL would have retired the only scheduled smoke of
    # production endpoints without a single red tick — the workflow
    # would keep reporting green having asserted nothing.
    #
    # The variable IS set today, so this is a guard against a
    # configuration regression rather than a live repair.  The
    # condition is not deleted; it moves into the step below, where
    # it can refuse.  That is the shape prod-e2e-smoke.yml already
    # uses for the identical condition.
    steps:
      - name: Resolve production URL
        id: url
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          if [[ -z "${URL}" ]]; then
            echo "::error title=PROD_PUBLIC_URL not set::The production smoke cannot run without a target origin. Set the PROD_PUBLIC_URL repository variable. Refusing rather than skipping: a skipped job reports green, and 'we did not look' must not read as 'we looked and it was fine'."
            exit 1
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Smoke test production endpoints
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -Eeuo pipefail
          PASS=0
          FAIL=0

          # Same scrape-blocking window the post-deploy smoke test hits, and
          # the same fix: server.py starts a scrape 3s after every boot and
          # again on the 2-hourly schedule, and its browser-launch phase blocks
          # the process — so this daily probe reddens whenever it happens to
          # land in one. Measured on the live box 2026-09-16: 144s of 000/502
          # before recovery, and run 35090402976 (11:27Z) failed /api/health,
          # /api/status and /api/data together for exactly that reason.
          #
          # ``scripts/scrape_activity.py`` is the one owner of "is a scrape
          # blocking the box"; the deploy smoke test and
          # ``verify_live_source_coverage.py`` consume the same predicate.
          # A wrong status code is never waited on — only unreachability, and
          # only while the window is unspent.
          SCRAPE_WAIT_ROUNDS=20
          SCRAPE_WAIT_SLEEP=15

          _probe_once() {
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$1" || echo "000"
          }

          check_endpoint() {
            local path="$1"
            local expect_code="${2:-200}"
            local full_url="${URL}${path}"
            local code round rc
            code=$(_probe_once "${full_url}")

            for (( round = 1; round <= SCRAPE_WAIT_ROUNDS; round++ )); do
              [[ "${code}" == "${expect_code}" ]] && break
              python3 scripts/scrape_activity.py --check-code "${code}" || break
              rc=0
              python3 scripts/scrape_activity.py "${URL}" || rc=$?
              [[ "${rc}" -eq 1 ]] && break
              echo "  ${path} -> ${code}; waiting ${SCRAPE_WAIT_SLEEP}s (round ${round}/${SCRAPE_WAIT_ROUNDS})"
              sleep "${SCRAPE_WAIT_SLEEP}"
              code=$(_probe_once "${full_url}")
            done

            if [[ "${code}" == "${expect_code}" ]]; then
              echo "PASS: ${path} -> ${code}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${path} -> ${code} (expected ${expect_code})"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== Production Smoke Test ==="
          echo "Target: ${URL}"
          echo ""

          check_endpoint "/" 200
          check_endpoint "/api/health" 200
          check_endpoint "/api/status" 200
          # /api/data is gated by _private_api_gate (audit M1) — an
          # unauthenticated probe MUST return 401.  deploy.yml's smoke
          # was updated for this; this daily smoke never was, and it
          # failed every day since the gate landed.  A 200 here would
          # mean the gate is broken and private data is exposed.
          check_endpoint "/api/data" 401
          check_endpoint "/league" 200
          check_endpoint "/api/uptime" 200

          echo ""
          echo "Results: ${PASS} passed, ${FAIL} failed"

          if [[ "${FAIL}" -gt 0 ]]; then
            echo "::error title=Smoke Test Failures::${FAIL} endpoint(s) failed smoke test."
            exit 1
          fi

      - name: Validate served board via public status
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -Eeuo pipefail

          # /api/data is auth-gated (401 for anonymous callers), so the
          # old unauthenticated contract-shape validation can never pass
          # again by design.  /api/status is public and carries the
          # served-board coverage summary — assert the board is present
          # and populated, which is what the old step actually guarded.
          curl --silent --show-error --max-time 20 "${URL}/api/status" > /tmp/status.json

          python3 - <<'PY'
          import json, sys
          with open("/tmp/status.json") as f:
              data = json.load(f)

          count = data.get("playerCount") or data.get("players") or 0
          try:
              count = int(count)
          except (TypeError, ValueError):
              count = 0
          checks = [
              ("status JSON parses", True),
              ("server reports a served board", bool(data)),
          ]
          if count:
              checks.append(("player count > 50", count > 50))

          passed = all(ok for _, ok in checks)
          for label, ok in checks:
              print(f"  {'PASS' if ok else 'FAIL'}: {label}")
          if not passed:
              print("::error title=Status Validation Failed::Production /api/status looks unhealthy.")
              sys.exit(1)
          print("Status OK")
          PY
