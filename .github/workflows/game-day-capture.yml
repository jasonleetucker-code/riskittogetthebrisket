name: Game Day Capture (on-box)

# MANUAL TRIGGER + VERIFICATION for the Game Day pre-game prediction
# archive. The SCHEDULED owner of this capture is the prod-side systemd
# timer (deploy/systemd/dynasty-game-day-capture.timer.template), NOT this
# workflow — see that unit for why the capture has to run on the box:
# data/ is gitignored repo-wide, so an archive written on a CI runner is
# discarded with the runner, and the projection snapshots the capture joins
# against (data/bdvm/projections/) exist only on the box.
#
# So this workflow does not capture on the runner. It runs the SAME script
# on the box over SSH, which gives two things the timer alone does not:
#
#   1. a "capture now" button, for the week the timer is first installed
#      (its first fire is the only one with no prior run to prove it works,
#      and a Week 1 pregame window missed for an install problem is
#      unrecoverable evidence, not a retryable job); and
#   2. a --dry-run VERIFY mode that reports coverage and whether the window
#      is still open, without writing anything.
#
# DEFAULT IS DRY RUN. Writing is opt-in via the `write` input, because the
# archive is append-only: the FIRST capture for a (league, season, week,
# team, pregame) tuple is the one that stands, and a premature run consumes
# that slot with an earlier, staler roster.
#
# Same SSH mechanism, permissions and concurrency posture as
# lane4-onbox-verification.yml.

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Actually write snapshots (unchecked = dry run, reports only)"
        required: false
        default: false
        type: boolean
      capture_kind:
        description: "Which capture this is"
        required: false
        default: "pregame"
        type: choice
        options:
          - pregame
          - in_game
          - postgame
      league:
        description: "Registry league key (blank = every ACTIVE league)"
        required: false
        default: ""
        type: string
      week:
        description: "Override the week Sleeper reports (blank = ask Sleeper)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  capture:
    name: Game Day capture on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Run capture on the box
        id: capture
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          # The production venv lives OUTSIDE APP_DIR. deploy.yml passes this
          # same variable to deploy.sh as VENV_DIR, overriding deploy.sh's own
          # ${APP_DIR}/.venv default — so APP_DIR/.venv does not exist on this
          # box and guessing it silently selects the SYSTEM python, which has
          # no fastapi. Measured on run 33903569120: ModuleNotFoundError, 4
          # seconds in. The systemd unit was never affected (deploy renders
          # __VENV_DIR__ with the real path); only this workflow guessed.
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          CAPTURE_KIND: ${{ inputs.capture_kind || 'pregame' }}
          LEAGUE_KEY: ${{ inputs.league }}
          WEEK: ${{ inputs.week }}
          WRITE: ${{ inputs.write && '1' || '' }}
          RUN_ID: gha-${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          rc=0
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") VENV_DIR=$(printf %q "$VENV_DIR") CAPTURE_KIND=$(printf %q "$CAPTURE_KIND") LEAGUE_KEY=$(printf %q "$LEAGUE_KEY") WEEK=$(printf %q "$WEEK") WRITE=$(printf %q "$WRITE") RUN_ID=$(printf %q "$RUN_ID") bash -s" <<'REMOTE' 2>&1 | tee game-day-capture.txt || rc=$?
          set -Eeuo pipefail
          cd "$APP_DIR"
          echo "### deployed_sha: $(git rev-parse HEAD)"
          echo "### utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "### capture_kind: $CAPTURE_KIND"
          echo "### mode: ${WRITE:+WRITE}${WRITE:-DRY-RUN}"
          echo "###"
          # FAIL CLOSED. The retired ladder ended in a bare `python3`, and
          # that fallback is what turned "the venv is somewhere else" into a
          # ModuleNotFoundError deep inside an import chain — an interpreter
          # that cannot import the app is not a degraded run of this script,
          # it is a different question being answered. Refuse instead.
          PY="$VENV_DIR/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/.venv/bin/python"
          [ -x "$PY" ] || PY="$APP_DIR/venv/bin/python"
          if [ ! -x "$PY" ]; then
            echo "### ERROR: no application venv found."
            echo "### tried: $VENV_DIR/bin/python, $APP_DIR/.venv/bin/python, $APP_DIR/venv/bin/python"
            echo "### Set the PROD_VENV_DIR repository variable to the real path."
            exit 41
          fi
          echo "### python: $PY"

          ARGS="--capture-kind $CAPTURE_KIND --run-id $RUN_ID"
          [ -n "$LEAGUE_KEY" ] && ARGS="$ARGS --league $LEAGUE_KEY"
          [ -n "$WEEK" ] && ARGS="$ARGS --week $WEEK"
          [ -z "$WRITE" ] && ARGS="$ARGS --dry-run"

          # -u for the same reason lane4-onbox-verification.yml needs it:
          # no TTY at any hop, so block-buffered stdout can leave a killed
          # run indistinguishable from a silent one.
          set +e
          "$PY" -u scripts/capture_game_day_predictions.py $ARGS
          capture_rc=$?
          set -e
          echo "### capture-exit: $capture_rc"

          # Show what is actually on disk afterwards. A workflow that
          # reports "wrote 12 snapshots" and cannot show 12 files is
          # reporting its own intent, not the state of production.
          echo "###"
          echo "### archive contents:"
          find data/game_day/predictions -name '*.json' 2>/dev/null \
            | sed 's|^|###   |' | sort | head -60 || true
          echo "### archive file count: $(find data/game_day/predictions -name '*.json' 2>/dev/null | wc -l)"

          # Is the SCHEDULED path actually armed? A successful manual run
          # proves the script works; it says nothing about whether the timer
          # that is supposed to fire before kickoff exists and is enabled.
          # Those are different claims and the first has been mistaken for
          # the second before — deploy.sh only installs a missing timer when
          # its ensure-units check notices it, and a cancelled deploy
          # installs nothing at all.
          echo "###"
          echo "### scheduled timer:"
          TIMER="$(systemctl list-timers --all --no-pager --no-legend 2>/dev/null \
            | grep -i 'game-day-capture' || true)"
          if [ -n "$TIMER" ]; then
            echo "###   $TIMER"
            systemctl is-enabled --quiet "$(systemctl list-units --type=timer --all --no-legend \
              | awk '/game-day-capture/ && !s { for (i=1;i<=NF;i++) if ($i ~ /\.timer$/) { print $i; s=1; break } }')" 2>/dev/null \
              && echo "###   enabled: yes" || echo "###   enabled: NO"
          else
            echo "###   NOT INSTALLED — no game-day-capture timer on this host."
            echo "###   The scheduled pre-kickoff capture will NOT fire."
          fi

          # Does the INSTALLED unit treat exit 2 as success?
          #
          # A green run of THIS workflow does not answer that. The workflow
          # maps rc=2 to success itself, further down; that is a different
          # half of the same fix from what systemd does with the same code
          # on a timer firing. Reading one as evidence of the other is the
          # mistake this block exists to prevent.
          #
          # It matters because the timer fires ~6x/day and the window is
          # open ~30h a week, so nearly every firing exits 2. Without
          # SuccessExitStatus=2 the unit sits `failed` almost permanently
          # and a REAL failure becomes indistinguishable from the normal
          # case — which is the whole point of #1272.
          #
          # And a template reaching the repo is not a template reaching the
          # box: until #1267, install_simple_timer left an existing unit
          # alone however much its template had changed, so every timer edit
          # in this repo's history shipped into that hole. Print what is
          # ACTUALLY installed.
          echo "###"
          echo "### installed unit — exit-code policy:"
          # NOTE the awk idiom: match-and-set, never `{print; exit}`.
          # `exit` closes the pipe while systemctl is still writing, which
          # is SIGPIPE -> 141, and under `set -Eeuo pipefail` that aborts
          # the whole run before a single line of this diagnostic prints.
          # Measured: run 34167418550 died at exit 141 doing exactly that.
          # The pre-existing timer lookup below survives the same idiom
          # only because `--type=timer` is short enough to fit the pipe
          # buffer; `--type=service --all` is not. Consume the stream.
          # And NOT `print $1`: `systemctl list-units` puts a status BULLET
          # in the first column for any unit that is not in a clean state,
          # so $1 is "●" and the unit name shifts to $2. Measured: run
          # 34170621573 printed `unit: ●`, then answered every question
          # about a unit that does not exist — "(none)", "NO", "inactive".
          # A probe that silently reads the wrong subject is worse than no
          # probe, because its answers look like findings. Select the field
          # by SUFFIX, which is position-independent and bullet-proof.
          SVC="$(systemctl list-units --type=service --all --no-legend 2>/dev/null \
            | awk '/game-day-capture/ && !s { for (i=1;i<=NF;i++) if ($i ~ /\.service$/) { print $i; s=1; break } }' || true)"
          SVC="${SVC:-$(systemctl list-unit-files --no-legend 2>/dev/null \
            | awk '/game-day-capture\.service/ && !s { for (i=1;i<=NF;i++) if ($i ~ /\.service$/) { print $i; s=1; break } }' || true)}"
          if [ -n "$SVC" ]; then
            SES="$(systemctl show "$SVC" -p SuccessExitStatus --value 2>/dev/null || true)"
            echo "###   unit: $SVC"
            echo "###   SuccessExitStatus: ${SES:-(none)}"
            case " $SES " in
              *" 2 "*) echo "###   exit 2 counts as SUCCESS: yes" ;;
              *)       echo "###   exit 2 counts as SUCCESS: NO — the unit will sit failed between windows" ;;
            esac
            # 1 and 3 must stay failures. 3 is REFUSED: the window closed and
            # that week's observation is permanently unrecoverable. If either
            # ever appears here, someone widened the list and silenced the two
            # states an operator must actually be woken for.
            case " $SES " in
              *" 1 "*|*" 3 "*) echo "###   WARNING: 1 or 3 is being swallowed as success" ;;
              *)               echo "###   1 and 3 still fail loudly: yes" ;;
            esac
            echo "###   current state: $(systemctl is-failed "$SVC" 2>/dev/null || true)"
            # A `failed` state here can be STALE — left by a firing that
            # predates the SuccessExitStatus fix reaching the box — so it is
            # only meaningful alongside the timestamp of the last run above.
            echo "###   last result: $(systemctl show "$SVC" -p Result --value 2>/dev/null || true)"
          else
            echo "###   no game-day-capture service unit found on this host."
          fi
          exit "$capture_rc"
          REMOTE
          echo "capture_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "rc=$rc"
          # Exit 2 is "nothing to do yet" — the run was correct and the
          # window simply is not open. Failing the job on it would make a
          # correct outcome look broken and, worse, make a red run
          # meaningless: most firings are legitimately outside the ~30h
          # weekly window. 1 (error) and 3 (REFUSED — window closed,
          # observation unrecoverable) still fail loudly.
          if [[ "$rc" == "2" ]]; then
            echo "::notice title=Outside the capture window::Nothing to do yet; this is the expected state between windows."
            exit 0
          fi
          exit "$rc"

      - name: Upload capture log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: game-day-capture-log
          path: game-day-capture.txt
          if-no-files-found: warn

      - name: Summarise
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Game Day capture (${{ inputs.capture_kind || 'pregame' }})"
            echo ""
            echo "Mode: ${{ inputs.write && 'WRITE' || 'DRY RUN' }}"
            echo "Script exit: ${{ steps.capture.outputs.capture_exit }}"
            echo ""
            echo "Exit codes: 0 captured/already captured · 1 error ·"
            echo "2 nothing to do (preseason or no week) · **3 REFUSED — the"
            echo "pregame window has closed and that week's observation is"
            echo "permanently unrecoverable**."
            echo ""
            echo '```'
            cat game-day-capture.txt 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
