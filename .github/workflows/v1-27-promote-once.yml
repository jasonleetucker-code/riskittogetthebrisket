name: One-shot V1-27 ledger reconciliation

on:
  push:
    branches:
      - chatgpt/v1-27-promotion

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v1-27-promotion
          fetch-depth: 0

      - name: Promote V1-27 and mechanically recount V1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from collections import Counter
          from pathlib import Path

          path = Path("docs/VERSION_1_COMPLETION_CONTRACT.md")
          evidence_path = "docs/lineup/evidence/V1_27_AUTHENTICATED_PROD_2026-08-26.md"
          evidence = Path(evidence_path)
          assert evidence.is_file(), "merged V1-27 production evidence packet is missing"

          text = path.read_text(encoding="utf-8")

          row_re = re.compile(r"^\| V1-27 \|.*$", re.MULTILINE)
          match = row_re.search(text)
          assert match is not None, "V1-27 canonical row not found"
          old_row = match.group(0)
          assert "| L1 | `IMPLEMENTED_UNVERIFIED` | L3 |" in old_row, old_row
          assert "credential-blocked rather than incomplete" in old_row, (
              "V1-27 row changed since the authenticated evidence packet was prepared"
          )

          promotion = (
              " **PROMOTED 2026-08-26 to `VERIFIED` at L3 after the merged authenticated "
              f"production packet `{evidence_path}` closed the remaining consumer chain: "
              "the canonical guest-pass/login path authenticated against production; "
              "`/terminal` and `/rosters` rendered the server-stamped `optimalLineup`; and "
              "a real bench-for-bench trade simulation reported zero `starterDelta` at "
              "every position while preserving starter assignments. The already-recorded "
              "owner-approved substitute for the irrecoverable pre-deploy snapshot remains "
              "the evidence for that historical check; nothing was fabricated or inferred "
              "from a merge alone.**"
          )
          new_row = old_row.replace(
              "| L1 | `IMPLEMENTED_UNVERIFIED` | L3 |",
              "| L1 | `VERIFIED` | L3 |",
              1,
          )
          assert new_row != old_row
          assert new_row.endswith("|")
          new_row = new_row[:-1].rstrip() + promotion + " |"
          text = text[: match.start()] + new_row + text[match.end() :]

          standing = {
              "| `VERIFIED` | 115 |": "| `VERIFIED` | 116 |",
              "| `IMPLEMENTED_UNVERIFIED` | 16 |": "| `IMPLEMENTED_UNVERIFIED` | 15 |",
          }
          for old, new in standing.items():
              assert text.count(old) == 1, f"standing tally anchor count for {old!r}: {text.count(old)}"
              text = text.replace(old, new, 1)

          old_completion = "**V1 completion: 115 / 136 = 84.6%.**"
          assert text.count(old_completion) == 1, text.count(old_completion)
          new_completion = (
              "**V1 completion: 116 / 136 = 85.3%.** Numerator moved +1 by `V1-27` "
              "production L3 closure: the authenticated production packet merged in #1147 "
              "exercised the real canonical lineup consumers and a starter-neutral trade "
              "simulation, with the previously owner-approved substitute retained for the "
              "irrecoverable pre-deploy observation. **115 before this reconciliation.** "
          )
          text = text.replace(old_completion, new_completion, 1)

          status_re = re.compile(
              r"^\| (V1-\d+) \|.*?\| `(VERIFIED|IMPLEMENTED_UNVERIFIED|IN PROGRESS|NOT STARTED|BLOCKED)` \|",
              re.MULTILINE,
          )
          rows = status_re.findall(text)
          ids = [item_id for item_id, _ in rows]
          assert len(rows) == 136, f"V1 denominator changed: parsed {len(rows)} rows"
          assert len(set(ids)) == 136, "duplicate V1 ids in canonical table"
          counts = Counter(status for _, status in rows)
          expected = Counter(
              {
                  "VERIFIED": 116,
                  "IMPLEMENTED_UNVERIFIED": 15,
                  "IN PROGRESS": 2,
                  "NOT STARTED": 3,
                  "BLOCKED": 0,
              }
          )
          for key in expected:
              counts.setdefault(key, 0)
          assert counts == expected, f"unexpected V1 census: {dict(counts)}"

          path.write_text(text, encoding="utf-8")
          print("V1_27_PROMOTION=PASS")
          print("V1_CENSUS=116_VERIFIED,15_IMPLEMENTED_UNVERIFIED,2_IN_PROGRESS,3_NOT_STARTED,0_BLOCKED")
          print("V1_DENOMINATOR=136")
          PY

      - name: Run canonical planning guards
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_planning_integrity.py
          python scripts/check_decision_coercions.py

      - name: Commit only the reconciled contract and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VERSION_1_COMPLETION_CONTRACT.md
          git rm .github/workflows/v1-27-promote-once.yml
          git diff --cached --check
          git commit -m "docs(v1): verify V1-27 canonical lineup owner — 116/136"
          git push origin HEAD:chatgpt/v1-27-promotion
