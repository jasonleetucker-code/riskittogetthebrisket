name: Patch Sharp Explicit Route Registration

on:
  push:
    branches: [fix/sharp-route-explicit-registration]
    paths:
      - ".github/workflows/patch-sharp-explicit-route-registration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sharp-route-explicit-registration
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Register Sharp routes after the FastAPI app exists
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text()
          needle = '''from src.sharp import service as _sharp_service  # noqa: E402


@app.get("/api/sharp/cohort")'''
          replacement = '''from src.sharp import service as _sharp_service  # noqa: E402

# ``src.sharp.service`` can be imported transitively before ``app`` exists.
# Python then returns the cached module here, so its import-time registration
# hook does not run again.  Register explicitly after FastAPI construction;
# the helper is idempotent and this is the production startup path.
_sharp_service._register_http_routes()


@app.get("/api/sharp/cohort")'''
          if needle not in text:
              raise SystemExit("expected Sharp service import block not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python -m ruff format server.py
      - name: Add startup regression test
        run: |
          cat > tests/sharp/test_server_explicit_route_registration.py <<'PY'
          from pathlib import Path


          def test_server_explicitly_registers_sharp_market_routes_after_import():
              text = Path("server.py").read_text()
              service_import = text.index(
                  "from src.sharp import service as _sharp_service  # noqa: E402"
              )
              explicit_registration = text.index(
                  "_sharp_service._register_http_routes()", service_import
              )
              cohort_route = text.index('@app.get("/api/sharp/cohort")', service_import)

              assert service_import < explicit_registration < cohort_route
          PY
          python -m ruff format tests/sharp/test_server_explicit_route_registration.py
          python -m pytest \
            tests/sharp/test_service_route_registration.py \
            tests/sharp/test_server_explicit_route_registration.py -q
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.py tests/sharp/test_server_explicit_route_registration.py
          git commit -m "fix(sharp): explicitly register market routes at server startup"
          git push origin HEAD:fix/sharp-route-explicit-registration
