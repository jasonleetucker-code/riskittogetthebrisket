name: One-time trade finder boundary test hotfix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'TRIGGER: trade finder boundary hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and commit stale boundary fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          git pull --ff-only origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_trade_finder.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'a1 = _make_asset("A", model=int(target_val * 0.400), ktc=3500)':
                  'a1 = _make_asset("A", model=int(target_val * 0.400), ktc=4000)',
              'a2 = _make_asset("B", model=int(target_val * 0.172), ktc=2000)':
                  'a2 = _make_asset("B", model=int(target_val * 0.172), ktc=3500)',
              'a1 = _make_asset("A", model=int(target_val * 0.386), ktc=3500)':
                  'a1 = _make_asset("A", model=int(target_val * 0.386), ktc=4000)',
              'a2 = _make_asset("B", model=int(target_val * 0.157), ktc=2000)':
                  'a2 = _make_asset("B", model=int(target_val * 0.157), ktc=3500)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one fixture match, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_trade_finder.py
          git rm .github/workflows/trade-finder-boundary-hotfix.yml
          git commit -m "Fix trade finder fire-sale boundary fixtures"
          git push origin HEAD:main
