name: Materialize Sharp Board Draft-Pick Removal

on:
  push:
    branches: [fix/sharp-board-hide-draft-picks]
    paths:
      - ".github/workflows/materialize-sharp-hide-picks.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sharp-board-hide-draft-picks
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove draft picks from the Sharp Tracker board
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          page_path = Path("frontend/app/market/sharp-tracker/page.jsx")
          page = page_path.read_text()

          old_params = '''      qualification,
      limit: "100",
    });'''
          new_params = '''      qualification,
      assetType: "player",
      limit: "100",
    });'''
          if new_params not in page:
              if old_params not in page:
                  raise SystemExit("Sharp Tracker query parameter anchor not found")
              page = page.replace(old_params, new_params, 1)

          old_assets = '''  const assets = market?.assets || [];'''
          new_assets = '''  const assets = (market?.assets || []).filter(
    (asset) =>
      asset?.assetType !== "pick" &&
      asset?.position !== "PICK" &&
      !String(asset?.assetId || "").startsWith("pick:"),
  );'''
          if new_assets not in page:
              if old_assets not in page:
                  raise SystemExit("Sharp Tracker assets anchor not found")
              page = page.replace(old_assets, new_assets, 1)

          page = page.replace('''                  "Player / asset",''', '''                  "Player",''', 1)
          page = page.replace(
              "No normalized trade movements matched the selected source, window, and qualification filters.",
              "No normalized player movements matched the selected source, window, and qualification filters.",
              1,
          )
          page_path.write_text(page)

          test_path = Path("frontend/__tests__/sharp-unified-market.test.js")
          test = test_path.read_text()
          anchor = '''  it("labels automated, curated, and provisional qualification separately", () => {'''
          new_test = '''  it("shows players only and excludes draft-pick assets defensively", () => {
    expect(page).toContain('assetType: "player"');
    expect(page).toContain('asset?.assetType !== "pick"');
    expect(page).toContain('asset?.position !== "PICK"');
    expect(page).toContain('startsWith("pick:")');
    expect(page).toContain('"Player",');
    expect(page).not.toContain('"Player / asset",');
  });

'''
          if new_test not in test:
              if anchor not in test:
                  raise SystemExit("Sharp Tracker test anchor not found")
              test = test.replace(anchor, new_test + anchor, 1)
          test_path.write_text(test)
          PY

      - name: Run focused frontend test
        working-directory: frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npx vitest run __tests__/sharp-unified-market.test.js

      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/materialize-sharp-hide-picks.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/app/market/sharp-tracker/page.jsx frontend/__tests__/sharp-unified-market.test.js
          git commit -m "fix(sharp): hide draft picks from the tracker board"
          git push origin HEAD:fix/sharp-board-hide-draft-picks
