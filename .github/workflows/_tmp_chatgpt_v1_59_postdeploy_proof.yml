name: Temporary V1-59 Post-Deploy Production Proof

on:
  push:
    branches:
      - chatgpt/v1-59-postdeploy-proof

permissions:
  contents: read

concurrency:
  group: chatgpt-v1-59-postdeploy-proof
  cancel-in-progress: true

jobs:
  prove:
    name: Read-only V1-59 service semantics proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Inspect deployed V1-59 scheduled chain read-only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          REQUIRED_SHA: c30b8d6ba1ef2fa604ecb1cfe1e44dd6130ede44
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") REQUIRED_SHA=$(printf %q "$REQUIRED_SHA") bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          deployed="$(git rev-parse HEAD)"
          echo "DEPLOYED_SHA=$deployed"
          git cat-file -e "${REQUIRED_SHA}^{commit}"
          git merge-base --is-ancestor "$REQUIRED_SHA" "$deployed"
          echo "REQUIRED_SHA_PRESENT=$REQUIRED_SHA"

          echo
          echo "=== CANONICAL SYSTEMD SUCCESS SEMANTICS ==="
          units=(dynasty-sharp-discovery dynasty-sharp-records dynasty-sharp-rosters)
          for unit in "${units[@]}"; do
            echo "--- $unit.service unit definition ---"
            systemctl cat "$unit.service" --no-pager | grep -E '^(ExecStart|SuccessExitStatus|TimeoutStartSec)=' || true
          done

          echo
          echo "=== SCHEDULED DISCOVERY -> RECORDS -> ROSTERS ==="
          last_epochs=()
          for unit in "${units[@]}"; do
            timer_show="$(systemctl show "$unit.timer" -p LastTriggerUSec -p NextElapseUSecRealtime --no-pager)"
            echo "--- $unit.timer ---"
            printf '%s\n' "$timer_show"
            last="$(printf '%s\n' "$timer_show" | sed -n 's/^LastTriggerUSec=//p')"
            if [ -z "$last" ] || [ "$last" = "n/a" ]; then
              echo "ERROR: $unit.timer has no last trigger" >&2
              exit 1
            fi
            last_epochs+=("$(date -u -d "$last" +%s)")

            echo "--- $unit.service state ---"
            state="$(systemctl show "$unit.service" -p Result -p ExecMainCode -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager)"
            printf '%s\n' "$state"
            result="$(printf '%s\n' "$state" | sed -n 's/^Result=//p')"

            echo "--- $unit.service journal from latest timer trigger ---"
            journal="$(journalctl -u "$unit.service" --since "$last" --no-pager -q || true)"
            printf '%s\n' "$journal" | tail -n 220
            bad="$(printf '%s\n' "$journal" | grep -E -i 'database is locked|status=15/TERM|Failed with result|Traceback|watchdog|start operation timed out' || true)"

            # systemd's Result is authoritative because these units explicitly
            # declare SuccessExitStatus=0 2: exit 2 means resumable budget
            # exhaustion, not failure.  The previous probe incorrectly required
            # ExecMainStatus=0 and is superseded by this check.
            if [ "$result" != "success" ]; then
              echo "ERROR: $unit.service Result=$result" >&2
              exit 1
            fi
            if [ -n "$bad" ]; then
              echo "ERROR: $unit.service journal contains failure evidence:" >&2
              printf '%s\n' "$bad" >&2
              exit 1
            fi
          done

          if ! [ "${last_epochs[0]}" -lt "${last_epochs[1]}" ] || ! [ "${last_epochs[1]}" -lt "${last_epochs[2]}" ]; then
            echo "ERROR: timer order is not discovery < records < rosters: ${last_epochs[*]}" >&2
            exit 1
          fi
          echo "SCHEDULED_CHAIN_ORDER=discovery<records<rosters"

          echo
          echo "=== FFPC UNIT HEALTH ==="
          systemctl cat chaseupside-ffpc-sharp.service --no-pager | grep -E '^(ExecStart|SuccessExitStatus|TimeoutStartSec|Restart)=' || true
          ffpc="$(systemctl show chaseupside-ffpc-sharp.service -p Result -p ExecMainCode -p ExecMainStatus -p NRestarts -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager 2>/dev/null || true)"
          printf '%s\n' "$ffpc"
          ffpc_result="$(printf '%s\n' "$ffpc" | sed -n 's/^Result=//p')"
          if [ "$ffpc_result" != "success" ]; then
            echo "ERROR: FFPC unit Result=$ffpc_result" >&2
            exit 1
          fi
          ffpc_bad="$(journalctl -u chaseupside-ffpc-sharp.service --since '24 hours ago' --no-pager -q 2>/dev/null | grep -E -i 'database is locked|status=15/TERM|Failed with result|Traceback|watchdog|start operation timed out' || true)"
          if [ -n "$ffpc_bad" ]; then
            echo "ERROR: FFPC recent journal contains failure evidence:" >&2
            printf '%s\n' "$ffpc_bad" >&2
            exit 1
          fi

          echo
          echo "V1_59_SERVICE_CHAIN_PROOF=PASS"
          REMOTE
