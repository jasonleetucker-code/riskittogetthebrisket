name: Refit Hill Curves

# Hill Autopilot v2.
# Data refresh owns cadence. Every successful material two-hour refresh
# dispatches this workflow. Refitting is automatic; production mutation is
# fail-closed behind tournament, forward-persistence, scope and board gates.

on:
  workflow_dispatch:
    inputs:
      source_refresh_sha:
        description: "Main SHA of the data refresh that triggered this run"
        required: false
        type: string
        default: ""
      threshold:
        description: "Override raw refit RMSE drift threshold"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Evaluate only; never record or promote"
        required: false
        type: boolean
        default: false

concurrency:
  group: refit-hill-curves
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  refit:
    name: Refit + Tournament + Canonical Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering tree
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remember base SHA
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
          python scripts/check_env.py

      - name: Self-test calibration machinery
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest tests/model_registry/ tests/canonical/test_hill_percentile_constants_tripwire.py -q

      - name: Pin fit snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          SNAP=""
          for dir in data exports/latest; do
            if [[ -d "$dir" ]]; then
              CAND=$(ls -1t "$dir"/dynasty_data_*.json 2>/dev/null | head -1 || true)
              if [[ -n "$CAND" ]]; then SNAP="$CAND"; break; fi
            fi
          done
          [[ -n "$SNAP" ]] || { echo "::error title=Hill refit::no board snapshot"; exit 1; }
          SNAP_ABS="$(cd "$(dirname "$SNAP")" && pwd)/$(basename "$SNAP")"
          echo "RISKIT_FIT_SNAPSHOT=$SNAP_ABS" >> "$GITHUB_ENV"
          # A pin that names a path is a suggestion; a pin that also names the
          # bytes at that path is verified. Hashed here (not re-derived later)
          # so the challenger record states which bytes actually produced it,
          # even if a subsequent data refresh rewrites the same filename.
          SNAP_SHA256="$(sha256sum "$SNAP_ABS" | cut -d' ' -f1)"
          echo "RISKIT_FIT_SNAPSHOT_SHA256=$SNAP_SHA256" >> "$GITHUB_ENV"

      - name: Refit on this refresh
        id: refit
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -Eeuo pipefail
          ARGS="--force"
          if [[ -n "${{ inputs.threshold }}" ]]; then
            ARGS="$ARGS --threshold ${{ inputs.threshold }}"
          fi
          set +e
          python scripts/auto_refit_hill_curves.py $ARGS 2>&1 | tee refit_report.txt
          CODE=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          [[ "$CODE" == "0" || "$CODE" == "1" ]] || exit "$CODE"

      - name: Candidate tournament + forward gate
        id: autopilot
        if: inputs.dry_run != true
        shell: bash
        env:
          TRIGGER_SHA: ${{ inputs.source_refresh_sha }}
        run: |
          set -Eeuo pipefail
          set +e
          python scripts/hill_autopilot.py \
            --out autopilot_plan.json \
            --params-out /tmp/hill_safe_params.json \
            --record \
            --trigger-sha "${TRIGGER_SHA:-${GITHUB_SHA}}" \
            2>&1 | tee autopilot_report.txt
          CODE=${PIPESTATUS[0]}
          set -e
          if [[ "$CODE" == "10" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CODE" == "0" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            exit "$CODE"
          fi
          echo "winner=$(jq -r '.winnerVersion // empty' autopilot_plan.json)" >> "$GITHUB_OUTPUT"
          echo "champion=$(jq -r '.championVersion' autopilot_plan.json)" >> "$GITHUB_OUTPUT"

      - name: Register scope-safe candidate
        id: composed
        if: steps.autopilot.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=$(python scripts/model_registry.py register \
            --params /tmp/hill_safe_params.json \
            --producer "Hill Autopilot OFFENSE composite from raw v${{ steps.autopilot.outputs.winner }}")
          echo "$OUT"
          VERSION=$(printf '%s\n' "$OUT" | sed -nE 's/.*registered challenger v([0-9]+).*/\1/p' | tail -1)
          [[ -n "$VERSION" ]] || { echo "::error title=Hill autopilot::version parse failed"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Downstream board-impact gate
        id: board
        if: steps.autopilot.outputs.ready == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/measure_hill_version_board.py "${{ steps.autopilot.outputs.champion }}" --out /tmp/hill_before.json
          python scripts/measure_hill_version_board.py "${{ steps.composed.outputs.version }}" --out /tmp/hill_after.json
          set +e
          python scripts/hill_board_guard.py \
            /tmp/hill_before.json /tmp/hill_after.json \
            --policy config/model_registry/hill_autopilot_policy.json \
            --out hill_board_impact.json
          CODE=$?
          set -e
          if [[ "$CODE" == "0" ]]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
            python scripts/model_registry.py reject "${{ steps.composed.outputs.version }}" \
              --reason "Hill Autopilot downstream board-impact gate blocked promotion"
          fi

      - name: File an issue when the board-impact gate blocks promotion
        # This is the one path in this job that completes successfully with
        # nothing promoted: the challenger cleared the paired OFFENSE gate,
        # won the tournament and passed forward persistence, but the
        # downstream board-impact check disagreed. A run exiting 0 here
        # would otherwise be indistinguishable from an ordinary refresh
        # where the champion simply stood -- exactly the silent-tracker
        # failure mode this label's other consumer (audit-rank-form-drift.yml)
        # exists to avoid. Reuses that workflow's calibration label +
        # title-based dedup, not a second issue-filing convention.
        if: steps.autopilot.outputs.ready == 'true' && steps.board.outputs.pass == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          # Fixed title, deliberately WITHOUT the candidate version number --
          # next_version() strictly increments, so a per-version title would
          # make every rejected run mint a distinct title and the dedup
          # lookup below would never match a prior issue, filing a fresh
          # issue roughly every 2 hours for as long as the gate keeps
          # blocking. The version travels in the body instead.
          TITLE="Hill Autopilot: board-impact gate is blocking promotion"
          BODY=$(printf '%s\n\nChallenger v%s cleared the paired OFFENSE held-out gate, won the standing tournament, and passed forward persistence, but the downstream board-impact check rejected it. It has been recorded as `rejected` in the registry; canonical OFFENSE parameters were not changed.\n\nRun: %s\n' \
            "Hill Autopilot v2's automatic tournament -> forward-persistence -> board-impact pipeline found a candidate a human should look at." \
            "${{ steps.composed.outputs.version }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          gh label create calibration \
            --color 5319E7 \
            --description "Model-calibration work items opened by the weekly Hill refit and drift audits" \
            2>/dev/null || true
          EXISTING=$(gh issue list --state open --limit 50 \
                       --json number,title \
                       --jq ".[] | select(.title == \"${TITLE}\") | .number" \
                     2>/dev/null | head -n 1 || true)
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label calibration \
              || gh issue create --title "${TITLE}" --body "${BODY}"
          fi

      - name: Promote and apply canonical OFFENSE curve
        id: promote
        if: steps.autopilot.outputs.ready == 'true' && steps.board.outputs.pass == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="${{ steps.composed.outputs.version }}"
          python scripts/model_registry.py validate "$VERSION"
          python scripts/model_registry.py promote "$VERSION" \
            --reason "Hill Autopilot: tournament + forward persistence + board impact passed"
          python scripts/model_registry.py apply

          set +e
          python -m pytest tests/model_registry/ tests/canonical/test_hill_percentile_constants_tripwire.py -q
          TEST_CODE=$?
          set -e
          if [[ "$TEST_CODE" != "0" ]]; then
            python scripts/model_registry.py rollback \
              --reason "Hill Autopilot rollback: post-apply tests failed"
            python scripts/model_registry.py apply
            exit "$TEST_CODE"
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Refuse stale evidence
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          BASE="${{ steps.base.outputs.sha }}"
          REMOTE="$(git rev-parse origin/main)"
          if [[ "$REMOTE" != "$BASE" ]]; then
            echo "::error title=Hill autopilot::main advanced during evaluation; refusing stale write"
            exit 1
          fi

      - name: Commit calibration evidence and canonical change
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/model_registry/
          if [[ "${{ steps.promote.outputs.applied }}" == "true" ]]; then
            git add src/canonical/player_valuation.py
          fi
          if git diff --cached --quiet; then
            echo "No Hill state change to commit"
            exit 0
          fi
          if [[ "${{ steps.promote.outputs.applied }}" == "true" ]]; then
            MSG="chore(calibration): autopromote canonical Hill OFFENSE curve"
          else
            MSG="chore(calibration): record Hill two-hour refit evidence"
          fi
          git commit -m "$MSG"
          git push origin HEAD:main

      - name: Trigger deploy after canonical promotion
        if: steps.promote.outputs.applied == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Hill Autopilot"
            echo "**Pinned snapshot:** \`${RISKIT_FIT_SNAPSHOT:-unset}\` (sha256 \`${RISKIT_FIT_SNAPSHOT_SHA256:-unset}\`)"
            if [[ -f autopilot_plan.json ]]; then
              echo "**Ready:** $(jq -r '.ready' autopilot_plan.json)"
              echo "**Winner:** v$(jq -r '.winnerVersion // "-"' autopilot_plan.json)"
              echo "**Reason:** $(jq -r '.reason' autopilot_plan.json)"
              echo "**Stable versions:** $(jq -c '.stableVersions' autopilot_plan.json)"
              echo "**Forward days:** $(jq -r '.forwardDays' autopilot_plan.json)"
              echo "**Forward win rate:** $(jq -r '.forwardWinRate // 0' autopilot_plan.json)"
            fi
            if [[ -f hill_board_impact.json ]]; then
              echo "**Board impact:** $(jq -r '.pass' hill_board_impact.json)"
              jq '.metrics' hill_board_impact.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
