name: One-time Ruff formatting hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ruff-format-hotfix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository Ruff version
        run: python -m pip install "ruff~=0.6.0"

      - name: Format affected files
        run: >-
          python -m ruff format
          src/trade/finder_value_adjustment.py
          src/trade/market_value_adjustment.py

      - name: Commit formatting and remove one-time workflow
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trade/finder_value_adjustment.py src/trade/market_value_adjustment.py
          git rm .github/workflows/ruff-format-hotfix.yml
          git commit -m "Format trade value adjustment modules"
          git push origin HEAD:main
