name: Release Candidate

# The HEAD FREEZE gate, run once and deliberately.
#
# `PR Validation` answers "is this head correct".  It cannot answer "is
# the tree I validated the tree that will merge", because the base moves
# after the run concludes.  On 2026-08-16 that gap was 103 seconds: PR
# #871's exact head went green at 19:08:58, an automated data refresh
# pushed to main at 19:10:04, and the merge at 19:10:41 produced a tree
# nothing had ever validated — one whose refreshed payload carried a
# timed-out KTC scrape.  The deploy gate caught it, which is the system
# working, but `main` went red on an untested combination.
#
# Dispatch this against the frozen head immediately before merging.  It
# asserts the release-candidate property in STRICT mode and then runs the
# same gates `PR Validation` runs, against the merge of base and head —
# the tree that will actually exist.
#
# It is deliberately manual.  Running it on every push would chase the
# 2-hourly refresh forever (green → refresh → revalidate → refresh),
# which is the loop the owner explicitly ruled out.  Bounded discipline:
# freeze, integrate once, validate that exact SHA, merge promptly.
#
# ── The hard gate, sharded (2026-11-07) ─────────────────────────────────
# The serial unit-test step was ~90 of this job's ~100 minutes.  It now runs
# as the same N duration-balanced shards PR Validation and Deploy use (owner:
# scripts/ci_test_shards.py) — the identical command, markers and bounded --maxfail=10 (was -x; exit status on failure unchanged), every
# collected test exactly once, proven by the shard manifests.
#
# The RC-specific part is TREE IDENTITY.  This workflow validates a merge
# candidate it builds itself, so N runners each building "the candidate"
# could build N different trees (the base moves every ~20 minutes).  So:
#
#   plan        runs the STRICT freshness check, builds the candidate, and
#               records head SHA, base SHA and the candidate TREE hash;
#   hard-gate   each shard rebuilds the candidate from those pinned SHAs and
#               FAILS unless its tree is the planned tree, then runs the gate;
#   candidate   every other gate, unchanged, on the same pinned rebuild
#               (asserted the same way), publishing the tree it validated;
#   validate    "Validate Release Candidate": rebuilds and asserts the same
#               tree, verifies every shard manifest, and passes only when
#               plan, candidate and every shard succeeded AND the candidate
#               gates' tree equals the planned tree.  always(): a skipped
#               final job must never read as a passed release candidate.
#
# "Re-run failed jobs" re-runs a shard and `validate` but keeps `plan`'s
# outputs from the earlier attempt, so the STRICT freshness check would not
# run again on a base that may since have moved (the 2026-08-16 race).  The
# verdict therefore fails any run whose plan is from an earlier attempt:
# re-run ALL jobs.  Shard manifests are named for the plan's attempt and tree,
# so an earlier attempt's manifests can never be verified as this one's.
#
# A candidate tree without the shard owner runs the old serial command on one
# runner (no manifests), as deploy.yml does for an old target.

on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch or SHA being released (the frozen head)"
        required: true
        type: string
      base_ref:
        description: "Base branch to integrate against"
        required: false
        default: "main"
        type: string

concurrency:
  # One release candidate at a time. Two people freezing different heads
  # against the same base is precisely the situation this exists to stop.
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Build and plan the release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.build.outputs.head_sha }}
      base_sha: ${{ steps.build.outputs.base_sha }}
      candidate_tree: ${{ steps.build.outputs.candidate_tree }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      mode: ${{ steps.plan.outputs.mode }}
      # The attempt this plan (and so its STRICT freshness check) ran in.
      attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout (full history — the check diffs base against head)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Release-candidate freshness (STRICT)
        # The same gate the candidate job runs (standard library only, so no
        # install): a head that is not a release candidate never reaches the
        # shards.
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -Eeuo pipefail
          # No --depth: the checkout is fetch-depth 0, and a depth-limited
          # fetch rewrites .git/shallow, which made the unit-test step's
          # feature-dictionary lock-history gate fail as "shallow boundary".
          git fetch --no-tags origin "${BASE_REF}"
          python scripts/check_release_candidate.py \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --strict

      - name: Build the exact merge candidate and record its identity
        # The base is pinned to a SHA here and every later job merges THAT
        # SHA, never the moving branch: a refresh landing mid-run cannot hand
        # the shards a different tree.  The tree hash is the identity every
        # job asserts; commit hashes differ per runner (merge timestamps).
        id: build
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -Eeuo pipefail
          head_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          base_sha="$(git rev-parse --verify "origin/${BASE_REF}^{commit}")"
          git config user.name  "release-candidate"
          git config user.email "noreply@anthropic.com"
          git merge --no-edit "${base_sha}"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          echo "head ${head_sha}  base ${base_sha}  candidate tree ${tree}"
          {
            echo "head_sha=${head_sha}"
            echo "base_sha=${base_sha}"
            echo "candidate_tree=${tree}"
          } >> "$GITHUB_OUTPUT"

      - name: Choose sharded or serial
        # Decided on the CANDIDATE tree (after the merge), never the head
        # alone: the shards run that tree's shard owner and config.
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/ci_test_shards.py && -f config/ci/test_shards.json ]]; then
            python scripts/ci_test_shards.py matrix --github-output
            echo "mode=sharded" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Serial hard gate::the candidate tree has no shard owner; running the whole suite on one runner."
            {
              echo 'shards=["serial"]'
              echo "shard_count=1"
              echo "mode=serial"
            } >> "$GITHUB_OUTPUT"
          fi

  candidate:
    # Every gate except the unit suite (which runs in the `hard-gate` shards),
    # unchanged.  It validates the PLANNED candidate: the pinned head, the
    # pinned base merged in, the tree asserted exactly as the shards assert it
    # (an inert commit landing on the base mid-run cannot fail it), and
    # publishes that tree for `validate` to compare.
    name: Release candidate gates (static, contract and frontend)
    runs-on: ubuntu-latest
    needs: plan
    outputs:
      candidate_tree: ${{ steps.rebuild.outputs.candidate_tree }}
    # 60 -> 80 (2026-10-02), matching PR Validation (#1605) and Deploy: the
    # full suite now routinely takes 58-60 min. Runner headroom only.
    # 80 -> 120 (2026-10-19), matching PR Validation and Deploy: the suite
    # now takes ~77 min (PR Validation run 39212246131 was cancelled at the
    # 80-minute wall after its unit tests passed). Runner headroom only.
    # 120 -> 180 (2026-11-06), matching PR Validation and Deploy: the suite
    # now takes ~105-110 min (PR Validation jobs of 109-112 min that day).
    # Runner headroom only.
    # 180 -> 60 (2026-11-07): the unit suite moved to the `hard-gate` shards
    # below, as deploy.yml's validate job did; the remaining gates and the
    # frontend build take minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout (full history — the check diffs base against head)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.lock.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Release-candidate freshness (STRICT)
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -Eeuo pipefail
          # No --depth: the checkout is fetch-depth 0, and a depth-limited
          # fetch rewrites .git/shallow, which made the unit-test step's
          # feature-dictionary lock-history gate fail as "shallow boundary".
          git fetch --no-tags origin "${BASE_REF}"
          python scripts/check_release_candidate.py \
            --base "origin/${BASE_REF}" \
            --head HEAD \
            --strict

      - name: Rebuild the candidate and assert it is the planned tree
        # Fail closed: this job tests (or verifies) the planned candidate TREE
        # or nothing.  Same merge as the plan's, of the same pinned SHAs.
        id: rebuild
        shell: bash
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CANDIDATE_TREE: ${{ needs.plan.outputs.candidate_tree }}
        run: |
          set -Eeuo pipefail
          for v in HEAD_SHA BASE_SHA CANDIDATE_TREE; do
            [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Release candidate identity::plan output ${v} is not a full SHA (${!v:-empty})"; exit 1; }
          done
          actual_head="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "${actual_head}" == "${HEAD_SHA}" ]] || { echo "::error title=Release candidate head mismatch::checked out ${actual_head}, planned ${HEAD_SHA}"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git config user.name  "release-candidate"
          git config user.email "noreply@anthropic.com"
          git merge --no-edit "${BASE_SHA}"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          echo "candidate tree ${tree} (planned ${CANDIDATE_TREE})"
          [[ "${tree}" == "${CANDIDATE_TREE}" ]] || { echo "::error title=Release candidate tree mismatch::rebuilt ${tree}, planned ${CANDIDATE_TREE}"; exit 1; }
          echo "candidate_tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Python format + lint gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format --check .
          python -m ruff check .

      - name: Governance + planning gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_planning_integrity.py
          python scripts/check_product_plan_governance.py
          python scripts/check_decision_coercions.py
          python scripts/audit_status.py

      - name: API data contract check (structural lane)
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/validate_api_contract.py --repo . --lane structural

      - name: Source health (advisory — the deploy gate is the blocking one)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_source_health.py --repo .

      # ── Parity with PR Validation ───────────────────────────────────
      # This workflow's header claims it "runs the same gates
      # `PR Validation` runs".  Audit 2026-08-17 measured that claim
      # false: it omitted EIGHT gates, including the entire frontend
      # (vitest + build + bundle budgets) and the `import server`
      # runtime gate.  So the HEAD-FREEZE tree — the one thing this
      # workflow exists to validate, and the tree that will actually
      # merge — was validated MORE WEAKLY than any ordinary PR.
      #
      # That is the same defect class `deploy.yml` records at its own
      # head ("the deploy path was strictly weaker than the PR path"),
      # reintroduced one workflow over.  The steps below close it.

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python runtime import gate
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi  # noqa: F401
          import uvicorn  # noqa: F401
          import requests  # noqa: F401
          from playwright.async_api import async_playwright  # noqa: F401
          import server  # noqa: F401
          print("Runtime import gate passed.")
          PY

      - name: Deploy script syntax gate (existing scripts only)
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in deploy/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Frontend unit tests (vitest)
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm test

      - name: Frontend build + bundle-size budget
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm run build:nocheck
          npm run check:bundles

  hard-gate:
    name: Release candidate hard gate (${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }})
    runs-on: ubuntu-latest
    needs: plan
    # 180 for the serial fallback (the whole suite on one runner); 45 for a
    # shard (~1/8 of it).  A finite hang bound either way —
    # tests/deploy/test_full_suite_budgets.py.
    timeout-minutes: ${{ matrix.shard == 'serial' && 180 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Checkout the frozen head (full history)
        uses: actions/checkout@v7
        with:
          # Full history: the merge needs the merge base, and Consensus Edge's
          # as-of panel tests SKIP on a shallow clone.
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head_sha }}

      - name: Rebuild the candidate and assert it is the planned tree
        # Fail closed: this job tests (or verifies) the planned candidate TREE
        # or nothing.  Same merge as the plan's, of the same pinned SHAs.
        id: rebuild
        shell: bash
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CANDIDATE_TREE: ${{ needs.plan.outputs.candidate_tree }}
        run: |
          set -Eeuo pipefail
          for v in HEAD_SHA BASE_SHA CANDIDATE_TREE; do
            [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Release candidate identity::plan output ${v} is not a full SHA (${!v:-empty})"; exit 1; }
          done
          actual_head="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "${actual_head}" == "${HEAD_SHA}" ]] || { echo "::error title=Release candidate head mismatch::checked out ${actual_head}, planned ${HEAD_SHA}"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git config user.name  "release-candidate"
          git config user.email "noreply@anthropic.com"
          git merge --no-edit "${BASE_SHA}"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          echo "candidate tree ${tree} (planned ${CANDIDATE_TREE})"
          [[ "${tree}" == "${CANDIDATE_TREE}" ]] || { echo "::error title=Release candidate tree mismatch::rebuilt ${tree}, planned ${CANDIDATE_TREE}"; exit 1; }
          echo "candidate_tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.lock.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Install tesseract-ocr (screenshot import OCR tests)
        # As in PR Validation and Deploy: the real-OCR tests
        # (``@pytest.mark.tesseract``) RUN instead of skipping, so all three
        # gates are measured against one skip budget.
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends tesseract-ocr
          tesseract --version | head -1

      - name: Unit tests (hard gate — pure logic)
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          UPTIME_CHECK_ENABLED: "0"
          # Empty on the serial fallback: the plugin then never registers and
          # the command runs exactly as the old serial gate did.
          RISKIT_TEST_SHARD: ${{ matrix.shard != 'serial' && format('{0}/{1}', matrix.shard, needs.plan.outputs.shard_count) || '' }}
          RISKIT_TEST_SHARD_MANIFEST: ${{ runner.temp }}/shard-manifest/shard-${{ matrix.shard }}.json
        run: |
          set -Eeuo pipefail
          # Runner speed varies ~1.8x between GitHub-hosted runners: over 38
          # jobs (CQ-29, 2026-10-19) this step's time tracked the same job's
          # live-data step at r=0.98 (40-77 min), so the variance is the
          # machine, not the suite.  Record the CPU and the slowest tests so a
          # slow run is diagnosable from its own log.  Output only — the
          # command, markers and the bounded --maxfail=10 are as in PR Validation.
          grep -m1 'model name' /proc/cpuinfo || true
          python -m pytest tests/ --maxfail=10 -q --tb=short -m "not livedata" --durations=30 --durations-min=5

      - name: Upload shard manifest
        if: ${{ always() && needs.plan.outputs.mode == 'sharded' }}
        uses: actions/upload-artifact@v4
        with:
          name: rc-hard-gate-a${{ needs.plan.outputs.attempt }}-${{ needs.plan.outputs.candidate_tree }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-manifest/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14
          # Named for the plan's attempt and tree, so the verdict never
          # downloads a manifest from another attempt or another candidate;
          # overwrite only lets a re-run of the same job replace its own.
          overwrite: true

  validate:
    # The release-candidate verdict, under the check name this workflow has
    # always exposed.  always(), as Validate PR: a run cancelled or broken
    # upstream must end RED here, never as a skipped job that reads as passed.
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    needs: [plan, candidate, hard-gate]
    if: ${{ always() }}
    timeout-minutes: 20
    steps:
      - name: Checkout the frozen head (full history)
        if: ${{ needs.plan.outputs.mode == 'sharded' }}
        uses: actions/checkout@v7
        with:
          # Full history: the merge needs the merge base, and Consensus Edge's
          # as-of panel tests SKIP on a shallow clone.
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head_sha }}

      - name: Rebuild the candidate and assert it is the planned tree
        # Fail closed: this job tests (or verifies) the planned candidate TREE
        # or nothing.  Same merge as the plan's, of the same pinned SHAs.
        id: rebuild
        if: ${{ needs.plan.outputs.mode == 'sharded' }}
        shell: bash
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          CANDIDATE_TREE: ${{ needs.plan.outputs.candidate_tree }}
        run: |
          set -Eeuo pipefail
          for v in HEAD_SHA BASE_SHA CANDIDATE_TREE; do
            [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=Release candidate identity::plan output ${v} is not a full SHA (${!v:-empty})"; exit 1; }
          done
          actual_head="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "${actual_head}" == "${HEAD_SHA}" ]] || { echo "::error title=Release candidate head mismatch::checked out ${actual_head}, planned ${HEAD_SHA}"; exit 1; }
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "${BASE_SHA}"
          git config user.name  "release-candidate"
          git config user.email "noreply@anthropic.com"
          git merge --no-edit "${BASE_SHA}"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          echo "candidate tree ${tree} (planned ${CANDIDATE_TREE})"
          [[ "${tree}" == "${CANDIDATE_TREE}" ]] || { echo "::error title=Release candidate tree mismatch::rebuilt ${tree}, planned ${CANDIDATE_TREE}"; exit 1; }
          echo "candidate_tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ needs.plan.outputs.mode == 'sharded' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download shard manifests
        if: ${{ needs.plan.outputs.mode == 'sharded' }}
        uses: actions/download-artifact@v4
        with:
          pattern: rc-hard-gate-a${{ needs.plan.outputs.attempt }}-${{ needs.plan.outputs.candidate_tree }}-shard-*
          path: shard-manifests

      - name: Prove the sharded hard gate ran every test
        # The candidate tree's own verifier and config (shard count, floor,
        # skip budget) — the tree asserted above.
        if: ${{ needs.plan.outputs.mode == 'sharded' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/ci_test_shards.py verify --manifests shard-manifests

      - name: Every required job succeeded
        if: ${{ always() }}
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          GATE_RESULT: ${{ needs.hard-gate.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          PLANNED_TREE: ${{ needs.plan.outputs.candidate_tree }}
          GATES_TREE: ${{ needs.candidate.outputs.candidate_tree }}
          PLAN_ATTEMPT: ${{ needs.plan.outputs.attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          echo "plan=${PLAN_RESULT} candidate=${CANDIDATE_RESULT} hard-gate=${GATE_RESULT} mode=${MODE}"
          echo "planned tree=${PLANNED_TREE:-empty} gates tree=${GATES_TREE:-empty}"
          echo "plan attempt=${PLAN_ATTEMPT:-empty} run attempt=${RUN_ATTEMPT:-empty}"
          fail=0
          if [[ "${PLAN_ATTEMPT}" != "${RUN_ATTEMPT}" ]]; then
            echo "::error title=Partial re-run::partial re-run detected: re-run ALL jobs so the strict freshness check and candidate build run again (plan from attempt ${PLAN_ATTEMPT:-unknown}, this is attempt ${RUN_ATTEMPT:-unknown})"
            fail=1
          fi
          if [[ "${PLAN_RESULT}" != "success" ]]; then
            echo "::error::release-candidate plan did not succeed (${PLAN_RESULT})"
            fail=1
          fi
          if [[ "${CANDIDATE_RESULT}" != "success" ]]; then
            echo "::error::static/contract/frontend gates did not succeed (${CANDIDATE_RESULT})"
            fail=1
          fi
          if [[ "${GATE_RESULT}" != "success" ]]; then
            echo "::error::hard gate did not succeed (${GATE_RESULT})"
            fail=1
          fi
          if [[ "${MODE}" != "sharded" && "${MODE}" != "serial" ]]; then
            echo "::error::hard-gate mode unknown (${MODE:-empty})"
            fail=1
          fi
          if [[ ! "${PLANNED_TREE}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the plan recorded no candidate tree (${PLANNED_TREE:-empty})"
            fail=1
          elif [[ "${GATES_TREE}" != "${PLANNED_TREE}" ]]; then
            echo "::error title=Release candidate tree mismatch::the static/contract/frontend gates validated ${GATES_TREE:-no tree}, the hard gate ${PLANNED_TREE}"
            fail=1
          fi
          exit "${fail}"
