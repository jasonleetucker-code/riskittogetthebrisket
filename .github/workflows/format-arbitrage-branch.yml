name: Format Arbitrage Branch Once

on:
  push:
    branches:
      - chatgpt/arbitrage-equal-count-exclusions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/arbitrage-equal-count-exclusions
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.6.9'
      - name: Format finder
        run: python -m ruff format src/trade/finder.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/trade/finder.py; then
            echo 'finder already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trade/finder.py
          git commit -m 'style: format arbitrage finder'
          git push origin HEAD:chatgpt/arbitrage-equal-count-exclusions
