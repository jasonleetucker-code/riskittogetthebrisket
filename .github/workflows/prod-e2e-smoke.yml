name: Production E2E Smoke (public /league)

# Runs the Playwright public-league spec against the real production
# URL every 4 hours.  Catches issues the deploy-time smoke can't:
# Sleeper outages, nginx config drift, DNS failures, expired certs,
# regressions in the client bundle that only show up after a fresh
# browser visit.
#
# Triggers:
#   * cron — every 4 hours
#   * workflow_dispatch — manual re-run
#
# Uses the SAME spec already under tests/e2e/specs/public-league.spec.js
# — so this is effectively "run the pinned E2E suite against prod" at a
# cadence that would catch a regression within hours instead of days.

on:
  schedule:
    # Every 4 hours, offset 17 minutes to avoid stacking on the hour.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

# Checkout only; the report upload needs no token scope.  The smoke job adds
# ``issues: write`` for itself: it files and closes its own tracking issue.
permissions:
  contents: read

concurrency:
  group: prod-e2e-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve production URL
        id: url
        shell: bash
        run: |
          set -Eeuo pipefail
          # No hardcoded fallback: the baked-in default outlived the
          # project's ownership of that domain and kept these runs
          # pointed at a third party's host.  An unset PROD_PUBLIC_URL
          # is an outage to surface, not a value to guess.
          URL="${{ vars.PROD_PUBLIC_URL }}"
          if [[ -z "${URL}" ]]; then
            echo "::error title=PROD_PUBLIC_URL not set::Set the PROD_PUBLIC_URL repository variable to the production origin."
            exit 1
          fi
          URL="${URL%/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Probe prod is live before running browser
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -Eeuo pipefail
          # 30s: a cold /api/public/league snapshot takes longer than 15s
          # even with the threadpool fix; the hourly warmup keeps it warm in
          # steady state but the preflight must not flap on the cold case.
          # --compressed: the snapshot is ~2.5 MB as identity and ~0.24 MB gzipped.
          # Runner->box throughput is the bottleneck (2026-10-07: 327 KB in 30 s from
          # a runner vs 1.3 s for the full body from elsewhere), so an uncompressed
          # liveness probe timed out against a healthy site. On a curl failure keep
          # ONLY the fallback code: an in-substitution "or echo 000" printed "HTTP 200000"
          # (curl had already written 200 before timing out mid-body).
          if ! code=$(curl --silent --show-error --compressed --max-time 60 \
            --output /dev/null --write-out '%{http_code}' \
            "${URL}/api/public/league"); then
            code=000
          fi
          if [[ "${code}" != "200" ]]; then
            echo "::error title=Prod unreachable::${URL}/api/public/league returned HTTP ${code}"
            exit 1
          fi

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install root deps
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund

      - name: Install Playwright chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npx playwright install --with-deps chromium

      - name: Run public /league spec against prod
        shell: bash
        env:
          E2E_BASE_URL: ${{ steps.url.outputs.url }}
          # This job runs ONE spec, not the full suite, so the reporter's
          # default floor — sized for the nightly's 139 passed — would
          # fail every prod smoke run.  Measured on run 30953000224
          # (5349fea29, 2026-08-04 21:35Z): "32 passed (1.3m)", tests
          # numbered [1/32]..[32/32], zero skipped = 16 tests x 2 chromium
          # projects.
          #
          # 30 rather than 32: a floor equal to the exact count fires on
          # any legitimate consolidation of two tests, and a floor that
          # gets "adjusted" every quarter stops being believed.  30 still
          # catches what this exists for — a spec-path typo or a project
          # filter matching nothing takes the count to 0 or 16, not 31.
          E2E_MIN_PASSED: "30"
          # Zero, and it CAN be zero: public-league.spec.js has no
          # conditional skips left — its three data-condition gates were
          # converted to assertions.  Any skip here means a gate came
          # back, which is exactly what we want to hear about.
          E2E_MAX_SKIPPED: "0"
        run: |
          set -Eeuo pipefail
          # Chromium desktop + mobile viewport.  We intentionally skip
          # the webkit "mobile-390 / mobile-430" projects here — those
          # require ``playwright install webkit`` and don't buy us
          # anything over the chromium mobile viewport for the public
          # /league layout coverage.
          #
          # NO `--reporter` FLAG.  It REPLACES playwright.config.js's
          # whole reporter array, which unloaded stack-death-reporter.js
          # and with it BOTH the stack-death abort AND the coverage floor
          # — for every prod smoke run this workflow made before
          # 2026-08-05.  The reporter's own header warns about this in
          # capitals; this workflow did it anyway, which is the same
          # never-fires class the guard was written to catch.
          # tests/e2e/test_e2e_harness_guards.py now fails the PR if any
          # workflow reintroduces the flag.
          #
          # Side effect worth knowing: the config's reporters are `list`
          # + `html`.  `list` is what `--reporter=line` was approximating,
          # and `html` now actually populates tests/e2e/playwright-report/,
          # which the failure-artifact step below has been uploading empty
          # since it was written.
          npx playwright test \
            -c tests/e2e/playwright.config.js \
            --project=desktop-1366 \
            --project=mobile-chromium \
            tests/e2e/specs/public-league.spec.js

      # PUBLIC repo => public artifact, and this run targets PRODUCTION
      # (security S3).  playwright.config.js turns trace/screenshot/video
      # OFF for a non-loopback E2E_BASE_URL, and only the html report
      # (steps + errors of an ANONYMOUS public-page run) is uploaded —
      # never tests/e2e/test-results/ (traces, videos, screenshots).
      # Pinned by tests/e2e/test_prod_auth_artifact_safety.py.
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prod-e2e-smoke-artifacts
          path: |
            tests/e2e/playwright-report/
          retention-days: 7

      # COV-DECISION.  This smoke is the only scheduled FUNCTIONAL probe of a
      # production page, and a failure used to upload an artifact and stop
      # there: no issue, no push, a red square on a page nobody watches.  Same
      # rolling-tracker shape as health-check.yml: label ``production-health``,
      # identity LABEL + this exact TITLE (distinct from the health and SLO
      # trackers that share the label), oldest wins, a comment per failing run,
      # closed by the next green run.  The owner is pushed through
      # scripts/notify_owner.sh only when the tracker is CREATED and on
      # RECOVERY; a push that did not go out leaves
      # ``<!-- owner-push: pending -->`` in the tracker body and the next run
      # retries it.  Mainline only (#716): a dispatch from a branch runs that
      # branch's spec and must neither open nor close the mainline tracker.
      - name: Open or update the tracking issue on failure
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TRACKER_TITLE="Production E2E smoke (public /league) failing"
          BODY=$(cat <<EOF
          The production E2E smoke (public \`/league\`, desktop + mobile chromium) failed.

          - Workflow run: ${RUN_URL}
          - Checked at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          What this means, by which step failed:

          1. **Prod unreachable** -- \`/api/public/league\` did not answer 200, so
             the browser spec did not run. Check the backend, nginx and the
             most recent deploy.
          2. **Run public /league spec against prod** -- the page loaded but a
             rendered assertion failed. The Playwright report is attached to
             the run as \`prod-e2e-smoke-artifacts\`.
          3. **Resolve production URL** -- \`PROD_PUBLIC_URL\` is unset; nothing
             was checked.

          The cron retries every 4 hours. This issue is rolling: it is
          commented on rather than reopened, and closed automatically by the
          next green run.
          EOF
          )
          gh label create production-health \
            --color B60205 \
            --description "Auto-opened when the scheduled production health check fails" \
            2>/dev/null || true
          PUSH_TITLE="Risk It: production E2E smoke failing"
          PUSH_TEXT="The public /league production smoke failed. Run: ${RUN_URL}"
          if ! ROWS=$(gh issue list --state open --label production-health \
                        --limit 1000 --json number,title); then
            echo "::error title=Tracker lookup failed::gh issue list failed; filing an alert without deduplicating against the existing tracker"
            ROWS=""
          fi
          EXISTING=""
          if [[ -n "$ROWS" ]]; then
            EXISTING=$(printf '%s' "$ROWS" \
              | jq -r "[.[] | select(.title==\"${TRACKER_TITLE}\") | .number] | min // empty")
          fi
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
            bash scripts/notify_owner.sh --retry-pending "$EXISTING" "$PUSH_TITLE" \
              "${PUSH_TEXT} (Delayed: the first push for this incident did not go out.)" || true
          else
            NEW_URL=$(gh issue create \
              --title "$TRACKER_TITLE" \
              --body "$BODY" \
              --label production-health)
            echo "$NEW_URL"
            bash scripts/notify_owner.sh --issue "$NEW_URL" "$PUSH_TITLE" "$PUSH_TEXT" || true
          fi

      - name: Close the tracking issue on a green run
        # The counterpart: an alert that cannot clear stops being read.  Same
        # LABEL + exact TITLE as the step above (it must stay identical -- this
        # is the direction that CLOSES a real issue when it is wrong), and every
        # match closes so duplicates drain.
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TRACKER_TITLE="Production E2E smoke (public /league) failing"
          PUSH_TITLE="Risk It: production E2E smoke recovered"
          if ! OPEN=$(gh issue list --state open --label production-health \
                        --limit 1000 --json number,title \
                        --jq "[.[] | select(.title==\"${TRACKER_TITLE}\") | .number] | sort | .[]"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; the green all-clear did NOT run and any open tracker is still open"
            exit 1
          fi
          if [[ -z "$OPEN" ]]; then
            echo "no open production E2E smoke tracker; nothing to close"
            if LAST_CLOSED=$(gh issue list --state closed --label production-health \
                               --limit 100 --json number,title \
                               --jq "[.[] | select(.title==\"${TRACKER_TITLE}\") | .number] | max // empty"); then
              if [[ -n "$LAST_CLOSED" ]]; then
                bash scripts/notify_owner.sh --retry-pending "$LAST_CLOSED" "$PUSH_TITLE" \
                  "The public /league production smoke is green. (Delayed: the recovery push did not go out.) ${RUN_URL}" || true
              fi
            else
              echo "::warning title=Recovery-push retry skipped::gh issue list (closed) failed; an undelivered recovery push stays pending"
            fi
            exit 0
          fi
          for N in $OPEN; do
            echo "closing #${N}"
            gh issue close "$N" --reason completed --comment \
              "Production E2E smoke green again as of $(date -u +"%Y-%m-%dT%H:%M:%SZ"). Closing. Workflow run: ${RUN_URL}"
          done
          bash scripts/notify_owner.sh --issue "$N" "$PUSH_TITLE" \
            "The public /league production smoke is green again. Run: ${RUN_URL}" || true
