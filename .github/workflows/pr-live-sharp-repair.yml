name: PR Live Sharp Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pr-live-sharp-repair.yml"

permissions:
  contents: read

env:
  APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
  VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
  SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}

jobs:
  repair:
    name: Deploy 681 And Force Live Population
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Configure production SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing ${name}"; exit 10; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "DEPLOY_PORT_RESOLVED=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Deploy latest main and run all Sharp passes now
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v REMOTE_ENV 'APP_DIR=%q VENV_DIR=%q SERVICE_NAME=%q APP_USER=%q' \
            "$APP_DIR" "$VENV_DIR" "$SERVICE_NAME" "$DEPLOY_USER"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            -p "$DEPLOY_PORT_RESOLVED" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"

          echo "=== UPDATE PRODUCTION TO CURRENT MAIN ==="
          git fetch --prune origin main
          git reset --hard origin/main
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "production_sha=${TARGET_SHA}"
          test "$TARGET_SHA" = "39b99e6474a656faafbba57d723b1a58f4b42801"

          echo "=== REBUILD FRONTEND AND RESTART APPLICATION ==="
          DEPLOY_REF="$TARGET_SHA" \
          APP_DIR="$APP_DIR" \
          APP_USER="$APP_USER" \
          VENV_DIR="$VENV_DIR" \
          SERVICE_NAME="$SERVICE_NAME" \
          RUN_FRONTEND_BUILD=true \
            bash "$APP_DIR/deploy/deploy.sh"

          echo "=== FORCE FFPC, SLEEPER RECORDS, AND SLEEPER ACTIVITY ==="
          APP_DIR="$APP_DIR" \
          APP_USER="$APP_USER" \
          VENV_DIR="$VENV_DIR" \
          SERVICE_NAME="$SERVICE_NAME" \
          FORCE_SHARP_RECORDS_KICK=true \
          SHARP_BOOTSTRAP_MAX_PASSES=3 \
            bash "$APP_DIR/deploy/bootstrap-sharp-records.sh"

          echo "=== DIRECT LIVE DATA VERIFICATION ==="
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          from src.intel import platform_ledger
          from src.sharp import service
          from scripts import crawl_sharp_activity

          coverage = platform_ledger.platform_coverage()
          cohort = service.cohort_status()
          market = service.market_payload(
              window="30d",
              sort="strength",
              asset_type="all",
              platform="all",
              qualification="all",
              limit=20,
          )
          ffpc = service.market_payload(
              window="90d",
              sort="strength",
              asset_type="all",
              platform="ffpc",
              qualification="provisional",
              limit=20,
          )
          activity = {
              "qualified": crawl_sharp_activity.qualified_sleeper_ids()[1],
              "coverage": coverage.get("sleeper") or {},
          }
          result = {
              "coverage": coverage,
              "cohort": cohort.get("cohort") or {},
              "records": cohort.get("records") or {},
              "marketStatus": market.get("status"),
              "marketAssets": len(market.get("assets") or []),
              "ffpcAssets": len(ffpc.get("assets") or []),
              "sampleAssets": [row.get("displayName") for row in (market.get("assets") or [])[:10]],
              "sleeperActivity": activity,
          }
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          if result["marketStatus"] != "ok" or result["ffpcAssets"] <= 0:
              raise SystemExit("Unified Sharp market is not live with FFPC data")
          PY

          echo "=== INSTALLED TIMERS ==="
          for timer in \
            "$SERVICE_NAME-sharp-discovery.timer" \
            "$SERVICE_NAME-sharp-records.timer" \
            "$SERVICE_NAME-sharp-activity.timer" \
            "$SERVICE_NAME-ffpc-sharp.timer"; do
            echo "$timer=$(sudo -n systemctl is-enabled "$timer" || true)/$(sudo -n systemctl is-active "$timer" || true)"
          done

          echo "=== RECENT JOURNALS ==="
          sudo -n journalctl -u "$SERVICE_NAME" -n 80 --no-pager || true
          sudo -n journalctl -u "$SERVICE_NAME-sharp-records.service" -n 160 --no-pager || true
          sudo -n journalctl -u "$SERVICE_NAME-sharp-activity.service" -n 160 --no-pager || true
          sudo -n journalctl -u "$SERVICE_NAME-ffpc-sharp.service" -n 160 --no-pager || true
          REMOTE
