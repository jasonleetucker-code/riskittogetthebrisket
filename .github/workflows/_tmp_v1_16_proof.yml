name: Temporary V1-16 roster reconstruction proof

on:
  push:
    branches:
      - chatgpt/v1-16-proof

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install -U pip pytest
      - name: GREEN baseline
        run: |
          pytest -q tests/acquisition/test_roster_and_privacy.py
      - name: Mutation must RED
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/acquisition/roster.py')
          s = p.read_text()
          old = """    if acquired is not None and int(acquired) > at_ms:\n        return False\n"""
          new = """    if acquired is not None and int(acquired) > at_ms:\n        return True\n"""
          assert s.count(old) == 1, f'expected one mutation target, found {s.count(old)}'
          p.write_text(s.replace(old, new))
          PY
          set +e
          pytest -q tests/acquisition/test_roster_and_privacy.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "mutation was vacuous: focused roster suite stayed green" >&2
            exit 1
          fi
          echo "mutation produced RED as required"
      - name: Restore and GREEN again
        run: |
          git checkout -- src/acquisition/roster.py
          git diff --exit-code
          pytest -q tests/acquisition/test_roster_and_privacy.py
          python scripts/check_planning_integrity.py
