name: Scheduled Health Check

on:
  schedule:
    # Every 6 hours at a randomized minute offset to avoid thundering herd.
    # GitHub Actions cron uses UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  health:
    name: Production Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # NO `if: ${{ vars.PROD_PUBLIC_URL != '' }}` here.  CI reliability
    # lane, 2026-08-20.  This is the workflow's ONLY job, and a job
    # skipped by a job-level `if` reports neutral — which the checks UI
    # and the run's own conclusion render as SUCCESS.  So an unset or
    # renamed PROD_PUBLIC_URL would silently retire the always-on
    # external check of production, and every 6 hours the repository
    # would be told production was fine by a run that never looked.
    #
    # This is the same class of defect as AUDIT F-21 below, which the
    # step already documents: a check that cannot report the condition
    # it exists for.  F-21 was an exemption inside the assertion; this
    # one removes the assertion entirely.
    #
    # The variable IS set today (prod-e2e-smoke.yml, which refuses when
    # it is empty, ran green at 2026-08-20T04:53Z), so this hardens
    # against a configuration regression rather than repairing a live
    # failure.  The condition is not deleted — it moves into a step
    # that can refuse, the shape prod-e2e-smoke.yml already uses.
    steps:
      - name: Resolve production URL
        id: url
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          if [[ -z "${URL}" ]]; then
            echo "::error title=PROD_PUBLIC_URL not set::The production health check cannot run without a target origin. Set the PROD_PUBLIC_URL repository variable. Refusing rather than skipping: a skipped job reports green, and 'we did not look' must not read as 'we looked and it was fine'."
            exit 1
          fi
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Check /api/health
        id: health
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          set -Eeuo pipefail
          # Strip trailing slash if present
          URL="${URL%/}"

          HEALTH_URL="${URL}/api/health"
          echo "Checking: ${HEALTH_URL}"

          # AUDIT F-21.  ``503`` used to be the ONE non-200 that did not fail
          # this check — a permanent exemption for exactly the code
          # ``server.py::get_health`` returns for stale data, a failed or
          # stalled scrape, or contract validation failure.  Every OTHER
          # unexpected code failed.  So the only always-on external check of
          # production could not report the conditions it exists for, and 20
          # consecutive runs were green.
          #
          # The concern behind the exemption was real — a momentary degrade
          # should not page anyone — but the answer to that is a
          # CONSECUTIVE-failure threshold, which is what
          # ``deploy/systemd/dynasty-healthcheck.sh`` already does for
          # liveness (``HEALTH_FAIL_THRESHOLD`` consecutive failures before
          # it acts).  This workflow keeps no state between its 6-hourly
          # runs, so "consecutive" is measured WITHIN the run: probe up to
          # ``HEALTH_PROBES`` times, ``HEALTH_PROBE_GAP_SEC`` apart, and fail
          # only if every probe reports degraded.  A transient degrade
          # clears; a real one persists and is now visible.
          HEALTH_PROBES=3
          HEALTH_PROBE_GAP_SEC=30

          HTTP_CODE="000"
          DEGRADED_COUNT=0
          for attempt in $(seq 1 "${HEALTH_PROBES}"); do
            HTTP_CODE=$(curl --silent --show-error --output /tmp/health.json \
              --write-out '%{http_code}' --max-time 15 "${HEALTH_URL}" || echo "000")
            echo "probe ${attempt}/${HEALTH_PROBES}: HTTP ${HTTP_CODE}"

            if [[ "${HTTP_CODE}" == "200" ]]; then
              break
            fi
            if [[ "${HTTP_CODE}" == "503" ]]; then
              DEGRADED_COUNT=$((DEGRADED_COUNT + 1))
              # Only sleep between probes, never after the last one.
              if (( attempt < HEALTH_PROBES )); then
                sleep "${HEALTH_PROBE_GAP_SEC}"
              fi
              continue
            fi
            # Anything else is not a degrade — it is unreachable or broken,
            # and re-probing tells us nothing new.  Fail immediately.
            break
          done

          echo "HTTP status: ${HTTP_CODE}"

          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "status=healthy" >> "$GITHUB_OUTPUT"
            echo "Health check passed."
            cat /tmp/health.json | python3 -m json.tool 2>/dev/null || cat /tmp/health.json
          elif [[ "${HTTP_CODE}" == "503" && "${DEGRADED_COUNT}" -ge "${HEALTH_PROBES}" ]]; then
            echo "status=degraded" >> "$GITHUB_OUTPUT"
            echo "::error title=Health Degraded::Service returned 503 (degraded) on all ${HEALTH_PROBES} probes over $(( (HEALTH_PROBES - 1) * HEALTH_PROBE_GAP_SEC ))s.  /api/health returns 503 for stale data, a failed or stalled scrape, or contract validation failure."
            cat /tmp/health.json | python3 -m json.tool 2>/dev/null || cat /tmp/health.json
            exit 1
          else
            echo "status=down" >> "$GITHUB_OUTPUT"
            echo "::error title=Health Check Failed::Service returned HTTP ${HTTP_CODE}."
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

      - name: Check /api/status (data freshness)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"

          STATUS_URL="${URL}/api/status"
          echo "Checking: ${STATUS_URL}"

          HTTP_CODE=$(curl --silent --show-error --output /tmp/status.json \
            --write-out '%{http_code}' --max-time 15 "${STATUS_URL}" || echo "000")

          if [[ "${HTTP_CODE}" != "200" ]]; then
            # AUDIT F-21: an assertion that could not run is UNKNOWN,
            # not a pass.  Reported as its own state so "we could not
            # check" stops reading like "we checked and it is fine".
            echo "::error title=Status Unreachable::Status endpoint returned HTTP ${HTTP_CODE}.  The assertion below did NOT run — this is unknown, not healthy."
            exit 1
          fi

          # Extract key metrics
          python3 - <<'PY'
          import json, sys
          try:
              with open("/tmp/status.json") as f:
                  data = json.load(f)
              rate = data.get("scrape_success_rate_24h", {})
              print(f"Scrape success rate (24h): {rate.get('rate', 'N/A')}")
              print(f"  Total: {rate.get('total', 0)}, Success: {rate.get('success', 0)}, Failure: {rate.get('failure', 0)}")
              print(f"Has data: {data.get('has_data', 'N/A')}")
              print(f"Player count: {data.get('player_count', 'N/A')}")
              print(f"Data date: {data.get('data_date', 'N/A')}")
              print(f"Canonical mode: {data.get('canonical_data_mode', 'N/A')}")
              last_scrape = data.get("last_scrape") or data.get("last_success_at")
              if last_scrape:
                  print(f"Last successful scrape: {last_scrape}")
              # Warn on low success rate
              if rate.get("rate") is not None and rate["rate"] < 0.5 and rate.get("total", 0) >= 2:
                  print(f"::warning title=Low Scrape Success Rate::Only {rate['rate']*100:.0f}% of scrapes succeeded in the last 24h.")
          except Exception as e:
              print(f"Could not parse status: {e}")
          PY

      - name: Check served-board source coverage
        # Continuous defense-in-depth for the silent-degraded-board
        # failure: the running process can serve the bare 3-source
        # legacy export instead of the ~11-source enriched blend while
        # every other health signal stays green (sites/source_health
        # only ever list the 3 legacy sources, player_count looks
        # normal).  ``served_source_coverage`` is the real per-source
        # player count of the board being served right now.  A healthy
        # board has ~16-21 covered sources; a degraded one has ~3.  A
        # floor of 8 cleanly separates them with wide margin and
        # tolerates a few legitimately-stale sources (e.g. idpShow).
        # Dependency-free so this lean workflow needs no checkout.
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/status_cov.json \
            --write-out '%{http_code}' --max-time 20 "${URL}/api/status" || echo "000")
          if [[ "${HTTP_CODE}" != "200" ]]; then
            # AUDIT F-21: an assertion that could not run is UNKNOWN,
            # not a pass.  Reported as its own state so "we could not
            # check" stops reading like "we checked and it is fine".
            echo "::error title=Status Unreachable::Coverage check skipped (HTTP ${HTTP_CODE}).  The assertion below did NOT run — this is unknown, not healthy."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          MIN_PER_SOURCE = 5   # mirrors watchdog_contract_coverage._MIN_COVERAGE
          MIN_SOURCES = 8      # healthy ~16-21; degraded ~3
          with open("/tmp/status_cov.json") as f:
              data = json.load(f)
          cov = data.get("served_source_coverage")
          if not isinstance(cov, dict) or not cov:
              print("::error title=Degraded board::/api/status has no "
                    "served_source_coverage — the live board is the bare "
                    "3-source legacy export, not the enriched blend. The "
                    "process did not re-prime from the CSVs.")
              sys.exit(1)
          covered = sorted(k for k, v in cov.items()
                           if isinstance(v, (int, float)) and v >= MIN_PER_SOURCE)
          print(f"Served sources (>= {MIN_PER_SOURCE} players): "
                f"{len(covered)} -> {covered}")
          if len(covered) < MIN_SOURCES:
              print(f"::error title=Degraded live board::Only {len(covered)} "
                    f"source(s) meaningfully cover the served board (need "
                    f">= {MIN_SOURCES}). The process is serving a degraded "
                    f"board (missing OTCFFB et al.). Restart the backend to "
                    f"force a re-prime and investigate the deploy/prime path.")
              sys.exit(1)
          print("Served-board source coverage OK.")
          PY

      - name: Check /api/status (backup freshness)
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/status_bkp.json \
            --write-out '%{http_code}' --max-time 20 "${URL}/api/status" || echo "000")
          if [[ "${HTTP_CODE}" != "200" ]]; then
            # AUDIT F-21: an assertion that could not run is UNKNOWN,
            # not a pass.  Reported as its own state so "we could not
            # check" stops reading like "we checked and it is fine".
            echo "::error title=Status Unreachable::Backup check skipped (HTTP ${HTTP_CODE}).  The assertion below did NOT run — this is unknown, not healthy."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          MAX_AGE_HOURS = 30   # nightly backup @ 02:00 UTC; >30h == missed a run
          with open("/tmp/status_bkp.json") as f:
              data = json.load(f)
          bh = data.get("backup_health")
          if not isinstance(bh, dict):
              print("::error title=Backup health missing::/api/status has no "
                    "backup_health block — cannot verify SQLite backups are "
                    "running. Deploy may predate backup monitoring.")
              sys.exit(1)
          age = bh.get("newestBackupAgeHours")
          if age is None:
              print("::error title=No SQLite backups::No backup found in "
                    "/var/backups/riskit or /home/dynasty/backups/riskit. "
                    "deploy/backup_user_kv.sh / riskit-backup.timer is broken — "
                    "user_kv, session_store and guest_passes are UNPROTECTED.")
              sys.exit(1)
          print(f"Newest backup: {age}h old (dir={bh.get('backupDirUsed')}, "
                f"dbCount={bh.get('dbCount')})")
          if age > MAX_AGE_HOURS:
              print(f"::error title=Stale SQLite backups::Newest backup is "
                    f"{age}h old (> {MAX_AGE_HOURS}h). The nightly backup has "
                    f"not run — investigate riskit-backup.timer and "
                    f"/var/log/riskit-backup.log.")
              sys.exit(1)
          if bh.get("dbCount", 0) < 3:
              print(f"::warning title=Partial backup::Only {bh.get('dbCount')} "
                    f"of 3 SQLite DBs in the latest backup set.")
          print("SQLite backup freshness OK.")
          PY

      - name: Open or update the tracking issue on failure
        # AUDIT F-21.  This workflow had no failure handler at all, so even
        # the codes that DID ``exit 1`` produced nothing but a red square on
        # a page nobody watches.  Same rolling-issue shape as
        # ``scheduled-refresh.yml``'s ``stale-sources`` handler: create the
        # label idempotently (an unlabelled fallback can never be found by
        # the dedup search, which is how that one used to spam a fresh issue
        # every cycle), then comment on the open issue if there is one.
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no `actions/checkout` step (deliberately —
          # it's a lightweight external HTTP ping), so `gh` cannot
          # infer the repo from a `.git` directory the way the
          # checked-out workflows do. Without this, every `gh issue`
          # call below fails with "not a git repository" — silently
          # turning both halves of F-21's own repair (file the alert,
          # clear it later) into a false negative that reads as
          # "checked and fine" instead of "did not run".  Measured:
          # 9 consecutive scheduled runs failed on exactly this while
          # production itself stayed healthy (2026-08-19 through
          # 2026-08-21).
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Production health check failed.

          - Workflow run: ${RUN_URL}
          - Checked at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          What this means, by which step failed:

          1. **Health Degraded** — \`/api/health\` returned 503 on every probe.
             That code means stale data, a failed or stalled scrape, or
             contract validation failure. Check \`/api/status\` and the most
             recent **Scheduled Data Refresh** run.
          2. **Health Check Failed** — the service answered something else, or
             nothing at all. Check the backend service and nginx.
          3. **Status Unreachable** — \`/api/status\` did not answer, so the
             coverage and backup assertions did not run. Their state is
             UNKNOWN, not healthy.

          The cron retries every 6 hours. This issue is rolling: it is
          commented on rather than reopened, and closed automatically by the
          next green run.
          EOF
          )
          gh label create production-health \
            --color B60205 \
            --description "Auto-opened when the scheduled production health check fails" \
            2>/dev/null || true
          # AUDIT F-23, applied forward.  Selecting `.[0]` off the LABEL alone
          # treats any issue wearing it as this workflow's own tracker.
          # `e2e.yml` learned that the hard way on #753 — a hand-filed defect
          # carrying the label, which the alert step hijacked and a green run
          # would have closed with a "resolved" comment.  `production-health`
          # is a new label so nothing wears it yet; this closes the door before
          # anyone does, rather than after.
          #
          # Identify the tracker by what this step actually CREATES: author AND
          # title.  The `[bot]` suffix is normalised away because `gh` reports a
          # bot's login differently depending on which API answers — that
          # mismatch is F-23 itself, and pinning either spelling is a bet.
          TRACKER_TITLE="Production health check failing"
          if ! EXISTING=$(gh issue list --state open --label production-health \
                            --json number,title,author \
                            --jq "[.[] | select((.author.login | sub(\"\\\\[bot\\\\]$\"; \"\")) == \"github-actions\")
                                       | select(.title==\"${TRACKER_TITLE}\")] | .[0].number"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; filing an alert without deduplicating against the existing tracker"
            EXISTING=""
          fi
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "$TRACKER_TITLE" \
              --body "$BODY" \
              --label production-health
          fi

      - name: Close the tracking issue on a green run
        # The counterpart, so an alert that has cleared stops being read as
        # an open incident.  ``success()`` is the whole condition: every gate
        # in this workflow must have passed.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See the matching comment on "Open or update the tracking
          # issue on failure" — same missing-checkout cause.
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          # Same identification as the alert step, and it must stay identical —
          # this is the direction where getting it wrong CLOSES a real open
          # issue rather than merely filing a wrong one (F-23).
          TRACKER_TITLE="Production health check failing"
          if ! EXISTING=$(gh issue list --state open --label production-health \
                            --json number,title,author \
                            --jq "[.[] | select((.author.login | sub(\"\\\\[bot\\\\]$\"; \"\")) == \"github-actions\")
                                       | select(.title==\"${TRACKER_TITLE}\")] | .[0].number"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; the green all-clear did NOT run and any open tracker is still open"
            exit 1
          fi
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" \
              --body "Production health check green again as of $(date -u +"%Y-%m-%dT%H:%M:%SZ"). Closing."
            gh issue close "$EXISTING"
          fi
