name: Calculator UI parity integration repair
on:
  push:
    branches: [codex/ui-gallery-gated-integration-20260924]
    paths: [.github/workflows/ui-parity-integration-20260924.yml]
permissions:
  contents: write
  pull-requests: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/psi-design-reference
          fetch-depth: 0
      - name: Reconcile exact head and record isolated integration claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 85864751e06d64181d3039c18e9e15ab42bda4fe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/parity-proof
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          root = 'https://api.github.com/repos/jasonleetucker-code/riskittogetthebrisket'
          def read(path):
              req = urllib.request.Request(root + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def pages(path):
              out = []
              for page in range(1, 100):
                  chunk = read(path + ('&' if '?' in path else '?') + f'per_page=100&page={page}')
                  out.extend(chunk)
                  if len(chunk) < 100:
                      return out
              raise RuntimeError('Pagination bound')
          target = 'tests/e2e/specs/api-view-parity.spec.js'
          audit = []
          for pr in pages('/pulls?state=open'):
              if pr['number'] == 1429:
                  continue
              matches = [f for f in pages(f"/pulls/{pr['number']}/files") if f['filename'] == target]
              if not matches:
                  continue
              patch = matches[0].get('patch', '')
              assert pr['number'] == 1346 and pr['head']['sha'] == '47b90cd412eeed8c8429487de8109823d82baac0', pr['number']
              added = [line for line in patch.splitlines() if line.startswith('+') and not line.startswith('+++')]
              removed = [line for line in patch.splitlines() if line.startswith('-') and not line.startswith('---')]
              assert added == ['+  "readModelKey", // prepared detail identity; absent in both legacy views'] and not removed, patch
              audit.append({'pr': pr['number'], 'head': pr['head']['sha'], 'patch': patch, 'coordination_comment': 5822109954})
          Path('/tmp/parity-proof/overlap-audit.json').write_text(json.dumps(audit, indent=2) + '\n')
          PY
          git fetch origin main
          test "$(git rev-parse origin/main)" = 3154065c828b3f1204b0f0351a47a7147c60b337
          git merge --no-ff -m 'Integrate current main test-only repair for final PSI release gates' origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/WORK_CLAIMS.md')
          s = p.read_text()
          rows = [line for line in s.splitlines() if line.startswith('| **PSI gallery reference #1422')]
          assert len(rows) == 1
          old = rows[0]
          new = old.replace('`tests/e2e/specs/psi-gallery.spec.js`,', '`tests/e2e/specs/psi-gallery.spec.js`, Integration-only `tests/e2e/specs/api-view-parity.spec.js` ktcMarket list entry (coordinated #1346 comment5822109954),')
          assert new != old
          fields = new.split('|')
          fields[-2] = ' integration in progress — add the already-consumed ktcMarket to explicit parity comparisons; no scanner exclusion or runtime change. #1346 readModelKey hunk preserved for its separate integration. Existing gallery run36055955615 evidence retained; seven real API parity checks required before push. #1428 OPEN, gallery PARTIAL; no production acceptance claim. Agent-OS-Receipt: cdca1dca8385f70c0989302dece8d1bd4ce4843c '
          p.write_text(s.replace(old, '|'.join(fields)))
          PY
          git add docs/WORK_CLAIMS.md
          git commit -m 'docs: claim isolated ktcMarket parity-list integration repair'
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/specs/api-view-parity.spec.js')
          s = p.read_text()
          old = '  "isSingleSource",\n  "madPenaltyApplied",'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '  "isSingleSource",\n  "ktcMarket",\n  "madPenaltyApplied",'))
          PY
          git add tests/e2e/specs/api-view-parity.spec.js
          git commit -m 'test(e2e): compare consumed ktcMarket in mobile desktop parity guard'
          echo "PARITY_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show -s --format='code=%H tree=%T parents=%P' | tee /tmp/parity-proof/provenance.txt
          git diff --exit-code 85864751e06d64181d3039c18e9e15ab42bda4fe HEAD -- frontend src server.py config scripts .github
          test ! -e .github/workflows/ui-parity-integration-20260924.yml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install canonical dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-dev.txt
          npm ci --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Canonical static and consumer-parity gates
        run: |
          set -Eeuo pipefail
          python scripts/check_planning_integrity.py
          python scripts/check_product_plan_governance.py
          python scripts/check_work_claims.py --files tests/e2e/specs/api-view-parity.spec.js --branch codex/psi-design-reference
          python -m pytest tests/api/test_compact_view_consumer_parity.py tests/docs tests/consensus_edge/test_fair_value.py -q | tee /tmp/parity-proof/python.log
          bash scripts/tiered_validate.sh l0 | tee /tmp/parity-proof/l0.log
      - name: Production build and unchanged budgets
        run: |
          set -Eeuo pipefail
          npm run build --prefix frontend 2>&1 | tee /tmp/parity-proof/build.log
      - name: Seven real API parity checks with exact focused coverage floor
        env:
          E2E_FRONTEND_CMD: npm run start
          E2E_MIN_PASSED: '7'
          E2E_MAX_SKIPPED: '0'
        run: |
          set -Eeuo pipefail
          npx playwright test -c tests/e2e/playwright.config.js tests/e2e/specs/api-view-parity.spec.js --project=desktop-1366 --retries=0 2>&1 | tee /tmp/parity-proof/e2e.log
          grep -Eq '7 passed' /tmp/parity-proof/e2e.log
          if grep -Eq '[1-9][0-9]* skipped' /tmp/parity-proof/e2e.log; then exit 1; fi
      - name: Preserve successful evidence and publish candidate only
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path('docs/WORK_CLAIMS.md')
          s = p.read_text()
          rows = [line for line in s.splitlines() if line.startswith('| **PSI gallery reference #1422')]
          assert len(rows) == 1
          old = rows[0]
          new = old.replace('integration in progress — add the already-consumed ktcMarket to explicit parity comparisons; no scanner exclusion or runtime change. #1346 readModelKey hunk preserved for its separate integration. Existing gallery run36055955615 evidence retained; seven real API parity checks required before push.', 'done — isolated ktcMarket parity-list repair validated by seven real API parity tests, zero skips/retries, consumer parity/docs/L0/build gates, run ' + os.environ['GITHUB_RUN_ID'] + ' on code ' + os.environ['PARITY_CODE_SHA'] + '. No runtime change or assertion relaxation. #1346 readModelKey hunk remains separately owned. Existing gallery run36055955615 proof retained; final ordinary PR/E2E and deployment gates separate.')
          assert new != old
          p.write_text(s.replace(old, new))
          dest = Path('docs/psi/evidence/PR_1429_2026-09-24/gated-integration/parity-repair.json')
          data = {'code_sha': os.environ['PARITY_CODE_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'integration_base': '3154065c828b3f1204b0f0351a47a7147c60b337', 'prior_head': '85864751e06d64181d3039c18e9e15ab42bda4fe', 'change': 'Add already-consumed ktcMarket to explicit desktop/mobile comparisons. Guard, exclusions and all assertions unchanged.', 'e2e_passed': 7, 'e2e_skipped': 0, 'retries': 0, 'runtime_changed': False, 'shared_file_coordination': {'pr': 1346, 'comment_id': 5822109954, 'preserve_separate_entry': 'readModelKey'}, 'prior_full_suite_failure': {'run_id': '36056426564', 'passed': 214, 'failed': 1, 'skipped': 63, 'flaky': 0, 'cause': 'Explicit materializer field-list omitted ktcMarket'}, 'full_final_head_ci': 'Required separately; not claimed by this focused run', 'production_verification': 'Not performed by this CI proof', 'chart_decision_1428': 'OPEN'}
          dest.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/check_planning_integrity.py
          python scripts/check_product_plan_governance.py
          git add docs/WORK_CLAIMS.md docs/psi/evidence/PR_1429_2026-09-24/gated-integration/parity-repair.json
          git diff --cached --check
          git commit -m 'test(ui): record expanded parity proof and retire bounded integration claim'
          git diff --exit-code 85864751e06d64181d3039c18e9e15ab42bda4fe HEAD -- frontend src server.py config scripts .github
          git show -s --format='final=%H tree=%T parents=%P' | tee /tmp/parity-proof/final-provenance.txt
          git push origin HEAD:refs/heads/codex/psi-parity-guard-candidate-20260924
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: psi-parity-integration-proof
          path: |
            /tmp/parity-proof
            tests/e2e/test-results
          retention-days: 3
      - name: Summary
        if: always()
        run: |
          printf '### Bounded API parity integration\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/parity-proof/provenance.txt >> "$GITHUB_STEP_SUMMARY"
          if test -e /tmp/parity-proof/final-provenance.txt; then cat /tmp/parity-proof/final-provenance.txt >> "$GITHUB_STEP_SUMMARY"; fi
          printf '\nNo runtime or release-branch modification. Full final-head gates remain required.\n' >> "$GITHUB_STEP_SUMMARY"
