name: PR Live Sharp Route Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pr-live-sharp-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH and inspect deployed frontend and Sharp data
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          SERVICE: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in HOST USER KEY HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::missing $name"; exit 10; }
          done
          PORT="${PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          printf -v ENVLINE 'APP_DIR=%q VENV_DIR=%q SERVICE=%q' "$APP_DIR" "$VENV_DIR" "$SERVICE"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            -p "$PORT" "$USER@$HOST" "$ENVLINE bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          echo "BACKEND_STATE=$(sudo -n systemctl is-active "$SERVICE" || true)"
          echo "FRONTEND_STATE=$(sudo -n systemctl is-active "$SERVICE-frontend" || true)"
          sudo -n systemctl show "$SERVICE-frontend" -p ActiveEnterTimestamp --no-pager || true
          stat -c 'FRONTEND_BUILD_ID_MTIME=%y' "$APP_DIR/frontend/.next/BUILD_ID" || true
          printf 'SOURCE_HAS_FORCE_DYNAMIC='
          grep -q 'dynamic = "force-dynamic"' "$APP_DIR/frontend/app/api/sharp/market/route.js" && echo yes || echo no
          printf 'SOURCE_HAS_AUTO_REFRESH='
          grep -q 'AUTO_REFRESH_MS = 60_000' "$APP_DIR/frontend/app/market/sharp-tracker/page.jsx" && echo yes || echo no

          echo "ACTIVE_COLLECTORS:"
          for unit in "$SERVICE-sharp-discovery.service" "$SERVICE-sharp-records.service" "$SERVICE-sharp-activity.service" "$SERVICE-ffpc-sharp.service"; do
            printf '%s=' "$unit"
            sudo -n systemctl is-active "$unit" || true
          done

          echo "DIRECT_SHARP_SUMMARY:"
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          from src.intel import platform_ledger
          from src.sharp import service

          cohort = service.cohort_status()
          market = service.market_payload(
              window="30d", sort="strength", asset_type="all",
              platform="all", qualification="all", limit=20,
          )
          ffpc = service.market_payload(
              window="90d", sort="strength", asset_type="all",
              platform="ffpc", qualification="provisional", limit=20,
          )
          result = {
              "coverage": platform_ledger.platform_coverage(),
              "cohort": cohort.get("cohort") or {},
              "records": cohort.get("records") or {},
              "marketStatus": market.get("status"),
              "marketAssets30d": len(market.get("assets") or []),
              "ffpcAssets90d": len(ffpc.get("assets") or []),
              "sampleAssets": [row.get("displayName") for row in (market.get("assets") or [])[:10]],
          }
          print(json.dumps(result, indent=2, sort_keys=True, default=str))
          if result["marketStatus"] != "ok" or result["ffpcAssets90d"] <= 0:
              raise SystemExit(71)
          PY
          REMOTE
