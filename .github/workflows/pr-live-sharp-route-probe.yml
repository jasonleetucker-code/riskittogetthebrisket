name: PR Live Sharp Route Probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pr-live-sharp-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH and inspect live Sharp data
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          SERVICE: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in HOST USER KEY HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::missing $name"; exit 10; }
          done
          PORT="${PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          printf -v ENVLINE 'APP_DIR=%q VENV_DIR=%q SERVICE=%q' "$APP_DIR" "$VENV_DIR" "$SERVICE"
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=20 \
            -p "$PORT" "$USER@$HOST" "$ENVLINE bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
          echo "BACKEND_STATE=$(sudo -n systemctl is-active "$SERVICE" || true)"
          echo "ACTIVE_COLLECTORS:"
          for unit in "$SERVICE-sharp-discovery.service" "$SERVICE-sharp-records.service" "$SERVICE-ffpc-sharp.service"; do
            printf '%s=' "$unit"
            sudo -n systemctl is-active "$unit" || true
          done

          echo "REGISTERED_SHARP_ROUTES:"
          "$VENV_DIR/bin/python" - <<'PY'
          import os
          os.environ.setdefault("ALLOW_DEFAULT_LOGIN_DEV", "1")
          import server
          print("\n".join(sorted({getattr(r, "path", "") for r in server.app.routes if "sharp" in getattr(r, "path", "")})))
          PY

          echo "DIRECT_SHARP_PAYLOADS:"
          "$VENV_DIR/bin/python" - <<'PY'
          import json
          from src.intel import platform_ledger
          from src.sharp import service

          payload = {
              "platformCoverage": platform_ledger.platform_coverage(),
              "cohort": service.cohort_status(),
              "marketAll30d": service.market_payload(
                  window="30d",
                  sort="strength",
                  asset_type="all",
                  platform="all",
                  qualification="all",
                  limit=10,
              ),
              "marketFfpc90d": service.market_payload(
                  window="90d",
                  sort="strength",
                  asset_type="all",
                  platform="ffpc",
                  qualification="provisional",
                  limit=10,
              ),
          }
          print(json.dumps(payload, indent=2, sort_keys=True, default=str)[:50000])
          PY

          echo "HTTP_ROUTE_EXISTENCE_WITHOUT_BROWSER_COOKIE:"
          "$VENV_DIR/bin/python" - <<'PY'
          import json, urllib.error, urllib.request
          for path in (
              "/api/sharp/cohort",
              "/api/sharp/market?window=30d&platform=all&qualification=all&limit=10",
          ):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000" + path, timeout=20) as r:
                      print(json.dumps({"path": path, "status": r.status}))
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  print(json.dumps({"path":path,"status":e.code,"body":body[:1000]}))
          PY
          REMOTE
