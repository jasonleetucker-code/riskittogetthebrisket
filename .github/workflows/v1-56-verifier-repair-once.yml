name: One-shot V1-56 verifier repair

on:
  push:
    branches:
      - chatgpt/v1-56-verifier-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v1-56-verifier-repair
          fetch-depth: 0

      - name: Repair the two V1-56 false-negative paths
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v1-56.patch <<'PATCH'
          diff --git a/scripts/verify_v1_authenticated.py b/scripts/verify_v1_authenticated.py
          --- a/scripts/verify_v1_authenticated.py
          +++ b/scripts/verify_v1_authenticated.py
          @@ -185,9 +185,19 @@ def check_v56(client: Client) -> None:
               if status != 200 or not isinstance(body, dict):
                   c.record("fail" if status != 401 else "unmeasurable", f"HTTP {status}")
                   return
          -    block = body.get("faabAnalytics") if "faabAnalytics" in body else body
          -    if not isinstance(block, dict):
          +    # `/api/public/league/{section}` is a section ENVELOPE:
          +    # `{contractVersion, league, section, data}`. The old verifier read the
          +    # envelope itself as the analytics block, so a healthy production response
          +    # falsely failed with "leagueMedianWinningBid absent" even though the value
          +    # was present under `data`. Accept the historical direct block only as a
          +    # compatibility shape; never fall back to treating the envelope as data.
          +    if isinstance(body.get("data"), dict):
          +        block = body["data"]
          +    elif isinstance(body.get("faabAnalytics"), dict):
          +        block = body["faabAnalytics"]
          +    else:
                   c.record("fail", "no analytics block", topKeys=sorted(body)[:15])
                   return
          +
               median = block.get("leagueMedianWinningBid", "ABSENT")
               if median == "ABSENT":
                   c.record("fail", "leagueMedianWinningBid absent from the payload", keys=sorted(block)[:20])
          diff --git a/tests/ops/test_v1_verification_primitives.py b/tests/ops/test_v1_verification_primitives.py
          --- a/tests/ops/test_v1_verification_primitives.py
          +++ b/tests/ops/test_v1_verification_primitives.py
          @@ -98,6 +98,50 @@ def test_v61_zero_coverage_where_null_expected_is_still_typed_pass():
               assert auth.CHECKS[-1].status == "fail"  # a string coverage is malformed
           
           
          +# ── V1-56: public-league section envelope ──
          +
          +
          +def test_v56_reads_the_analytics_block_from_the_section_data_envelope():
          +    client = _FakeClient(
          +        {
          +            "/api/public/league/faabAnalytics": (
          +                200,
          +                {
          +                    "contractVersion": "2026-03-10.v2",
          +                    "league": {"name": "Risk It To Get The Brisket"},
          +                    "section": "faabAnalytics",
          +                    "data": {
          +                        "leagueMedianWinningBid": 0.0,
          +                        "leagueAvgWinningBid": 1.37,
          +                        "totalBidsAnalyzed": 1097,
          +                    },
          +                },
          +            )
          +        }
          +    )
          +    auth.check_v56(client)
          +    assert auth.CHECKS[-1].status == "pass"
          +    assert "leagueMedianWinningBid=0.0" in auth.CHECKS[-1].detail
          +
          +
          +def test_v56_does_not_mistake_the_section_envelope_for_the_analytics_block():
          +    client = _FakeClient(
          +        {
          +            "/api/public/league/faabAnalytics": (
          +                200,
          +                {
          +                    "contractVersion": "2026-03-10.v2",
          +                    "league": {"name": "Risk It To Get The Brisket"},
          +                    "section": "faabAnalytics",
          +                    "data": None,
          +                },
          +            )
          +        }
          +    )
          +    auth.check_v56(client)
          +    assert auth.CHECKS[-1].status == "fail"
          +    assert auth.CHECKS[-1].detail == "no analytics block"
          +
          +
           # ── V1-131: the agreement rule ──
           
           
          diff --git a/tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js b/tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js
          --- a/tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js
          +++ b/tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js
          @@ -54,6 +54,42 @@ test.describe("V1-56: /waivers league-FAAB context strip", () => {
                 page.getByRole("heading", { level: 1, name: /^Waivers$/ }),
               ).toBeVisible({ timeout: 90_000 });
           
          +    // The ephemeral production-verification guest intentionally has no
          +    // persisted per-league team preference. The FAAB context strip is
          +    // team-context UI, so when the real shell says "Pick your team" the
          +    // verifier must establish that prerequisite through the SAME user-facing
          +    // TeamSwitcher a normal user uses. The old proof instead demanded a
          +    // team-scoped strip while deliberately providing no team, producing a
          +    // false negative against a component whose analytics request had already
          +    // succeeded. Do not seed localStorage or call an internal setter here.
          +    const teamSwitcher = page.locator(".team-switcher").first();
          +    await expect(
          +      teamSwitcher,
          +      "authenticated /waivers must offer a real team selector before a team-scoped FAAB assertion",
          +    ).toBeVisible({ timeout: 30_000 });
          +    const needsTeam = await teamSwitcher.evaluate((node) =>
          +      node.classList.contains("team-switcher--needs"),
          +    );
          +    if (needsTeam) {
          +      const toggle = teamSwitcher.locator(".team-switcher-toggle");
          +      await toggle.click();
          +      const option = teamSwitcher.locator(".team-switcher-option").first();
          +      await expect(
          +        option,
          +        "the production contract exposes no selectable team for the guest verifier",
          +      ).toBeVisible({ timeout: 15_000 });
          +      const chosen = (await option.innerText()).trim();
          +      await option.click();
          +      annotate(testInfo, "team-context", `selected through TeamSwitcher: ${chosen}`);
          +    } else {
          +      annotate(
          +        testInfo,
          +        "team-context",
          +        `already resolved by the shell: ${(await teamSwitcher.innerText()).trim()}`,
          +      );
          +    }
          +
               const analyticsRes = await analyticsPromise;
               let data = null;
               if (analyticsRes) {
          PATCH
          git apply --check /tmp/v1-56.patch
          git apply /tmp/v1-56.patch

      - name: Run focused verifier tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/ops/test_v1_verification_primitives.py
          node --check tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js
          python scripts/check_decision_coercions.py
          python scripts/check_planning_integrity.py

      - name: Commit only verifier repairs and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_v1_authenticated.py \
                  tests/ops/test_v1_verification_primitives.py \
                  tests/e2e/specs/prod-auth/v1-56-waivers-faab-strip.spec.js
          git rm .github/workflows/v1-56-verifier-repair-once.yml
          git diff --cached --check
          git commit -m "test(v1): make V1-56 production proof establish real team context"
          git push origin HEAD:chatgpt/v1-56-verifier-repair
