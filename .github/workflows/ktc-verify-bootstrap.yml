name: KTC pre-push verification

# Temporary execution harness on this branch ONLY. Never merge this workflow.
# The repair is applied to a scratch checkout and is NOT published until all
# mandated local gates complete successfully. Normal PR/release/deploy gates
# remain untouched and must still pass after publication.
on:
  push:
    branches: ['codex/ktc-verify-bootstrap']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktc-prepush-1391
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE: ${{ runner.temp }}/ktc-evidence
      BUNDLE: ${{ runner.temp }}/ktc-bundle
      ALLOW_DEFAULT_LOGIN_DEV: '1'
      UPTIME_CHECK_ENABLED: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f01839f7d8dcb389be1b003bda48540e434236fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Retrieve exact staged package (no branch or code push)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE" "$BUNDLE"
          gh api repos/jasonleetucker-code/riskittogetthebrisket/git/blobs/8aeed8d793dc5225996493bc76b18d9168c375c1 > "$RUNNER_TEMP/package.json"
          python - <<'PY'
          import base64, hashlib, io, json, os, zipfile
          from pathlib import Path
          data = base64.b64decode(json.loads(Path(os.environ['RUNNER_TEMP'], 'package.json').read_text())['content'])
          assert hashlib.sha256(data).hexdigest() == '4f61fbaad7a86bb6c6d83d9a07f252a77328bba208305c6b1f51a08f9b205f27'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert set(z.namelist()) == {'candidate.patch','prepare.py','freeze.py','probe.py','verify_mutations.py'}
              for name in z.namelist():
                  Path(os.environ['BUNDLE'], name).write_bytes(z.read(name))
          PY
      - name: Install canonical dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
          pip freeze > "$EVIDENCE/dependencies.txt"
      - name: Canonical startup and bounded candidate application
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/agent_session_start.sh 2>&1 | tee "$EVIDENCE/startup.txt"
          python "$BUNDLE/prepare.py"
      - name: Pinned formatter, full format/lint and candidate freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/format_python_changes.sh 2>&1 | tee "$EVIDENCE/format.txt"
          python "$BUNDLE/freeze.py"
          python -m py_compile server.py 'Dynasty Scraper.py' src/sources/ktc_value_sources.py tests/sources/test_ktc_value_source_projection.py
      - name: Sabotage verification in disposable copies
        shell: bash
        run: |
          set -Eeuo pipefail
          python "$BUNDLE/verify_mutations.py" 2>&1 | tee "$EVIDENCE/sabotage.txt"
      - name: Complete source subsystem tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest tests/sources/ -q --tb=short -m 'not livedata' --junitxml="$EVIDENCE/source-tests.xml" 2>&1 | tee "$EVIDENCE/source-tests.txt"
      - name: Full repository non-livedata sweep (no fail-fast or exclusions)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest tests/ -q --tb=short -m 'not livedata' --junitxml="$EVIDENCE/full-suite.xml" 2>&1 | tee "$EVIDENCE/full-suite.txt"
      - name: Remaining repository blocking local gates
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            python scripts/check_env.py
            python scripts/check_decision_coercions.py
            python scripts/audit_status.py
            python scripts/check_planning_integrity.py
            python scripts/check_product_plan_governance.py
            python -c 'import server; print("runtime server import: passed")'
            python scripts/validate_api_contract.py --repo . --lane structural
            for script in deploy/*.sh; do bash -n "$script"; done
            python -m ruff format --check .
            python -m ruff check .
            git diff --check
          } 2>&1 | tee "$EVIDENCE/local-gates.txt"
      - name: Freeze integrity check before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          for name,digest in json.loads((e/'candidate-hashes.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, f'Tests modified candidate: {name}'
          (e/'VERIFIED').write_text('Full local suite and all preceding gates passed; NOT production verification.\n')
          PY
      - name: Upload complete evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-prepush-evidence
          path: ${{ runner.temp }}/ktc-evidence/
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f01839f7d8dcb389be1b003bda48540e434236fa
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ktc-prepush-evidence
          path: ${{ runner.temp }}/ktc-evidence
      - name: Publish exactly the verified candidate to task branch only
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/ktc-evidence
        run: |
          set -Eeuo pipefail
          test -f "$EVIDENCE/VERIFIED"
          test "$(git rev-parse HEAD)" = "$(cat "$EVIDENCE/base.txt")"
          git apply --check "$EVIDENCE/validated.patch"
          git apply "$EVIDENCE/validated.patch"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          paths=json.loads((e/'paths.json').read_text())
          for name,digest in json.loads((e/'candidate-hashes.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, f'Publish bytes differ: {name}'
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(actual)==sorted(paths), actual
          PY
          git diff --cached --check
          git config user.name 'ChatGPT KTC repair'
          git config user.email '266685218+jasonleetucker-code@users.noreply.github.com'
          git switch -c codex/ktc-compact-capture
          git commit -m 'fix(ktc): project native value fields before Playwright transfer' -m "Pre-push full-suite evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -m "$(cat "$EVIDENCE/receipt.txt")"
          git push origin HEAD:refs/heads/codex/ktc-compact-capture
          echo "Published tested head $(git rev-parse HEAD). PR, review, release, deploy and live acceptance remain required." >> "$GITHUB_STEP_SUMMARY"
