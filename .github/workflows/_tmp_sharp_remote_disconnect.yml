name: Temporary Sharp Sleeper disconnect repair

on:
  push:
    branches:
      - chatgpt/sharp-sleeper-remote-disconnect

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded transport-failure repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/api/sleeper_overlay.py')
          s = p.read_text()
          old_import = 'import datetime as _dt\nimport json\n'
          new_import = 'import datetime as _dt\nimport http.client\nimport json\n'
          assert s.count(old_import) == 1
          s = s.replace(old_import, new_import)

          old_exc = 'except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError) as exc:'
          new_exc = 'except (\n        urllib.error.URLError,\n        urllib.error.HTTPError,\n        TimeoutError,\n        http.client.RemoteDisconnected,\n    ) as exc:'
          assert s.count(old_exc) == 1
          s = s.replace(old_exc, new_exc)
          p.write_text(s)

          t = Path('tests/api/test_sleeper_overlay_remote_disconnect.py')
          assert not t.exists()
          t.write_text('''"""Regression coverage for transient Sleeper transport disconnects."""\n\nimport http.client\n\nfrom src.api import sleeper_overlay\n\n\ndef test_http_get_json_remote_disconnect_returns_none(monkeypatch):\n    called = {"urlopen": 0}\n\n    def remote_disconnect(*args, **kwargs):\n        called["urlopen"] += 1\n        raise http.client.RemoteDisconnected("remote closed")\n\n    monkeypatch.setattr(sleeper_overlay.urllib.request, "urlopen", remote_disconnect)\n    monkeypatch.setattr(\n        "src.utils.circuit_breaker.get_or_create",\n        lambda *args, **kwargs: None,\n    )\n\n    result = sleeper_overlay._http_get_json("https://api.sleeper.app/v1/test")\n\n    assert called["urlopen"] == 1\n    assert result is None\n''')
          PY
          git diff --check
          python -m compileall -q src/api/sleeper_overlay.py tests/api/test_sleeper_overlay_remote_disconnect.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run focused regression
        run: pytest -q tests/api/test_sleeper_overlay_remote_disconnect.py
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Integration"
          git config user.email "chatgpt-integration@users.noreply.github.com"
          git rm .github/workflows/_tmp_sharp_remote_disconnect.yml
          git add src/api/sleeper_overlay.py tests/api/test_sleeper_overlay_remote_disconnect.py
          git commit -m "fix(sharp): tolerate Sleeper remote disconnects"
          git push origin HEAD:chatgpt/sharp-sleeper-remote-disconnect
