name: Autoformat Sharp 681

on:
  push:
    branches:
      - fix/sharp-live-refresh-and-sleeper-activity
    paths:
      - ".github/workflows/autoformat-sharp-681.yml"
      - "scripts/crawl_sharp_activity.py"
      - "tests/scripts/test_crawl_sharp_activity.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sharp-live-refresh-and-sleeper-activity
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff format scripts/crawl_sharp_activity.py tests/scripts/test_crawl_sharp_activity.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/crawl_sharp_activity.py tests/scripts/test_crawl_sharp_activity.py
          git commit -m "style(sharp): format activity collector" || exit 0
          git push origin HEAD:fix/sharp-live-refresh-and-sleeper-activity
