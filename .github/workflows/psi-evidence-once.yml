name: PSI evidence finalization (temporary issue 1422)
on:
  push:
    branches: [codex/psi-design-reference]
    paths: [.github/workflows/psi-evidence-once.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: psi-gallery-1422
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'jasonleetucker-code/riskittogetthebrisket'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      ALLOW_DEFAULT_LOGIN_DEV: '1'
      UPTIME_CHECK_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 60
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Retrieve exact existing validation artifact and install pinned docs tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/psi-final-evidence
          gh api repos/jasonleetucker-code/riskittogetthebrisket/actions/artifacts/10817595460/zip > /tmp/psi-original-evidence.zip
          echo '22a9d0d46d0f317b96762c6a24c81725cba331b65e73a2bbe3846e268303a71e  /tmp/psi-original-evidence.zip' | sha256sum --check
          python -m pip install -r requirements-dev.txt
      - name: Claim evidence paths, preserve exact PNGs and update measured status only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'codex/psi-design-reference'
          git config user.name 'Calculator UI implementation'
          git config user.email 'noreply@users.noreply.github.com'
          git switch -c psi-evidence-finalization
          git fetch origin main:refs/remotes/origin/main --depth=60
          python - <<'PY'
          import hashlib, json, pathlib, struct, subprocess, zipfile
          root = pathlib.Path.cwd()
          prefix = 'docs/psi/evidence/PR_1429_2026-09-24/'
          sha = '49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('diff', '--name-only', sha, 'HEAD', '--', 'frontend/', 'tests/e2e/'):
              raise SystemExit('Tested frontend changed: rerun proof instead of recycling screenshots')
          if (root / prefix).exists():
              raise SystemExit('Evidence destination already exists; do not overwrite')
          # Recheck live PRs before taking this unique evidence directory.
          prs = json.loads(git('version').replace('git version', 'null') if False else subprocess.check_output(['gh','api','repos/jasonleetucker-code/riskittogetthebrisket/pulls?state=open&per_page=100'], text=True))
          if len(prs) >= 100:
              raise SystemExit('PR inventory requires further pagination')
          for pr in prs:
              if pr['head']['ref'] == 'codex/psi-design-reference':
                  continue
              output = subprocess.check_output(['gh','api','--paginate',f"repos/jasonleetucker-code/riskittogetthebrisket/pulls/{pr['number']}/files",'--jq','.[].filename'], text=True)
              if any(name.startswith(prefix) for name in output.splitlines()):
                  raise SystemExit(f"Evidence path claimed by PR {pr['number']}")
          claims = root / 'docs/WORK_CLAIMS.md'
          text = claims.read_text(encoding='utf-8')
          lines = text.splitlines()
          indexes = [i for i,line in enumerate(lines) if '| `codex/psi-design-reference` |' in line]
          if len(indexes) != 1:
              raise SystemExit('Ambiguous UI claim')
          i = indexes[0]
          lines[i] = lines[i].replace('bounded `docs/ui/` evidence and `docs/WORK_CLAIMS.md`', 'bounded `docs/ui/` evidence, `docs/psi/evidence/PR_1429_2026-09-24/`, and `docs/WORK_CLAIMS.md`')
          claims.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          git('add','docs/WORK_CLAIMS.md')
          git('commit','-m','chore(ui): reserve durable PR1429 screenshot evidence paths')
          dest = root / prefix
          dest.mkdir(parents=True)
          manifest = {'kind':'CI built-stack evidence, NOT production','code_sha':sha,'run_id':36021591253,'artifact_id':10817595460,'archive_sha256':'22a9d0d46d0f317b96762c6a24c81725cba331b65e73a2bbe3846e268303a71e','captured_utc_date':'2026-09-24','runtime_origin':'http://127.0.0.1:3100/design','images':[]}
          dirs = {
              'desktop': ('psi-gallery-PSI-gallery-po-86022--and-desktop-phone-evidence-desktop-1366','psi-gallery-PSI-gallery-ac-6d473--focus-under-reduced-motion-desktop-1366',1366,768),
              'phone': ('psi-gallery-PSI-gallery-po-86022--and-desktop-phone-evidence-mobile-chromium','psi-gallery-PSI-gallery-ac-6d473--focus-under-reduced-motion-mobile-chromium',390,844),
          }
          with zipfile.ZipFile('/tmp/psi-original-evidence.zip') as archive:
              if archive.read('implementation-head.txt').decode().strip() != sha:
                  raise SystemExit('Artifact code SHA mismatch')
              for viewport, (page_dir, overlay_dir, width, height) in dirs.items():
                  for state in ('reference-top','reference-full','table-secondary-fields','modal','drawer'):
                      directory = overlay_dir if state in {'modal','drawer'} else page_dir
                      source = f'screenshots/{directory}/{state}.png'
                      data = archive.read(source)
                      if data[:8] != b'\x89PNG\r\n\x1a\n':
                          raise SystemExit(f'Not PNG: {source}')
                      dimensions = struct.unpack('>II',data[16:24])
                      if dimensions[0] != width or (state != 'reference-full' and dimensions[1] != height):
                          raise SystemExit(f'Unexpected dimensions: {source}: {dimensions}')
                      name = f'{viewport}-{state}.png'
                      (dest/name).write_bytes(data)
                      manifest['images'].append({'file':name,'state':state,'viewport':{'width':width,'height':height},'image_dimensions':dimensions,'sha256':hashlib.sha256(data).hexdigest()})
              for name in ('bundle-delta.json','live-claim-audit.json'):
                  (dest/name).write_bytes(archive.read(name))
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          colors = ['#c98500','#3987e5','#d55181','#9085e9','#199e70','#d95926']
          def luminance(value):
              values = [int(value[i:i+2],16)/255 for i in (1,3,5)]
              values = [c/12.92 if c <= .04045 else ((c+.055)/1.055)**2.4 for c in values]
              return sum(c*w for c,w in zip(values,(.2126,.7152,.0722)))
          def contrast(a,b):
              x,y=sorted((luminance(a),luminance(b)))
              return (y+.05)/(x+.05)
          ratios=[{'token':f'--chart-{i+1}','color':color,'panel':contrast(color,'#faf6ec'),'nested':contrast(color,'#e9dfca')} for i,color in enumerate(colors)]
          (dest/'chart-contrast.json').write_text(json.dumps({'issue':1428,'method':'standard sRGB relative luminance; existing token values; no new palette','recorded_target':3.0,'ratios':ratios},indent=2)+'\n',encoding='utf-8')
          rows='\n'.join(f"| {r['token']} | {r['color']} | {r['panel']:.2f}:1 | {r['nested']:.2f}:1 |" for r in ratios)
          images='\n'.join(f"| {state} | [desktop](desktop-{state}.png) | [phone](phone-{state}.png) |" for state in ('reference-top','reference-full','table-secondary-fields','modal','drawer'))
          readme=f'''# PR #1429 — PSI gallery evidence, 2026-09-24

          **Code tested:** `{sha}`. **Run:** 36021591253.
          **Origin:** built local CI stack, `http://127.0.0.1:3100/design`, NOT production.
          The evidence-only follow-up commit does not change tested frontend or E2E code.
          Source artifact 10817595460 is checksummed in manifest.json. The ten exact PNGs
          are preserved here so the evidence does not disappear when the artifact expires.
          This is manual screenshot review plus automated behavior testing, not an approved
          pixel-golden comparison or owner sign-off. Not deployed / PSI_VERIFIED / legacy-retired.

          ## Exact validation

          | Gate | Actual result |
          |---|---|
          | Frontend Vitest | 168 files; 2,483 tests passed, including four gallery tests |
          | Build / bundle | production build and all 14 existing route budgets passed |
          | Own gallery JS chunk | 27,690 -> 28,881 bytes; +1,191 bytes; not total shared first-load JS |
          | Desktop 1366x768 / phone 390x844 | four real-stack E2E passed, zero skipped; retries disabled |
          | Axe | six populated/modal/drawer scans passed, WCAG A/AA; not a full chart-contrast certificate |
          | Keyboard / responsive | opening/closure/focus restoration, reduced motion, table sort/density/detail access, one main and no document overflow passed |
          | Page exceptions | no pageerror exceptions in the tested flows; not a claim of zero all-console/harness warnings |
          | Governance | planning, product-plan, claim check, L0; docs 88 tests and 43 subtests passed |
          | Production | not deployed, not measured, not verified |

          Current commands were `npm --prefix frontend test`, `npm --prefix frontend run build`,
          `npm run regression:preflight`, and `npx playwright test --config tests/e2e/playwright.config.js
          tests/e2e/specs/psi-gallery.spec.js --project=desktop-1366 --project=mobile-chromium --retries=0`.
          Focused coverage floor was four passes/zero skips; full-suite reporters and guards unchanged.
          No separate frontend lint script existed. Logs remain in the original Actions artifact;
          background harness startup/metadata warnings were not hidden or counted as production proof.

          ## Screenshots reviewed

          | State | Desktop | Phone |
          |---|---|---|
          {images}

          Inspection confirms editorial gallery scope and hierarchy, readable fixture/state labels,
          accessible table detail, phone-safe modal and player-name/chart drawer layout. Full-page
          and viewport/interaction captures complement each other; a full-page image alone cannot
          certify sticky chrome behavior. Existing dark outer canvas and legacy Screenshot FAB
          remain visible outside this bounded gallery claim. Record these as shell convergence
          debt; do not silently restyle high-conflict shared files.

          ## Specific remaining visual decision — #1428

          **OWNER UI DECISION REQUIRED** for categorical chart treatment unless an existing
          approved compliant reference is established. The legacy fixed palette's recorded >=3:1
          validation was on a dark panel, not every cream surface. Standard sRGB calculations:

          | Token | Current value | PSI panel | PSI nested / alternate |
          |---|---|---:|---:|
          {rows}

          The actual amber drawer/table Sparkline illustrates the gap; axe does not clear it.
          No colors, movement semantics, contrast threshold or design authority were changed.
          Resolve only this decision under the owner/approved-reference hierarchy, with token-owner
          and shared-primitive claims where needed. No gallery shipping/PSI completion claim yet.

          ## Integration and continuous UI

          Parent governance PR #1426; separate UI PR #1429 remains draft. #1428 blocks only the
          affected chart acceptance, not Lane 6. Next safe work is populated Rankings/Player File
          accessibility/visual test coverage with checked disjoint test paths, alongside existing
          performance/consumer work. Recheck current main/PR files/claims before dispatch.
          Final production acceptance still requires real deployed desktop/phone flows, auth,
          data/loading/error/focus/console/performance and owner-review evidence.
          '''
          # Keep generated Markdown readable without changing preserved source text.
          readme='\n'.join(line[10:] if line.startswith('          ') else line for line in readme.splitlines()).strip()+'\n'
          (dest/'README.md').write_text(readme,encoding='utf-8')
          ledger=root/'docs/ui/UI_PARALLEL_LEDGER.md'
          text=ledger.read_text(encoding='utf-8')
          lines=text.splitlines()
          indexes=[i for i,line in enumerate(lines) if line.startswith('| `/design` |')]
          if len(indexes)!=1: raise SystemExit('Ambiguous gallery ledger row')
          lines[indexes[0]]='| `/design` | C8-U2/U3 | Static gallery / ds/token-contract.js; no private API | STABLE foundation; chart acceptance #1428 | MIGRATING — code and CI proof; not shipping-certified | 1366x768 tests/screens reviewed | 390x844 tests/screens reviewed | Six axe scans and keyboard passed; manual chart contrast #1428 OPEN | Build/budgets PASS; own JS +1,191 B; production NM | Gallery terminal copy retired; outer shell/FAB debt remains | Ten CI PNGs in docs/psi/evidence/PR_1429_2026-09-24; NO production proof | #1422 / draft PR #1429; checkpoint captured | Parent #1426; bounded chart decision #1428 | Resolve only chart authority; continue other safe UI reference tests |'
          text='\n'.join(lines)+'\n'
          text=text.replace('reference unit. Tests and visual evidence are separate gates; this is not deployment.', 'reference unit, now draft PR #1429 with measured CI evidence. #1428 holds only chart-treatment acceptance; no deployment or continuously running worker is claimed.')
          text+='\n## Measured checkpoint — PR #1429\n\nCode `49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121`; actual proof and limitations in\n`docs/psi/evidence/PR_1429_2026-09-24/README.md`. Axe green does not close #1428.\nThe next safe UI unit remains populated Rankings/Player File test coverage after\nlive claim checks; no whole-program blocker or route-completion promotion.\n'
          ledger.write_text(text,encoding='utf-8')
          handoff=root/'docs/ui/PSI_DESIGN_REFERENCE_HANDOFF.md'
          text=handoff.read_text(encoding='utf-8')
          marker='## Copyable prompt'
          assert marker in text
          checkpoint='''## Current checkpoint — implementation exists, do not redo it

          PR #1429 is a separate draft stacked on governance #1426. Runtime code tested at
          49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121: 2,483 Vitest, build/14 budgets, four E2E,
          six axe states, keyboard/responsive checks passed. Ten reviewed CI images and
          bundle +1,191-byte measurement are in docs/psi/evidence/PR_1429_2026-09-24/README.md.
          They are not production proof. Current blocker is only #1428's inherited categorical
          chart contrast on cream; do not invent palette/plot treatment or weaken contrast.
          Reuse an evidenced approved solution or obtain the explicit bounded owner decision.
          Shared shell outer-canvas/Screenshot-FAB debt needs its own claim. Continue safe
          populated Rankings/Player File reference test work while that decision waits.
          The original prompt below is historical scope; first inspect the implemented diff
          and resume only remaining acceptance. No background worker is implied by the branch.

          '''
          checkpoint='\n'.join(line[10:] if line.startswith('          ') else line for line in checkpoint.splitlines())
          handoff.write_text(text.replace(marker,checkpoint+'\n'+marker,1),encoding='utf-8')
          lines=claims.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if '| `codex/psi-design-reference` |' in line:
                  before,_=line.rsplit(' | ',1)
                  lines[i]=before+' | checkpoint — code/CI/visual evidence recorded in draft PR #1429; #1428 blocks only chart acceptance. No continuously running worker or deployed acceptance claimed. Agent-OS-Receipt: cdca1dca8385f70c0989302dece8d1bd4ce4843c |'
          claims.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/psi-evidence-once.yml
          git add docs/WORK_CLAIMS.md docs/ui/UI_PARALLEL_LEDGER.md docs/ui/PSI_DESIGN_REFERENCE_HANDOFF.md docs/psi/evidence/PR_1429_2026-09-24/
          git diff --cached --check
          git commit -m 'docs(ui): preserve desktop-phone proof and explicit chart acceptance gap (#1429)'
      - name: Validate evidence-only final tree and push only this UI branch
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            python scripts/agent_os_receipt.py
            python scripts/check_planning_integrity.py
            python scripts/check_product_plan_governance.py
            python -m pytest tests/docs -q
            bash scripts/tiered_validate.sh l0
            git diff --exit-code 49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121 HEAD -- frontend/ tests/e2e/
            git diff --check 49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121 HEAD
          } 2>&1 | tee /tmp/psi-final-evidence/validation.log
          git rev-parse HEAD | tee /tmp/psi-final-evidence/final-head.txt
          git diff --stat 49e7fcfd824ba3f2c7432a818d2f7f5fbc2d8121 HEAD > /tmp/psi-final-evidence/stat.txt
          git push origin HEAD:refs/heads/codex/psi-design-reference
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-evidence-finalization-result
          path: /tmp/psi-final-evidence/
          retention-days: 7
          if-no-files-found: warn
