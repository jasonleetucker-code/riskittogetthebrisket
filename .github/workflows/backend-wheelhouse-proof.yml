name: Backend Wheelhouse Proof

on:
  pull_request:
    paths:
      - '.github/workflows/backend-wheelhouse-proof.yml'
      - 'scripts/backend_wheelhouse.py'
      - 'tests/scripts/test_backend_wheelhouse.py'
      - 'requirements.lock.txt'
      - 'requirements-dev.lock.txt'

permissions:
  contents: read

concurrency:
  group: backend-wheelhouse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove-linux-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify lock and artifact logic
        run: |
          set -Eeuo pipefail
          python scripts/python_lock.py check
      - name: Download exact Linux wheels and test an offline install
        run: |
          set -Eeuo pipefail
          python -m pip download --require-hashes --only-binary=:all: \
            -r requirements-dev.lock.txt --dest backend-wheels
          python -m venv /tmp/calculator-wheelhouse-venv
          /tmp/calculator-wheelhouse-venv/bin/python -m pip install \
            --no-index --find-links backend-wheels --require-hashes \
            -r requirements-dev.lock.txt
          /tmp/calculator-wheelhouse-venv/bin/python -m pip check
          /tmp/calculator-wheelhouse-venv/bin/python -m pytest -q \
            tests/scripts/test_backend_wheelhouse.py
      - name: Bind wheel bytes to the tested lock and runtime
        run: |
          set -Eeuo pipefail
          python scripts/backend_wheelhouse.py create \
            --wheel-dir backend-wheels --lock requirements-dev.lock.txt \
            --manifest backend-wheelhouse-manifest.json
          python scripts/backend_wheelhouse.py verify \
            --wheel-dir backend-wheels --lock requirements-dev.lock.txt \
            --manifest backend-wheelhouse-manifest.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf calculator-backend-wheels.tar \
            backend-wheelhouse-manifest.json requirements-dev.lock.txt backend-wheels
          sha256sum calculator-backend-wheels.tar > calculator-backend-wheels.tar.sha256
          sha256sum -c calculator-backend-wheels.tar.sha256
          du -h calculator-backend-wheels.tar
      - name: Upload measured backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-backend-wheels-${{ github.event.pull_request.head.sha }}
          path: |
            calculator-backend-wheels.tar
            calculator-backend-wheels.tar.sha256
          compression-level: 0
          if-no-files-found: error
