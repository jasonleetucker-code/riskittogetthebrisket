name: Intel Refresh

# Daily crawl of the league-mate pool's Sleeper activity ("Sharp
# Tracker", Phase 5).  Triggers POST /api/intel/refresh?leagueKey=all
# on the production host — the server iterates EVERY active registry
# league sequentially under its single crawl lock (a bearer request
# has no user session, so without the explicit all-mode the resolver
# would fall back to the default league and non-default leagues would
# never get a snapshot).  Then polls GET /api/intel/refresh/status
# until the run finishes or ~12 minutes elapse (each league's crawl
# is budgeted separately, so multi-league runs take longer).
#
# Auth: the intel refresh + status endpoints accept a bearer token —
# ``INTEL_REFRESH_TOKEN`` (falling back server-side to
# ``SIGNAL_ALERT_CRON_TOKEN``).  Store the same value as the
# ``INTEL_REFRESH_TOKEN`` repo secret.
#
# On failure this opens/updates an idempotent tracking issue labeled
# ``intel-stale`` (same rolling-issue pattern as the scheduled-refresh
# workflow's ``stale-sources`` handler).

on:
  schedule:
    # Daily at 09:10 UTC — after the overnight data refresh cycles,
    # before US morning traffic.
    - cron: "10 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: intel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Resolve target URL
        id: url
        shell: bash
        run: |
          set -Eeuo pipefail
          # NO hardcoded fallback.  This step sends a bearer token, and
          # a baked-in default silently kept pointing at a domain the
          # project no longer owns — every daily run shipped
          # INTEL_REFRESH_TOKEN to a third party until it was caught.
          # Fail loudly instead: an unset PROD_PUBLIC_URL is an outage,
          # not something to paper over with a guess.
          URL="${{ vars.PROD_PUBLIC_URL }}"
          if [[ -z "${URL}" ]]; then
            echo "::error title=PROD_PUBLIC_URL not set::Refusing to send a bearer token to a guessed host. Set the PROD_PUBLIC_URL repository variable to the production origin."
            exit 1
          fi
          URL="${URL%/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Trigger intel refresh
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
          TOKEN: ${{ secrets.INTEL_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TOKEN}" ]]; then
            echo "::error title=Missing secret::INTEL_REFRESH_TOKEN is not set"
            exit 1
          fi
          # 202 = our all-league run started.  409 = some run is
          # already active — but ONLY adopt it if that run is itself
          # the all-league mode.  A session-triggered SINGLE-league
          # refresh holding the lock must not count as success: its
          # completion would leave every other partition stale for a
          # day.  In that case wait and retry the all-league POST
          # (bounded — ~5 minutes of retries before giving up).
          started=""
          for attempt in $(seq 1 10); do
            body_file="$(mktemp)"
            code="$(curl --silent --show-error --globoff --max-time 30 \
              --request POST \
              --header "Authorization: Bearer ${TOKEN}" \
              --output "${body_file}" --write-out '%{http_code}' \
              "${URL}/api/intel/refresh?leagueKey=all" || echo 000)"
            echo "trigger attempt ${attempt}: status=${code}"
            cat "${body_file}" || true
            if [[ "${code}" == "202" ]]; then
              started=1
              break
            fi
            if [[ "${code}" == "409" ]]; then
              active="$(python3 - "${body_file}" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], "r", encoding="utf-8") as f:
                  d = json.load(f)
          except Exception:
              d = {}
          print(((d.get("status") or {}).get("leagueKey")) or "")
          PY
              )"
              if [[ "${active}" == "all" ]]; then
                echo "An all-league refresh is already running — adopting it."
                started=1
                break
              fi
              echo "Single-league refresh (${active:-unknown}) holds the lock — waiting 30s to retry the all-league trigger."
              sleep 30
              continue
            fi
            if [[ "${code}" == "401" ]]; then
              # Auth failure is a CONFIGURATION problem, not a retry
              # candidate.  The endpoint accepts
              # ``Authorization: Bearer <INTEL_REFRESH_TOKEN>`` where
              # the server reads INTEL_REFRESH_TOKEN (falling back to
              # SIGNAL_ALERT_CRON_TOKEN) from the .env loaded by the
              # dynasty systemd unit.  Check, in order:
              #   1. the INTEL_REFRESH_TOKEN repo secret matches the
              #      VPS value byte-for-byte (no trailing newline);
              #   2. the VPS .env line is plain KEY=value (systemd
              #      EnvironmentFile ignores ``export KEY=...``);
              #   3. the dynasty service restarted after the .env
              #      edit (the token is read at process start);
              #   4. the backend journal — the server logs WHICH
              #      branch failed (no token configured vs mismatch).
              echo "::error title=Intel refresh auth failed::HTTP 401 from ${URL}/api/intel/refresh — token mismatch or server-side token not configured; see step log for the checklist"
              exit 1
            fi
            echo "::error title=Intel refresh trigger failed::HTTP ${code} from ${URL}/api/intel/refresh"
            exit 1
          done
          if [[ -z "${started}" ]]; then
            echo "::error title=Intel refresh trigger failed::Another (non-all) run kept the lock through every retry"
            exit 1
          fi

      - name: Poll refresh status
        shell: bash
        env:
          URL: ${{ steps.url.outputs.url }}
          TOKEN: ${{ secrets.INTEL_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          # ~12 minutes of polling: 48 attempts x 15s (all-leagues
          # mode crawls each active league with its own budget).
          for attempt in $(seq 1 48); do
            sleep 15
            body_file="$(mktemp)"
            code="$(curl --silent --show-error --globoff --max-time 20 \
              --header "Authorization: Bearer ${TOKEN}" \
              --output "${body_file}" --write-out '%{http_code}' \
              "${URL}/api/intel/refresh/status" || echo 000)"
            if [[ "${code}" != "200" ]]; then
              echo "attempt ${attempt}: status endpoint HTTP ${code} — retrying"
              continue
            fi
            if python3 - "${body_file}" <<'PY'; then
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              d = json.load(f)
          running = bool(d.get("isRunning"))
          err = d.get("lastError")
          result = d.get("lastResult") or {}
          if running:
              print(f"still running (started {d.get('startedAt')})")
              raise SystemExit(2)   # keep polling
          if err:
              print(f"refresh finished with error: {err}")
              raise SystemExit(1)   # hard fail
          if not result:
              print("no run recorded yet")
              raise SystemExit(2)   # keep polling
          if result.get("mode") != "all":
              # The latest completed run is a SINGLE-league refresh
              # (e.g. session-triggered) — NOT the all-league run this
              # cron is responsible for.  Accepting it would leave the
              # other partitions stale, so keep waiting for ours.
              print("latest completed run is not the all-league run — waiting for ours")
              raise SystemExit(2)   # keep polling
          # Multi-league run: one summary per refreshed league.
          for lg in result.get("leagues") or []:
              print(
                  "refresh OK [{}]: calls={} events+={} members={} leagues={} exhausted={}".format(
                      lg.get("leagueKey"),
                      lg.get("callsUsed"),
                      lg.get("newEventCount"),
                      lg.get("memberCount"),
                      lg.get("leagueCount"),
                      lg.get("budgetExhausted"),
                  )
              )
          bad = result.get("errors") or []
          if bad:
              print(f"per-league failures: {bad}")
              raise SystemExit(1)
          raise SystemExit(0)
          PY
              echo "Intel refresh completed successfully."
              exit 0
            else
              rc=$?
              if [[ "${rc}" == "1" ]]; then
                echo "::error title=Intel refresh failed::See status output above"
                exit 1
              fi
              # rc 2 → still running / not started; keep polling.
            fi
          done
          echo "::error title=Intel refresh timed out::Still running after ~12 minutes of polling"
          exit 1

      - name: Alert on workflow failure
        # Idempotent tracking issue (mirrors scheduled-refresh.yml's
        # ``stale-sources`` handler): ensure the label exists, comment
        # on the existing open ``intel-stale`` issue when there is
        # one, otherwise open a single labeled issue.
        #
        # GH_REPO is REQUIRED: this workflow never checks out the
        # repository (it only curls the prod host), so without it the
        # gh CLI tries to infer the repo from git and dies with
        # "fatal: not a git repository" — which is exactly how the
        # first live failure lost its tracking issue.
        #
        # Mainline only — see the long note on the same guard in e2e.yml
        # (#716); workflow_dispatch is this workflow's only non-main path.
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          Daily intel refresh (Sharp Tracker crawl) failed.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Triggered: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Likely causes:
          1. The trigger call failed (backend down, INTEL_REFRESH_TOKEN
             secret missing/rotated — check the **Trigger intel refresh** step).
          2. The crawl errored server-side (see \`lastError\` in the
             **Poll refresh status** step output).
          3. The crawl ran past the ~12 minute polling window (budget
             exhaustion resumes next run — repeated timeouts mean the
             pool outgrew the call budget).

          The cron retries automatically tomorrow.  For an immediate
          retry use ``workflow_dispatch``.
          EOF
          )
          gh label create intel-stale \
            --color B60205 \
            --description "Auto-opened when the daily intel refresh fails" \
            2>/dev/null || true
          EXISTING=$(gh issue list --state open --label intel-stale \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Daily intel refresh failing" \
              --body "$BODY" \
              --label intel-stale
          fi

      - name: Close the tracking issue when the run is green
        # The missing half of the pattern copied from
        # scheduled-refresh.yml, which opens AND closes.  Without this an
        # open `intel-stale` issue means "this failed at least once, ever"
        # rather than "this is broken now" — #663 sat open for hours after
        # its gate went green because of exactly this gap.
        #
        # Mainline only, for the reason in e2e.yml: a green dispatch from a
        # branch would close a real open mainline issue.
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Close EVERY open one: the alert step reads `.[0].number`, so
          # duplicates would otherwise be orphaned forever.
          OPEN=$(gh issue list --state open --label intel-stale \
                   --json number --jq '.[].number' 2>/dev/null || echo "")
          if [[ -z "$OPEN" ]]; then
            echo "no open intel-stale issue; nothing to close"
            exit 0
          fi
          for N in $OPEN; do
            echo "closing #${N}"
            gh issue close "$N" --reason completed --comment \
              "Daily intel refresh is green again — the intel artifacts rebuilt cleanly.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Closed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Reopened automatically by the alert step if it fails again." || true
          done
