name: V1-61 Production Stage Profile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v1-61-production-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-61-production-profile
  cancel-in-progress: false

jobs:
  profile:
    name: Profile canonical Sharp roster percentage on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
      VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Prepare pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing production SSH configuration::${name} is empty or unset."; exit 1; }
          done
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]] || { echo "::error title=Invalid SSH port::DEPLOY_PORT must be numeric."; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          if [[ "${DEPLOY_PORT}" == "22" ]]; then lookup="${DEPLOY_HOST}"; else lookup="[${DEPLOY_HOST}]:${DEPLOY_PORT}"; fi
          ssh-keygen -F "${lookup}" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1 || { echo "::error title=Host key mismatch::No pinned known_hosts entry for production target."; exit 1; }

      - name: Run read-only V1-61 stage profiler on production
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          PORT="${DEPLOY_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${PORT}" \
            "${TARGET}" \
            "APP_DIR='${APP_DIR}' VENV_DIR='${VENV_DIR}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "${APP_DIR}"
          echo "productionHead=$(git rev-parse HEAD)"
          [[ -f scripts/profile_sharp_roster_percentage.py ]] || { echo "profileStatus=missing_profiler"; exit 41; }
          [[ -x "${VENV_DIR}/bin/python" ]] || { echo "profileStatus=missing_venv_python"; exit 42; }

          set +e
          "${VENV_DIR}/bin/python" scripts/profile_sharp_roster_percentage.py --timeout-seconds 300 2>&1 | tee /tmp/v1-61-production-profile.json
          rc=${PIPESTATUS[0]}
          set -e
          echo "profilerExit=${rc}"

          # Exit 2 is the profiler's explicit, truthful timeout result.  It is
          # diagnostic evidence, not an infrastructure failure, so preserve it
          # in the log without turning the workflow into a false-red. Any other
          # nonzero exit means the profiler itself failed to execute correctly.
          if [[ "${rc}" -eq 0 ]]; then
            echo "profileStatus=completed"
            exit 0
          elif [[ "${rc}" -eq 2 ]]; then
            echo "profileStatus=timed_out_truthfully"
            exit 0
          fi
          echo "profileStatus=execution_error"
          exit "${rc}"
          REMOTE
