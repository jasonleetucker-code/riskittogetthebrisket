name: Verify Sharp Production Population

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/ops/sharp-production-smoke.json"
      - "data/**"
      - "exports/**"
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sharp-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for deploy and Sharp population, then capture coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'pending' }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path("data/ops/sharp-production-smoke.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          base = "https://chaseupside.com"
          event_name = os.environ.get("EVENT_NAME", "")
          deploy_conclusion = os.environ.get("DEPLOY_CONCLUSION", "pending")
          deploy_sha = os.environ.get("DEPLOY_HEAD_SHA", "")
          deploy_run = os.environ.get("DEPLOY_RUN_ID", "")

          class Unauthenticated(Exception):
              """The endpoint answered, and told us we may not look.

              AUDIT O-4. ``/api/sharp/*`` sits behind the session-cookie
              gate in ``server.py::_private_api_gate`` and this workflow
              holds no credential — it has no ``secrets`` at all. So every
              request returns 401, the bare ``except Exception`` below
              filed it as a retryable blip, and the loop spent its full
              80 attempts x 30s = 40 MINUTES before giving up. On every
              push to main. Measured: 80/80 attempts 401, 79 runs.

              A 401 is not a transient error. It is a definitive answer:
              the service is up and correctly refusing an anonymous
              caller. Retrying it is guaranteed to waste the same 40
              minutes, and reporting it as a timeout hides a credential
              problem behind what looks like a slow deploy.
              """

          def fetch_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "ChaseUpside-Production-Smoke/1.0",
                      "Cache-Control": "no-cache",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if exc.code in (401, 403):
                      raise Unauthenticated(f"{exc.code} from {url}") from exc
                  raise

          result = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "eventName": event_name,
              "deployConclusion": deploy_conclusion,
              "deployRunId": deploy_run,
              "deployHeadSha": deploy_sha,
              "status": "waiting",
              "attempts": 0,
              "cohort": {},
              "ffpcMarket": {},
              "errors": [],
          }

          if event_name == "workflow_run" and deploy_conclusion != "success":
              result["status"] = "deploy_failed"
          else:
              # A push-triggered smoke starts alongside deployment. A workflow-run
              # smoke starts after deployment. Both allow up to 40 minutes for the
              # deploy plus the initial background Sleeper/FFPC collection.
              for attempt in range(1, 81):
                  result["attempts"] = attempt
                  try:
                      cohort_status, cohort = fetch_json(f"{base}/api/sharp/cohort")
                      market_status, market = fetch_json(
                          f"{base}/api/sharp/market?window=90d&platform=ffpc&qualification=provisional&limit=100"
                      )
                      cohort_stats = cohort.get("cohort") or {}
                      records = ((cohort.get("coverage") or {}).get("records") or {})
                      market_cohort = market.get("cohort") or {}
                      assets = market.get("assets") or []
                      ffpc_coverage = (
                          ((market.get("coverage") or {}).get("platforms") or {}).get("ffpc")
                          or {}
                      )
                      result["cohort"] = {
                          "httpStatus": cohort_status,
                          "status": cohort.get("status"),
                          "observableManagers": cohort_stats.get("observableManagers", 0),
                          "evaluableManagers": cohort_stats.get("evaluableManagers", 0),
                          "qualifiedManagers": cohort_stats.get("qualifiedManagers", 0),
                          "provisionalManagers": cohort_stats.get("provisionalManagers", 0),
                          "managersWithRecords": records.get("managersWithRecords", 0),
                          "seasonRows": records.get("seasonRows", 0),
                      }
                      result["ffpcMarket"] = {
                          "httpStatus": market_status,
                          "status": market.get("status"),
                          "assetRows": len(assets),
                          "provisionalManagers": market_cohort.get("provisionalManagers", 0),
                          "transactions": ffpc_coverage.get("transactions", 0),
                          "movements": ffpc_coverage.get("movements", 0),
                          "unmappedAssets": (market.get("dataQuality") or {}).get(
                              "unmappedAssets", 0
                          ),
                          "sampleAssets": [
                              {
                                  "assetId": row.get("assetId"),
                                  "displayName": row.get("displayName"),
                                  "sourceLabels": row.get("sourceLabels"),
                              }
                              for row in assets[:5]
                          ],
                      }
                      sleeper_started = int(records.get("managersWithRecords") or 0) > 0
                      ffpc_started = (
                          len(assets) > 0
                          and int(market_cohort.get("provisionalManagers") or 0) > 0
                      )
                      if sleeper_started and ffpc_started:
                          result["status"] = "healthy"
                          break
                      result["status"] = "population_in_progress"
                  except Unauthenticated as exc:
                      # Terminal, not transient. Say what is actually
                      # wrong — the check has no credential — instead of
                      # burning 40 minutes to report a timeout.
                      result["status"] = "unverifiable_unauthenticated"
                      result["errors"].append(
                          {"attempt": attempt, "type": "Unauthenticated", "message": str(exc)}
                      )
                      break
                  except Exception as exc:  # noqa: BLE001
                      result["errors"].append(
                          {
                              "attempt": attempt,
                              "type": type(exc).__name__,
                              "message": str(exc),
                          }
                      )
                      result["errors"] = result["errors"][-10:]
                      result["status"] = "endpoint_retry"
                  if attempt < 80:
                      time.sleep(30)
              else:
                  result["status"] = "degraded_timeout"

          result["checkedAt"] = datetime.now(timezone.utc).isoformat()
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit production smoke result
        # AUDIT O-4: ``git add`` without ``-f`` on a path under the
        # gitignored ``data/`` (.gitignore:45) fails, and it failed
        # BEFORE the enforce gate below — which is why that gate had
        # never executed once. The artifact is force-added the same way
        # scheduled-refresh.yml force-adds data/scrape_state/.
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add -f data/ops/sharp-production-smoke.json
          # A byte-identical result is not an error; only commit a change.
          if git diff --cached --quiet; then
            echo "No change in smoke result — nothing to commit."
          else
            git commit -m "chore(ops): record Sharp production smoke"
            git push origin HEAD:main
          fi

      - name: Enforce healthy population
        # This step had never run: the commit above always failed first.
        # Now that it can run, it must distinguish "measured unhealthy"
        # from "could not measure" — reporting the second as the first
        # would fail every push to main for a credential this workflow
        # was never given, and a gate that cries wolf gets deleted.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("data/ops/sharp-production-smoke.json").read_text())
          status = result.get("status")

          if status == "healthy":
              print("Sharp production population is healthy.")
              raise SystemExit(0)

          if status == "unverifiable_unauthenticated":
              # Insufficient evidence. Loud, not fatal, and specific
              # about what would make it a real check.
              print(
                  "::warning title=Sharp smoke cannot verify::"
                  "/api/sharp/* requires a session and this workflow holds no "
                  "credential, so population health was NOT measured. Provision a "
                  "token for the smoke (see _SELF_AUTHED_API_EXACT in server.py for "
                  "the bearer pattern used by /api/signal-alerts/run) to turn this "
                  "into an enforcing gate."
              )
              raise SystemExit(0)

          raise SystemExit(f"Sharp production smoke is not healthy: {status}")
          PY
