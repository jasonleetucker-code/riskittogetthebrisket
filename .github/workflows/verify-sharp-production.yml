name: Verify Sharp Production Population

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/ops/sharp-production-smoke.json"
      - "data/**"
      - "exports/**"
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]

permissions:
  contents: write
  # The gate cannot measure production and has not been able to for its
  # whole recorded history.  A ``::warning`` once per run, into a log
  # nobody reads, is not loud — so the finding goes where the repository
  # already puts findings CI cannot act on itself.
  issues: write

concurrency:
  group: sharp-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Wait for deploy and Sharp population, then capture coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'pending' }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Bearer token for GET /api/sharp/cohort and GET /api/sharp/market
          # (server.py's _SELF_AUTHED_API_EXACT + src.sharp.service's
          # SHARP_SMOKE_TOKEN check — same pattern INTEL_REFRESH_TOKEN uses
          # in intel-refresh.yml). Unset secret = empty string = the
          # workflow's original behavior (anonymous request, 401,
          # unverifiable_unauthenticated) is unchanged.
          SHARP_SMOKE_TOKEN: ${{ secrets.SHARP_SMOKE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path("data/ops/sharp-production-smoke.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          base = "https://chaseupside.com"
          event_name = os.environ.get("EVENT_NAME", "")
          deploy_conclusion = os.environ.get("DEPLOY_CONCLUSION", "pending")
          deploy_sha = os.environ.get("DEPLOY_HEAD_SHA", "")
          deploy_run = os.environ.get("DEPLOY_RUN_ID", "")

          class Unauthenticated(Exception):
              """The endpoint answered, and told us we may not look.

              AUDIT O-4. ``/api/sharp/*`` sits behind the session-cookie
              gate in ``server.py::_private_api_gate`` and this workflow
              holds no credential — it has no ``secrets`` at all. So every
              request returns 401, the bare ``except Exception`` below
              filed it as a retryable blip, and the loop spent its full
              80 attempts x 30s = 40 MINUTES before giving up. On every
              push to main. Measured: 80/80 attempts 401, 79 runs.

              A 401 is not a transient error. It is a definitive answer:
              the service is up and correctly refusing an anonymous
              caller. Retrying it is guaranteed to waste the same 40
              minutes, and reporting it as a timeout hides a credential
              problem behind what looks like a slow deploy.
              """

          smoke_token = os.environ.get("SHARP_SMOKE_TOKEN", "").strip()

          def fetch_json(url):
              headers = {
                  "User-Agent": "ChaseUpside-Production-Smoke/1.0",
                  "Cache-Control": "no-cache",
              }
              if smoke_token:
                  headers["Authorization"] = f"Bearer {smoke_token}"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  if exc.code in (401, 403):
                      raise Unauthenticated(f"{exc.code} from {url}") from exc
                  raise

          result = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "eventName": event_name,
              "deployConclusion": deploy_conclusion,
              "deployRunId": deploy_run,
              "deployHeadSha": deploy_sha,
              # Whether a credential was PRESENTED, not whether it worked.  A
              # 401 reads the same either way; this is what separates "the
              # owner has not provisioned it" from "provisioned and refused".
              "tokenProvisioned": bool(smoke_token),
              "status": "waiting",
              "attempts": 0,
              "cohort": {},
              "ffpcMarket": {},
              "errors": [],
          }

          # Classify the DEPLOY outcome before deciding whether production
          # health is even a question.  `!= "success"` used to collapse four
          # distinct outcomes into `deploy_failed`, and the one it got most
          # wrong is `cancelled`: that is the NORMAL outcome when the
          # concurrency group supersedes a run, which happens on every
          # merge that lands while an earlier deploy is still going.  The
          # superseding deploy usually succeeds moments later, so the
          # record was asserting a production failure about a deploy that
          # shipped fine.  Superseded is not failed, and neither is
          # unmeasured.
          #
          # A cancelled or skipped deploy yields NO production-health
          # verdict at all — the correct answer is "we did not measure",
          # not a verdict in either direction.  Real failures keep their
          # teeth.
          if event_name == "workflow_run" and deploy_conclusion == "cancelled":
              result["status"] = "deploy_superseded"
          elif event_name == "workflow_run" and deploy_conclusion in ("skipped", "", "pending", None):
              result["status"] = "deploy_unmeasured"
          elif event_name == "workflow_run" and deploy_conclusion != "success":
              result["status"] = "deploy_failed"
          else:
              # A push-triggered smoke starts alongside deployment. A workflow-run
              # smoke starts after deployment. Both allow up to 40 minutes for the
              # deploy plus the initial background Sleeper/FFPC collection.
              for attempt in range(1, 81):
                  result["attempts"] = attempt
                  try:
                      cohort_status, cohort = fetch_json(f"{base}/api/sharp/cohort")
                      market_status, market = fetch_json(
                          f"{base}/api/sharp/market?window=90d&platform=ffpc&qualification=provisional&limit=100"
                      )
                      cohort_stats = cohort.get("cohort") or {}
                      records = ((cohort.get("coverage") or {}).get("records") or {})
                      market_cohort = market.get("cohort") or {}
                      assets = market.get("assets") or []
                      ffpc_coverage = (
                          ((market.get("coverage") or {}).get("platforms") or {}).get("ffpc")
                          or {}
                      )
                      result["cohort"] = {
                          "httpStatus": cohort_status,
                          "status": cohort.get("status"),
                          "observableManagers": cohort_stats.get("observableManagers", 0),
                          "evaluableManagers": cohort_stats.get("evaluableManagers", 0),
                          "qualifiedManagers": cohort_stats.get("qualifiedManagers", 0),
                          "provisionalManagers": cohort_stats.get("provisionalManagers", 0),
                          "managersWithRecords": records.get("managersWithRecords", 0),
                          "seasonRows": records.get("seasonRows", 0),
                      }
                      result["ffpcMarket"] = {
                          "httpStatus": market_status,
                          "status": market.get("status"),
                          "assetRows": len(assets),
                          "provisionalManagers": market_cohort.get("provisionalManagers", 0),
                          "transactions": ffpc_coverage.get("transactions", 0),
                          "movements": ffpc_coverage.get("movements", 0),
                          "unmappedAssets": (market.get("dataQuality") or {}).get(
                              "unmappedAssets", 0
                          ),
                          "sampleAssets": [
                              {
                                  "assetId": row.get("assetId"),
                                  "displayName": row.get("displayName"),
                                  "sourceLabels": row.get("sourceLabels"),
                              }
                              for row in assets[:5]
                          ],
                      }
                      sleeper_started = int(records.get("managersWithRecords") or 0) > 0
                      ffpc_started = (
                          len(assets) > 0
                          and int(market_cohort.get("provisionalManagers") or 0) > 0
                      )
                      if sleeper_started and ffpc_started:
                          result["status"] = "healthy"
                          break
                      result["status"] = "population_in_progress"
                  except Unauthenticated as exc:
                      # Terminal, not transient. Say what is actually
                      # wrong — the check has no credential — instead of
                      # burning 40 minutes to report a timeout.
                      result["status"] = "unverifiable_unauthenticated"
                      result["errors"].append(
                          {"attempt": attempt, "type": "Unauthenticated", "message": str(exc)}
                      )
                      break
                  except Exception as exc:  # noqa: BLE001
                      result["errors"].append(
                          {
                              "attempt": attempt,
                              "type": type(exc).__name__,
                              "message": str(exc),
                          }
                      )
                      result["errors"] = result["errors"][-10:]
                      result["status"] = "endpoint_retry"
                  if attempt < 80:
                      time.sleep(30)
              else:
                  result["status"] = "degraded_timeout"

          now = datetime.now(timezone.utc)
          result["checkedAt"] = now.isoformat()

          # scripts/sharp_smoke_record.py owns what the durable record IS
          # and when it is worth rewriting.  It lives in a module rather
          # than in this heredoc so its decision can be unit-tested;
          # heredoc logic is untestable, and this decision is the one that
          # was quietly wrong for 42 commits a day.
          sys.path.insert(0, str(Path("scripts").resolve()))
          import sharp_smoke_record as smoke_record

          previous = smoke_record.load_previous(
              output.read_text() if output.exists() else None
          )
          record = smoke_record.build_record(
              previous, result, now_iso=now.isoformat(), today=now.date().isoformat()
          )
          rendered = json.dumps(record, indent=2, sort_keys=True) + "\n"

          # What the TRACKED file should hold is not always what THIS run
          # saw.  A run that probed nothing (superseded / skipped deploy)
          # leaves the standing record alone; otherwise the push-triggered
          # and deploy-triggered runs flip the file between two statuses and
          # commit every flip.  This run's own view stays in ``rendered``,
          # which the gate grades.
          persisted = smoke_record.record_to_persist(previous, record)
          persisted_rendered = json.dumps(persisted, indent=2, sort_keys=True) + "\n"

          # THIS RUN's evidence, written where only this run can see it.
          # The gate below reads THIS file and never the tracked artifact.
          #
          # The tracked artifact is a durable RECORD, and a record is not a
          # measurement: it survives between runs, so a gate reading it
          # grades whatever the last run that wrote it observed.  With the
          # write now conditional that is no longer theoretical -- a stale
          # ``healthy`` would pass a run that measured nothing.
          #
          # ``RUNNER_TEMP`` is indexed, not ``.get``-ed with a fallback: if
          # the runner does not provide it the gate must fail loudly rather
          # than quietly grade a file in the working directory.
          current = Path(os.environ["RUNNER_TEMP"]) / "sharp-smoke-current.json"
          current.write_text(rendered)

          # The tracked record is rewritten only when the STATE changed or
          # the day rolled over.  Everything else is a commit that says
          # "still the same", and 42 of those a day is what this replaces.
          # The heartbeat half is not optional: without it the record
          # freezes and a workflow that has stopped firing is
          # indistinguishable from one reporting a stable state.
          if smoke_record.decide_write(previous, persisted):
              output.write_text(persisted_rendered)
              print("recording: state changed or the day rolled over")
          else:
              print(
                  "not recording: same state, same day "
                  f"(since {persisted['stateSince']}) — the run summary carries this run"
              )

          print(rendered)

          # EVERY run reports here, written or not.  This is the per-run
          # heartbeat, and it lives in the run ledger where a stale file
          # cannot fake it.
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(
                      "### Sharp production smoke\n\n"
                      f"This run: `{record['status']}` — measured: {record['measured']}\n\n"
                      f"Standing record: `{persisted['status']}` since {persisted['stateSince']}"
                      " (a run that probed nothing leaves it unchanged)\n\n"
                      f"```json\n{rendered}```\n"
                  )
          PY

      - name: Commit production smoke result
        # AUDIT O-4: ``git add`` without ``-f`` on a path under the
        # gitignored ``data/`` (.gitignore:45) fails, and it failed
        # BEFORE the enforce gate below — which is why that gate had
        # never executed once. The artifact is force-added the same way
        # scheduled-refresh.yml force-adds data/scrape_state/.
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # ``--autostash``, and the pull BEFORE the add.  The smoke step
          # above rewrites the tracked artifact, so the tree is dirty
          # here and a bare ``git pull --rebase`` aborts with "cannot
          # pull with rebase: You have unstaged changes" (exit 128).
          # That is what it did on every run, taking the enforce gate
          # below down with it — the SAME defect class as the AUDIT O-4
          # note above, one line later: a mechanical step failing ahead
          # of the gate, so the gate never executes.
          #
          # ORDER IS LOAD-BEARING.  Verified empirically, because the
          # obvious "stage first, then pull" is WRONG: autostash pops
          # with ``git stash apply`` semantics and does not restore the
          # index, so a staged artifact comes back UNSTAGED, the
          # ``git diff --cached --quiet`` below then exits 0, and the
          # job takes the "nothing to commit" branch — green, and the
          # smoke result silently never recorded. Pull first, stage
          # after.
          git pull --rebase --autostash origin main
          git add -f data/ops/sharp-production-smoke.json
          # A byte-identical result is not an error; only commit a change.
          if git diff --cached --quiet; then
            echo "No change in smoke result — nothing to commit."
          else
            git commit -m "chore(ops): record Sharp production smoke"
            git push origin HEAD:main
          fi

      - name: Enforce healthy population
        id: gate
        # This step had never run: the commit above always failed first.
        # Now that it can run, it must distinguish "measured unhealthy"
        # from "could not measure" — reporting the second as the first
        # would fail every push to main for a credential this workflow
        # was never given, and a gate that cries wolf gets deleted.
        #
        # It reads the RUN-SCOPED result, never the tracked artifact.
        # See the smoke step's own note: the artifact is a record that
        # outlives the run that wrote it, so grading it would eventually
        # grade someone else's measurement as this run's.
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "sharp-smoke-current.json").read_text()
          )
          status = result.get("status")
          # This step is its own python process: ``deploy_conclusion`` is
          # defined in the smoke step above and does not exist here.  The
          # ``deploy_superseded`` / ``deploy_unmeasured`` branches below
          # interpolate it, so without this line every superseded run died
          # with ``NameError`` and concluded FAILURE for a run that was
          # designed to make no claim at all: 12 of the 15 red
          # workflow_run runs retained on 2026-10-26 (the other 3 were
          # genuine ``deploy_failed``).  Read it from the run-scoped
          # result, where the record builder files it under ``lastRun``.
          deploy_conclusion = (result.get("lastRun") or {}).get("deployConclusion")

          # Published BEFORE any exit branch, so the tracker steps below
          # can run on a failing gate too.  A gate that fails and files
          # nothing is the state this workflow was already in.
          outputs = os.environ.get("GITHUB_OUTPUT")
          if outputs:
              with open(outputs, "a", encoding="utf-8") as handle:
                  handle.write(f"status={status}\n")
                  handle.write(f"measured={str(bool(result.get('measured'))).lower()}\n")
                  handle.write(f"state_since={result.get('stateSince') or ''}\n")
                  # EMPTY, never the string "None".  The tracker body
                  # renders this as `${LAST_MEASURED_ON:-never}`, and
                  # "None" is non-empty — it would print literally and
                  # read as a date nobody could parse, in the one field
                  # that says whether this gate has EVER worked.
                  handle.write(f"last_measured_on={result.get('lastMeasuredOn') or ''}\n")

          if status == "healthy":
              print("Sharp production population is healthy.")
              raise SystemExit(0)

          if status == "unverifiable_unauthenticated":
              # LOSING a capability the record shows we once had is a
              # regression, and regressions are red.  This is the one
              # tooth in an otherwise non-enforcing gate, and it is only
              # computable because the durable record carries
              # ``lastMeasuredOn`` forward across runs.
              #
              # It can only ADD a failure condition, never remove one, so
              # it cannot manufacture a green.
              if result.get("credentialRegression"):
                  raise SystemExit(
                      "::error title=Sharp smoke lost its credential::"
                      "/api/sharp/* answered 401, but this check HAS measured "
                      f"production before (last on {result.get('lastMeasuredOn')}). "
                      "A capability that used to work and now does not is a "
                      "regression, not a standing gap."
                  )

              # Insufficient evidence: loud, and green ON PURPOSE.
              #
              # The conclusion is a decision, not a leftover.  The
              # repository's rule for "a credential is missing" is
              # tests/deploy/test_no_workflow_exits_green_on_missing_secrets.py
              # -- refuse with ``::error`` + ``exit 1``, because a green tick
              # for a run that could not look is indistinguishable from a
              # green tick for a run that looked and found health.  This
              # branch is outside that guard's mechanical reach (the secret
              # is read in the smoke step and arrives here as a recorded
              # fact; there is no shell emptiness test), and it has NOT been
              # granted an exemption by name.  It is green because
              # test_unverifiable_is_reported_as_a_warning_not_a_pass_or_a_failure
              # has pinned "warning, not failure" since 2026-08-20: red on
              # every push to main for a credential only the owner can issue
              # is how a gate gets deleted, and the owner may also choose to
              # accept an unmeasured gate.  What this branch must NOT be is
              # QUIET: the green is made distinguishable by a warning
              # annotation, a job-summary banner, the tracker issue and the
              # record's measured=false.  Turning it red is a one-line change
              # (replace the final SystemExit(0)) and an owner call.
              provisioned = result.get("tokenProvisioned")
              if provisioned is False:
                  headline = "SHARP_SMOKE_TOKEN is not provisioned — nothing was measured"
                  cause = (
                      "The `SHARP_SMOKE_TOKEN` repository secret is empty or unset, so "
                      "this run called `/api/sharp/*` anonymously and was refused (401)."
                  )
              elif provisioned is True:
                  headline = (
                      "SHARP_SMOKE_TOKEN is provisioned but /api/sharp/* rejected it "
                      "— nothing was measured"
                  )
                  cause = (
                      "A `SHARP_SMOKE_TOKEN` was presented and production refused it. "
                      "The repo secret and production's `.env` value do not match, or "
                      "the `dynasty` service was not restarted after the change."
                  )
              else:
                  headline = (
                      "/api/sharp/* refused this run and whether a token was presented "
                      "was not recorded — nothing was measured"
                  )
                  cause = "Whether a `SHARP_SMOKE_TOKEN` was presented is unknown for this run."
              print(f"::warning title=Sharp smoke UNVERIFIABLE::{headline}")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(
                          "### :warning: Sharp smoke UNVERIFIABLE\n\n"
                          f"**{headline}.**\n\n"
                          f"{cause}\n\n"
                          "This run is green only because it is not allowed to fail "
                          "for a credential CI cannot issue. **Green here is not "
                          "verification.** No Sharp cohort or FFPC market number was "
                          "read; `measured` is `false`.\n\n"
                          f"- In this state since: `{result.get('stateSince')}`\n"
                          "- Last time it could measure: "
                          f"`{result.get('lastMeasuredOn') or 'never'}`\n\n"
                          "**To make this a real check:** set the `SHARP_SMOKE_TOKEN` "
                          "repo secret AND the matching `SHARP_SMOKE_TOKEN` value in "
                          "production's `.env`, then restart the `dynasty` service "
                          "(`src.sharp.service.sharp_smoke_bearer_auth_ok`; same bearer "
                          "pattern as `/api/signal-alerts/run`).\n"
                      )
              raise SystemExit(0)

          if status == "deploy_superseded":
              # No verdict.  The deploy this run was triggered by was
              # cancelled — almost always because a later merge superseded
              # it — so there is no deployed state to make a claim about.
              # Exiting 0 here is not a green claim about production; it is
              # the absence of a claim, which is what the evidence supports.
              print(
                  "::notice title=Sharp smoke made no production claim::"
                  f"the triggering deploy concluded '{deploy_conclusion}' "
                  "(superseded by a later run), so production health was NOT "
                  "measured and no verdict is recorded."
              )
              raise SystemExit(0)

          if status == "deploy_unmeasured":
              print(
                  "::warning title=Sharp smoke has no deploy conclusion::"
                  f"the triggering deploy concluded '{deploy_conclusion or 'none'}', "
                  "so production health was NOT measured. This is an absence of "
                  "evidence, not evidence of health or of failure."
              )
              raise SystemExit(0)

          raise SystemExit(f"Sharp production smoke is not healthy: {status}")
          PY

      - name: Track that the Sharp gate cannot measure
        # The gate stays green on `unverifiable_unauthenticated`, and that
        # is the right per-run disposition: /api/sharp/* sits behind
        # server.py::_private_api_gate, this workflow holds no credential,
        # and failing ~12x a day for a token it was never issued is how a
        # gate gets deleted.  `test_sharp_smoke_commit_order.py` pins that
        # warning-not-failure behaviour and it is unchanged.
        #
        # But "loud once per run into a log" is not loud.  Measured: the
        # workflow has been GREEN through every run in its recorded
        # history while measuring nothing at all.  A gate that has never
        # once evaluated its own invariant, and shows a green tick each
        # time, is a false green even when each individual run is honest.
        #
        # So the finding goes where this repository already puts findings
        # CI cannot act on itself — a tracking issue — and it names the
        # single action that turns this into a real gate.  Shape copied
        # from e2e.yml, including the `[bot]` suffix normalisation it paid
        # for in AUDIT F-23.
        #
        # No mainline guard is needed here: the job's own `if:` already
        # admits only `push` to main and `workflow_run` whose head_branch
        # is main.
        if: ${{ always() && steps.gate.outputs.status == 'unverifiable_unauthenticated' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_SINCE: ${{ steps.gate.outputs.state_since }}
          LAST_MEASURED_ON: ${{ steps.gate.outputs.last_measured_on }}
        run: |
          set -Eeuo pipefail
          TRACKER_TITLE="Sharp production gate cannot measure: /api/sharp/* has no credential"
          # Report a STATE, not a run.  This step used to comment on every
          # run that could not measure — 812 identical comments on #951 by
          # 2026-10-07, which buries the one comment that matters (the state
          # changing) under hundreds that say nothing new.  The (status,
          # since) pair is the state; it is stamped into every body this step
          # writes as a hidden marker, and a run whose marker is already on
          # the tracker stays quiet.  A changed `since` (the state re-entered)
          # or a tracker that predates the marker gets exactly one comment.
          STATE_MARKER="<!-- sharp-tracker-state: unverifiable_unauthenticated|${STATE_SINCE} -->"
          gh label create sharp-unverifiable \
            --color FBCA04 \
            --description "Auto-opened when the Sharp production smoke cannot measure what it gates on" \
            2>/dev/null || true
          BODY=$(cat <<EOF
          \`Verify Sharp Production Population\` is green, and it has not measured anything.

          - Status: \`unverifiable_unauthenticated\`
          - In this state since: \`${STATE_SINCE}\`
          - Last time it could measure: \`${LAST_MEASURED_ON:-never}\`
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`https://chaseupside.com/api/sharp/cohort\` answers **401**. The site is up
          and correctly refusing an unauthenticated caller; this run presented no
          valid session and no matching \`SHARP_SMOKE_TOKEN\` bearer, so Sharp
          population health is **not measured**. The per-run disposition is
          deliberately a warning rather than a failure — failing every run for a
          token CI was never issued is how a gate gets deleted — but the
          cumulative fact is that the gate has never evaluated its invariant.

          **The one action that fixes this:** the bearer mechanism already exists
          (\`_SELF_AUTHED_API_EXACT\` in \`server.py\` +
          \`src.sharp.service.sharp_smoke_bearer_auth_ok\`, same pattern
          \`/api/signal-alerts/run\` uses) — set the \`SHARP_SMOKE_TOKEN\` repo
          secret AND the matching \`SHARP_SMOKE_TOKEN\` value in production's
          \`.env\` (then restart the \`dynasty\` service so it picks up the new
          env var).

          This issue closes itself on the first run that reports \`healthy\`.

          ${STATE_MARKER}
          EOF
          )
          # A lookup that FAILS must not read like a lookup that found
          # nothing — e2e.yml's AUDIT F-23 note has the full account. On
          # failure: say so loudly, then still file, because losing the
          # finding is worse than a duplicate.
          #
          # ISSUE #958.  The author clause is GONE, and that is the fix.
          # It has now failed twice on the same guess: F-23 pinned the bare
          # `github-actions`, then normalised a `[bot]` SUFFIX away.  Neither
          # was ever reproduced against real `gh` output — F-23's own note
          # calls the spelling "a bet" — and the bet lost again here, one new
          # issue per run (#951/#953/#955/#957 in 67 minutes).
          # `tests/deploy/test_sharp_tracker_dedup.py` runs this shell against
          # a gh stub and real jq for all three spellings: `github-actions` and
          # `github-actions[bot]` both PASS the old clause, and
          # `app/github-actions` — the `app/` prefix gh puts on bot actors in
          # `--json author` — is the one that fails, which is the behaviour
          # measured in production.
          #
          # Identity is now LABEL + exact TITLE.  `sharp-unverifiable` is
          # created and applied only by this workflow, and TITLE is the same
          # constant the create below uses, so a false positive needs a human
          # to apply this workflow's label AND reuse its exact title.  That is
          # what the author clause was defending against, and the title
          # defends it without depending on a spelling nobody has verified.
          #
          # OLDEST wins, not `.[0]`.  gh sorts newest-first, so `.[0]` picks
          # whichever duplicate was filed last — the exact mechanism that let
          # #753 displace the real tracker #732 in e2e.yml.  min-by-number is
          # stable and drains the duplicates that already exist onto one.
          #
          # The author logins are still FETCHED and echoed once per run, so the
          # spelling question is settled by evidence in the log rather than by
          # a third guess.  Nothing branches on it.
          if ! ROWS=$(gh issue list --state open --label sharp-unverifiable \
                        --json number,title,author); then
            echo "::error title=Tracker lookup failed::gh issue list failed; filing without deduplicating against the existing tracker"
            ROWS=""
          fi
          if [[ -n "$ROWS" ]]; then
            echo "::notice title=Tracker author spelling::$(printf '%s' "$ROWS" \
              | jq -r '[.[].author.login] | unique | join(",")')"
            EXISTING=$(printf '%s' "$ROWS" \
              | jq -r "[.[] | select(.title==\"${TRACKER_TITLE}\") | .number] | min // empty")
          else
            EXISTING=""
          fi
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            # Has this exact state already been reported on the tracker?  A
            # view that FAILS is not "already reported": say so and comment,
            # because a duplicate comment is cheaper than a lost state change.
            if THREAD=$(gh issue view "$EXISTING" --json body,comments); then
              SEEN=$(printf '%s' "$THREAD" \
                | jq -r --arg m "$STATE_MARKER" '[.body] + [.comments[].body] | map(select(. != null and contains($m))) | length')
            else
              echo "::warning title=Tracker view failed::gh issue view #${EXISTING} failed; commenting rather than risk losing a state change"
              SEEN=0
            fi
            if [[ "$SEEN" != "0" ]]; then
              echo "::notice title=Sharp tracker unchanged::#${EXISTING} already reports this state (since ${STATE_SINCE:-unknown}); not commenting again"
            else
              gh issue comment "$EXISTING" --body "$BODY"
            fi
          else
            gh issue create --title "$TRACKER_TITLE" --body "$BODY" --label sharp-unverifiable
          fi

      - name: Close the unmeasurable-gate tracker once the smoke can measure
        # The other half of the pattern.  The day a token is provisioned
        # this drains itself, so nobody has to remember the issue exists.
        #
        # Keyed on LABEL + exact TITLE, the same rule and the same constant
        # the open step uses — #958.  A label-only close WOULD close a human's
        # hand-labelled issue on their behalf, which is the risk e2e.yml
        # records; the exact-title match is what prevents that, and unlike the
        # retired author clause it does not depend on which spelling gh emits.
        # Closes EVERY match, so the duplicates that accumulated drain on the
        # first healthy run.
        if: ${{ steps.gate.outputs.measured == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          TRACKER_TITLE="Sharp production gate cannot measure: /api/sharp/* has no credential"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if ! OPEN=$(gh issue list --state open --label sharp-unverifiable \
                        --json number,title,author \
                        --jq "[.[] | select(.title==\"${TRACKER_TITLE}\") | .number] | sort | .[]"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; the green all-clear did NOT run, so an open tracker may be stale"
            exit 1
          fi
          if [[ -z "$OPEN" ]]; then
            echo "no open unverifiable-gate tracker; nothing to close"
            exit 0
          fi
          for N in $OPEN; do
            echo "closing #${N}"
            gh issue close "$N" --reason completed --comment \
              "The Sharp production smoke measured production successfully — the gate is enforcing again.

          - Workflow run: ${RUN_URL}
          - Closed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Reopened automatically by the tracker step if the credential is lost again."
          done
