name: KTC diagnostic evidence harvest
# Temporary helper branch only; never merge. Reads completed Actions logs.
# No SSH, production credentials, code mutation, restart, or scrape trigger.
on:
  push:
    branches: ['codex/ktc-evidence-harvest']
permissions:
  contents: read
  actions: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jasonleetucker-code/riskittogetthebrisket
      JOB_IDS: '105586511341'
      EVIDENCE_LABEL: fresh-pre-deploy-baseline
    steps:
      - name: Retrieve completed jobs with original masked logs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/ktc-harvest
          for job in $JOB_IDS; do
            [[ "$job" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/jobs/$job" > "/tmp/ktc-harvest/job-$job.json"
            test "$(jq -r .status "/tmp/ktc-harvest/job-$job.json")" = completed
            gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/$job/logs" > "/tmp/ktc-harvest/job-$job.log"
          done
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path('/tmp/ktc-harvest')
          records=[]
          for path in sorted(root.glob('job-*.json')):
              job=json.loads(path.read_text())
              log=path.with_suffix('.log')
              records.append({'job_id':job['id'],'run_id':job['run_id'],'name':job['name'],'status':job['status'],'conclusion':job['conclusion'],'head_sha':job.get('head_sha'),'started_at':job.get('started_at'),'completed_at':job.get('completed_at'),'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),'log_bytes':log.stat().st_size})
          summary={'label':os.environ['EVIDENCE_LABEL'],'jobs':records,'notice':'Original secret masking is retained. Masked numeric fields can make telemetry JSON invalid; do not silently discard those samples or reconstruct masked digits. Parse masked numeric fields as unknown. No production revision or incident resolution is inferred from workflow success.'}
          (root/'manifest.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve all retrieved evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-job-evidence
          path: /tmp/ktc-harvest/
          retention-days: 14
