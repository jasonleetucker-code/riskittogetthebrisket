name: KTC diagnostic evidence harvest
# Temporary helper branch only; never merge. Reads logs and tests untouched base.
# No SSH, production credentials, code mutation, restart, or scrape trigger.
on:
  push:
    branches: ['codex/ktc-evidence-harvest']
permissions:
  contents: read
  actions: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jasonleetucker-code/riskittogetthebrisket
      ALLOW_DEFAULT_LOGIN_DEV: '1'
      UPTIME_CHECK_ENABLED: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3314929b9cc0930361d6153cb47b77250434602a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install canonical dependencies
        run: pip install -r requirements-dev.txt
      - name: Preserve completed PR evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/ktc-harvest
          gh api "repos/$GH_REPO/actions/jobs/105583893736" > /tmp/ktc-harvest/pr-job.json
          test "$(jq -r .status /tmp/ktc-harvest/pr-job.json)" = completed
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/105583893736/logs" > /tmp/ktc-harvest/pr-job.log
          git rev-parse HEAD | tee /tmp/ktc-harvest/base-head.txt
          test "$(git rev-parse HEAD)" = 3314929b9cc0930361d6153cb47b77250434602a
          test "$(git hash-object src/sources/ktc_value_sources.py)" = 23a32169f9340ca56936e99ab04529057ba0cd6c
          test -z "$(git status --porcelain)"
      - name: Reproduce advisory failure on untouched base (no assertion changes)
        shell: bash
        run: |
          set -uo pipefail
          python -m pytest tests/api/test_fantasypros_idp_integration.py::TestFantasyProsIdpEnrichment::test_no_combined_player_loses_direct_rank -q --tb=short -m livedata 2>&1 | tee /tmp/ktc-harvest/base-advisory.txt
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > /tmp/ktc-harvest/base-advisory-exit.txt
          # This is a negative reproduction, not a green-test claim.
          test "$rc" = 1 && grep -q '578 != 77' /tmp/ktc-harvest/base-advisory.txt && grep -q 'Byron Murphy II: combined-board player lost direct rank' /tmp/ktc-harvest/base-advisory.txt
          match=$?
          if [ "$match" -eq 0 ]; then
            echo 'CONFIRMED: identical advisory IDP failure on untouched base; not caused by the KTC projection.' | tee /tmp/ktc-harvest/base-advisory-disposition.txt
          else
            echo 'NOT CONFIRMED: base did not reproduce the exact advisory signature. Inspect logs; do not label pre-existing from this run.' | tee /tmp/ktc-harvest/base-advisory-disposition.txt
          fi
          exit "$match"
      - name: Preserve all evidence including failed reproductions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-advisory-baseline-evidence
          path: /tmp/ktc-harvest/
          retention-days: 14
