name: Format unified FFPC branch

on:
  push:
    branches:
      - feature/unified-ffpc-sharp

permissions:
  contents: write

concurrency:
  group: format-unified-ffpc-branch
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install 'ruff==0.12.12'

      - name: Format and safely fix changed Python files
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then
            printf 'Formatting %s\n' "${files[@]}"
            python -m ruff format "${files[@]}"
            python -m ruff check --fix "${files[@]}"
          fi
          rm -f .github/workflows/format-unified-ffpc-branch.yml

      - name: Commit formatter output and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatter changes.'
            exit 0
          fi
          git commit -m 'Format unified FFPC implementation'
          git push origin HEAD:feature/unified-ffpc-sharp
