name: KTC public availability probes
# Helper branch only; never merge. Read-only Actions metadata and public HTTP.
# No SSH, account credentials, production writes, restart, scrape or deploy trigger.
on:
  push:
    branches: ['codex/ktc-public-probes']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: jasonleetucker-code/riskittogetthebrisket
      DEPLOY_RUN_ID: '35343585208'
      EXPECTED_DEPLOY_SHA: 4e5c7a4c72f20dcf87c63aac74eaa6ff90045be5
      ORIGIN: https://chaseupside.com
      SAMPLE_COUNT: '90'
      SAMPLE_INTERVAL: '10'
      EVIDENCE_LABEL: pinned-deploy-and-first-scrape
    steps:
      - name: Observe existing pinned deploy until remote phase (read-only)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/ktc-public-probes
          python3 -u - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('/tmp/ktc-public-probes')
          base = 'https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['DEPLOY_RUN_ID']
          def read(path):
              request = urllib.request.Request(path, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'KTC-pinned-deploy-observer'})
              with urllib.request.urlopen(request,timeout=20) as response: return json.load(response)
          deadline = time.monotonic()+2700
          previous = None
          while time.monotonic()<deadline:
              run = read(base)
              assert run['head_sha']==os.environ['EXPECTED_DEPLOY_SHA'], 'Wrong deploy revision'
              assert run['head_branch']=='main' and run['path']=='.github/workflows/deploy.yml', 'Not normal main deploy'
              jobs = read(base+'/jobs?per_page=100')['jobs']
              observation = {'at':datetime.now(timezone.utc).isoformat(),'run_id':run['id'],'head_sha':run['head_sha'],'status':run['status'],'conclusion':run['conclusion'],'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'steps':j.get('steps',[])} for j in jobs]}
              (root/'deploy-observation.json').write_text(json.dumps(observation,indent=2)+'\n')
              state = [(j['name'],j['status'],j['conclusion']) for j in jobs]
              if state != previous:
                  print(json.dumps({'at':observation['at'],'deploy_state':state}),flush=True)
                  previous = state
              remote = [s for j in jobs for s in j.get('steps',[]) if s['name']=='Run remote deploy script']
              if remote and remote[0]['status'] in {'in_progress','completed'}:
                  print('Remote deployment phase observed for the pinned revision; starting bounded public probes.',flush=True)
                  break
              if run['status']=='completed': raise RuntimeError('Deploy ended before its remote step: '+str(run['conclusion']))
              time.sleep(15)
          else: raise TimeoutError('Remote deployment phase not observed within 45 minutes')
          PY
      - name: Public endpoint responsiveness and source metadata (no credentials)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('/tmp/ktc-public-probes')
          selected = {'status','scrape_running','scrapeRunning','current_step','currentStep','current_source','currentSource','worker_id','phase','source','sourceKey','source_key','started_at','finished_at','last_scrape','last_success_at','last_success','duration_sec','git_sha','gitSha','gitHead','build_sha','buildSha','commit','commit_sha','revision','deployed_sha','rowCount','row_count','pricedCount','priced_count','rows','count','total','capturedAt','contentHash','valueSource','is_running','running','stalled','hung'}
          def fields(value, path=''):
              out = {}
              if isinstance(value, dict):
                  for key, item in value.items():
                      where = f'{path}.{key}' if path else key
                      if (key in selected or 'ktc' in key.lower()) and (item is None or isinstance(item, (str,int,float,bool))): out[where] = item if not isinstance(item,str) else item[:240]
                      elif isinstance(item, dict): out.update(fields(item,where))
              return out
          rows = []
          count = int(os.environ['SAMPLE_COUNT'])
          assert 1 <= count <= 100
          for iteration in range(count):
              cycle = time.monotonic()
              for method, path in [('GET','/api/health'),('GET','/api/status'),('POST','/api/auth/login')]:
                  if method == 'POST' and iteration not in {0,count//2,count-1}: continue
                  row = {'at':datetime.now(timezone.utc).isoformat(),'iteration':iteration,'method':method,'path':path,'label':os.environ['EVIDENCE_LABEL']}
                  request = urllib.request.Request(os.environ['ORIGIN']+path, data=b'{}' if method=='POST' else None, method=method, headers={'Cache-Control':'no-cache','Content-Type':'application/json','User-Agent':'KTC-repair-readonly-verifier'})
                  started = time.monotonic()
                  try:
                      try: response = urllib.request.urlopen(request,timeout=8)
                      except urllib.error.HTTPError as error: response = error
                      with response:
                          row['http_status'] = response.code
                          raw = response.read(1048576)
                      try:
                          payload = json.loads(raw)
                          row['root_keys'] = sorted(payload) if isinstance(payload,dict) else []
                          row['fields'] = fields(payload)
                          if isinstance(payload,dict): row['metadata_shape'] = {key:sorted(payload[key]) for key in ['data_runtime','served_source_coverage','source_health'] if isinstance(payload.get(key),dict)}
                      except (ValueError,UnicodeDecodeError): row['json'] = False
                  except (OSError,ValueError) as error:
                      row['http_status'] = None
                      row['transport_error'] = type(error).__name__
                  row['seconds'] = round(time.monotonic()-started,3)
                  rows.append(row)
                  with (root/'probes.jsonl').open('a') as handle: handle.write(json.dumps(row)+'\n')
                  print(json.dumps(row), flush=True)
              if iteration+1<count: time.sleep(max(0,int(os.environ['SAMPLE_INTERVAL'])-(time.monotonic()-cycle)))
          summary = {'label':os.environ['EVIDENCE_LABEL'],'expected_deploy_sha':os.environ['EXPECTED_DEPLOY_SHA'],'requests':len(rows),'transport_failures':sum(row['http_status'] is None for row in rows),'max_seconds':max(row['seconds'] for row in rows),'notice':'Window begins during remote deploy and may include old code/build/restart. Correlate with actual deploy completion and scrape telemetry before attributing behavior. At most three empty-body POST rejection probes, not successful login tests. No cookies or raw response bodies retained.'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary),flush=True)
          PY
      - name: Preserve observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-public-probes
          path: /tmp/ktc-public-probes/
          retention-days: 14
