name: Temporary V1-84 ledger reconciliation

on:
  push:
    branches:
      - chatgpt/v1-84-prod-evidence-main2

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile canonical V1 ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/VERSION_1_COMPLETION_CONTRACT.md')
          s = p.read_text()

          old_row = '| V1-84 | 503 is not exempt from production health failure | audit `F-21` | L5 | `IMPLEMENTED_UNVERIFIED` | L3 | false-green repair. #909 |'
          new_row = '| V1-84 | 503 is not exempt from production health failure | audit `F-21` | L5 | `VERIFIED` | L3 | false-green repair. #909 | **PROMOTED 2026-08-25 from natural L3 production evidence.** The repaired F-21 health workflow from `#909` was exercised by scheduled production run `32700949074` on head `b1066ec98a93b417d3801935142543885e94230f`; that head is 818 commits after `#909` merge `82b25bd7d`. The first attempt observed HTTP 503 on all three `/api/health` probes with `contract_ok=false` and opened rolling production-health issue `#1069` instead of warning/exempting the degraded state. A later canonical data cycle recovered; attempt 2 returned HTTP 200 with `contract_ok=true` and the workflow closed the same tracker. This is the real production failure/recovery path, not a synthetic status or workflow-green inference.'
          assert s.count(old_row) == 1, f'expected one V1-84 row, found {s.count(old_row)}'
          s = s.replace(old_row, new_row)

          assert s.count('| `VERIFIED` | 112 |') == 1
          assert s.count('| `IMPLEMENTED_UNVERIFIED` | 18 |') == 1
          s = s.replace('| `VERIFIED` | 112 |', '| `VERIFIED` | 113 |')
          s = s.replace('| `IMPLEMENTED_UNVERIFIED` | 18 |', '| `IMPLEMENTED_UNVERIFIED` | 17 |')

          old_completion = '**V1 completion: 112 / 136 = 82.4%.** Numerator moved +1 by `V1-89` production L3 closure'
          new_completion = '**V1 completion: 113 / 136 = 83.1%.** Numerator moved +1 by `V1-84` production L3 closure (scheduled health run `32700949074`: three consecutive 503s produced a real `production-health` incident, and the green recovery attempt closed it). **112 before this reconciliation.** Numerator moved +1 by `V1-89` production L3 closure'
          assert s.count(old_completion) == 1, f'expected standing completion intro once, found {s.count(old_completion)}'
          s = s.replace(old_completion, new_completion)

          p.write_text(s)
          PY

          git diff --check
          python scripts/check_planning_integrity.py
          python scripts/check_decision_coercions.py

      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Integration"
          git config user.email "chatgpt-integration@users.noreply.github.com"
          git rm .github/workflows/_tmp_v1_84_reconcile.yml
          git add docs/VERSION_1_COMPLETION_CONTRACT.md
          git commit -m "docs: verify V1-84 from production evidence"
          git push origin HEAD:chatgpt/v1-84-prod-evidence-main2
