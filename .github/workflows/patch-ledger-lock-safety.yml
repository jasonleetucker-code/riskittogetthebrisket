name: Patch Ledger Lock Safety

on:
  push:
    branches: [fix/ledger-lock-safety]
    paths:
      - ".github/workflows/patch-ledger-lock-safety.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/patch-ledger-lock-safety.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ledger-lock-safety
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Patch ledger initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("src/intel/ledger.py")
          text = path.read_text()
          start = text.index("def _open_or_reset(path: Path) -> None:")
          end = text.index("\ndef _ensure_schema(path: Path) -> None:", start)
          replacement = dedent(
              '''
              def _is_corrupt_database_error(exc: sqlite3.DatabaseError) -> bool:
                  """Return True only for errors that prove the file itself is corrupt.

                  ``OperationalError`` is a ``DatabaseError`` subclass. Treating every
                  database error as corruption meant a routine ``database is locked``
                  during a collector write renamed the live ledger and rebuilt an empty
                  one underneath the writer. Busy/locked errors must propagate so the
                  caller can retry; only SQLite CORRUPT/NOTADB conditions may quarantine
                  and rebuild this derived store.
                  """
                  code = getattr(exc, "sqlite_errorcode", None)
                  corrupt_codes = {
                      getattr(sqlite3, "SQLITE_CORRUPT", 11),
                      getattr(sqlite3, "SQLITE_NOTADB", 26),
                  }
                  if code in corrupt_codes:
                      return True
                  message = str(exc).lower()
                  return any(
                      marker in message
                      for marker in (
                          "database disk image is malformed",
                          "file is not a database",
                          "file is encrypted or is not a database",
                          "malformed database schema",
                      )
                  )


              def _schema_is_current(conn: sqlite3.Connection) -> bool:
                  """Check an existing schema without taking a write lock."""
                  try:
                      row = conn.execute(
                          "SELECT value FROM meta WHERE key='schema_version'"
                      ).fetchone()
                  except sqlite3.OperationalError as exc:
                      if "no such table" in str(exc).lower():
                          return False
                      raise
                  return row is not None and str(row[0]) == str(SCHEMA_VERSION)


              def _open_or_reset(path: Path) -> None:
                  """Open the ledger and rebuild only when SQLite proves corruption.

                  Existing, current ledgers are checked read-only. This lets API readers
                  start while a collector owns the write lock. A busy or locked database
                  is never renamed, deleted, or rebuilt.
                  """
                  conn = sqlite3.connect(str(path), timeout=30.0)
                  conn.execute("PRAGMA busy_timeout=30000")
                  try:
                      if _schema_is_current(conn):
                          return
                      _apply_schema(conn)
                      return
                  except sqlite3.DatabaseError as exc:
                      if not _is_corrupt_database_error(exc):
                          raise
                      conn.close()
                      quarantine = path.with_suffix(
                          path.suffix + f".corrupt-{int(time.time() * 1000)}"
                      )
                      log.warning(
                          "intel.ledger: %s failed SQLite corruption checks — quarantining as %s",
                          path,
                          quarantine,
                      )
                      if path.exists():
                          try:
                              path.rename(quarantine)
                          except OSError:
                              path.unlink(missing_ok=True)
                      conn = sqlite3.connect(str(path), timeout=30.0)
                      conn.execute("PRAGMA busy_timeout=30000")
                      try:
                          _apply_schema(conn)
                      finally:
                          conn.close()
                      return
                  finally:
                      try:
                          conn.close()
                      except Exception:  # noqa: BLE001 — best effort
                          pass
              '''
          ).lstrip()
          text = text[:start] + replacement + text[end:]

          connect_start = text.index("def connect(path: Path | None = None)")
          connect_end = text.index("\ndef reset_setup_cache", connect_start)
          connect_block = text[connect_start:connect_end]
          old_timeout = "sqlite3.connect(str(target), timeout=10.0)"
          if old_timeout not in connect_block:
              raise SystemExit("expected ledger connect timeout not found")
          connect_block = connect_block.replace(
              old_timeout,
              "sqlite3.connect(str(target), timeout=30.0)",
              1,
          )
          row_factory = "    conn.row_factory = sqlite3.Row"
          if row_factory not in connect_block:
              raise SystemExit("expected row_factory line not found")
          connect_block = connect_block.replace(
              row_factory,
              '    conn.execute("PRAGMA busy_timeout=30000")\n' + row_factory,
              1,
          )
          text = text[:connect_start] + connect_block + text[connect_end:]
          path.write_text(text)
          PY
          python -m ruff format src/intel/ledger.py

      - name: Add lock and corruption regression tests
        run: |
          cat > tests/intel/test_ledger_lock_safety.py <<'PY'
          from __future__ import annotations

          import sqlite3

          import pytest

          from src.intel import ledger


          def test_locked_database_is_never_quarantined_or_rebuilt(tmp_path):
              path = tmp_path / "ledger.sqlite3"
              ledger.reset_setup_cache()
              conn = ledger.connect(path)
              conn.execute("INSERT INTO meta(key, value) VALUES ('sentinel', 'preserve-me')")
              conn.commit()
              conn.close()

              writer = sqlite3.connect(path)
              writer.execute("PRAGMA journal_mode=DELETE")
              writer.execute("BEGIN EXCLUSIVE")
              writer.execute("UPDATE meta SET value='held' WHERE key='sentinel'")

              ledger.reset_setup_cache()
              with pytest.raises(sqlite3.OperationalError, match="locked"):
                  ledger.connect(path)

              assert path.exists()
              assert list(tmp_path.glob("ledger.sqlite3.corrupt*")) == []

              writer.rollback()
              writer.close()
              ledger.reset_setup_cache()
              check = ledger.connect(path)
              assert check.execute(
                  "SELECT value FROM meta WHERE key='sentinel'"
              ).fetchone()[0] == "preserve-me"
              check.close()


          def test_proven_non_database_file_is_quarantined_and_rebuilt(tmp_path):
              path = tmp_path / "ledger.sqlite3"
              path.write_bytes(b"this is not sqlite")
              ledger.reset_setup_cache()

              conn = ledger.connect(path)
              version = conn.execute(
                  "SELECT value FROM meta WHERE key='schema_version'"
              ).fetchone()[0]
              conn.close()

              assert version == str(ledger.SCHEMA_VERSION)
              quarantined = list(tmp_path.glob("ledger.sqlite3.corrupt-*"))
              assert len(quarantined) == 1
              assert quarantined[0].read_bytes() == b"this is not sqlite"
          PY
          python -m ruff format tests/intel/test_ledger_lock_safety.py
          python -m pytest tests/intel/test_ledger_lock_safety.py -q

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/intel/ledger.py tests/intel/test_ledger_lock_safety.py
          git commit -m "fix(intel): never rebuild a locked ledger"
          git push origin HEAD:fix/ledger-lock-safety
