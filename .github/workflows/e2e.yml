name: E2E Safety Net

# Full-stack Playwright critical-journey suite against a locally
# booted backend (FastAPI :8000) + frontend (Next.js :3000), fed
# entirely from the committed data snapshot (exports/latest/ +
# CSVs/site_raw/) — no external network, no scraper credentials.
#
# This is the functional-parity safety net for the UI redesign: the
# journey specs (tests/e2e/specs/journey-*.spec.js, mobile-smoke)
# assert BEHAVIOR — board renders/sorts/filters, popup + search work,
# trade surfaces respond, settings overrides round-trip — so each
# redesign phase can rewrite markup and prove nothing functional broke.
#
# Triggers: nightly cron, manual dispatch, and PRs that touch the app
# SHELL — still deliberately NOT every PR.  The suite boots the whole
# stack, builds the frontend, and drives a real browser through dozens
# of journeys; it runs for many minutes, which is too slow to put in
# front of every change.  pr-validation.yml keeps the fast checks on
# every PR; this one is the slow, targeted second gate.
#
# Why the path-filtered PR trigger exists (added after #709):
#
# A `dynamic()` import added to `components/AppShell.jsx` put a React
# lazy boundary around `{children}` — the entire page.  Every route's
# content became deferred streaming content, so React staged it in a
# hidden `<div id="S:1">`, moved it into place, and left the staged
# copy behind.  /waivers served THREE <main> elements: the shell's,
# the page's, and a hidden second full copy of the page.
#
# Nothing else in the repo saw it.  The duplicate has no client rects
# and never reaches the accessibility tree, so it is invisible in a
# screenshot and to a human clicking around.  Six rounds of performance
# instrumentation — CLS, LCP, INP, long-task/TBT, scroll FPS, per-route
# bundle size — ALL reported unchanged numbers for a build that rendered
# every page twice.  pr-validation.yml runs pytest, vitest and lint; it
# never opens a browser.  The only detector was a Playwright strict-mode
# violation ("resolved to 2 elements") in waivers-smoke.spec.js, in this
# workflow, which at the time ran nightly and so caught it a day late
# and on a branch nobody was watching.
#
# Hence: when a change touches the shell, the layout, the auth gate or
# the bundler config, run the browser BEFORE merge.  The paths below are
# deliberately narrow — see the note beside them.
#
# The "#S:1 streaming race" (#716) is FIXED — and it was never an app
# defect.  This paragraph used to say the staging copy was "occasionally
# left behind" at 1/15 on /arbitrage and 1/45 on /waivers.  Both the
# diagnosis and the numbers were wrong.
#
# Routes with a `loading.jsx` (/waivers, /arbitrage, ~8 others) are
# wrapped by the App Router in a Suspense boundary and STREAMED: the
# body arrives inside `<div hidden id="S:n">` and an inline
# `$RC("B:n","S:n")` moves it into place.  For a few milliseconds around
# that swap the document can satisfy a selector twice, and Playwright's
# strict mode throws ON THE SPOT rather than retrying.  Nothing is left
# behind and nothing is broken — a spec was simply asserting mid-stream.
# The server HTML was verified to contain exactly ONE copy on 20/20
# samples, so the duplicate never existed server-side at all.
#
# The real rate was ~13-20% per detector, not 1/45 — an order of
# magnitude worse than documented, across four detector points, which is
# why a fully green run had become close to a coin flip.
#
# Fixed by `awaitStreamSettled()` in tests/e2e/helpers/journey.js: wait
# for React's streaming machinery to finish, THEN assert.  Measured
# 25/25 and 12/12 clean afterward, from 13-20% failing.
#
# The locators themselves were NOT loosened, and must not be.  They are
# the only detector this repo has for the #709 class — a build that
# renders every page twice, which every performance metric is blind to.
# That bug is a PERSISTENT duplicate: it survives streaming completion
# and still trips strict mode.  Verified by injecting one after
# `awaitStreamSettled` and confirming the count still goes 1 -> 2.
#
# Failure handling mirrors scheduled-refresh.yml: an idempotent
# tracking issue labelled ``e2e-failures`` is opened (or commented
# on) so a broken journey can't sit unnoticed between manual runs.
#
# That tracker is about MAIN, and only main writes to it.  Both issue
# steps require `github.ref == 'refs/heads/main'` AND a non-PR event —
# the ref clause keeps a branch DISPATCH from speaking for main (#716),
# the event clause keeps a PR run from doing the same.  Neither clause
# subsumes the other in intent, so both are stated; see the notes on the
# steps themselves.

on:
  schedule:
    # Nightly at 06:23 UTC — offset from the on-the-hour crowd and
    # from scheduled-refresh's :42 cadence.
    - cron: "23 6 * * *"
  workflow_dispatch: {}
  pull_request:
    # The SSR/module-graph surface: anything here can change how the
    # app streams and hydrates, which is the bug class above.
    #
    # `frontend/components/ds/**` is deliberately ABSENT despite being
    # the widest-blast-radius candidate.  The design system is touched
    # by a large share of frontend PRs, so including it would quietly
    # turn this into the every-PR gate the header rules out.  Dispatch
    # the workflow by hand for a risky `ds` change instead.
    paths:
      - "frontend/app/layout.jsx"
      - "frontend/app/AppShellWrapper.jsx"
      - "frontend/components/AppShell.jsx"
      - "frontend/components/shell/**"
      - "frontend/middleware.js"
      - "frontend/lib/public-routes.js"
      # Bundler + framework config: `sideEffects`, dependency bumps and
      # next.config changes all move chunk boundaries, and chunk
      # boundaries are what decide when React defers a boundary.
      - "frontend/package.json"
      - "frontend/next.config.*"
      # The suite and its harness — a change here should prove itself.
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"

concurrency:
  # Per-ref, NOT one global group.  With a single `e2e-safety-net` group
  # and `cancel-in-progress`, the first PR run would cancel the nightly
  # (and every other PR's run) — and a cancelled run reports the same
  # "not green" as a failed one while having tested nothing.
  group: e2e-safety-net-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ``issues: write`` for the idempotent failure-tracking issue below.
permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: Boot stack + run journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Browsers for the TEST runner live in a dedicated path.  The
      # backend process is intentionally pointed elsewhere (see the
      # "Start backend" step) so its startup scrape — which would
      # otherwise launch the python-side Playwright and hit external
      # ranking sites — fails fast at browser launch and the committed
      # snapshot stays the single, deterministic data source.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install root + frontend deps
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund
          npm --prefix frontend install --no-audit --no-fund

      - name: Install Playwright chromium (test runner only)
        shell: bash
        run: |
          set -Eeuo pipefail
          npx playwright install --with-deps chromium

      - name: Preflight (compile checks, contract validation, data seed)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Seeds data/ from the committed exports/latest snapshot so
          # the backend serves a full contract without any scrape.
          npm run regression:preflight

      - name: Build frontend (production)
        shell: bash
        run: |
          set -Eeuo pipefail
          # server.py proxies page routes to :3000 with a 5s timeout;
          # a dev-mode first compile blows through that, so we always
          # run the production build here.
          npm --prefix frontend run build:nocheck

      - name: Generate test session secret
        shell: bash
        run: |
          set -Eeuo pipefail
          # Random per-run secret for the test-only session endpoint
          # (/api/test/create-session).  Both the server and the
          # Playwright runner read it; it never leaves this run.
          echo "E2E_TEST_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Start backend (FastAPI :8000)
        shell: bash
        run: |
          set -Eeuo pipefail
          # PLAYWRIGHT_BROWSERS_PATH is overridden to an empty dir for
          # the SERVER process only: the startup scrape's browser
          # launch fails immediately, load_from_disk keeps the seeded
          # snapshot, and no external ranking site is ever contacted.
          #
          # RATE_LIMIT_BYPASS_IPS exempts the runner from the public-API
          # rate limiter (60/min + 1000/hour per IP, src/api/rate_limit.py).
          # A full suite run fires thousands of public calls
          # (/api/auth/status on every page load, /api/public/league/*);
          # the hour bucket drains mid-run and the resulting 429s don't
          # look like rate limiting downstream — create-session 429 makes
          # signed-in specs skip, and an /api/auth/status 429 makes pages
          # render the logged-out shell, so they surface as bogus auth or
          # render failures.
          #
          # E2E_TEST_USERNAME is REQUIRED — /api/test/create-session
          # fails closed without it rather than defaulting to a real
          # account.  This throwaway name is deliberately NOT in the
          # admin allowlist; signed-in-smoke.spec.js already accepts
          # either 200 or 403 from the admin gate.
          mkdir -p /tmp/no-pw-browsers
          UPTIME_CHECK_ENABLED=false \
          ALLOW_DEFAULT_LOGIN_DEV=1 \
          E2E_TEST_MODE=1 \
          E2E_TEST_USERNAME=e2e-test-user \
          RATE_LIMIT_BYPASS_IPS=127.0.0.1 \
          PLAYWRIGHT_BROWSERS_PATH=/tmp/no-pw-browsers \
          nohup python server.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: Start frontend (Next.js :3000)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd frontend
          nohup npm run start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"

      - name: Wait for stack readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          # Backend ready = /api/status answers AND the seeded contract
          # is loaded (has_data).  /api/health intentionally returns
          # 503 while "degraded" (the startup scrape fails by design
          # here), so poll /api/status instead.
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/status | grep -q '"has_data": *true'; then
              echo "backend ready (attempt $i)"; break
            fi
            if [[ $i == 60 ]]; then
              echo "::error title=Backend never became ready::see backend.log artifact"
              tail -n 100 "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            sleep 2
          done
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || echo 000)
            if [[ "$code" == "200" ]]; then
              echo "frontend ready (attempt $i)"; break
            fi
            if [[ $i == 60 ]]; then
              echo "::error title=Frontend never became ready::see frontend.log artifact"
              tail -n 100 "$RUNNER_TEMP/frontend.log" || true
              exit 1
            fi
            sleep 2
          done

      # Answering /api/status is NOT the same as being ready to serve a
      # journey.  BDVM is flag-on by default, and its first /api/bdvm/*
      # call lazily ingests the nflverse corpus INSIDE the backend
      # process — measured in run 32316532286: ~112k weekly-stat rows +
      # ~158k snap-count rows + schedules, 00:17:05 to ~00:19:45, all
      # network + CPU on a 2-core runner.  While that runs the event
      # loop is starved, and the Next /api/dynasty-data bridge aborts a
      # response after a 4s INTER-CHUNK gap
      # (BACKEND_IDLE_TIMEOUT_MS in frontend/app/api/dynasty-data/route.js),
      # so a journey that loads the board inside that window gets a 503
      # and a "Rankings unavailable" page with zero rows.  That is what
      # failed journey-trade.spec.js:96 at ~00:19 in that run.
      #
      # Paying for the ingestion here MOVES it out of the journey window
      # instead of adding work, and the poll below is the honest
      # readiness condition: the very path the app uses must actually
      # serve the contract before the suite starts.
      #
      # ASSESSED after the durable repair (P1-BDVM-INGEST): the /api/bdvm
      # loop below is now REDUNDANT for its stated purpose — the request
      # path is cache-only and loads a materialised context, so a first
      # BDVM request can no longer start an ingest to move out of the
      # window (measured 49.9s -> 0.48s, 295,111 rows -> 0). It is left in
      # place deliberately rather than deleted in the same change: the
      # stronger replacement is a deterministic test
      # (tests/bdvm/test_request_path_is_local.py) which lands with the
      # repair, and removing a CI step here at the same time would make
      # this suite's result non-comparable to the baseline the repair is
      # required to hold. Removal belongs to the E2E lane.
      #
      # The POLL is NOT redundant and must stay whatever happens to the
      # loop: "answers /api/status" and "can serve the contract" are
      # different readiness conditions, and only the second one gates a
      # journey.
      - name: Warm lazy backend caches, then prove the data path serves
        shell: bash
        run: |
          set -Eeuo pipefail
          jar="$RUNNER_TEMP/warm-cookies.txt"
          curl -sf -X POST http://127.0.0.1:8000/api/test/create-session \
            -H "Authorization: Bearer $E2E_TEST_SECRET" -c "$jar" -o /dev/null
          keys=$(curl -sf http://127.0.0.1:8000/api/leagues \
            | python3 -c 'import json,sys; print(" ".join(l["key"] for l in json.load(sys.stdin).get("leagues", [])))')
          for key in $keys; do
            # A non-200 here is fine and is NOT swallowed error handling:
            # /api/bdvm/values documents 503 for flag-off, no snapshot and
            # a non-loaded league.  The point is to force the lazy
            # ingestion now, whatever the verdict; the poll below is what
            # actually gates the suite.
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 900 -b "$jar" \
              "http://127.0.0.1:8000/api/bdvm/values?leagueKey=$key" || echo 000)
            echo "bdvm warm leagueKey=$key -> $code"
          done
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 120 -b "$jar" \
              "http://127.0.0.1:3000/api/dynasty-data?view=app" || echo 000)
            if [[ "$code" == "200" ]]; then
              echo "data bridge serves the contract (attempt $i)"; break
            fi
            if [[ $i == 90 ]]; then
              echo "::error title=Data bridge never served the contract::the backend is still starved or unreachable — see backend.log artifact"
              tail -n 100 "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright suite
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          # Page navigations go straight to Next.js — production's nginx
          # topology, where nginx routes pages to Next directly.  Through
          # the backend's page proxy, "/" renders the anonymous shell even
          # for a signed-in session, and slow SSR passes like /league
          # exceed the proxy's 5s timeout.  See helpers/journey.js.
          #
          # This key was previously declared TWICE here, with the same
          # value and two complementary comments — a merge artifact.  YAML
          # parsers silently keep the last one; GitHub Actions REJECTS the
          # workflow outright, so every run of this file was a startup
          # failure with zero jobs.  A workflow that cannot start looks
          # exactly like one that starts and finds nothing wrong, which is
          # why the scheduled E2E run appeared healthy while never
          # executing.  Keep this key declared once.
          E2E_PAGE_ORIGIN: http://127.0.0.1:3000
          # Visual-regression baselines are not committed to the repo,
          # so pixel comparisons are skipped; the visual specs still
          # run their structural chart/render assertions.
          SKIP_VISUAL_REGRESSION: "1"
        run: |
          set -Eeuo pipefail
          # Chromium desktop + chromium mobile viewport.  The webkit
          # device projects (mobile-390/430) are local-only extras —
          # same rationale as prod-e2e-smoke.yml.
          npx playwright test \
            -c tests/e2e/playwright.config.js \
            --project=desktop-1366 \
            --project=mobile-chromium \
            --ignore-snapshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          retention-days: 7

      - name: Alert on workflow failure
        # Idempotent tracking issue, mirroring the pattern in
        # scheduled-refresh.yml: ensure the label exists, then comment
        # on the open ``e2e-failures`` issue if there is one, else
        # open a single labelled issue and keep reusing it.
        #
        # MAIN ONLY, and the two clauses below guard DIFFERENT things —
        # do not collapse them into one.
        #
        # The ref clause is about BRANCH DISPATCH, not about PRs.
        # Dispatching this workflow on a branch is a first-class use (it
        # is how a branch gets arbitrated against the green baseline),
        # and its result is reported in the run itself.  It just does not
        # get to speak for main.  See #716, and see the close step below
        # for why that one is the dangerous direction.
        #
        # The event clause states the PR-run intent at the point of use.
        # A PR run failing says something about the PR, not about main,
        # and the failure is already visible on the PR's own checks —
        # commenting here would bury the real signal under one comment
        # per red PR run, which is exactly the "permanently red" noise
        # the close step below was added to end.  It is redundant with
        # the ref clause TODAY (a `pull_request` run's ref is
        # `refs/pull/<n>/merge`, never `refs/heads/main`), and it is kept
        # so that adding a `push:` trigger later cannot silently make PR
        # runs eligible.
        if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(cat <<EOF
          E2E safety-net run failed on \`main\` (trigger: ${GITHUB_EVENT_NAME}).

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Triggered: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Likely causes:
          1. A critical journey genuinely regressed (check the
             uploaded Playwright report artifact for the failing spec
             + screenshot/trace).
          2. The committed data snapshot went stale or lost fields the
             contract needs (check the preflight + backend.log).
          3. Stack boot trouble on the runner (backend/frontend logs
             are attached as artifacts on failure).

          During the UI redesign: a failure here means the current
          phase broke a user journey — fix the page (or update the
          selector registry in tests/e2e/helpers/journey.js if only
          markup moved) before shipping the phase.
          EOF
          )
          gh label create e2e-failures \
            --color B60205 \
            --description "Auto-opened when the nightly E2E safety net fails" \
            2>/dev/null || true
          # The label alone does NOT identify this step's own tracker.
          # `e2e-failures` is a plain label and a human (or another
          # agent) can apply it to a hand-written defect issue — #753 is
          # exactly that.  Selecting `.[0]` off the label was therefore
          # picking whichever issue sorted first, and since `gh issue
          # list` sorts newest-first, #753 displaced the real tracker
          # (#732) the moment it was filed: run failures started
          # commenting on somebody's bug report.
          #
          # Identify the tracker by what this step actually creates —
          # author AND title.  Author alone would still match a
          # different bot-filed issue; title alone would match a human
          # who reused the string.  TRACKER_TITLE is used for BOTH the
          # lookup and the create below so the two cannot drift, and the
          # close step carries the same constant.
          #
          # AUDIT F-23.  The author clause compared against the bare
          # spelling `github-actions`, and the login this bot actually
          # files under is `github-actions[bot]`.  So the lookup matched
          # nothing, every failing run took the `create` branch, and the
          # close step below — carrying the identical clause — could
          # never drain what accumulated: 14 open issues, all titled
          # "E2E safety net failing", 0 comments between them.  The
          # mechanism was still working as late as #732, which holds 9
          # comments; every tracker filed after it holds none.
          #
          # `gh` reports a bot's login differently depending on which API
          # answers — GraphQL's `Bot` type gives `github-actions`, REST
          # gives `github-actions[bot]` — so pinning either spelling is a
          # bet.  Normalise the suffix away instead and the clause is
          # correct under both.  `tests/deploy/test_e2e_workflow_triggers.py`
          # pinned the losing spelling as a literal string, which is why a
          # green test suite sat on top of a dead selector for two weeks;
          # it now pins the normalisation.
          TRACKER_TITLE="E2E safety net failing"
          # A lookup that FAILS must not be indistinguishable from a lookup
          # that found nothing — that difference is the whole defect above.
          # `2>/dev/null || echo ""` erased it, so a broken `gh` call filed a
          # duplicate in silence.  On failure: say so loudly, then still file
          # the alert, because losing the alert entirely is worse than
          # filing a second copy of it.
          if ! EXISTING=$(gh issue list --state open --label e2e-failures \
                            --json number,title,author \
                            --jq "[.[] | select((.author.login | sub(\"\\\\[bot\\\\]$\"; \"\")) == \"github-actions\")
                                       | select(.title==\"${TRACKER_TITLE}\")] | .[0].number"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; filing an alert without deduplicating against the existing tracker"
            EXISTING=""
          fi
          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "$TRACKER_TITLE" \
              --body "$BODY" \
              --label e2e-failures
          fi

      - name: Close the tracking issue when the suite is green
        # The missing half of the pattern this workflow's header claims to
        # mirror.  `scheduled-refresh.yml` opens AND closes; every copy of
        # it — here, audit-identity-matches, audit-rank-form-drift,
        # intel-refresh — took only the failure half.
        #
        # The cost was not theoretical.  #588 was opened 2026-07-27, the
        # 07-28 nightly SUCCEEDED, and the issue stayed open and simply
        # accumulated comments.  So an open `e2e-failures` issue meant
        # "this failed at least once, ever" rather than "this is broken
        # now", which is worthless for triage and is a large part of why
        # the repo reads as permanently red.
        #
        # A green run of THIS workflow is the all-clear by construction:
        # the suite is the gate, so there is no per-step outcome to
        # re-derive.
        #
        # MAIN ONLY — same two clauses as the alert step, and this is
        # the stronger of the two requirements, because a false all-clear
        # CLOSES a real open failure while a false alarm merely files a
        # wrong one.  Both ways of not being main are live here:
        #
        # - a green DISPATCH on a branch would issue main's all-clear
        #   from code that was never on main (#716);
        # - a green PR run is green for a merge commit of a branch that
        #   is not main, so any shell-touching PR could silently clear a
        #   genuine nightly failure.
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Close EVERY open one, not just the first.  The alert step above
          # reads the first match, so if duplicates ever exist it comments on
          # one and leaves the rest orphaned forever; closing `.[]` drains
          # them.  Same reasoning as scheduled-refresh.yml.
          #
          # But drain only THIS STEP'S OWN TRACKERS.  `e2e-failures` is a
          # plain label, and a human or another agent can apply it to a
          # hand-written defect issue — #753 is exactly that: a real,
          # open, reproducible defect that happens to wear this label.
          # Selecting on the label alone, the first green run would have
          # closed it with a "green again" comment and buried it.
          #
          # That is this step's own stated fear — "a false all-clear
          # CLOSES a real open failure" — reached through a door the
          # note above did not anticipate.  Not a FALSE green: a TRUE
          # green closing an issue that was never a run tracker.
          #
          # So match what the alert step creates: author AND title.
          # Author alone would still close a different bot-filed issue;
          # title alone would close a human's issue that reused the
          # string.  TRACKER_TITLE must stay identical to the alert
          # step's — tests/deploy/test_e2e_workflow_triggers.py fails if
          # the two drift, or if either clause is dropped.
          #
          # F-23: the same bare-`github-actions` comparison was here too, so
          # this step has never closed anything.  Both halves carry the
          # normalisation, and they must stay identical — the guard test
          # fails if they drift.
          TRACKER_TITLE="E2E safety net failing"
          # A failed lookup here reads as "nothing open" and exits 0, i.e. a
          # green run silently declining to clear a real alert.  Fail loudly
          # instead: this direction cannot compensate by doing more work, so
          # the only honest outcome is to say the all-clear did not run.
          if ! OPEN=$(gh issue list --state open --label e2e-failures \
                        --json number,title,author \
                        --jq ".[] | select((.author.login | sub(\"\\\\[bot\\\\]$\"; \"\")) == \"github-actions\")
                                  | select(.title==\"${TRACKER_TITLE}\") | .number"); then
            echo "::error title=Tracker lookup failed::gh issue list failed; the green all-clear did NOT run and any open tracker is still open"
            exit 1
          fi
          if [[ -z "$OPEN" ]]; then
            echo "no open e2e-failures issue; nothing to close"
            exit 0
          fi
          for N in $OPEN; do
            echo "closing #${N}"
            gh issue close "$N" --reason completed --comment \
              "E2E safety net is green again on \`main\` — every critical journey passed.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Closed: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Reopened automatically by the alert step if the suite fails again." || true
          done
