name: Format FFPC production config test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/sharp-production-population
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'ruff~=0.6.0'
      - run: python -m ruff format tests/sharp/test_ffpc_production_config.py
      - name: Commit formatted file
        run: |
          rm -f .github/workflows/format-ffpc-config-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style(ffpc): apply repository formatter"
          git push origin HEAD:fix/sharp-production-population
