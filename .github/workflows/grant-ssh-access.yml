name: Grant SSH Access

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "Your PUBLIC key line (starts with ssh-ed25519 or ssh-rsa). Never paste a private key."
        required: true
        type: string

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Install key
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -qiE 'PRIVATE KEY' <<<"$PUBLIC_KEY"; then
            echo "::error::That is a PRIVATE key. Paste the .pub contents instead, and rotate the key you pasted."
            exit 1
          fi
          printf '%s\n' "$PUBLIC_KEY" > /tmp/k.pub
          ssh-keygen -lf /tmp/k.pub

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS"     | sed 's/\r$//' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$PUBLIC_KEY" | ssh -i ~/.ssh/id_ed25519 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'umask 077
             install -d -m 700 ~/.ssh
             touch ~/.ssh/authorized_keys
             chmod 600 ~/.ssh/authorized_keys
             cp -a ~/.ssh/authorized_keys ~/.ssh/authorized_keys.bak
             K=$(cat)
             if grep -qF "$K" ~/.ssh/authorized_keys; then
               echo "ALREADY_PRESENT"
             else
               printf "%s\n" "$K" >> ~/.ssh/authorized_keys
               echo "ADDED"
             fi
             echo "user=$(whoami) host=$(hostname)"'

          echo "Now connect with:  ssh -i <your-key> $DEPLOY_USER@$DEPLOY_HOST"
