name: Force Sharp Production Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-sharp-production-now.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-sharp-production-now
  cancel-in-progress: true

jobs:
  force-production:
    name: Restart Backend And Populate Sharp Tracker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Configure production SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "::error::${name} is empty"; exit 1; }
          done
          DEPLOY_PORT_RESOLVED="${DEPLOY_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          {
            echo "DEPLOY_PORT_RESOLVED=${DEPLOY_PORT_RESOLVED}"
            echo "DEPLOY_KEY_FILE=$HOME/.ssh/id_ed25519"
            echo "DEPLOY_KNOWN_HOSTS_FILE=$HOME/.ssh/known_hosts"
          } >> "$GITHUB_ENV"

      - name: Write remote force script
        shell: bash
        run: |
          cat > /tmp/force-sharp-production.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          cd "${APP_DIR}"
          echo "[force-sharp] host=$(hostname) app=${APP_DIR} service=${SERVICE_NAME}"
          echo "[force-sharp] before=$(git rev-parse HEAD 2>/dev/null || true)"
          git fetch --prune origin main
          git reset --hard origin/main
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "[force-sharp] target=${TARGET_SHA}"

          sudo -n systemctl daemon-reload
          sudo -n systemctl restart "${SERVICE_NAME}"
          sleep 5
          sudo -n systemctl is-active "${SERVICE_NAME}"

          BOOTSTRAP_CODE=0
          APP_DIR="${APP_DIR}" \
          APP_USER="${APP_USER}" \
          VENV_DIR="${VENV_DIR}" \
          SERVICE_NAME="${SERVICE_NAME}" \
          FORCE_SHARP_RECORDS_KICK=true \
          SHARP_BOOTSTRAP_MAX_PASSES=3 \
            bash "${APP_DIR}/deploy/bootstrap-sharp-records.sh" || BOOTSTRAP_CODE=$?

          FFPC_CODE=0
          APP_DIR="${APP_DIR}" \
          APP_USER="${APP_USER}" \
          VENV_DIR="${VENV_DIR}" \
          SERVICE_NAME="${SERVICE_NAME}" \
            bash "${APP_DIR}/deploy/install-ffpc-sharp-service.sh" || FFPC_CODE=$?
          sudo -n systemctl reset-failed "${SERVICE_NAME}-ffpc-sharp.service" >/dev/null 2>&1 || true
          sudo -n systemctl start "${SERVICE_NAME}-ffpc-sharp.service" || FFPC_CODE=$?

          mkdir -p "${APP_DIR}/data/ops"
          BOOTSTRAP_CODE="${BOOTSTRAP_CODE}" FFPC_CODE="${FFPC_CODE}" TARGET_SHA="${TARGET_SHA}" \
          SERVICE_NAME="${SERVICE_NAME}" VENV_DIR="${VENV_DIR}" \
          "${VENV_DIR}/bin/python" - <<'PY' > "${APP_DIR}/data/ops/sharp-force-production-live.json"
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          def command(*args):
              proc = subprocess.run(args, text=True, capture_output=True, check=False)
              return {
                  "code": proc.returncode,
                  "stdout": proc.stdout.strip()[-4000:],
                  "stderr": proc.stderr.strip()[-4000:],
              }

          def fetch(path):
              url = "http://127.0.0.1:8000" + path
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Sharp-Force-Production/1.0", "Cache-Control": "no-cache"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode("utf-8", "replace")
                      try:
                          body = json.loads(raw)
                      except json.JSONDecodeError:
                          body = raw[:4000]
                      return {"status": response.status, "body": body}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw)
                  except json.JSONDecodeError:
                      body = raw[:4000]
                  return {"status": exc.code, "body": body}
              except Exception as exc:
                  return {"status": None, "error": f"{type(exc).__name__}: {exc}"}

          service = os.environ["SERVICE_NAME"]
          result = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "targetSha": os.environ.get("TARGET_SHA"),
              "bootstrapExitCode": int(os.environ.get("BOOTSTRAP_CODE", "0")),
              "ffpcExitCode": int(os.environ.get("FFPC_CODE", "0")),
              "services": {
                  "backend": command("sudo", "-n", "systemctl", "is-active", service),
                  "sleeperDiscoveryTimer": command("sudo", "-n", "systemctl", "is-active", f"{service}-sharp-discovery.timer"),
                  "sleeperRecordsTimer": command("sudo", "-n", "systemctl", "is-active", f"{service}-sharp-records.timer"),
                  "ffpcTimer": command("sudo", "-n", "systemctl", "is-active", f"{service}-ffpc-sharp.timer"),
              },
              "endpoints": {
                  "health": fetch("/api/health"),
                  "cohort": fetch("/api/sharp/cohort"),
                  "marketAll": fetch("/api/sharp/market?window=30d&platform=all&qualification=all&limit=10"),
                  "marketFfpc": fetch("/api/sharp/market?window=90d&platform=ffpc&qualification=provisional&limit=10"),
              },
              "journals": {
                  "backend": command("sudo", "-n", "journalctl", "-u", service, "-n", "120", "--no-pager"),
                  "sleeperRecords": command("sudo", "-n", "journalctl", "-u", f"{service}-sharp-records.service", "-n", "160", "--no-pager"),
                  "ffpc": command("sudo", "-n", "journalctl", "-u", f"{service}-ffpc-sharp.service", "-n", "160", "--no-pager"),
              },
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

          cat "${APP_DIR}/data/ops/sharp-force-production-live.json"

          MARKET_STATUS="$("${VENV_DIR}/bin/python" - "${APP_DIR}/data/ops/sharp-force-production-live.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          print(((data.get("endpoints") or {}).get("marketAll") or {}).get("status"))
          PY
          )"
          if [[ "${MARKET_STATUS}" != "200" ]]; then
            echo "[force-sharp] market endpoint is not healthy: ${MARKET_STATUS}" >&2
            exit 41
          fi
          if (( BOOTSTRAP_CODE != 0 || FFPC_CODE != 0 )); then
            echo "[force-sharp] collector bootstrap failed: sleeper=${BOOTSTRAP_CODE} ffpc=${FFPC_CODE}" >&2
            exit 42
          fi
          REMOTE
          chmod +x /tmp/force-sharp-production.sh

      - name: Force production update and collectors
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          PROD_VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          PROD_SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf -v REMOTE_ENV 'APP_DIR=%q APP_USER=%q VENV_DIR=%q SERVICE_NAME=%q' \
            "${PROD_APP_DIR}" "${DEPLOY_USER}" "${PROD_VENV_DIR}" "${PROD_SERVICE_NAME}"
          ssh \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=12 \
            -p "${DEPLOY_PORT_RESOLVED}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "${REMOTE_ENV} bash -s" < /tmp/force-sharp-production.sh

      - name: Retrieve live diagnostics
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data/ops
          scp \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -P "${DEPLOY_PORT_RESOLVED}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${PROD_APP_DIR}/data/ops/sharp-force-production-live.json" \
            data/ops/sharp-force-production-live.json
          cat data/ops/sharp-force-production-live.json

      - name: Commit live diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f data/ops/sharp-force-production-live.json ]] || exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add data/ops/sharp-force-production-live.json
          git commit -m "chore(ops): record forced Sharp production result" || exit 0
          git push origin HEAD:main
