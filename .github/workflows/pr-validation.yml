name: PR Validation

# Runs on every pull request to provide pre-merge feedback.
# This is the "preview/staging" gate â€” validates code quality before merge.
# Production deploy only happens after merge to main (see deploy.yml).

on:
  pull_request:
    branches:
      - main
      # Stacked PRs too.  A PR whose base is another work branch —
      # tier 2 on top of tier 1, say — matched none of these filters,
      # so GitHub created it with ZERO check runs.  Not a failing gate:
      # no gate at all, which reviews identically to a passing one and
      # is exactly the defect class ORCHESTRATION.md 6.15 names.
      #
      # The alternative was to wait for the base to merge (GitHub
      # auto-retargets an open PR to main when its base branch is
      # merged and deleted, and CI would run then).  That is true but
      # useless for review: the stack is reviewed BEFORE the base
      # merges, which is the whole point of stacking.
      - 'claude/**'
      - 'codex/**'
      #
      # A SECOND cause of zero check runs, and this one no trigger
      # config can fix. GitHub builds `pull_request` runs against the
      # computed merge ref (`refs/pull/N/merge`). When the PR has merge
      # conflicts that ref cannot be created, so the run is never
      # scheduled — the PR sits with NO checks at all, which on the
      # merge page reads identically to checks having passed.
      #
      # Observed on #625 (2026-07-29): zero check runs for the whole
      # time it was `mergeable_state: dirty`, then a run appeared and
      # went green within minutes of the conflicts being resolved.
      #
      # The mitigation is branch protection, not this file: a ruleset
      # that REQUIRES `Validate PR` turns "no checks" from something
      # that looks mergeable into something that cannot be merged.
      # Without it, a conflicted PR is an ungated PR.

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── Job layout (2026-11-07, sharded hard gate) ─────────────────────────
# The hard-gate unit suite used to run serially inside the one `Validate PR`
# job.  Over eight green full-backend runs on 2026-11-06/07 that single step
# took 74-106 minutes — ~93% of the job — while every other gate together took
# ~5.  The suite now runs as N duration-balanced shards on separate runners:
#
#   scope ──┬── checks    (format, lint, governance, import, contract, frontend)
#           ├── backend   (matrix: the SAME hard-gate command, 1/N of the files each)
#           └── livedata  (advisory, never blocks)
#   validate = "Validate PR"  (needs scope + checks + backend; always runs)
#
# Nothing is skipped by the split: `scripts/ci_test_shards.py` assigns every
# test file to exactly one shard, and `Validate PR` refuses to pass unless
# every shard's manifest proves the shards together executed every collected
# test, the collection floor holds and the skip budget is not exceeded.  The
# required-check name stays `Validate PR` (GitHub matches checks by job name;
# tests/deploy/test_main_protection_ruleset.py).
jobs:
  scope:
    name: Detect changed systems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.scope.outputs.python }}
      frontend: ${{ steps.scope.outputs.frontend }}
      high_risk: ${{ steps.scope.outputs.high_risk }}
      shards: ${{ steps.shards.outputs.shards }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Detect changed systems (tiered-validation path-awareness)
        # Single owner: scripts/ci_change_scope.py (standard library only, so
        # this job needs no dependency install). See
        # docs/AGENT_OPERATING_SYSTEM.md §3 "Tiered validation workflow —
        # L0 through L3". Decides which EXPENSIVE blocks (the backend hard
        # gate, the frontend install+vitest+build) are relevant to this diff
        # so a single-domain PR does not pay for both every time.
        #
        # A high-risk change (workflow files, dependency manifests, canonical
        # valuation/identity/history owners, shared adapters — see the module
        # docstring) forces BOTH blocks on regardless of which paths literally
        # changed, so a shared-dependency change can never silently narrow
        # validation.
        #
        # Fails safe: any detection error defaults every flag to "true" (run
        # everything). And if this whole JOB fails, `Validate PR` fails — a
        # skipped backend matrix can never read as a passed one.
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          # No --depth: a depth-limited fetch rewrites .git/shallow and
          # truncates history (see the same fetch in the backend job).
          git fetch --no-tags origin main || true
          python scripts/ci_change_scope.py --base origin/main --head HEAD --github-output

      - name: Shard plan
        id: shards
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/ci_test_shards.py matrix --github-output

  checks:
    name: Static, contract and frontend checks
    needs: scope
    runs-on: ubuntu-latest
    # 20-minute budget: the job legitimately takes ~11 minutes now
    # (full pytest + vitest + lint gates).  At 10 the runner killed
    # jobs during their final step and GitHub recorded them as
    # "cancelled", which looked like mystery cancellations.
    #
    # NOTE (2026-07-29 audit): the "+ vitest" in that sentence was
    # aspirational until this date — no vitest step existed in any
    # workflow.  It does now (see "Frontend unit tests" below), so the
    # comment is finally accurate.  vitest adds ~20s.
    #
    # 20 → 30 (2026-08-25): the suite legitimately grew past the old
    # ceiling — ten green runs that day measured 12.5-19.5 minutes, and
    # TWO runs were killed at exactly ~20m ("cancelled", which reads
    # like a supersede and cost an hour of diagnosis each time).
    #
    # 30 → 60 (2026-09-09): PR #1321 was killed at the 30-minute wall-clock
    # ceiling while the blocking pure-logic suite was still progressing
    # normally (~41%), causing every later blocking gate to be skipped.
    # This changes only runner headroom; no test, gate, or tolerance is
    # weakened. Sixty minutes preserves a finite hang bound while allowing
    # the current full suite to complete.
    # 60 → 80 (2026-10-01): the full suite now routinely takes 58-60 min
    # (measured: #1599 58.6 min, #1597 59.4 min on 2026-10-01), and #1597's
    # rerun-worthy run 36917378085 was cancelled at the 60-minute wall while
    # still running unit tests. Same rationale as before: runner headroom only;
    # no test, gate, or tolerance weakened; a finite hang bound is preserved.
    # 80 -> 120 (2026-10-19): the full suite now takes ~77 min. Release
    # train 11's PR Validation run 39212246131 spent 77:22 in unit tests
    # (the hard gate PASSED) and was then cancelled at the 80-minute wall,
    # skipping every later blocking step; its release check passed with
    # ~4 min to spare. Same rationale as each step above: runner headroom
    # only; no test, gate or tolerance weakened; a finite hang bound remains.
    # 120 -> 180 (2026-11-06): the hard suite now takes ~105-110 min. Full
    # Validate PR jobs that day: #2091 112 min, #2093 112 min, #2095 109 min
    # (all green), and #2100's run was still in unit tests at 114 min with
    # the frontend steps not yet started. Same rationale as each step above:
    # runner headroom only; no test, gate or tolerance weakened; a finite
    # hang bound remains. The durable fix is a faster suite (CW-41), not
    # another raise.
    # 180 -> 40 (2026-11-07): that durable fix landed as the sharded `backend`
    # job below; the history above is the serial suite's, kept because it is
    # why the shards exist. This job no longer runs the hard gate — its own
    # gates plus the frontend build take ~5-8 min.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the changed-files ruff gate can diff the
          # PR against its base SHA.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.lock.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Fetch base branch
        # The change-scope decision moved to the `scope` job; this keeps the
        # side effect later steps here relied on (an `origin/main` ref, full
        # history). Format, lint, governance/planning gates, the runtime
        # import gate and the API contract check stay unconditional: they are
        # cheap cross-cutting safety nets, not per-domain suites.
        shell: bash
        run: |
          set -Eeuo pipefail
          # No --depth: a depth-limited fetch rewrites .git/shallow.
          git fetch --no-tags origin main || true

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python format gate (ruff format --check)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Deterministic Black-compatible formatter. Hard-blocking is
          # safe: the repo-wide sweep already landed and the check is
          # idempotent. Config: pyproject.toml [tool.ruff].
          if ! python -m ruff format --check .; then
            echo "::group::Exact Ruff formatter diff"
            python -m ruff format .
            git diff -- .
            echo "::endgroup::"
            exit 1
          fi

      - name: Python lint (ruff check — whole repo, blocking)
        # Was changed-files-only, and that was right at the time: phase
        # A3 ratcheted enforcement onto new violations while a ~77-item
        # pre-existing backlog stayed unblocked, because whole-repo
        # enforcement against a dirty tree would have blocked every PR
        # on somebody else's mess.
        #
        # THE BACKLOG IS GONE. #708 cleared the last 37 (verified: `ruff
        # check .` reports 0 on main), so the condition the narrowing
        # existed for no longer holds, and the narrow gate now has a real
        # hole: it cannot see a violation in a file the PR did not touch.
        # That is exactly how the backlog rebuilds — nobody edits those
        # files, so nobody is ever told.
        #
        # It also could not catch the mistake it most needed to. While
        # clearing the 37, an incomplete rename left an undefined name
        # (F821) in a file the same PR HAD touched — the changed-files
        # gate would have caught that one. But the identical mistake in a
        # file left alone would have sailed through, and a repo that has
        # just reached zero is precisely when that gap starts costing.
        #
        # force-exclude in pyproject keeps excluded dirs excluded.
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check .

      - name: Decision-path coercion gate
        # The 2026-08-04 audit's largest cross-cutting pattern: missing
        # data resolving to an optimistic or fabricated number instead of
        # abstention. A team absent from a sim file becomes `or 0.0`
        # playoff odds and is told to SELL; an unknown FAAB budget becomes
        # `or 100`. Those had all been through review — a convention does
        # not catch three characters, so it is a gate.
        #
        # Blocking from introduction, which is safe because the baseline
        # absorbs the 618 pre-existing violations: only NEW coercions and
        # STALE allowances fail. That is the same ratchet the ruff gate
        # used through phase A3, and the same anti-rot rule as
        # `_LIVEDATA_MODULES` — an exemption nobody can check is how 33
        # core-blend tests sat outside the hard gate unnoticed.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_decision_coercions.py

      - name: Audit finding-status drift gate
        # Re-runs each Critical finding's defect signature and fails when
        # a finding recorded as closed has its signature back. Keeps
        # "41 Criticals closed" a checkable claim rather than a assertion
        # in a PR description — which is the failure mode that produced
        # the audit in the first place.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/audit_status.py

      - name: Planning integrity gate
        # Structural guards on the planning hierarchy. Each check exists
        # because the failure actually happened: two live CE registries in
        # which 18 of 22 identifiers named different capabilities, so a
        # binding owner decision citing "CE-19" resolved to a different
        # feature depending on which document you opened; an authorization
        # record that recorded B6 as merged in §1 while authorizing B6 as
        # next in §2; and 65 binding owner decisions living in a file the
        # governance index classified as superseded. Cheap to check,
        # expensive to discover a month later.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_planning_integrity.py

      - name: Product-plan governance gate
        # The companion structural guard: every planning-like document in
        # the tree must be classified in the governance index, so a new
        # owner addendum cannot quietly become a parallel roadmap.
        #
        # It existed and was never wired to any workflow, which is why it
        # sat red on ``main`` (C1-U6 follow-up 5) with nobody told. An
        # unwired gate is indistinguishable from a passing one.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_product_plan_governance.py

      - name: Python import gate
        shell: bash
        env:
          # ``server.py`` requires ``JASON_LOGIN_PASSWORD`` at import
          # time (audit M1 removed the source-code default).  CI
          # runners don't have prod's .env, so we use the explicit
          # dev escape hatch here.
          ALLOW_DEFAULT_LOGIN_DEV: "1"
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import uvicorn
          import requests
          from playwright.async_api import async_playwright
          import server
          print("Runtime import gate passed.")
          PY
      - name: Check generated leagues contract
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          python -m scripts.generate_leagues_contract --check
      - name: API data contract check (structural lane — blocking)
        # BLOCKING, and deliberately scoped to the STRUCTURAL lane.
        #
        # Two repairs landed here on 2026-08-16, both of which had been
        # hiding each other:
        #
        # 1. The old guard looked for ``dynasty_data_*.json`` in the repo
        #    root or ``data/``.  Both are gitignored for that artifact —
        #    the only tracked payload is ``exports/latest/`` — so this step
        #    printed "No sample data; skipping" on EVERY run since it was
        #    written.  The gate had never executed.  ``validate_api_contract.py``
        #    now looks in ``exports/latest`` first, so it does.
        #
        # 2. Turning it on unmodified would have made a live KTC timeout
        #    fail every open PR, which is precisely the contamination this
        #    stabilization exists to remove.  ``--lane structural`` fails on
        #    what our code owns — schema, rank invariants, the 1..9999
        #    scale, blend-hull integrity, the pick-completeness census — and
        #    reports source-health conditions as warnings instead.
        #
        # The full lane still blocks the DEPLOY (deploy.yml), and the
        # advisory step below keeps the condition loud here.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/validate_api_contract.py --repo . --lane structural

      - name: Release-candidate freshness (advisory)
        # Answers the question `PR Validation` structurally cannot: is
        # the tree this run validated the tree that will actually merge?
        # Advisory here on purpose — main takes an automated data refresh
        # every two hours, and blocking on that would mean chasing it
        # forever.  The STRICT form runs once, deliberately, from
        # `.github/workflows/release-candidate.yml` at HEAD FREEZE.
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=200 || true
          python scripts/check_release_candidate.py --base origin/main --head HEAD

      - name: Source-health check (advisory — non-blocking)
        # The other half of the split.  A timed-out or empty upstream source
        # is real and must stay visible on the PR; it is simply not evidence
        # about the PR's code.  ``continue-on-error`` + ``always()`` so it
        # reports even when an earlier gate failed.
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_source_health.py --repo .

      - name: Deploy script syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in deploy/*.sh; do
            [[ -f "${script}" ]] || continue
            bash -n "${script}"
          done

      # Frontend bundle-size budget gate.  Builds the Next.js app
      # without checks (``build:nocheck``) then explicitly runs the
      # ``check:bundles`` script that compares each page's chunk size
      # against the per-page budget in
      # ``frontend/scripts/check-bundle-sizes.mjs``.  Splitting the
      # build from the check lets us print the full Next.js build
      # output even on success, while the check step's exit code is
      # what determines the gate.
      - name: Set up Node.js
        # Path-aware (tiered-validation L2): skipped when this diff
        # touches neither frontend/ nor a high-risk shared dependency (see
        # the "Detect changed systems" step above). A backend-only PR does
        # not pay for npm install + vitest + the Next.js build.
        if: ${{ needs.scope.outputs.frontend == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ needs.scope.outputs.frontend == 'true' }}
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # Frontend unit tests (vitest).  ADDED 2026-07-29 audit.
      #
      # These 80+ files / ~1,390 assertions existed since the frontend
      # was built and ran in NO workflow — not here, not in e2e.yml, not
      # in deploy.yml, not in smoke-test.yml.  The comment at the top of
      # this job claimed the gate was "full pytest + vitest + lint", so
      # the gap read as covered.  Everything the frontend owns outright
      # — buildRows materialization, the valuation overlay, waiver and
      # trade math, the BDVM display layer — was unverified on every PR.
      #
      # Placed BEFORE the build: unit failures should surface in seconds
      # rather than after a full Next.js compile.
      - name: Frontend unit tests (vitest)
        if: ${{ needs.scope.outputs.frontend == 'true' }}
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm test

      - name: Frontend build + bundle-size budget
        if: ${{ needs.scope.outputs.frontend == 'true' }}
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm run build:nocheck
          npm run check:bundles

      # Exercise the real Next output through the same manifest, tar layout,
      # checksum and extracted-byte verifier used by the deploy cutover.
      - name: Package and verify frontend release candidate
        if: ${{ needs.scope.outputs.frontend == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          python -m scripts.release_artifact create \
            --commit "${commit}" --node-version "$(node --version)" \
            --run-id "${GITHUB_RUN_ID}"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --exclude='frontend/.next/cache' \
            -cf calculator-release.tar \
            release-manifest.json requirements.lock.txt \
            frontend/package-lock.json frontend/.next
          sha256sum calculator-release.tar > calculator-release.tar.sha256
          sha256sum -c calculator-release.tar.sha256
          verify_dir="$(mktemp -d)"
          tar -xf calculator-release.tar -C "${verify_dir}"
          python -m scripts.release_artifact verify \
            --root "${verify_dir}" --commit "${commit}"

  backend:
    # The hard gate: everything EXCEPT data-coupled tests.  A real code
    # regression must fail here and block the PR.
    #
    # Same command, markers as the serial gate it replaced, with a bounded --maxfail=10 in place of -x (a failed shard still exits 1, so it still fails `Validate PR`; the log now shows up to ten failures per shard instead of the first); each shard
    # runs the files `scripts/ci_test_shards.py` assigns it (every file to
    # exactly one shard, duration-balanced) and writes a manifest that
    # `Validate PR` checks.  Path-aware (tiered-validation L2): skipped only
    # when the diff touches neither backend/tooling code nor a high-risk
    # shared dependency.
    name: Backend hard gate (shard ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }})
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    # One shard is ~1/8 of a suite that took 74-106 min serially; 45 leaves
    # the ~1.8x runner-speed variance (CQ-29) plus setup inside a finite bound.
    timeout-minutes: 45
    strategy:
      # Every shard reports its own first failure: one red shard does not
      # cancel the others, so one round surfaces every independent break.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.lock.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Fetch base branch
        shell: bash
        run: |
          set -Eeuo pipefail
          # No --depth: the checkout is fetch-depth 0, and a depth-limited
          # fetch here rewrites .git/shallow and truncates history — which
          # made the feature-dictionary lock-history gate
          # (tests/model_registry/test_feature_dictionary.py) fail as
          # "shallow boundary" on every PR running the backend suite.
          git fetch --no-tags origin main || true

      - name: Install tesseract-ocr (screenshot import OCR tests)
        # The screenshot trade importer (C3-IMPORT-IMAGE) shells out to the
        # tesseract binary.  Installing it here makes the real-OCR tests
        # (``@pytest.mark.tesseract``) RUN in the hard gate instead of
        # skipping; without the binary they skip and only the fake-engine
        # tests cover the pipeline.
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends tesseract-ocr
          tesseract --version | head -1

      - name: Run unit tests (hard gate — pure logic)
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          # The hard gate must not depend on the live site being up.
          # ``server`` enables its uptime watchdog by default, so every
          # TestClient used to fire a real request at production and its
          # shutdown joined that thread.  Measured 2026-08-12 during a
          # production ``/api/`` outage: 6.07s per client.  An outage must
          # fail a health check, not time out an unrelated PR.
          # ``tests/conftest.py`` sets the same default via ``setdefault``;
          # this line keeps the CI policy visible in the workflow.
          UPTIME_CHECK_ENABLED: "0"
          RISKIT_TEST_SHARD: ${{ matrix.shard }}/${{ needs.scope.outputs.shard_count }}
          RISKIT_TEST_SHARD_MANIFEST: ${{ runner.temp }}/shard-manifest/shard-${{ matrix.shard }}.json
        run: |
          set -Eeuo pipefail
          # Runner speed varies ~1.8x between GitHub-hosted runners (CQ-29,
          # 2026-10-19).  Record the CPU and the slowest tests so a slow run
          # is diagnosable from its own log.
          grep -m1 'model name' /proc/cpuinfo || true
          python -m pytest tests/ --maxfail=10 -q --tb=short -m "not livedata" --durations=30 --durations-min=5

      - name: Upload shard manifest
        # Always: a failed shard's manifest still names what it selected, and
        # a missing manifest is itself a `Validate PR` failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-manifest/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14
          # "Re-run failed jobs" re-uploads the same name; the re-run's
          # manifest must replace the failed attempt's.
          overwrite: true

  livedata:
    # Data-coupled tests (live scraped board/exports).  A routine source
    # row-count dip / scrape churn is NOT a code defect and must NOT block
    # every PR (it did, repeatedly).  Advisory: the step's continue-on-error
    # keeps this job green, and `Validate PR` does not need it.  The
    # deploy-time #451 served-board gate + the static
    # test_source_floor_invariant hard gate remain the real guards.
    name: Live-data tests (advisory)
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.lock.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python scripts/python_lock.py check
          pip install --require-hashes -r requirements-dev.lock.txt

      - name: Run live-data tests (advisory — non-blocking)
        continue-on-error: true
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          python -m pytest tests/ -q --tb=short -m livedata

  dependency-audit:
    # ADVISORY.  Known-vulnerability reports for the locked Python and npm
    # dependency sets.  Both steps and the job are continue-on-error and
    # `validate` does not list this job in `needs`, so a new advisory published
    # against an untouched lockfile can never fail or block a PR -- the same
    # posture as the live-data tier above.  It reads lockfiles only (no
    # install of the app, no secrets) and reports to the job summary.
    # Run `python -m pip_audit` / `npm audit` locally to reproduce.
    name: Dependency audit (advisory)
    permissions:
      contents: read
    needs: scope
    if: ${{ needs.scope.outputs.python == 'true' || needs.scope.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit (advisory — non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python -m pip install --quiet pip-audit==2.9.0
          {
            echo "### pip-audit (advisory)"
            for lock in requirements.lock.txt requirements-dev.lock.txt; do
              echo "#### ${lock}"
              echo '```'
              python -m pip_audit --requirement "${lock}" --no-deps --disable-pip --progress-spinner off 2>&1 || true
              echo '```'
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: npm audit (advisory — non-blocking)
        continue-on-error: true
        shell: bash
        working-directory: frontend
        run: |
          set -uo pipefail
          {
            echo "### npm audit (advisory, production dependencies)"
            echo '```'
            npm audit --omit=dev --package-lock-only --audit-level=high 2>&1 || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

  validate:
    # The required check.  Passes only when the change-scope job, the static
    # checks and — whenever the backend is in scope — every backend shard
    # succeeded AND their manifests prove the shards together executed every
    # collected hard-gate test exactly once.  `always()`, not `!cancelled()`:
    # under `!cancelled()` a manually cancelled run leaves this job SKIPPED,
    # and GitHub counts a skipped required check as satisfied — the old single
    # job ended "cancelled", which blocks a merge.  Here a cancelled
    # dependency is a red `Validate PR`; the cost is a red check on commits a
    # newer push superseded, which nothing merges.
    name: Validate PR
    needs: [scope, checks, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: ${{ needs.scope.outputs.python == 'true' }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ needs.scope.outputs.python == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download shard manifests
        if: ${{ needs.scope.outputs.python == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: backend-shard-*
          path: shard-manifests

      - name: Prove the sharded hard gate ran every test
        # executed == selected per shard, the shards partition one collected
        # set, collected >= floor, skipped <= budget (config/ci/test_shards.json;
        # audit W24-F001).  Runs even when a shard failed so the omission
        # report is never hidden behind the first red shard.
        if: ${{ always() && needs.scope.outputs.python == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/ci_test_shards.py verify --manifests shard-manifests

      - name: Every required job succeeded
        if: ${{ always() }}
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BACKEND_IN_SCOPE: ${{ needs.scope.outputs.python }}
        run: |
          set -Eeuo pipefail
          echo "scope=${SCOPE_RESULT} checks=${CHECKS_RESULT} backend=${BACKEND_RESULT} backend_in_scope=${BACKEND_IN_SCOPE}"
          fail=0
          if [[ "${SCOPE_RESULT}" != "success" ]]; then
            echo "::error::change-scope job did not succeed (${SCOPE_RESULT})"
            fail=1
          fi
          if [[ "${CHECKS_RESULT}" != "success" ]]; then
            echo "::error::static/contract/frontend checks did not succeed (${CHECKS_RESULT})"
            fail=1
          fi
          if [[ "${BACKEND_IN_SCOPE}" == "true" ]]; then
            if [[ "${BACKEND_RESULT}" != "success" ]]; then
              echo "::error::backend hard gate did not succeed (${BACKEND_RESULT})"
              fail=1
            fi
          elif [[ "${BACKEND_IN_SCOPE}" != "false" ]]; then
            echo "::error::change scope did not say whether the backend is in scope (${BACKEND_IN_SCOPE:-empty})"
            fail=1
          fi
          exit "${fail}"
