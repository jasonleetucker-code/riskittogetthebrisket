name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install repository Ruff version
        run: python -m pip install 'ruff~=0.6.0'

      - name: Format FFPC implementation and restore validation workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          branch='feature/unified-ffpc-sharp'
          git fetch origin main "${branch}"
          git checkout -B "${branch}" "origin/${branch}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py')
          if ((${#files[@]})); then
            printf 'Formatting %s\n' "${files[@]}"
            python -m ruff format "${files[@]}"
            python -m ruff check --fix "${files[@]}" || true
          fi
          rm -f .github/workflows/format-unified-ffpc-branch.yml
          git show origin/main:.github/workflows/pr-validation.yml > .github/workflows/pr-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatter changes to commit.'
            exit 0
          fi
          git commit -m 'Format unified FFPC implementation'
          git push origin HEAD:"${branch}"
