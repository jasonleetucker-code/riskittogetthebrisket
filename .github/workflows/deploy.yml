name: Deploy Production

on:
  push:
    branches:
      - main
    # Skip deploy for data-only commits from scheduled-refresh.
    # Data flows to production via the server's own scrape loop, not via git deploy.
    paths-ignore:
      - 'data/**'
      - 'exports/**'
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Optional git ref (commit/tag/branch) to deploy. Default is current commit."
        required: false
        type: string
      allow_non_fast_forward:
        description: "Deploy even if it moves production BACKWARDS or sideways (intentional rollback). Normally leave false."
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Build Inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history. Consensus Edge's as-of panel tests reconstruct
          # past boards with `git show`, and `panel.is_shallow()` makes
          # them SKIP on a shallow clone — silently, so the deploy path
          # was strictly weaker than the PR path (which already sets
          # fetch-depth: 0). A regression reaching production via
          # force-push or workflow_dispatch would have been ungated.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (requirements-dev.txt)
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f "requirements.txt" ]] || { echo "::error title=Missing Python manifest::requirements.txt is required for production deploy dependency installation."; exit 1; }
          [[ -f "requirements-dev.txt" ]] || { echo "::error title=Missing dev manifest::requirements-dev.txt is required so the validate job can run the test suite."; exit 1; }
          python -m pip install --upgrade pip
          # Validate job installs the dev manifest (which chains in
          # requirements.txt) so the test step below has pytest + httpx
          # available.  Production itself only installs requirements.txt
          # on the production host via deploy/deploy.sh::prepare_python_runtime.
          pip install -r requirements-dev.txt

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python format gate (ruff format --check)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Defense-in-depth mirror of the pr-validation format gate so
          # a hotfix pushed straight to main can't bypass it.
          python -m ruff format --check .

      - name: Python lint (ruff check — blocking mirror)
        # Now blocking, matching the format gate directly above it and
        # for the same stated reason: "a hotfix pushed straight to main
        # can't bypass it". The PR gate cannot see a direct push, and
        # this repo has several — the refresh workflows commit to main
        # every 2h as github-actions[bot].
        #
        # It was report-only, described as "a visible signal of the
        # pre-existing backlog". That backlog is gone (#708), so the
        # signal has nothing left to show, and a report-only step whose
        # output nobody has any reason to read is a guard that cannot
        # fire — ORCHESTRATION §6.15's own subject.
        #
        # Scope note, because this is the riskier of the two changes: a
        # violation here fails a DEPLOY, not a PR. That is deliberate —
        # the format gate above already accepts the same trade — but it
        # means main must be kept clean, which is now true and enforced
        # upstream by the PR gate. If this ever fires on a direct push,
        # the fix is to clean main, not to revert this to report-only.
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check . --output-format concise

      - name: Python runtime import gate
        shell: bash
        env:
          # ``server.py`` requires ``JASON_LOGIN_PASSWORD`` at import
          # time (audit M1 removed the source-code default).  CI
          # runners don't have prod's .env, so we use the explicit
          # dev escape hatch here.  The runner ALSO never serves
          # auth requests — this env only affects the import-time
          # guard.
          ALLOW_DEFAULT_LOGIN_DEV: "1"
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi  # noqa: F401
          import uvicorn  # noqa: F401
          import requests  # noqa: F401
          from playwright.async_api import async_playwright  # noqa: F401
          import server  # noqa: F401
          print("Runtime import gate passed.")
          PY
      - name: Run unit tests (hard gate — pure logic)
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          # Same policy as pr-validation.yml, and it matters more here:
          # ``server`` enables its uptime watchdog by default, so every
          # TestClient probes the live site and its shutdown joins that
          # thread.  With production's ``/api/`` wedged, this step ran
          # long enough to burn the job's 20-minute budget — which would
          # block the very deploy that could fix production.
          # ``tests/conftest.py`` sets the same default; stated here so
          # the policy is visible in the workflow.
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          # Hard gate: real code regressions block the deploy.  Data-
          # coupled tests are advisory below — the #451 served-board
          # coverage gate in verify-deploy.sh is the real deploy-time
          # guard against genuine source degradation, so a routine
          # scrape-churn dip must not false-block a deploy.
          python -m pytest tests/ -x -q --tb=short -m "not livedata"

      - name: Run live-data tests (advisory — non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          # Advisory, but it spends the same job budget.
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          python -m pytest tests/ -q --tb=short -m livedata

      - name: API data contract check (FULL lane — blocking)
        # The deploy ships ``exports/`` and ``data/`` to the box (that is why
        # scheduled-refresh.yml dispatches this workflow after a scrape), so
        # here the source-health half is exactly the point: refusing to ship
        # a board built without a critical market is fail-safe — production
        # keeps serving what it already has.
        #
        # This step had also never run before 2026-08-16: it looked for the
        # payload in two gitignored locations and skipped every time.  The
        # only thing blocking a source-degraded deploy was a unit test that
        # happened to assert ``contractHealth.ok`` — i.e. the contamination
        # bug WAS the production guard.  It is a named gate now.
        #
        # Recovery is automatic and needs no override: the 2-hourly refresh
        # re-scrapes and the condition clears on the next healthy run.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/validate_api_contract.py --repo . --lane full

      - name: Validate required deploy artifacts exist
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f "deploy/deploy.sh" ]]; then
            echo "::error title=Missing required deploy script::deploy/deploy.sh is required by the deploy job remote execution path but does not exist in this repository."
            echo "::error::Either add deploy/deploy.sh or update deploy strategy/path in .github/workflows/deploy.yml."
            exit 1
          fi
          if [[ ! -f "requirements.txt" ]]; then
            echo "::error title=Missing Python manifest::requirements.txt is required for production deploy dependency installation."
            exit 1
          fi

      - name: Deploy script syntax gate (existing scripts only)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n "deploy/deploy.sh"

          for script in deploy/*.sh; do
            [[ -f "${script}" ]] || continue
            [[ "${script}" == "deploy/deploy.sh" ]] && continue
            bash -n "${script}"
          done

      # Per-page bundle-size budgets are normally enforced by
      # ``pr-validation.yml`` before a PR can merge.  This duplicate
      # check on the deploy path is defence in depth — it catches the
      # cases where main is updated outside the PR flow (force-push,
      # data-refresh commits, hotfixes) and a bloated chunk would
      # otherwise ship to prod without ever hitting the gate.
      - name: Set up Node (for bundle gate)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend bundle-size gate
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          # Frontend unit tests run on the PR path but did NOT run here,
          # so anything reaching main outside the PR flow shipped with
          # its JS logic ungated — the same asymmetry as the shallow
          # clone above.
          npm test
          npm run build
          # ``check:bundles`` runs as part of ``npm run build`` per
          # the package.json script, but call it again explicitly so
          # the workflow log shows a clean ✓ separately from the build.
          npm run check:bundles

  deploy:
    name: Deploy To Production
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    environment: production
    steps:
      # This job did not previously check out the repo — it only needed
      # SSH.  The deploy-skip guard below does merge-base ancestry
      # between the sha being deployed and the sha already in
      # production, so it needs real history here.
      - name: Checkout (full history for the deploy-skip guard)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preflight validate deploy inputs (no SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          PROD_VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          PROD_DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
          PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
          PROD_SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          require_non_empty() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "${value}" ]]; then
              echo "::error title=Missing Deploy Configuration::Required secret ${name} is empty or not set."
              exit 1
            fi
          }

          require_non_empty DEPLOY_HOST
          require_non_empty DEPLOY_USER
          require_non_empty DEPLOY_SSH_PRIVATE_KEY
          require_non_empty DEPLOY_KNOWN_HOSTS

          DEPLOY_HOST_RESOLVED="${DEPLOY_HOST}"
          DEPLOY_USER_RESOLVED="${DEPLOY_USER}"
          DEPLOY_PORT_RESOLVED="${DEPLOY_PORT:-22}"
          DEPLOY_KEY_RESOLVED="${DEPLOY_SSH_PRIVATE_KEY}"
          DEPLOY_KNOWN_HOSTS_RESOLVED="${DEPLOY_KNOWN_HOSTS}"

          if ! [[ "${DEPLOY_PORT_RESOLVED}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid SSH Port::Resolved deploy port must be numeric; got '${DEPLOY_PORT_RESOLVED}'."
            exit 1
          fi

          if ! grep -Eq 'BEGIN [A-Z0-9 ]*PRIVATE KEY' <<<"${DEPLOY_KEY_RESOLVED}"; then
            echo "::error title=Invalid SSH private key::Key does not look like a PEM/OpenSSH private key."
            exit 1
          fi

          if ! grep -Eq '(^|[[:space:]])(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)|^\|1\|' <<<"${DEPLOY_KNOWN_HOSTS_RESOLVED}"; then
            echo "::error title=Invalid known_hosts::Known hosts data is missing a valid host key entry."
            exit 1
          fi

          [[ -n "${DEPLOY_PORT:-}" ]] || echo "DEPLOY_PORT not set; defaulting to 22."

          install -d -m 700 "$HOME/.ssh"
          DEPLOY_KEY_FILE="$HOME/.ssh/id_ed25519"
          DEPLOY_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"

          printf '%s\n' "${DEPLOY_KEY_RESOLVED}" | sed 's/\r$//' > "${DEPLOY_KEY_FILE}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS_RESOLVED}" | sed 's/\r$//' > "${DEPLOY_KNOWN_HOSTS_FILE}"

          chmod 600 "${DEPLOY_KEY_FILE}"
          chmod 644 "${DEPLOY_KNOWN_HOSTS_FILE}"

          ssh-keygen -y -f "${DEPLOY_KEY_FILE}" >/dev/null
          [[ -s "${DEPLOY_KNOWN_HOSTS_FILE}" ]] || { echo "::error title=known_hosts empty::Known hosts secret resolved to an empty file."; exit 1; }

          echo "Deploy key fingerprint:"
          ssh-keygen -lf "${DEPLOY_KEY_FILE}"
          ssh-keygen -y -f "${DEPLOY_KEY_FILE}" > /tmp/deploy_key.pub
          echo "Derived public key fingerprint:"
          ssh-keygen -lf /tmp/deploy_key.pub

          {
            echo "DEPLOY_HOST_RESOLVED=${DEPLOY_HOST_RESOLVED}"
            echo "DEPLOY_USER_RESOLVED=${DEPLOY_USER_RESOLVED}"
            echo "DEPLOY_PORT_RESOLVED=${DEPLOY_PORT_RESOLVED}"
            echo "DEPLOY_KEY_FILE=${DEPLOY_KEY_FILE}"
            echo "DEPLOY_KNOWN_HOSTS_FILE=${DEPLOY_KNOWN_HOSTS_FILE}"
          } >> "$GITHUB_ENV"

          echo "Deploy target: ${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}:${DEPLOY_PORT_RESOLVED}"
          echo "Remote app dir: ${PROD_APP_DIR}"
          echo "Remote venv dir: ${PROD_VENV_DIR}"
          echo "Remote deploy state dir: ${PROD_DEPLOY_STATE_DIR}"
          echo "Remote last successful deploy file: ${PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}"
          echo "Remote service: ${PROD_SERVICE_NAME}"

      - name: Validate known_hosts entry for target host
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET_HOST="${DEPLOY_HOST_RESOLVED}"

          if [[ "${SSH_PORT}" == "22" ]]; then
            LOOKUP="${TARGET_HOST}"
          else
            LOOKUP="[${TARGET_HOST}]:${SSH_PORT}"
          fi

          if ! ssh-keygen -F "${LOOKUP}" -f "${DEPLOY_KNOWN_HOSTS_FILE}" >/dev/null 2>&1; then
            echo "::error title=Host key mismatch::No known_hosts entry found for ${LOOKUP}. Recreate DEPLOY_KNOWN_HOSTS with: ssh-keyscan -H -p ${SSH_PORT} ${TARGET_HOST}"
            exit 1
          fi

      - name: SSH preflight (connectivity + remote paths)
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${APP_DIR}" ]] || { echo "::error title=Missing APP_DIR::PROD_APP_DIR cannot be empty."; exit 1; }
          [[ -n "${VENV_DIR}" ]] || { echo "::error title=Missing VENV_DIR::PROD_VENV_DIR cannot be empty."; exit 1; }

          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          echo "Testing SSH connectivity to ${TARGET}:${SSH_PORT}"
          ssh \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${SSH_PORT}" \
            "${TARGET}" \
            "set -Eeuo pipefail; \
             echo '[remote] pwd:'; pwd; \
             echo \"[remote] connected host=\$(hostname) user=\$(id -un)\"; \
             command -v bash >/dev/null || { echo \"[remote] bash not found\" >&2; exit 11; }; \
             command -v git >/dev/null || { echo \"[remote] git not found\" >&2; exit 16; }; \
             command -v python3 >/dev/null || { echo \"[remote] python3 not found\" >&2; exit 17; }; \
             [[ -d '${APP_DIR}' ]] || { echo \"[remote] APP_DIR missing: ${APP_DIR}\" >&2; exit 12; }; \
             [[ -d '${APP_DIR}/.git' ]] || { echo \"[remote] APP_DIR is not a git repo: ${APP_DIR}\" >&2; exit 13; }; \
             echo '[remote] git top-level:'; git -C '${APP_DIR}' rev-parse --show-toplevel; \
             echo '[remote] git status --short:'; git -C '${APP_DIR}' status --short || true; \
             command -v systemctl >/dev/null || { echo \"[remote] systemctl not found\" >&2; exit 15; }; \
             command -v sudo >/dev/null || { echo \"[remote] sudo not found\" >&2; exit 18; }; \
             ( [[ -x /bin/systemctl ]] && sudo -n /bin/systemctl --version >/dev/null 2>&1 ) || ( [[ -x /usr/bin/systemctl ]] && sudo -n /usr/bin/systemctl --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for systemctl (/bin/systemctl or /usr/bin/systemctl)\" >&2; exit 19; }; \
             ( [[ -x /bin/journalctl ]] && sudo -n /bin/journalctl --version >/dev/null 2>&1 ) || ( [[ -x /usr/bin/journalctl ]] && sudo -n /usr/bin/journalctl --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for journalctl (/bin/journalctl or /usr/bin/journalctl)\" >&2; exit 20; }; \
             ( [[ -x /usr/bin/install ]] && sudo -n /usr/bin/install --version >/dev/null 2>&1 ) || ( [[ -x /bin/install ]] && sudo -n /bin/install --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for install (/usr/bin/install or /bin/install)\" >&2; exit 21; }; \
             echo '[remote] preflight checks passed'"

      # ── Deploy-skip guard ────────────────────────────────────────────
      # Concurrency group ``production-deploy`` sets
      # ``cancel-in-progress: false``, which protects the RUNNING deploy
      # but not queued ones: GitHub holds only ONE pending run per group,
      # so when N merges land inside a few minutes each new run evicts the
      # previously-queued one.  Only the first and last deploys survive;
      # every middle merge's deploy is silently cancelled.
      #
      # That is harmless while the train is linear, because the surviving
      # run's sha is a descendant and carries the evicted commits anyway.
      # It is NOT harmless when it isn't: a revert, a force-push, or a
      # ``workflow_dispatch`` pinned to an older ``deploy_ref`` (which
      # this workflow accepts) can leave a commit that reached ``main``
      # silently unshipped, with a grey "cancelled" tick as the only
      # trace — and that tick reads as "my change failed to deploy" when
      # it actually shipped.
      #
      # So assert the property rather than relying on it: whatever we are
      # about to deploy must be a descendant of what is already in
      # production.  Observed 2026-07-26, when three merges in nine
      # minutes cancelled the middle deploy (run 30217214959).
      - name: Guard against skipping or reversing a deploy
        env:
          DEPLOY_REF_INPUT: ${{ inputs.deploy_ref }}
          ALLOW_NON_FF: ${{ inputs.allow_non_fast_forward }}
          LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          DEPLOY_REF="${DEPLOY_REF_INPUT:-${GITHUB_SHA}}"
          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          # Read the last sha that actually reached production.  A missing
          # or unreadable file is not an error — first deploy, or a fresh
          # host — it just means there is no baseline to compare against.
          LAST_DEPLOYED="$(
            ssh \
              -i "${DEPLOY_KEY_FILE}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
              -o ConnectTimeout=15 \
              -p "${SSH_PORT}" \
              "${TARGET}" \
              "cat '${LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}' 2>/dev/null | tr -d '[:space:]'" \
            || true
          )"

          TARGET_SHA="$(git rev-parse --verify "${DEPLOY_REF}^{commit}" 2>/dev/null || true)"
          if [[ -z "${TARGET_SHA}" ]]; then
            echo "::error title=Unknown deploy ref::'${DEPLOY_REF}' does not resolve to a commit in this checkout."
            exit 1
          fi
          echo "Deploying:      ${TARGET_SHA}"
          echo "In production:  ${LAST_DEPLOYED:-<none recorded>}"

          if [[ -z "${LAST_DEPLOYED}" ]]; then
            echo "::notice title=No deploy baseline::No last-successful-deploy commit recorded; skipping the ancestry check. This is expected on a first deploy."
            exit 0
          fi

          if ! git cat-file -e "${LAST_DEPLOYED}^{commit}" 2>/dev/null; then
            echo "::warning title=Baseline commit not found::The recorded production commit ${LAST_DEPLOYED} is not in this repository — history may have been rewritten. Cannot verify the deploy moves forward."
            if [[ "${ALLOW_NON_FF}" == "true" ]]; then
              echo "allow_non_fast_forward=true — proceeding anyway."
              exit 0
            fi
            echo "::error title=Cannot verify deploy safety::Re-run with allow_non_fast_forward=true if this is intentional."
            exit 1
          fi

          if [[ "${LAST_DEPLOYED}" == "${TARGET_SHA}" ]]; then
            echo "::notice title=Redeploy::Already at this commit; redeploying the same tree."
            exit 0
          fi

          if git merge-base --is-ancestor "${LAST_DEPLOYED}" "${TARGET_SHA}"; then
            AHEAD="$(git rev-list --count "${LAST_DEPLOYED}..${TARGET_SHA}")"
            echo "::notice title=Fast-forward deploy::Moving production forward by ${AHEAD} commit(s)."
            # Name them, so a cancelled middle deploy is visibly carried
            # rather than merely assumed to be.
            git log --oneline --no-decorate "${LAST_DEPLOYED}..${TARGET_SHA}" | sed 's/^/  shipping: /'
            exit 0
          fi

          # Not a fast-forward.  Either we are going backwards (deploying
          # an ancestor of what is live) or the histories diverged.
          if git merge-base --is-ancestor "${TARGET_SHA}" "${LAST_DEPLOYED}"; then
            BEHIND="$(git rev-list --count "${TARGET_SHA}..${LAST_DEPLOYED}")"
            REASON="this would move production BACKWARDS by ${BEHIND} commit(s), un-shipping code that is already live"
          else
            REASON="the deploy ref and the live commit have DIVERGED (neither is an ancestor of the other) — likely a force-push or an unrelated ref"
          fi

          echo "Commits that would be lost from production:"
          git log --oneline --no-decorate "${TARGET_SHA}..${LAST_DEPLOYED}" | sed 's/^/  dropping: /'

          if [[ "${ALLOW_NON_FF}" == "true" ]]; then
            echo "::warning title=Non-fast-forward deploy::${REASON}. Proceeding because allow_non_fast_forward=true."
            exit 0
          fi

          echo "::error title=Deploy would skip or reverse shipped code::${REASON}. If this is an intentional rollback, re-run via workflow_dispatch with allow_non_fast_forward=true."
          exit 1

      - name: Run remote deploy script
        env:
          DEPLOY_REF_INPUT: ${{ github.event.inputs.deploy_ref }}
          APP_NAME: ${{ vars.PROD_APP_NAME || 'riskittogetthebrisket' }}
          APP_USER: ${{ vars.PROD_APP_USER || 'dynasty' }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
          LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
          SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
          DEPLOY_BRANCH: ${{ vars.PROD_DEPLOY_BRANCH || 'main' }}
          AUTO_ROLLBACK: ${{ vars.PROD_AUTO_ROLLBACK || 'true' }}
          APP_HOST: ${{ vars.PROD_APP_HOST || '127.0.0.1' }}
          APP_PORT: ${{ vars.PROD_APP_PORT || '8000' }}
          STRICT_LOCAL_HEALTH: ${{ vars.PROD_STRICT_LOCAL_HEALTH || 'false' }}
          PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          DEPLOY_REF="${DEPLOY_REF_INPUT:-${GITHUB_SHA}}"
          [[ -n "${DEPLOY_REF}" ]] || { echo "::error title=Missing DEPLOY_REF::Unable to determine deploy ref."; exit 1; }

          if [[ "${DEPLOY_REF}" =~ [[:space:]] ]]; then
            echo "::error title=Invalid DEPLOY_REF::deploy_ref cannot contain whitespace."
            exit 1
          fi

          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          echo "Deploying ref '${DEPLOY_REF}' to ${TARGET}:${SSH_PORT}"
          ssh \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${SSH_PORT}" \
            "${TARGET}" \
            "bash -s" <<EOF
          set -Eeuo pipefail
          export APP_NAME="${APP_NAME}"
          export APP_USER="${APP_USER}"
          export APP_DIR="${APP_DIR}"
          export VENV_DIR="${VENV_DIR}"
          export DEPLOY_STATE_DIR="${DEPLOY_STATE_DIR}"
          export LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE="${LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}"
          export SERVICE_NAME="${SERVICE_NAME}"
          export DEPLOY_BRANCH="${DEPLOY_BRANCH}"
          export DEPLOY_REF="${DEPLOY_REF}"
          export AUTO_ROLLBACK="${AUTO_ROLLBACK}"
          export APP_HOST="${APP_HOST}"
          export APP_PORT="${APP_PORT}"
          export STRICT_LOCAL_HEALTH="${STRICT_LOCAL_HEALTH}"
          export PUBLIC_URL="${PUBLIC_URL}"
          # Force the frontend rebuild on every deploy.  The production
          # server's login environment had RUN_FRONTEND_BUILD set to a
          # non-true value, which short-circuited maybe_build_frontend
          # and caused deploys to silently ship stale .next/ assets
          # (the ChunkLoadError outage).  Exporting it here guarantees
          # the remote shell inherits "true" regardless of any profile,
          # /etc/environment, or systemd-user default.
          #
          # CRITERIA FOR REMOVING THIS OVERRIDE: this can be deleted
          # once (a) the production login environment no longer sets
          # RUN_FRONTEND_BUILD anywhere (verified via
          # ``ssh prod env | grep RUN_FRONTEND_BUILD`` returning empty),
          # AND (b) we've shipped a deploy script change that requires
          # an explicit ``--rebuild-frontend`` flag rather than reading
          # this env var.  Until both conditions hold, keep the override
          # — silently shipping stale .next/ chunks is the worst class
          # of deploy bug we've seen.
          export RUN_FRONTEND_BUILD="true"

          [[ -n "\${APP_DIR}" ]] || { echo "[remote] APP_DIR is empty" >&2; exit 20; }
          [[ -d "\${APP_DIR}/.git" ]] || { echo "[remote] APP_DIR is not a git repo: \${APP_DIR}" >&2; exit 21; }

          if [[ ! -f "\${APP_DIR}/deploy/deploy.sh" ]]; then
            echo "[remote] deploy/deploy.sh missing before run; attempting git bootstrap."
            git -C "\${APP_DIR}" fetch --prune --tags origin
            if git -C "\${APP_DIR}" rev-parse --verify --quiet "\${DEPLOY_REF}^{commit}" >/dev/null; then
              git -C "\${APP_DIR}" checkout --force "\${DEPLOY_REF}"
            elif git -C "\${APP_DIR}" rev-parse --verify --quiet "origin/\${DEPLOY_BRANCH}^{commit}" >/dev/null; then
              git -C "\${APP_DIR}" checkout --force "origin/\${DEPLOY_BRANCH}"
            else
              echo "[remote] Unable to resolve \${DEPLOY_REF} or origin/\${DEPLOY_BRANCH} during bootstrap." >&2
              exit 22
            fi
          fi

          # Always refresh deploy.sh from the target ref before running it.
          # This prevents stale deploy scripts on the production server from
          # blocking deployments that include deploy-script fixes.
          # Write to a temp file first so a failed git-show does not truncate
          # the existing script to zero bytes.
          git -C "\${APP_DIR}" fetch --prune origin 2>/dev/null || true
          if git -C "\${APP_DIR}" rev-parse --verify --quiet "\${DEPLOY_REF}^{commit}" >/dev/null 2>&1; then
            _tmp_deploy="\${APP_DIR}/deploy/.deploy.sh.tmp"
            if git -C "\${APP_DIR}" show "\${DEPLOY_REF}:deploy/deploy.sh" > "\${_tmp_deploy}" 2>/dev/null && [[ -s "\${_tmp_deploy}" ]]; then
              mv -f "\${_tmp_deploy}" "\${APP_DIR}/deploy/deploy.sh"
            else
              rm -f "\${_tmp_deploy}"
            fi
          fi

          [[ -f "\${APP_DIR}/deploy/deploy.sh" ]] || { echo "[remote] Missing deploy script after bootstrap: \${APP_DIR}/deploy/deploy.sh" >&2; exit 23; }
          bash "\${APP_DIR}/deploy/deploy.sh"
          EOF

      - name: Post-deploy smoke test
        if: ${{ vars.PROD_PUBLIC_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"
          PASS=0
          FAIL=0

          check_endpoint() {
            local path="$1"
            local expect_code="${2:-200}"
            local full_url="${URL}${path}"
            local code
            # --globoff stops curl from treating literal [ and ] in URLs
            # as glob ranges — required for Next.js dynamic-route chunk
            # filenames like "app/api/public/league/[section]/route-*.js"
            # which preserve the brackets on disk.
            code=$(curl --silent --show-error --globoff --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "${full_url}" || echo "000")
            if [[ "${code}" == "${expect_code}" ]]; then
              echo "PASS: ${path} -> ${code}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${path} -> ${code} (expected ${expect_code})"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== Post-Deploy Smoke Test ==="
          echo "Target: ${URL}"

          # The service is restarted moments before this step runs, so
          # wait for it to finish loading its first payload before we
          # probe — a cold-start blip must not false-fail the deploy.
          echo "Waiting for ${URL}/api/health to become ready…"
          for _i in $(seq 1 30); do
            _hc=$(curl --silent --globoff --output /dev/null --max-time 10 \
              --write-out '%{http_code}' "${URL}/api/health" || echo "000")
            if [[ "${_hc}" == "200" ]]; then
              echo "  health ready after ~$(( _i * 3 ))s"
              break
            fi
            sleep 3
          done

          # The public-league snapshot is ALWAYS cold right after a
          # restart: the first request kicks a multi-season Sleeper
          # rebuild that can take minutes.  The event loop stays
          # responsive during the rebuild (threadpool offload, #519) —
          # which is why /api/status passes while /league and
          # /api/public/league still wait on the snapshot — but a 15s
          # single-shot probe here false-failed the 2026-07-25 deploy
          # AFTER verification had already passed.  Kick the rebuild
          # and poll until warm (up to ~6 min) before the pass/fail
          # probes below.
          echo "Waiting for ${URL}/api/public/league snapshot to come warm…"
          for _i in $(seq 1 24); do
            _plc=$(curl --silent --globoff --output /dev/null --max-time 20 \
              --write-out '%{http_code}' "${URL}/api/public/league" || echo "000")
            if [[ "${_plc}" == "200" ]]; then
              echo "  public-league snapshot warm after ~$(( _i * 15 ))s"
              break
            fi
            sleep 15
          done

          check_endpoint "/api/health" 200
          check_endpoint "/api/status" 200
          # /api/data is intentionally gated by _private_api_gate in
          # server.py — an unauthenticated probe MUST return 401.
          # Expecting 401 here verifies the auth gate is active; a 200
          # would mean the gate is broken and private data is exposed.
          check_endpoint "/api/data" 401
          check_endpoint "/" 200
          check_endpoint "/league" 200
          check_endpoint "/api/public/league" 200

          # Extract EVERY /_next/static/* reference from the landing
          # page HTML (and a sample of other key routes) and verify
          # the server actually serves all of them.  This is the
          # guardrail for the ChunkLoadError failure mode: if the HTML
          # references a chunk hash the Next.js process no longer has
          # on disk (the exact symptom the prior production outage
          # showed), this check fails and the deploy is marked red
          # instead of silently shipping a broken client.
          #
          # The previous implementation probed ONLY the first match
          # from `head -n 1`, which was always the webpack runtime
          # chunk and always returned 200 — so a broken async chunk
          # (like 448-*.js) silently shipped.  This implementation
          # probes every distinct reference and fails the deploy if
          # any single one returns non-200.
          HTML_ROUTES=( "/" "/rankings" "/trade" "/edge" "/finder" "/league" )
          declare -A SEEN_ASSETS=()
          for route in "${HTML_ROUTES[@]}"; do
            body_file="$(mktemp)"
            if ! curl --silent --show-error --globoff --max-time 15 --output "${body_file}" "${URL}${route}"; then
              echo "WARN: unable to fetch ${route} HTML for _next asset extraction"
              rm -f "${body_file}"
              continue
            fi
            while IFS= read -r asset; do
              [[ -z "${asset}" ]] && continue
              SEEN_ASSETS["${asset}"]=1
            done < <(grep -oE '/_next/static/[^"'"'"'[:space:]<>]+\.(js|css)' "${body_file}" | sort -u)
            rm -f "${body_file}"
          done

          if [[ "${#SEEN_ASSETS[@]}" -eq 0 ]]; then
            echo "::error title=No _next assets found::HTML for routes ${HTML_ROUTES[*]} contained no /_next/static/* references."
            FAIL=$((FAIL + 1))
          else
            echo "Probing ${#SEEN_ASSETS[@]} distinct /_next/static/* references from HTML."
            for asset in "${!SEEN_ASSETS[@]}"; do
              check_endpoint "${asset}" 200
            done
          fi

          echo ""
          echo "Results: ${PASS} passed, ${FAIL} failed"

          if [[ "${FAIL}" -gt 0 ]]; then
            echo "::error title=Post-Deploy Smoke Failure::${FAIL} endpoint(s) failed after deploy."
            exit 1
          fi

      - name: Validate live data contract
        if: ${{ vars.PROD_PUBLIC_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"

          curl --silent --show-error --max-time 20 "${URL}/api/health" > /tmp/health.json

          python3 - <<'PY'
          import json, sys
          with open("/tmp/health.json") as f:
              data = json.load(f)
          status = data.get("status", "unknown")
          has_data = data.get("has_data", False)
          stale = data.get("data_stale", True)
          print(f"  status={status} has_data={has_data} data_stale={stale}")
          if status not in ("ok", "degraded"):
              print("::error title=Unexpected health status::Health returned unexpected status.")
              sys.exit(1)
          if not has_data:
              print("::warning title=No data loaded::Server reports no data loaded.")
          print("Post-deploy health validation passed.")
          PY

