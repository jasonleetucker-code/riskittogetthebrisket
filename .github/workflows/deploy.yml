name: Deploy Production

on:
  push:
    branches:
      - main
    # Skip deploy for data-only commits from scheduled-refresh.
    # Data flows to production via the server's own scrape loop, not via git deploy.
    paths-ignore:
      - 'data/**'
      - 'exports/**'
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Optional git ref (commit/tag/branch) to deploy. Default is current commit."
        required: false
        type: string
      allow_non_fast_forward:
        description: "Deploy even if it moves production BACKWARDS or sideways (intentional rollback). Normally leave false."
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # One immutable target (owner decision C, 2026-10-01). The requested ref is
  # resolved ONCE here to a full commit SHA; validate, the guard, the box command
  # and the smoke identity all consume needs.resolve.outputs.sha. This job runs
  # the WORKFLOW commit's resolver (never target-tree code) and holds no secrets.
  resolve:
    name: Resolve Deploy Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      kind: ${{ steps.resolve.outputs.kind }}
      release_mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout (workflow commit, full history for resolution)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the requested ref to one full commit SHA
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.deploy_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --quiet --tags --force origin
          python3 scripts/resolve_deploy_ref.py --requested="${REQUESTED_REF:-}" --default="${WORKFLOW_SHA}"

      - name: Classify exact target release mode
        id: classify
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_LEGACY: ${{ inputs.allow_non_fast_forward || false }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/deploy_release_mode.py \
            --target "${TARGET_SHA}" --event "${EVENT_NAME}" \
            --allow-legacy "${ALLOW_LEGACY}"

  validate:
    name: Validate Build Inputs
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      artifact_id: ${{ steps.package.outputs.artifact_id }}
      backend_sha256: ${{ steps.package.outputs.backend_sha256 }}
    # Measured 2026-09-09: the last SUCCESSFUL deploy (run 34267910262,
    # 2026-09-08T19:15-19:35) finished in 19m59s -- one second inside the
    # old 20-minute budget. Every deploy since timed out mid-run (three in
    # a row: runs 34326611988, 34326615945, 34329213659, all cut off
    # around the 20:00 mark during or just after "Run unit tests"), which
    # for 14+ hours looked identical to the documented queued-run eviction
    # below and was misread as that. It wasn't: no run was queued behind
    # any of them: it was this timeout, not concurrency, silently
    # blocking every production deploy including fixes for this week's
    # launch tranche. Run 34426528602 then showed the same failure mode at
    # 30 minutes: the hard suite was still progressing normally at 82%
    # when the runner cancelled the job. Match PR Validation's 60-minute
    # ceiling so the deploy gate has enough wall-clock headroom without
    # weakening any test.
    # 60 -> 80 (2026-10-02), matching PR Validation (#1605): the full hard
    # suite now routinely takes 58-60 min, and deploy run 36956966551
    # (7e8d8cda) was cancelled at exactly 60:15 inside "Run unit tests" --
    # the same silent deploy block this comment documents above. Runner
    # headroom only; no test, gate or tolerance weakened; a finite hang
    # bound remains.
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history. Consensus Edge's as-of panel tests reconstruct
          # past boards with `git show`, and `panel.is_shallow()` makes
          # them SKIP on a shallow clone — silently, so the deploy path
          # was strictly weaker than the PR path (which already sets
          # fetch-depth: 0). A regression reaching production via
          # force-push or workflow_dispatch would have been ungated.
          fetch-depth: 0
          # The resolved target, not the workflow commit: what is validated
          # is what ships (a dispatch with deploy_ref used to validate main).
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Assert the validated tree is the resolved target
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::resolved target is not a full SHA"; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Workflow definition: ${WORKFLOW_SHA}"
          echo "Validated target:    ${HEAD_SHA}"
          [[ "${HEAD_SHA}" == "${TARGET_SHA}" ]] || { echo "::error title=Validate checkout mismatch::validating ${HEAD_SHA}, resolved ${TARGET_SHA}"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install dependencies (requirements-dev.txt)
        env:
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          if [[ "${RELEASE_MODE}" == "artifact" ]]; then
            [[ -f "requirements.lock.txt" ]] || { echo "::error title=Missing Python lock::requirements.lock.txt is required for production deploy."; exit 1; }
            [[ -f "requirements-dev.lock.txt" ]] || { echo "::error title=Missing dev lock::requirements-dev.lock.txt is required for tests."; exit 1; }
            python scripts/python_lock.py check
            pip install --require-hashes -r requirements-dev.lock.txt
          elif [[ "${RELEASE_MODE}" == "legacy" ]]; then
            echo "::notice::Explicit historical rollback: installing the target's legacy requirements-dev.txt. Exact Python lock identity is unavailable."
            pip install -r requirements-dev.txt
          else
            echo "::error::unknown release mode ${RELEASE_MODE}"
            exit 1
          fi

      - name: Validate dependency graph (pip check)
        shell: bash
        run: |
          set -Eeuo pipefail
          pip check

      - name: Preflight environment check
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_env.py

      - name: Python syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile server.py "Dynasty Scraper.py"
          python -m py_compile src/api/data_contract.py

      - name: Python format gate (ruff format --check)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Defense-in-depth mirror of the pr-validation format gate so
          # a hotfix pushed straight to main can't bypass it.
          python -m ruff format --check .

      - name: Python lint (ruff check — blocking mirror)
        # Now blocking, matching the format gate directly above it and
        # for the same stated reason: "a hotfix pushed straight to main
        # can't bypass it". The PR gate cannot see a direct push, and
        # this repo has several — the refresh workflows commit to main
        # every 2h as github-actions[bot].
        #
        # It was report-only, described as "a visible signal of the
        # pre-existing backlog". That backlog is gone (#708), so the
        # signal has nothing left to show, and a report-only step whose
        # output nobody has any reason to read is a guard that cannot
        # fire — ORCHESTRATION §6.15's own subject.
        #
        # Scope note, because this is the riskier of the two changes: a
        # violation here fails a DEPLOY, not a PR. That is deliberate —
        # the format gate above already accepts the same trade — but it
        # means main must be kept clean, which is now true and enforced
        # upstream by the PR gate. If this ever fires on a direct push,
        # the fix is to clean main, not to revert this to report-only.
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check . --output-format concise

      - name: Python runtime import gate
        shell: bash
        env:
          # ``server.py`` requires ``JASON_LOGIN_PASSWORD`` at import
          # time (audit M1 removed the source-code default).  CI
          # runners don't have prod's .env, so we use the explicit
          # dev escape hatch here.  The runner ALSO never serves
          # auth requests — this env only affects the import-time
          # guard.
          ALLOW_DEFAULT_LOGIN_DEV: "1"
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi  # noqa: F401
          import uvicorn  # noqa: F401
          import requests  # noqa: F401
          from playwright.async_api import async_playwright  # noqa: F401
          import server  # noqa: F401
          print("Runtime import gate passed.")
          PY
      - name: Check generated leagues contract
        # Artifact-mode only, like every other step this train added to
        # validate. A legacy target is by definition a pre-artifact commit,
        # and scripts/generate_leagues_contract.py landed with the artifact
        # contract, so it does not exist there; ungated, this step failed
        # every legacy (historical rollback) validation.
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          python -m scripts.generate_leagues_contract --check
      - name: Run unit tests (hard gate — pure logic)
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          # Same policy as pr-validation.yml, and it matters more here:
          # ``server`` enables its uptime watchdog by default, so every
          # TestClient probes the live site and its shutdown joins that
          # thread.  With production's ``/api/`` wedged, this step ran
          # long enough to burn the job's 20-minute budget — which would
          # block the very deploy that could fix production.
          # ``tests/conftest.py`` sets the same default; stated here so
          # the policy is visible in the workflow.
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          # Hard gate: real code regressions block the deploy.  Data-
          # coupled tests are advisory below — the #451 served-board
          # coverage gate in verify-deploy.sh is the real deploy-time
          # guard against genuine source degradation, so a routine
          # scrape-churn dip must not false-block a deploy.
          python -m pytest tests/ -x -q --tb=short -m "not livedata"

      - name: Run live-data tests (advisory — non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          ALLOW_DEFAULT_LOGIN_DEV: "1"
          # Advisory, but it spends the same job budget.
          UPTIME_CHECK_ENABLED: "0"
        run: |
          set -Eeuo pipefail
          python -m pytest tests/ -q --tb=short -m livedata

      - name: API data contract check (FULL lane — blocking)
        # The deploy ships ``exports/`` and ``data/`` to the box (that is why
        # scheduled-refresh.yml dispatches this workflow after a scrape), so
        # here the source-health half is exactly the point: refusing to ship
        # a board built without a critical market is fail-safe — production
        # keeps serving what it already has.
        #
        # This step had also never run before 2026-08-16: it looked for the
        # payload in two gitignored locations and skipped every time.  The
        # only thing blocking a source-degraded deploy was a unit test that
        # happened to assert ``contractHealth.ok`` — i.e. the contamination
        # bug WAS the production guard.  It is a named gate now.
        #
        # Recovery is automatic and needs no override: the 2-hourly refresh
        # re-scrapes and the condition clears on the next healthy run.
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/validate_api_contract.py --repo . --lane full

      - name: Validate required deploy artifacts exist
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f "deploy/deploy.sh" ]]; then
            echo "::error title=Missing required deploy script::deploy/deploy.sh is required by the deploy job remote execution path but does not exist in this repository."
            echo "::error::Either add deploy/deploy.sh or update deploy strategy/path in .github/workflows/deploy.yml."
            exit 1
          fi
          if [[ ! -f "requirements.txt" ]]; then
            echo "::error title=Missing Python manifest::requirements.txt is required for production deploy dependency installation."
            exit 1
          fi

      - name: Deploy script syntax gate (existing scripts only)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n "deploy/deploy.sh"

          for script in deploy/*.sh; do
            [[ -f "${script}" ]] || continue
            [[ "${script}" == "deploy/deploy.sh" ]] && continue
            bash -n "${script}"
          done

      # Per-page bundle-size budgets are normally enforced by
      # ``pr-validation.yml`` before a PR can merge.  This duplicate
      # check on the deploy path is defence in depth — it catches the
      # cases where main is updated outside the PR flow (force-push,
      # data-refresh commits, hotfixes) and a bloated chunk would
      # otherwise ship to prod without ever hitting the gate.
      - name: Set up Node (for bundle gate)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend bundle-size gate
        shell: bash
        working-directory: frontend
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          # Frontend unit tests run on the PR path but did NOT run here,
          # so anything reaching main outside the PR flow shipped with
          # its JS logic ungated — the same asymmetry as the shallow
          # clone above.
          npm test
          npm run build
          # ``check:bundles`` runs as part of ``npm run build`` per
          # the package.json script, but call it again explicitly so
          # the workflow log shows a clean ✓ separately from the build.
          npm run check:bundles

      - name: Build and test offline backend runtime wheelhouse
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/python_lock.py check
          bash scripts/build_backend_wheelhouse.sh \
            requirements.lock.txt backend-wheelhouse.tar

      - name: Package tested release artifact
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        id: package
        shell: bash
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -Eeuo pipefail
          python -m scripts.release_artifact create \
            --commit "${TARGET_SHA}" \
            --node-version "$(node --version)" \
            --run-id "${GITHUB_RUN_ID}" \
            --backend-archive backend-wheelhouse.tar
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --exclude='frontend/.next/cache' \
            -cf calculator-release.tar \
            release-manifest.json requirements.lock.txt backend-wheelhouse.tar \
            frontend/package-lock.json frontend/.next
          sha256sum calculator-release.tar > calculator-release.tar.sha256
          sha256sum -c calculator-release.tar.sha256
          echo "archive_sha256=$(sha256sum calculator-release.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          verify_dir="$(mktemp -d)"
          tar -xf calculator-release.tar -C "${verify_dir}"
          python -m scripts.release_artifact verify \
            --root "${verify_dir}" --commit "${TARGET_SHA}"
          echo "artifact_id=$(python -c 'import json; print(json.load(open("release-manifest.json"))["artifact_id"])')" >> "$GITHUB_OUTPUT"
          echo "backend_sha256=$(python -c 'import json; print(json.load(open("release-manifest.json"))["identity"]["backend_artifact_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Upload tested release artifact
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release-${{ needs.resolve.outputs.sha }}
          path: |
            calculator-release.tar
            calculator-release.tar.sha256
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy To Production
    runs-on: ubuntu-latest
    needs: [resolve, validate]
    timeout-minutes: 25
    environment: production
    env:
      # The one resolved target; every step below consumes it.
      DEPLOY_TARGET_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # This job did not previously check out the repo — it only needed
      # SSH.  The deploy-skip guard below does merge-base ancestry
      # between the sha being deployed and the sha already in
      # production, so it needs real history here.
      # The deploy job runs the WORKFLOW commit's own helpers (the smoke's
      # scripts/scrape_activity.py, for one) so a rollback to an older target
      # cannot remove the tooling this job executes. The target is consumed as
      # DEPLOY_TARGET_SHA, never as the checked-out tree.
      - name: Checkout (full history for the deploy-skip guard)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert the resolved target is present in this clone
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::resolved target is not a full SHA"; exit 1; }
          git fetch --quiet --tags --force origin
          git cat-file -e "${DEPLOY_TARGET_SHA}^{commit}" || { echo "::error title=Target missing::${DEPLOY_TARGET_SHA} is not a commit in this clone"; exit 1; }
          echo "Workflow definition: ${GITHUB_SHA}"
          echo "Deploy target:       ${DEPLOY_TARGET_SHA}"

      - name: Download tested release artifact
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: calculator-release-${{ needs.resolve.outputs.sha }}
          path: release-input

      - name: Verify downloaded archive is the validated archive
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        env:
          VALIDATED_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${VALIDATED_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::validated archive digest is missing"; exit 1; }
          (cd release-input && sha256sum -c calculator-release.tar.sha256)
          DOWNLOADED_SHA256="$(sha256sum release-input/calculator-release.tar | cut -d ' ' -f1)"
          [[ "${DOWNLOADED_SHA256}" == "${VALIDATED_SHA256}" ]] || { echo "::error::downloaded archive differs from validation job"; exit 1; }
          echo "RELEASE_ARCHIVE_SHA256=${VALIDATED_SHA256}" >> "$GITHUB_ENV"

      - name: Preflight validate deploy inputs (no SSH)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          PROD_VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          PROD_DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
          PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
          PROD_SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          require_non_empty() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "${value}" ]]; then
              echo "::error title=Missing Deploy Configuration::Required secret ${name} is empty or not set."
              exit 1
            fi
          }

          require_non_empty DEPLOY_HOST
          require_non_empty DEPLOY_USER
          require_non_empty DEPLOY_SSH_PRIVATE_KEY
          require_non_empty DEPLOY_KNOWN_HOSTS

          DEPLOY_HOST_RESOLVED="${DEPLOY_HOST}"
          DEPLOY_USER_RESOLVED="${DEPLOY_USER}"
          DEPLOY_PORT_RESOLVED="${DEPLOY_PORT:-22}"
          DEPLOY_KEY_RESOLVED="${DEPLOY_SSH_PRIVATE_KEY}"
          DEPLOY_KNOWN_HOSTS_RESOLVED="${DEPLOY_KNOWN_HOSTS}"

          if ! [[ "${DEPLOY_PORT_RESOLVED}" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid SSH Port::Resolved deploy port must be numeric; got '${DEPLOY_PORT_RESOLVED}'."
            exit 1
          fi

          if ! grep -Eq 'BEGIN [A-Z0-9 ]*PRIVATE KEY' <<<"${DEPLOY_KEY_RESOLVED}"; then
            echo "::error title=Invalid SSH private key::Key does not look like a PEM/OpenSSH private key."
            exit 1
          fi

          if ! grep -Eq '(^|[[:space:]])(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)|^\|1\|' <<<"${DEPLOY_KNOWN_HOSTS_RESOLVED}"; then
            echo "::error title=Invalid known_hosts::Known hosts data is missing a valid host key entry."
            exit 1
          fi

          [[ -n "${DEPLOY_PORT:-}" ]] || echo "DEPLOY_PORT not set; defaulting to 22."

          install -d -m 700 "$HOME/.ssh"
          DEPLOY_KEY_FILE="$HOME/.ssh/id_ed25519"
          DEPLOY_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"

          printf '%s\n' "${DEPLOY_KEY_RESOLVED}" | sed 's/\r$//' > "${DEPLOY_KEY_FILE}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS_RESOLVED}" | sed 's/\r$//' > "${DEPLOY_KNOWN_HOSTS_FILE}"

          chmod 600 "${DEPLOY_KEY_FILE}"
          chmod 644 "${DEPLOY_KNOWN_HOSTS_FILE}"

          ssh-keygen -y -f "${DEPLOY_KEY_FILE}" >/dev/null
          [[ -s "${DEPLOY_KNOWN_HOSTS_FILE}" ]] || { echo "::error title=known_hosts empty::Known hosts secret resolved to an empty file."; exit 1; }

          echo "Deploy key fingerprint:"
          ssh-keygen -lf "${DEPLOY_KEY_FILE}"
          ssh-keygen -y -f "${DEPLOY_KEY_FILE}" > /tmp/deploy_key.pub
          echo "Derived public key fingerprint:"
          ssh-keygen -lf /tmp/deploy_key.pub

          {
            echo "DEPLOY_HOST_RESOLVED=${DEPLOY_HOST_RESOLVED}"
            echo "DEPLOY_USER_RESOLVED=${DEPLOY_USER_RESOLVED}"
            echo "DEPLOY_PORT_RESOLVED=${DEPLOY_PORT_RESOLVED}"
            echo "DEPLOY_KEY_FILE=${DEPLOY_KEY_FILE}"
            echo "DEPLOY_KNOWN_HOSTS_FILE=${DEPLOY_KNOWN_HOSTS_FILE}"
          } >> "$GITHUB_ENV"

          echo "Deploy target: ${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}:${DEPLOY_PORT_RESOLVED}"
          echo "Remote app dir: ${PROD_APP_DIR}"
          echo "Remote venv dir: ${PROD_VENV_DIR}"
          echo "Remote deploy state dir: ${PROD_DEPLOY_STATE_DIR}"
          echo "Remote last successful deploy file: ${PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}"
          echo "Remote service: ${PROD_SERVICE_NAME}"

      - name: Validate known_hosts entry for target host
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET_HOST="${DEPLOY_HOST_RESOLVED}"

          if [[ "${SSH_PORT}" == "22" ]]; then
            LOOKUP="${TARGET_HOST}"
          else
            LOOKUP="[${TARGET_HOST}]:${SSH_PORT}"
          fi

          if ! ssh-keygen -F "${LOOKUP}" -f "${DEPLOY_KNOWN_HOSTS_FILE}" >/dev/null 2>&1; then
            echo "::error title=Host key mismatch::No known_hosts entry found for ${LOOKUP}. Recreate DEPLOY_KNOWN_HOSTS with: ssh-keyscan -H -p ${SSH_PORT} ${TARGET_HOST}"
            exit 1
          fi

      - name: SSH preflight (connectivity + remote paths)
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${APP_DIR}" ]] || { echo "::error title=Missing APP_DIR::PROD_APP_DIR cannot be empty."; exit 1; }
          [[ -n "${VENV_DIR}" ]] || { echo "::error title=Missing VENV_DIR::PROD_VENV_DIR cannot be empty."; exit 1; }

          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          echo "Testing SSH connectivity to ${TARGET}:${SSH_PORT}"
          ssh \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${SSH_PORT}" \
            "${TARGET}" \
            "set -Eeuo pipefail; \
             echo '[remote] pwd:'; pwd; \
             echo \"[remote] connected host=\$(hostname) user=\$(id -un)\"; \
             command -v bash >/dev/null || { echo \"[remote] bash not found\" >&2; exit 11; }; \
             command -v git >/dev/null || { echo \"[remote] git not found\" >&2; exit 16; }; \
             command -v python3 >/dev/null || { echo \"[remote] python3 not found\" >&2; exit 17; }; \
             [[ -d '${APP_DIR}' ]] || { echo \"[remote] APP_DIR missing: ${APP_DIR}\" >&2; exit 12; }; \
             [[ -d '${APP_DIR}/.git' ]] || { echo \"[remote] APP_DIR is not a git repo: ${APP_DIR}\" >&2; exit 13; }; \
             echo '[remote] git top-level:'; git -C '${APP_DIR}' rev-parse --show-toplevel; \
             echo '[remote] git status --short:'; git -C '${APP_DIR}' status --short || true; \
             command -v systemctl >/dev/null || { echo \"[remote] systemctl not found\" >&2; exit 15; }; \
             command -v sudo >/dev/null || { echo \"[remote] sudo not found\" >&2; exit 18; }; \
             ( [[ -x /bin/systemctl ]] && sudo -n /bin/systemctl --version >/dev/null 2>&1 ) || ( [[ -x /usr/bin/systemctl ]] && sudo -n /usr/bin/systemctl --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for systemctl (/bin/systemctl or /usr/bin/systemctl)\" >&2; exit 19; }; \
             ( [[ -x /bin/journalctl ]] && sudo -n /bin/journalctl --version >/dev/null 2>&1 ) || ( [[ -x /usr/bin/journalctl ]] && sudo -n /usr/bin/journalctl --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for journalctl (/bin/journalctl or /usr/bin/journalctl)\" >&2; exit 20; }; \
             ( [[ -x /usr/bin/install ]] && sudo -n /usr/bin/install --version >/dev/null 2>&1 ) || ( [[ -x /bin/install ]] && sudo -n /bin/install --version >/dev/null 2>&1 ) || { echo \"[remote] missing NOPASSWD sudo permission for install (/usr/bin/install or /bin/install)\" >&2; exit 21; }; \
             echo '[remote] preflight checks passed'"

      # ── Deploy-skip guard ────────────────────────────────────────────
      # Concurrency group ``production-deploy`` sets
      # ``cancel-in-progress: false``, which protects the RUNNING deploy
      # but not queued ones: GitHub holds only ONE pending run per group,
      # so when N merges land inside a few minutes each new run evicts the
      # previously-queued one.  Only the first and last deploys survive;
      # every middle merge's deploy is silently cancelled.
      #
      # That is harmless while the train is linear, because the surviving
      # run's sha is a descendant and carries the evicted commits anyway.
      # It is NOT harmless when it isn't: a revert, a force-push, or a
      # ``workflow_dispatch`` pinned to an older ``deploy_ref`` (which
      # this workflow accepts) can leave a commit that reached ``main``
      # silently unshipped, with a grey "cancelled" tick as the only
      # trace — and that tick reads as "my change failed to deploy" when
      # it actually shipped.
      #
      # So assert the property rather than relying on it: whatever we are
      # about to deploy must be a descendant of what is already in
      # production.  Observed 2026-07-26, when three merges in nine
      # minutes cancelled the middle deploy (run 30217214959).
      - name: Guard against skipping or reversing a deploy
        env:
          ALLOW_NON_FF: ${{ inputs.allow_non_fast_forward }}
          LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          # Read the last sha that actually reached production.  A missing
          # or unreadable file is not an error — first deploy, or a fresh
          # host — it just means there is no baseline to compare against.
          LAST_DEPLOYED="$(
            ssh \
              -i "${DEPLOY_KEY_FILE}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
              -o ConnectTimeout=15 \
              -p "${SSH_PORT}" \
              "${TARGET}" \
              "cat '${LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}' 2>/dev/null | tr -d '[:space:]'" \
            || true
          )"

          # Resolved once by the resolve job; never re-resolved here.
          TARGET_SHA="${DEPLOY_TARGET_SHA:-}"
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=No resolved deploy target::needs.resolve.outputs.sha is missing or not a full SHA."
            exit 1
          fi
          echo "Deploying:      ${TARGET_SHA}"
          echo "In production:  ${LAST_DEPLOYED:-<none recorded>}"
          # Exported before any early exit below, for the post-deploy build check.
          echo "DEPLOY_TARGET_SHA=${TARGET_SHA}" >> "$GITHUB_ENV"

          if [[ -z "${LAST_DEPLOYED}" ]]; then
            echo "::notice title=No deploy baseline::No last-successful-deploy commit recorded; skipping the ancestry check. This is expected on a first deploy."
            exit 0
          fi

          if ! git cat-file -e "${LAST_DEPLOYED}^{commit}" 2>/dev/null; then
            echo "::warning title=Baseline commit not found::The recorded production commit ${LAST_DEPLOYED} is not in this repository — history may have been rewritten. Cannot verify the deploy moves forward."
            if [[ "${ALLOW_NON_FF}" == "true" ]]; then
              echo "allow_non_fast_forward=true — proceeding anyway."
              exit 0
            fi
            echo "::error title=Cannot verify deploy safety::Re-run with allow_non_fast_forward=true if this is intentional."
            exit 1
          fi

          if [[ "${LAST_DEPLOYED}" == "${TARGET_SHA}" ]]; then
            echo "::notice title=Redeploy::Already at this commit; redeploying the same tree."
            exit 0
          fi

          if git merge-base --is-ancestor "${LAST_DEPLOYED}" "${TARGET_SHA}"; then
            AHEAD="$(git rev-list --count "${LAST_DEPLOYED}..${TARGET_SHA}")"
            echo "::notice title=Fast-forward deploy::Moving production forward by ${AHEAD} commit(s)."
            # Name them, so a cancelled middle deploy is visibly carried
            # rather than merely assumed to be.
            git log --oneline --no-decorate "${LAST_DEPLOYED}..${TARGET_SHA}" | sed 's/^/  shipping: /'
            exit 0
          fi

          # Not a fast-forward.  Either we are going backwards (deploying
          # an ancestor of what is live) or the histories diverged.
          if git merge-base --is-ancestor "${TARGET_SHA}" "${LAST_DEPLOYED}"; then
            BEHIND="$(git rev-list --count "${TARGET_SHA}..${LAST_DEPLOYED}")"
            REASON="this would move production BACKWARDS by ${BEHIND} commit(s), un-shipping code that is already live"
          else
            REASON="the deploy ref and the live commit have DIVERGED (neither is an ancestor of the other) — likely a force-push or an unrelated ref"
          fi

          echo "Commits that would be lost from production:"
          git log --oneline --no-decorate "${TARGET_SHA}..${LAST_DEPLOYED}" | sed 's/^/  dropping: /'

          if [[ "${ALLOW_NON_FF}" == "true" ]]; then
            echo "::warning title=Non-fast-forward deploy::${REASON}. Proceeding because allow_non_fast_forward=true."
            exit 0
          fi

          echo "::error title=Deploy would skip or reverse shipped code::${REASON}. If this is an intentional rollback, re-run via workflow_dispatch with allow_non_fast_forward=true."
          exit 1

      - name: Assert post-deploy verification will actually run
        # BOTH verification steps below are gated on
        # ``vars.PROD_PUBLIC_URL != ''``.  If that variable is unset,
        # renamed, or scoped to an environment this job cannot read,
        # they SKIP and the job reports green — a gate whose input is
        # missing reading exactly like a gate that passed.  That is the
        # same failure class as the contract gate which silently skipped
        # for months (``scripts/validate_api_contract.py`` docstring),
        # and it is the one thing that could make every other statement
        # in this workflow untrue.  Fail loudly instead (audit
        # 2026-08-17).
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${{ vars.PROD_PUBLIC_URL }}" ]]; then
            echo "::error title=PROD_PUBLIC_URL is not set::Post-deploy smoke test and live-contract validation would both silently skip, and this job would report success without verifying anything. Set the repository variable PROD_PUBLIC_URL."
            exit 1
          fi
          echo "PROD_PUBLIC_URL is set; post-deploy verification will run."

      - name: Transfer tested release archive to production
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        env:
          DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"
          REMOTE_ARCHIVE="${DEPLOY_STATE_DIR}/incoming/${DEPLOY_TARGET_SHA}-${GITHUB_RUN_ID}.tar"
          ssh -i "${DEPLOY_KEY_FILE}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" -p "${DEPLOY_PORT_RESOLVED}" \
            "${TARGET}" "install -d -m 700 '${DEPLOY_STATE_DIR}/incoming'"
          ARCHIVE_SIZE="$(stat -c %s release-input/calculator-release.tar)"
          REMOTE_FREE="$(ssh -i "${DEPLOY_KEY_FILE}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" -p "${DEPLOY_PORT_RESOLVED}" \
            "${TARGET}" "df -B1 --output=avail '${DEPLOY_STATE_DIR}/incoming' | tail -n 1 | tr -d '[:space:]'")"
          [[ "${REMOTE_FREE}" =~ ^[0-9]+$ ]] || { echo "::error::remote free-space check failed"; exit 1; }
          MIN_REQUIRED="$((ARCHIVE_SIZE + 2 * 1024 * 1024 * 1024))"
          [[ "${REMOTE_FREE}" -ge "${MIN_REQUIRED}" ]] || {
            echo "::error::remote disk has ${REMOTE_FREE} bytes free; ${MIN_REQUIRED} required before artifact transfer"
            exit 1
          }
          scp -i "${DEPLOY_KEY_FILE}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" -P "${DEPLOY_PORT_RESOLVED}" \
            release-input/calculator-release.tar "${TARGET}:${REMOTE_ARCHIVE}"
          ssh -i "${DEPLOY_KEY_FILE}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" -p "${DEPLOY_PORT_RESOLVED}" \
            "${TARGET}" "printf '%s  %s\\n' '${RELEASE_ARCHIVE_SHA256}' '${REMOTE_ARCHIVE}' | sha256sum -c -"
          echo "RELEASE_ARCHIVE_REMOTE=${REMOTE_ARCHIVE}" >> "$GITHUB_ENV"

      - name: Run remote deploy script
        env:
          APP_NAME: ${{ vars.PROD_APP_NAME || 'riskittogetthebrisket' }}
          APP_USER: ${{ vars.PROD_APP_USER || 'dynasty' }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
          LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE: ${{ vars.PROD_LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE || '/home/dynasty/.deploy-state/trade-calculator.last_successful_deploy_commit' }}
          SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
          DEPLOY_BRANCH: ${{ vars.PROD_DEPLOY_BRANCH || 'main' }}
          AUTO_ROLLBACK: ${{ vars.PROD_AUTO_ROLLBACK || 'true' }}
          APP_HOST: ${{ vars.PROD_APP_HOST || '127.0.0.1' }}
          APP_PORT: ${{ vars.PROD_APP_PORT || '8000' }}
          STRICT_LOCAL_HEALTH: ${{ vars.PROD_STRICT_LOCAL_HEALTH || 'false' }}
          PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # The box receives the resolved full SHA only -- never the raw input,
          # so it cannot resolve a branch name to a newer commit than the one
          # validated and guarded, and nothing unvalidated reaches the remote shell.
          DEPLOY_REF="${DEPLOY_TARGET_SHA:-}"
          if [[ ! "${DEPLOY_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid deploy target::resolved target is not a full commit SHA."
            exit 1
          fi

          SSH_PORT="${DEPLOY_PORT_RESOLVED}"
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"

          echo "Deploying ref '${DEPLOY_REF}' to ${TARGET}:${SSH_PORT}"
          ssh \
            -i "${DEPLOY_KEY_FILE}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "${SSH_PORT}" \
            "${TARGET}" \
            "bash -s" <<EOF
          set -Eeuo pipefail
          export APP_NAME="${APP_NAME}"
          export APP_USER="${APP_USER}"
          export APP_DIR="${APP_DIR}"
          export VENV_DIR="${VENV_DIR}"
          export DEPLOY_STATE_DIR="${DEPLOY_STATE_DIR}"
          export LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE="${LAST_SUCCESSFUL_DEPLOY_COMMIT_FILE}"
          export SERVICE_NAME="${SERVICE_NAME}"
          export DEPLOY_BRANCH="${DEPLOY_BRANCH}"
          export DEPLOY_REF="${DEPLOY_REF}"
          export AUTO_ROLLBACK="${AUTO_ROLLBACK}"
          export APP_HOST="${APP_HOST}"
          export APP_PORT="${APP_PORT}"
          export STRICT_LOCAL_HEALTH="${STRICT_LOCAL_HEALTH}"
          export PUBLIC_URL="${PUBLIC_URL}"
          export RELEASE_ARCHIVE="${RELEASE_ARCHIVE_REMOTE:-}"
          export RELEASE_ARCHIVE_SHA256="${RELEASE_ARCHIVE_SHA256:-}"
          # Preserve the legacy recovery setting. Artifact deployment uses
          # RELEASE_ARCHIVE and always stages the tested bytes regardless of
          # this inherited variable; rollback to a pre-artifact revision may
          # still need to rebuild its frontend.
          export RUN_FRONTEND_BUILD="true"

          [[ -n "\${APP_DIR}" ]] || { echo "[remote] APP_DIR is empty" >&2; exit 20; }
          [[ -d "\${APP_DIR}/.git" ]] || { echo "[remote] APP_DIR is not a git repo: \${APP_DIR}" >&2; exit 21; }

          if [[ ! -f "\${APP_DIR}/deploy/deploy.sh" ]]; then
            echo "[remote] deploy/deploy.sh missing before run; attempting git bootstrap."
            git -C "\${APP_DIR}" fetch --prune --tags origin
            git -C "\${APP_DIR}" fetch origin "\${DEPLOY_REF}" 2>/dev/null || true
            # DEPLOY_REF is always the resolved full SHA: bootstrap from it or
            # stop -- never leave the box's tree on the branch instead.
            if git -C "\${APP_DIR}" rev-parse --verify --quiet "\${DEPLOY_REF}^{commit}" >/dev/null; then
              git -C "\${APP_DIR}" checkout --force "\${DEPLOY_REF}"
            else
              echo "[remote] Unable to resolve \${DEPLOY_REF} during bootstrap." >&2
              exit 22
            fi
          fi

          # Always refresh deploy.sh from the target ref before running it.
          # This prevents stale deploy scripts on the production server from
          # blocking deployments that include deploy-script fixes.
          # Write to a temp file first so a failed git-show does not truncate
          # the existing script to zero bytes.
          git -C "\${APP_DIR}" fetch --prune --tags origin 2>/dev/null || true
          # The target may be absent from the box's last branch/tag fetch:
          # fetch it by id.
          git -C "\${APP_DIR}" fetch origin "\${DEPLOY_REF}" 2>/dev/null || true
          if git -C "\${APP_DIR}" rev-parse --verify --quiet "\${DEPLOY_REF}^{commit}" >/dev/null 2>&1; then
            _tmp_deploy="\${APP_DIR}/deploy/.deploy.sh.tmp"
            if git -C "\${APP_DIR}" show "\${DEPLOY_REF}:deploy/deploy.sh" > "\${_tmp_deploy}" 2>/dev/null && [[ -s "\${_tmp_deploy}" ]]; then
              mv -f "\${_tmp_deploy}" "\${APP_DIR}/deploy/deploy.sh"
            else
              rm -f "\${_tmp_deploy}"
            fi
          fi

          [[ -f "\${APP_DIR}/deploy/deploy.sh" ]] || { echo "[remote] Missing deploy script after bootstrap: \${APP_DIR}/deploy/deploy.sh" >&2; exit 23; }
          bash "\${APP_DIR}/deploy/deploy.sh"
          EOF

      - name: Post-deploy smoke test
        if: ${{ vars.PROD_PUBLIC_URL != '' }}
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          EXPECTED_BACKEND_SHA256: ${{ needs.validate.outputs.backend_sha256 }}
          RELEASE_MODE: ${{ needs.resolve.outputs.release_mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"
          PASS=0
          FAIL=0

          # The deploy restarts the service, and server.py's startup path
          # launches a scrape three seconds after boot (``initial_scrape``).
          # Its browser-launch phase BLOCKS the process, so there is a window
          # in which the box is alive but answers nothing — measured on run
          # 35092313919, where /api/public/league returned 200 to the warm
          # loop at 12:22:01 and then timed out at 12:22:38, and /api/health
          # reported ``scrape_running: true, current_step: "browser"``
          # throughout.
          #
          # That window is a known bounded recovery state, not a fault:
          # ``verify_live_source_coverage.py`` has waited it out since the
          # 2026-09-09 rollback incident. This reuses that script's predicate
          # through its one owner, ``scripts/scrape_activity.py``, rather than
          # growing a second answer here.
          #
          # NOT A WEAKENED GATE. Only a transport-level failure is ever
          # attributable to a scrape, and only while the server itself reports
          # an active NON-STALLED scrape:
          #   * a wrong status code (an auth gate answering 200 where 401 is
          #     required) is a correctness statement and fails on the spot;
          #   * a stalled or hung scrape fails on the spot;
          #   * "cannot tell" (status unreadable) is not a yes — one grace
          #     re-probe only, then the real code is reported;
          #   * the wait is bounded and every round is printed.
          SCRAPE_WAIT_ROUNDS=20
          SCRAPE_WAIT_SLEEP=15

          _probe_once() {
            # --globoff stops curl from treating literal [ and ] in URLs
            # as glob ranges — required for Next.js dynamic-route chunk
            # filenames like "app/api/public/league/[section]/route-*.js"
            # which preserve the brackets on disk.
            curl --silent --show-error --globoff --output /dev/null \
              --write-out '%{http_code}' --max-time 30 "$1" || echo "000"
          }

          check_endpoint() {
            local path="$1"
            # Accepts a REGEX of tolerated codes, not a single literal.
            # ``/api/health`` needs ``200|503`` — see the readiness loop
            # below for why a 503 here is a source-health statement, not
            # a deploy failure.
            local expect_code="${2:-200}"
            local full_url="${URL}${path}"
            local code round rc
            code=$(_probe_once "${full_url}")

            for (( round = 1; round <= SCRAPE_WAIT_ROUNDS; round++ )); do
              # Matched the contract? Done — never wait on a passing probe.
              [[ "${code}" =~ ^(${expect_code})$ ]] && break
              # Answered, just not what we require? That is a real failure.
              python3 scripts/scrape_activity.py --check-code "${code}" || break
              # Transport failure: ask the server whether a scrape explains it.
              # Only a server that ANSWERS and says no scrape is running ends
              # the wait. An unreadable /api/status (exit 2) keeps waiting and
              # consumes a round, per the 2026-09-09 finding that a fully
              # blocked box is stronger evidence of an active blocking scrape
              # than a slow-but-responsive one, not weaker — the blocking
              # phase swallows /api/status too. Waiting only delays the
              # verdict; the real code is still reported and still fails once
              # the bounded window is spent.
              # ``|| rc=$?`` rather than ``; rc=$?`` — this step runs under
              # ``set -Eeuo pipefail``, where an unprotected non-zero exit
              # kills the whole smoke test instead of being classified.
              rc=0
              python3 scripts/scrape_activity.py "${URL}" || rc=$?
              if [[ "${rc}" -eq 1 ]]; then
                break   # server answered: no active scrape — this is a real fault
              fi
              echo "  ${path} -> ${code}; waiting ${SCRAPE_WAIT_SLEEP}s (round ${round}/${SCRAPE_WAIT_ROUNDS})"
              sleep "${SCRAPE_WAIT_SLEEP}"
              code=$(_probe_once "${full_url}")
            done

            if [[ "${code}" =~ ^(${expect_code})$ ]]; then
              echo "PASS: ${path} -> ${code}"
              PASS=$((PASS + 1))
            else
              echo "FAIL: ${path} -> ${code} (expected ${expect_code})"
              FAIL=$((FAIL + 1))
            fi
          }

          echo "=== Post-Deploy Smoke Test ==="
          echo "Target: ${URL}"

          # The service is restarted moments before this step runs, so
          # wait for it to finish loading its first payload before we
          # probe — a cold-start blip must not false-fail the deploy.
          #
          # ACCEPT 200 **OR** 503, and say which we got (audit 2026-08-17).
          # ``/api/health`` returns 503 whenever ``is_ok`` is false
          # (server.py: no last_error AND not stalled AND not data_stale
          # AND contractHealth.ok) — so a box that is merely MID-SCRAPE,
          # or serving a board whose critical source timed out, answers
          # 503 while being perfectly alive.  A loop that breaks only on
          # 200 therefore cannot distinguish "still booting" from
          # "booted and degraded": it burned its whole budget and the
          # probe below then failed the deploy over a SOURCE-HEALTH
          # condition.  That is the CI lane inversion
          # ``docs/ops/STABILIZATION_2026-08-16.md`` §3d exists to
          # prevent, reproduced on the deploy side — measured on run
          # 32062696830 (2026-08-17), where the remote deploy script had
          # already succeeded and the smoke step reddened the job anyway.
          #
          # The adjudicator for "ok vs degraded" is the
          # ``Validate live data contract`` step below, which already
          # tolerates ``degraded`` deliberately.  Two consecutive steps
          # must not hold opposite policies on one signal.
          echo "Waiting for ${URL}/api/health to answer…"
          _ready=""
          for _i in $(seq 1 30); do
            _hc=$(curl --silent --globoff --output /dev/null --max-time 10 \
              --write-out '%{http_code}' "${URL}/api/health") || _hc=000
            if [[ "${_hc}" == "200" || "${_hc}" == "503" ]]; then
              echo "  health answering after ~$(( _i * 3 ))s (HTTP ${_hc})"
              [[ "${_hc}" == "503" ]] && echo "  note: 503 = degraded (mid-scrape or source health); the live-contract step adjudicates"
              _ready="${_hc}"
              break
            fi
            sleep 3
          done
          # Exhaustion must be LOUD.  Previously this loop fell through
          # silently and the only symptom was a failing probe 30 lines
          # later with no explanation in the log.
          if [[ -z "${_ready}" ]]; then
            echo "::warning title=Health never answered::${URL}/api/health did not return 200 or 503 within ~90s (last code ${_hc}). Continuing to the probes, which will report the real code."
          fi

          # The public-league snapshot is ALWAYS cold right after a
          # restart: the first request kicks a multi-season Sleeper
          # rebuild that can take minutes.  The event loop stays
          # responsive during the rebuild (threadpool offload, #519) —
          # which is why /api/status passes while /league and
          # /api/public/league still wait on the snapshot — but a 15s
          # single-shot probe here false-failed the 2026-07-25 deploy
          # AFTER verification had already passed.  Kick the rebuild
          # and poll until warm (up to ~6 min) before the pass/fail
          # probes below.
          echo "Waiting for ${URL}/api/public/league snapshot to come warm…"
          _warm=""
          for _i in $(seq 1 24); do
            # --compressed: ~2.5 MB identity vs ~0.24 MB gzipped; runner->box
            # throughput made the uncompressed probe time out on a healthy box.
            _plc=$(curl --silent --globoff --compressed --output /dev/null --max-time 20 \
              --write-out '%{http_code}' "${URL}/api/public/league") || _plc=000
            if [[ "${_plc}" == "200" ]]; then
              echo "  public-league snapshot warm after ~$(( _i * 15 ))s"
              _warm="1"
              break
            fi
            sleep 15
          done
          # Deliberately still BLOCKING below (a public page that cannot
          # answer after ~6 min is a real regression), but exhaustion is
          # now stated instead of inferred from a bare FAIL line.  The
          # residual false-red vector — a slow Sleeper upstream — is
          # named in the audit rather than silently widened away.
          if [[ -z "${_warm}" ]]; then
            echo "::warning title=Public-league snapshot never warmed::Last code ${_plc} after ~6 min. If the probe below fails, suspect a slow Sleeper rebuild before suspecting this deploy."
          fi

          # 200 OR 503 — see the readiness loop above.  503 means
          # "degraded", which is a statement about SOURCE HEALTH, and
          # source health is adjudicated by ``Validate live data
          # contract`` below (which accepts ``degraded`` by design) and
          # by the blocking ``--lane full`` contract gate in the
          # validate job.  It is not a reason to red a deploy whose
          # remote script already succeeded.
          check_endpoint "/api/health" "200|503"
          check_endpoint "/api/status" 200

          # Deployed is not verified: the process must report the commit this
          # workflow shipped (``build.commit``, read once at import by
          # src/api/build_identity.py). A mismatch means the old process is still
          # serving or a different tree was checked out; ``null`` means the box
          # cannot say, which is not a pass either.
          if [[ -z "${DEPLOY_TARGET_SHA:-}" ]]; then
            echo "::error title=No deploy target recorded::DEPLOY_TARGET_SHA is empty; cannot verify the served build."
            FAIL=$((FAIL + 1))
          else
            # Only an UNREADABLE status (e.g. the startup scrape's blocking
            # browser phase) is retried; a readable build block -- a commit, or
            # null with its reason -- decides at once, so a stale process fails fast.
            _build=""
            for _attempt in $(seq 1 20); do
              _build="$(curl --silent --globoff --max-time 15 "${URL}/api/status" \
                | jq -c '.build // empty' 2>/dev/null || true)"
              [[ -n "${_build}" ]] && break
              sleep 10
            done
            _note=""
            if [[ -z "${_build}" ]]; then
              _note=" (status unreadable after retries)"
              _build="{}"
            fi
            _served="$(jq -r '.commit // empty' <<<"${_build}" 2>/dev/null || true)"
            _why="$(jq -r '.unavailable_reason // empty' <<<"${_build}" 2>/dev/null || true)"
            [[ -n "${_why}" ]] && _note=" (${_why})"
            if [[ -n "${_served}" && "${_served}" == "${DEPLOY_TARGET_SHA}" ]]; then
              echo "PASS build.commit == ${DEPLOY_TARGET_SHA}"
              PASS=$((PASS + 1))
            else
              # For a manual deploy by branch name the box resolves the name
              # after its own fetch, so it can ship a newer commit than the
              # guard resolved: the message names what the guard resolved.
              echo "::error title=Served build mismatch::/api/status reports build.commit '${_served:-<none>}'${_note}; the deploy guard resolved ${DEPLOY_TARGET_SHA}."
              FAIL=$((FAIL + 1))
            fi
            _artifact="$(jq -r '.release.frontend_artifact_id // empty' <<<"${_build}" 2>/dev/null || true)"
            _artifact_why="$(jq -r '.release.frontend_artifact_unavailable_reason // empty' <<<"${_build}" 2>/dev/null || true)"
            if [[ "${RELEASE_MODE}" == "legacy" ]]; then
              echo "NOTICE historical rollback: frontend artifact identity is unavailable; exact served commit and asset probes remain required."
            elif [[ -n "${EXPECTED_ARTIFACT_ID:-}" && "${_artifact}" == "${EXPECTED_ARTIFACT_ID}" ]]; then
              echo "PASS build.release.frontend_artifact_id == ${EXPECTED_ARTIFACT_ID}"
              PASS=$((PASS + 1))
            else
              echo "::error title=Served artifact mismatch::/api/status reports artifact '${_artifact:-<none>}' (${_artifact_why:-no reason}); validated artifact is '${EXPECTED_ARTIFACT_ID:-<none>}'."
              FAIL=$((FAIL + 1))
            fi
            _backend="$(jq -r '.release.backend_artifact_sha256 // empty' <<<"${_build}" 2>/dev/null || true)"
            if [[ "${RELEASE_MODE}" == "artifact" && "${_backend}" == "${EXPECTED_BACKEND_SHA256}" &&
                  "${_backend}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "PASS build.release.backend_artifact_sha256 == ${EXPECTED_BACKEND_SHA256}"
              PASS=$((PASS + 1))
            elif [[ "${RELEASE_MODE}" == "artifact" ]]; then
              echo "::error title=Served backend artifact mismatch::/api/status reports backend '${_backend:-<none>}'; validated backend is '${EXPECTED_BACKEND_SHA256:-<none>}'."
              FAIL=$((FAIL + 1))
            fi
          fi
          # /api/data is intentionally gated by _private_api_gate in
          # server.py — an unauthenticated probe MUST return 401.
          # Expecting 401 here verifies the auth gate is active; a 200
          # would mean the gate is broken and private data is exposed.
          check_endpoint "/api/data" 401
          check_endpoint "/" 200
          check_endpoint "/league" 200
          check_endpoint "/api/public/league" 200

          # Extract EVERY /_next/static/* reference from the landing
          # page HTML (and a sample of other key routes) and verify
          # the server actually serves all of them.  This is the
          # guardrail for the ChunkLoadError failure mode: if the HTML
          # references a chunk hash the Next.js process no longer has
          # on disk (the exact symptom the prior production outage
          # showed), this check fails and the deploy is marked red
          # instead of silently shipping a broken client.
          #
          # The previous implementation probed ONLY the first match
          # from `head -n 1`, which was always the webpack runtime
          # chunk and always returned 200 — so a broken async chunk
          # (like 448-*.js) silently shipped.  This implementation
          # probes every distinct reference and fails the deploy if
          # any single one returns non-200.
          HTML_ROUTES=( "/" "/rankings" "/trade" "/edge" "/finder" "/league" )
          declare -A SEEN_ASSETS=()
          for route in "${HTML_ROUTES[@]}"; do
            body_file="$(mktemp)"
            if ! curl --silent --show-error --globoff --max-time 15 --output "${body_file}" "${URL}${route}"; then
              echo "WARN: unable to fetch ${route} HTML for _next asset extraction"
              rm -f "${body_file}"
              continue
            fi
            while IFS= read -r asset; do
              [[ -z "${asset}" ]] && continue
              SEEN_ASSETS["${asset}"]=1
            done < <(grep -oE '/_next/static/[^"'"'"'[:space:]<>]+\.(js|css)' "${body_file}" | sort -u)
            rm -f "${body_file}"
          done

          if [[ "${#SEEN_ASSETS[@]}" -eq 0 ]]; then
            echo "::error title=No _next assets found::HTML for routes ${HTML_ROUTES[*]} contained no /_next/static/* references."
            FAIL=$((FAIL + 1))
          else
            echo "Probing ${#SEEN_ASSETS[@]} distinct /_next/static/* references from HTML."
            for asset in "${!SEEN_ASSETS[@]}"; do
              check_endpoint "${asset}" 200
            done
          fi

          echo ""
          echo "Results: ${PASS} passed, ${FAIL} failed"

          if [[ "${FAIL}" -gt 0 ]]; then
            echo "::error title=Post-Deploy Smoke Failure::${FAIL} endpoint(s) failed after deploy."
            exit 1
          fi

      - name: Validate live data contract
        if: ${{ vars.PROD_PUBLIC_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="${{ vars.PROD_PUBLIC_URL }}"
          URL="${URL%/}"

          curl --silent --show-error --max-time 20 "${URL}/api/health" > /tmp/health.json

          python3 - <<'PY'
          import json, sys
          with open("/tmp/health.json") as f:
              data = json.load(f)
          status = data.get("status", "unknown")
          has_data = data.get("has_data", False)
          stale = data.get("data_stale", True)
          print(f"  status={status} has_data={has_data} data_stale={stale}")
          if status not in ("ok", "degraded"):
              print("::error title=Unexpected health status::Health returned unexpected status.")
              sys.exit(1)
          if not has_data:
              print("::warning title=No data loaded::Server reports no data loaded.")
          print("Post-deploy health validation passed.")
          PY

      - name: Verify live frontend matches the tested artifact
        if: ${{ needs.resolve.outputs.release_mode == 'artifact' }}
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          DEPLOY_STATE_DIR: ${{ vars.PROD_DEPLOY_STATE_DIR || '/home/dynasty/.deploy-state' }}
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${EXPECTED_ARTIFACT_ID}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::validated artifact ID is missing"; exit 1; }
          TARGET="${DEPLOY_USER_RESOLVED}@${DEPLOY_HOST_RESOLVED}"
          LIVE_ARTIFACT_ID="$(ssh -i "${DEPLOY_KEY_FILE}" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${DEPLOY_KNOWN_HOSTS_FILE}" \
            -p "${DEPLOY_PORT_RESOLVED}" "${TARGET}" \
            "cd '${APP_DIR}' && python3 -m scripts.release_artifact verify --root '${APP_DIR}' --manifest '${DEPLOY_STATE_DIR}/last_successful_release_manifest.json' --commit '${DEPLOY_TARGET_SHA}'")"
          [[ "${LIVE_ARTIFACT_ID}" == "${EXPECTED_ARTIFACT_ID}" ]] || {
            echo "::error::live frontend artifact ID differs from the validation job"
            exit 1
          }
          echo "Verified live frontend artifact: ${LIVE_ARTIFACT_ID}"

