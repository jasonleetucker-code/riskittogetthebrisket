name: Temporary Power Week Integrity Repair

on:
  push:
    branches:
      - fix/power-week-integrity-and-card-parity
    paths:
      - scripts/_tmp_power_week_integrity_repair.py
      - .github/workflows/_tmp-power-week-integrity-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/power-week-integrity-and-card-parity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply repair
        run: |
          set -Eeuo pipefail
          python scripts/_tmp_power_week_integrity_repair.py
          python -m py_compile src/ros/power_v2.py src/ros/power_snapshots.py
      - name: Commit repair
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ros/power_v2.py src/ros/power_snapshots.py frontend/app/league/sections/ros-power.jsx tests/ros/test_power_week_integrity.py
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "fix(power): align weekly records and official share state"
          git push origin HEAD:fix/power-week-integrity-and-card-parity
