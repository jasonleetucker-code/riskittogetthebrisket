name: Game Day Live Collector Diagnostics (read-only)

# Evidence for why production Game Day stops publishing fresh generations
# (2026-09-27: a 51-minute-old generation against a 3-minute budget, games
# live).  The collector runs only on the box and writes only gitignored
# data/game_day/live/, so this reuses the deploy path's SSH capability to run
# deploy/diagnostics/game_day_live_inventory.sh — READ-ONLY by contract: no
# unit is started/stopped/restarted and nothing is written.
#
# Its own concurrency group (NOT production-deploy): it changes nothing, and
# the evidence it collects is most needed exactly while a deploy is queued.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: game-day-live-diagnostics
  cancel-in-progress: false

jobs:
  inventory:
    name: Game Day live collector inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure production SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | sed 's/\r$//' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "PORT=${DEPLOY_PORT:-22}" >> "$GITHUB_ENV"

      - name: Collect Game Day live collector inventory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_DIR: ${{ vars.PROD_APP_DIR || '/home/dynasty/trade-calculator' }}
          VENV_DIR: ${{ vars.PROD_VENV_DIR || '/home/dynasty/.venvs/trade-calculator' }}
          SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME || 'dynasty' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR=$(printf %q "$APP_DIR") VENV_DIR=$(printf %q "$VENV_DIR") SERVICE_NAME=$(printf %q "$SERVICE_NAME") bash -s" \
            < deploy/diagnostics/game_day_live_inventory.sh
