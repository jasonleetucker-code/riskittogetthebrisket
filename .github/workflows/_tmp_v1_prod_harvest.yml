name: Temporary V1 production evidence harvest

on:
  push:
    branches: [chatgpt/v1-prod-harvest-111-124]

permissions:
  contents: write

jobs:
  harvest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile V1-111 and V1-124
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/VERSION_1_COMPLETION_CONTRACT.md')
          s = p.read_text()
          lines = s.splitlines()

          evidence = {
            'V1-111': ('IMPLEMENTED_UNVERIFIED', 'VERIFIED', 'Fresh post-#1135 authenticated production verification run 32919648642 against deployed SHA `a82898fdbe73ea2effd295132590dff35a45ac98` passed the dedicated `v1-111-premium-rankings.spec.js` consumer proof at both production desktop and 390x844 mobile. The spec first reads the authenticated `/api/data?view=app` contract, proves `.psi-editorial` is actively applied, and verifies rendered rank/name/value tuples are the backend stamps rather than client recomputation; partial/missing states remain explicit. This supplies the previously missing L4 deployed-consumer evidence.'),
            'V1-124': ('NOT STARTED', 'VERIFIED', 'Fresh post-#1135 on-box production verification run 32919655291 against deployed SHA `a82898fdbe73ea2effd295132590dff35a45ac98` returned `V1-124: PASS`. The canonical on-box verifier checks the real production timer units/job timestamps and their actual data artifacts, and records unavailable artifacts truthfully rather than coercing missing to zero. This supplies the row\'s L3 production proof.'),
          }

          changed = []
          out = []
          for line in lines:
            matched = False
            for row_id, (old_status, new_status, note) in evidence.items():
              if line.startswith(f'| {row_id} |'):
                parts = line.split('|')
                # table fields: blank, id, item, source, lane, status, target, notes, blank
                current = parts[5].strip().strip('`')
                assert current == old_status, f'{row_id}: expected {old_status}, found {current}'
                parts[5] = f' `{new_status}` '
                notes = parts[7].strip()
                parts[7] = f' {notes} **PROMOTED 2026-08-25 from fresh production evidence.** {note} '
                line = '|'.join(parts)
                changed.append(row_id)
                matched = True
                break
            out.append(line)
          assert changed == ['V1-111', 'V1-124'], changed
          s = '\n'.join(out) + '\n'

          assert '| `VERIFIED` | 109 |' in s
          assert '| `IMPLEMENTED_UNVERIFIED` | 20 |' in s
          assert '| `NOT STARTED` | 4 |' in s
          s = s.replace('| `VERIFIED` | 109 |', '| `VERIFIED` | 111 |', 1)
          s = s.replace('| `IMPLEMENTED_UNVERIFIED` | 20 |', '| `IMPLEMENTED_UNVERIFIED` | 19 |', 1)
          s = s.replace('| `NOT STARTED` | 4 |', '| `NOT STARTED` | 3 |', 1)

          s, n = re.subn(r'\*\*V1 completion: 109 / 136 = 80\.1%\.\*\*', '**V1 completion: 111 / 136 = 81.6%.**', s, count=1)
          assert n == 1, f'completion summary replacements={n}'
          p.write_text(s)
          PY

          git diff --check
          python scripts/check_planning_integrity.py
          python scripts/check_decision_coercions.py
      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Integration"
          git config user.email "chatgpt-integration@users.noreply.github.com"
          git rm .github/workflows/_tmp_v1_prod_harvest.yml
          git add docs/VERSION_1_COMPLETION_CONTRACT.md
          git commit -m "docs: verify V1-111 and V1-124 from production evidence"
          git push origin HEAD:chatgpt/v1-prod-harvest-111-124
