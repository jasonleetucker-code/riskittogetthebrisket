name: Calculator UI governance (temporary issue 1421)
on:
  push:
    branches: [codex/calculator-ui-parallel-contract]
    paths: [.github/workflows/calculator-ui-governance-once.yml]
permissions:
  contents: write
concurrency:
  group: calculator-ui-governance-1421
  cancel-in-progress: false
jobs:
  apply-and-validate:
    if: github.repository == 'jasonleetucker-code/riskittogetthebrisket'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALLOW_DEFAULT_LOGIN_DEV: '1'
      UPTIME_CHECK_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install repository-pinned validation toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Apply bounded governance and commit the final tree before L0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'codex/calculator-ui-parallel-contract'
          mkdir -p /tmp/calculator-ui-evidence
          git config user.name 'Calculator UI implementation'
          git config user.email 'noreply@users.noreply.github.com'
          git switch -c calculator-ui-application
          git fetch origin main:refs/remotes/origin/main --depth=50
          python .github/ui-directive-once.py
          git rm .github/ui-directive-once.py .github/workflows/calculator-ui-audit-once.yml .github/workflows/calculator-ui-governance-once.yml
          bash scripts/format_python_changes.sh scripts/check_planning_integrity.py tests/docs/test_ui_parallel_governance.py 2>&1 | tee /tmp/calculator-ui-evidence/format.log
          git add ASSISTANT_COORDINATION.md CLAUDE.md docs/BRISKET_IDEAS.md docs/C_SERIES_EXECUTION_MAP.md docs/C_SERIES_SCOPE_MANIFEST.md docs/DESIGN-SYSTEM.md docs/EXECUTION_PLAN.md docs/MASTER_PRODUCT_PLAN.md docs/OWNER_REQUESTED_TODO.md docs/PLANNING_DOCUMENT_STATUS.md docs/PREMIUM_SPORTS_INTELLIGENCE_DESIGN_NORTH_STAR.md docs/WORK_CLAIMS.md docs/ui/ .github/pull_request_template.md scripts/check_planning_integrity.py tests/docs/test_ui_parallel_governance.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          allowed = {'ASSISTANT_COORDINATION.md','CLAUDE.md','docs/BRISKET_IDEAS.md','docs/C_SERIES_EXECUTION_MAP.md','docs/C_SERIES_SCOPE_MANIFEST.md','docs/DESIGN-SYSTEM.md','docs/EXECUTION_PLAN.md','docs/MASTER_PRODUCT_PLAN.md','docs/OWNER_REQUESTED_TODO.md','docs/PLANNING_DOCUMENT_STATUS.md','docs/PREMIUM_SPORTS_INTELLIGENCE_DESIGN_NORTH_STAR.md','docs/WORK_CLAIMS.md','.github/pull_request_template.md','scripts/check_planning_integrity.py','tests/docs/test_ui_parallel_governance.py','.github/ui-directive-once.py','.github/workflows/calculator-ui-audit-once.yml','.github/workflows/calculator-ui-governance-once.yml'}
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          unexpected = [p for p in paths if p not in allowed and not p.startswith('docs/ui/')]
          if unexpected:
              raise SystemExit(f'Unexpected paths: {unexpected}')
          PY
          # The canonical scope checker now sees the final net diff, not a
          # helper deleted in the worktree but still present in the old HEAD.
          git commit -m 'feat(governance): lock PSI implementation and keep Calculator UI continuously parallel (#1421)'
          git diff a3c29639aeb61c2af4fd169b75ccb9429011109b HEAD --stat > /tmp/calculator-ui-evidence/final-stat.txt
      - name: Canonical receipt, integrity, docs, claims and L0 on committed tree
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            python scripts/agent_os_receipt.py
            python scripts/check_planning_integrity.py
            python scripts/check_product_plan_governance.py
            python -m pytest tests/docs -q
            python scripts/check_work_claims.py --files docs/ui/CALCULATOR_UI_IMPLEMENTATION_CONTRACT.md docs/ui/UI_PARALLEL_LEDGER.md scripts/check_planning_integrity.py tests/docs/test_ui_parallel_governance.py --branch codex/calculator-ui-parallel-contract
            bash scripts/tiered_validate.sh l0
            git diff --exit-code
          } 2>&1 | tee /tmp/calculator-ui-evidence/validation.log
      - name: Record passing governance gates and push only this feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/WORK_CLAIMS.md')
          text = p.read_text(encoding='utf-8')
          old = 'open — bounded governance writer;'
          assert old in text
          text = text.replace(old, 'done — governance implementation and focused gates passed; Integration review remains;', 1)
          p.write_text(text, encoding='utf-8')
          PY
          python scripts/check_planning_integrity.py
          python -m pytest tests/docs -q
          git add docs/WORK_CLAIMS.md
          git diff --cached --check
          git commit -m 'docs(ui): record validated governance checkpoint and queued separate UI unit'
          git rev-parse HEAD > /tmp/calculator-ui-evidence/validated-head.txt
          git diff a3c29639aeb61c2af4fd169b75ccb9429011109b HEAD > /tmp/calculator-ui-evidence/governance.patch
          git push origin HEAD:refs/heads/codex/calculator-ui-parallel-contract
      - name: Export changed text and actual results
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/calculator-ui-evidence
          python - <<'PY'
          import pathlib, subprocess, zipfile
          names = subprocess.check_output(['git','diff','--name-only','a3c29639aeb61c2af4fd169b75ccb9429011109b','HEAD'], text=True).splitlines()
          with zipfile.ZipFile('/tmp/calculator-ui-evidence/changed-text-files.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = pathlib.Path(name)
                  if path.is_file():
                      archive.write(path, name)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-ui-governance-evidence
          path: /tmp/calculator-ui-evidence/
          retention-days: 7
          if-no-files-found: warn
